# 在 GitHub 配置好 Secrets / Variables 后，推送 worker 代码即自动部署 Cloudflare Worker。
# 见 DEPLOY.md「GitHub Actions 自动部署 Worker」。
name: Deploy Cloudflare Worker

on:
  # 不限 paths：任意 push main 都部署，避免漏跑（仅多几次 Wrangler 调用）
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: 写入 KV namespace id 到 wrangler.toml
        env:
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$CF_KV_NAMESPACE_ID" ]; then
            echo "::error::请在仓库 Settings → Secrets → Actions 中添加 CF_KV_NAMESPACE_ID（wrangler kv namespace create 的输出）"
            exit 1
          fi
          sed -i.bak "s/REPLACE_WITH_KV_NAMESPACE_ID/${CF_KV_NAMESPACE_ID}/g" wrangler.toml
          # 仓库内若已写死 id，仍覆盖为 Secret 中的值，避免与 CI 不一致
          sed -i.bak2 "s/^id = \".*\"/id = \"${CF_KV_NAMESPACE_ID}\"/" wrangler.toml

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WX_APPID: ${{ vars.WX_APPID }}
          # 小程序流量主广告单元 ID（非密钥，用 GitHub Actions Variables 即可；也可只在 Cloudflare 控制台配置）
          REWARDED_VIDEO_AD_UNIT_ID: ${{ vars.REWARDED_VIDEO_AD_UNIT_ID }}
          MINI_BANNER_AD_UNIT_ID: ${{ vars.MINI_BANNER_AD_UNIT_ID }}
          MINI_BANNER_MINE_AD_UNIT_ID: ${{ vars.MINI_BANNER_MINE_AD_UNIT_ID }}
          INTERSTITIAL_AD_UNIT_ID: ${{ vars.INTERSTITIAL_AD_UNIT_ID }}
          SPLASH_AD_UNIT_ID: ${{ vars.SPLASH_AD_UNIT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::请添加 Secret：CLOUDFLARE_API_TOKEN（Cloudflare → My Profile → API Tokens，需 Edit Cloudflare Workers）"
            exit 1
          fi
          deploy_args=()
          [ -n "$WX_APPID" ] && deploy_args+=(--var "WX_APPID:${WX_APPID}")
          [ -n "$REWARDED_VIDEO_AD_UNIT_ID" ] && deploy_args+=(--var "REWARDED_VIDEO_AD_UNIT_ID:${REWARDED_VIDEO_AD_UNIT_ID}")
          [ -n "$MINI_BANNER_AD_UNIT_ID" ] && deploy_args+=(--var "MINI_BANNER_AD_UNIT_ID:${MINI_BANNER_AD_UNIT_ID}")
          [ -n "$MINI_BANNER_MINE_AD_UNIT_ID" ] && deploy_args+=(--var "MINI_BANNER_MINE_AD_UNIT_ID:${MINI_BANNER_MINE_AD_UNIT_ID}")
          [ -n "$INTERSTITIAL_AD_UNIT_ID" ] && deploy_args+=(--var "INTERSTITIAL_AD_UNIT_ID:${INTERSTITIAL_AD_UNIT_ID}")
          [ -n "$SPLASH_AD_UNIT_ID" ] && deploy_args+=(--var "SPLASH_AD_UNIT_ID:${SPLASH_AD_UNIT_ID}")
          npx wrangler deploy "${deploy_args[@]}"

      - name: 同步 Worker Secrets（微信 / LLM / 管理后台）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -n "$WX_APPSECRET" ]; then
            echo "$WX_APPSECRET" | npx wrangler secret put WX_APPSECRET
          else
            echo "未设置 WX_APPSECRET，小程序将走 Worker 内 mock 登录逻辑"
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
          else
            echo "未设置 DEEPSEEK_API_KEY，/api/generate 需用户自带 Key"
          fi
          if [ -n "$ADMIN_KEY" ]; then
            echo "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
          else
            echo "未设置 ADMIN_KEY，管理后台 /admin.html 将无法登录 Worker 版接口"
          fi
