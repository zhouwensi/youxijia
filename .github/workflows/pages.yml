# 将 public/ 部署到 GitHub Pages（需仓库 Settings → Pages → Source: GitHub Actions）
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build frontend (混淆 + api-base.js)
        env:
          NODE_ENV: production
          # 默认 API 子域；可在仓库 Settings → Variables 设置 API_BASE_URL 覆盖
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.yijuhuayouxi.com' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages 官方要求：本 job 必须显式声明（仅靠 workflow 顶层在部分仓库下会导致 Resource not found）
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
