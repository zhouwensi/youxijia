<body>
  <!-- 原游戏body内容 -->
  
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1 class="title">机械迷城</h1>
        <p class="subtitle">连接齿轮，修复古老的机械核心！</p>
        <button id="startBtn" class="btn">开始游戏</button>
        <div class="instructions">
            点击并拖动齿轮到正确位置，连接所有管道即可过关。<br>
            键盘方向键移动，空格键旋转齿轮。触屏直接拖动。
        </div>
    </div>
    
    <div id="endScreen" class="screen hidden">
        <h1 class="title">关卡完成！</h1>
        <p class="subtitle" id="endMessage">你成功修复了机械核心！</p>
        <button id="restartBtn" class="btn">再玩一次</button>
        <button id="nextBtn" class="btn">下一关</button>
        <div class="instructions">
            你的得分: <span id="finalScore">0</span><br>
            用时: <span id="timeUsed">0</span> 秒
        </div>
    </div>
    
    <div class="score-display">得分: <span id="score">0</span></div>
    <div class="level-display">关卡: <span id="level">1</span></div>

    <script>
        (function() {
            'use strict';
            
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const endScreen = document.getElementById('endScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const nextBtn = document.getElementById('nextBtn');
            const scoreDisplay = document.getElementById('score');
            const levelDisplay = document.getElementById('level');
            const finalScoreDisplay = document.getElementById('finalScore');
            const endMessage = document.getElementById('endMessage');
            const timeUsedDisplay = document.getElementById('timeUsed');
            
            let gameActive = false;
            let score = 0;
            let currentLevel = 1;
            let startTime = 0;
            let selectedGear = null;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let isDragging = false;
            
            const gears = [];
            const pipes = [];
            const connections = [];
            
            const colors = {
                gear: ['#4df0ff', '#ff55aa', '#ffcc55', '#aa55ff'],
                pipe: ['#2a7fff', '#ff3333', '#33ff77', '#ffaa33'],
                bg: '#121230',
                grid: 'rgba(100, 150, 255, 0.1)'
            };
            
            class Gear {
                constructor(x, y, targetX, targetY, type) {
                    this.x = x;
                    this.y = y;
                    this.targetX = targetX;
                    this.targetY = targetY;
                    this.radius = 40;
                    this.rotation = 0;
                    this.type = type || Math.floor(Math.random() * 4);
                    this.color = colors.gear[this.type];
                    this.connected = false;
                    this.speed = 0.05;
                    this.teeth = 8;
                }
                
                update() {
                    if (this.connected) {
                        this.rotation += this.speed;
                    }
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    ctx.fillStyle = this.connected ? this.color : '#333355';
                    ctx.strokeStyle = this.connected ? '#ffffff' : '#666699';
                    ctx.lineWidth = 3;
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    for (let i = 0; i < this.teeth; i++) {
                        const angle = (i / this.teeth) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(
                            Math.cos(angle) * this.radius,
                            Math.sin(angle) * this.radius
                        );
                        ctx.lineTo(
                            Math.cos(angle) * (this.radius + 15),
                            Math.sin(angle) * (this.radius + 15)
                        );
                        ctx.stroke();
                    }
                    
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.restore();
                    
                    if (!this.connected) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.beginPath();
                        ctx.arc(this.targetX, this.targetY, this.radius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#4df0ff';
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.arc(this.targetX, this.targetY, this.radius, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
                
                isAtTarget() {
                    const dx = this.x - this.targetX;
                    const dy = this.y - this.targetY;
                    return Math.sqrt(dx * dx + dy * dy) < 10;
                }
                
                containsPoint(x, y) {
                    const dx = x - this.x;
                    const dy = y - this.y;
                    return dx * dx + dy * dy <= this.radius * this.radius;
                }
            }
            
            class Pipe {
                constructor(x1, y1, x2, y2, type) {
                    this.x1 = x1;
                    this.y1 = y1;
                    this.x2 = x2;
                    this.y2 = y2;
                    this.type = type || Math.floor(Math.random() * 4);
                    this.color = colors.pipe[this.type];
                    this.connected = false;
                }
                
                draw() {
                    ctx.strokeStyle = this.connected ? this.color : '#444466';
                    ctx.lineWidth = 12;
                    ctx.lineCap = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(this.x1, this.y1);
                    ctx.lineTo(this.x2, this.y2);
                    ctx.stroke();
                    
                    ctx.fillStyle = this.connected ? this.color : '#333355';
                    ctx.beginPath();
                    ctx.arc(this.x1, this.y1, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.x2, this.y2, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            function initGame() {
                gears.length = 0;
                pipes.length = 0;
                connections.length = 0;
                selectedGear = null;
                isDragging = false;
                
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                if (currentLevel === 1) {
                    gears.push(new Gear(100, 150, centerX - 120, centerY - 80, 0));
                    gears.push(new Gear(canvas.width - 100, 150, centerX + 120, centerY - 80, 1));
                    gears.push(new Gear(100, canvas.height - 150, centerX - 120, centerY + 80, 2));
                    gears.push(new Gear(canvas.width - 100, canvas.height - 150, centerX + 120, centerY + 80, 3));
                    
                    pipes.push(new Pipe(centerX - 120, centerY - 80, centerX, centerY - 40, 0));
                    pipes.push(new Pipe(centerX + 120, centerY - 80, centerX, centerY - 40, 1));
                    pipes.push(new Pipe(centerX - 120, centerY + 80, centerX, centerY + 40, 2));
                    pipes.push(new Pipe(centerX + 120, centerY + 80, centerX, centerY + 40, 3));
                    pipes.push(new Pipe(centerX, centerY - 40, centerX, centerY + 40, 0));
                } else if (currentLevel === 2) {
                    gears.push(new Gear(80, 200, centerX - 150, centerY, 0));
                    gears.push(new Gear(canvas.width - 80, 200, centerX + 150, centerY, 1));
                    gears.push(new Gear(80, canvas.height - 200, centerX - 80, centerY + 120, 2));
                    gears.push(new Gear(canvas.width - 80, canvas.height - 200, centerX + 80, centerY + 120, 3));
                    gears.push(new Gear(centerX, 100, centerX, centerY - 120, 0));
                    
                    pipes.push(new Pipe(centerX - 150, centerY, centerX - 80, centerY + 40, 0));
                    pipes.push(new Pipe(centerX + 150, centerY, centerX + 80, centerY + 40, 1));
                    pipes.push(new Pipe(centerX - 80, centerY + 120, centerX, centerY + 80, 2));
                    pipes.push(new Pipe(centerX + 80, centerY + 120, centerX, centerY + 80, 3));
                    pipes.push(new Pipe(centerX, centerY - 120, centerX, centerY - 40, 0));
                    pipes.push(new Pipe(centerX, centerY - 40, centerX - 80, centerY + 40, 1));
                    pipes.push(new Pipe(centerX, centerY - 40, centerX + 80, centerY + 40, 2));
                    pipes.push(new Pipe(centerX - 80, centerY + 40, centerX, centerY + 80, 3));
                    pipes.push(new Pipe(centerX + 80, centerY + 40, centerX, centerY + 80, 0));
                } else {
                    const count = 6 + Math.min(currentLevel - 3, 4);
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        const radius = Math.min(canvas.width, canvas.height) * 0.3;
                        const targetX = centerX + Math.cos(angle) * radius;
                        const targetY = centerY + Math.sin(angle) * radius;
                        const startX = 100 + (i % 3) * (canvas.width - 200) / 2;
                        const startY = 100 + Math.floor(i / 3) * (canvas.height - 200) / 2;
                        
                        gears.push(new Gear(startX, startY, targetX, targetY, i % 4));
                        
                        if (i > 0) {
                            pipes.push(new Pipe(
                                targetX, targetY,
                                centerX + Math.cos(angle - Math.PI / count) * radius,
                                centerY + Math.sin(angle - Math.PI / count) * radius,
                                i % 4
                            ));
                        }
                    }
                    pipes.push(new Pipe(
                        centerX + Math.cos(0) * radius,
                        centerY + Math.sin(0) * radius,
                        centerX + Math.cos((count - 1) / count * Math.PI * 2) * radius,
                        centerY + Math.sin((count - 1) / count * Math.PI * 2) * radius,
                        0
                    ));
                }
                
                updateConnections();
            }
            
            function updateConnections() {
                connections.length = 0;
                
                for (const gear of gears) {
                    gear.connected = gear.isAtTarget();
                }
                
                for (const pipe of pipes) {
                    let connected1 = false;
                    let connected2 = false;
                    
                    for (const gear of gears) {
                        if (gear.connected) {
                            const dx1 = gear.x - pipe.x1;
                            const dy1 = gear.y - pipe.y1;
                            const dx2 = gear.x - pipe.x2;
                            const dy2 = gear.y - pipe.y2;
                            
                            if (Math.sqrt(dx1 * dx1 + dy1 * dy1) < 50) connected1 = true;
                            if (Math.sqrt(dx2 * dx2 + dy2 * dy2) < 50) connected2 = true;
                        }
                    }
                    
                    pipe.connected = connected1 && connected2;
                    
                    if (pipe.connected && !connections.includes(pipe)) {
                        connections.push(pipe);
                    }
                }
                
                const allGearsConnected = gears.every(gear => gear.connected);
                const allPipesConnected = pipes.every(pipe => pipe.connected);
                
                if (allGearsConnected && allPipesConnected && gameActive) {
                    endGame(true);
                }
            }
            
            function updateScore() {
                const baseScore = 100 * currentLevel;
                const connectionBonus = connections.length * 20;
                const timeBonus = Math.max(0, 300 - Math.floor((Date.now() - startTime) / 1000)) * 5;
                
                score = baseScore + connectionBonus + timeBonus;
                scoreDisplay.textContent = score;
            }
            
            function drawGrid() {
                ctx.strokeStyle = colors.grid;
                ctx.lineWidth = 1;
                
                const gridSize = 40;
                const offsetX = 0;
                const offsetY = 0;
                
                for (let x = offsetX; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = offsetY; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                drawGrid();
                
                for (const pipe of pipes) {
                    pipe.draw();
                }
                
                for (const gear of gears) {
                    gear.update();
                    gear.draw();
                }
                
                if (selectedGear && isDragging) {
                    ctx.strokeStyle = '#4df0ff';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(selectedGear.x, selectedGear.y);
                    ctx.lineTo(selectedGear.targetX, selectedGear.targetY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                updateScore();
            }
            
            function gameLoop() {
                if (!gameActive) return;
                
                draw();
                requestAnimationFrame(gameLoop);
            }
            
            function startGame() {
                gameActive = true;
                startScreen.classList.add('hidden');
                endScreen.classList.add('hidden');
                startTime = Date.now();
                initGame();
                gameLoop();
            }
            
            function endGame(success) {
                gameActive = false;
                
                if (success) {
                    const timeUsed = Math.floor((Date.now() - startTime) / 1000);
                    timeUsedDisplay.textContent = timeUsed;
                    finalScoreDisplay.textContent = score;
                    
                    if (currentLevel >= 3) {
                        endMessage.textContent = "恭喜！你修复了整个机械迷城！";
                        nextBtn.style.display = 'none';
                    } else {
                        endMessage.textContent = `第 ${currentLevel} 关完成！`;
                        nextBtn.style.display = 'inline-block';
                    }
                    
                    endScreen.classList.remove('hidden');
                }
            }
            
            function resizeCanvas() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                const maxWidth = 800;
                const maxHeight = 1200;
                
                const scale = Math.min(width / maxWidth, height / maxHeight, 1);
                
                canvas.width = maxWidth * scale;
                canvas.height = maxHeight * scale;
                
                canvas.style.width = canvas.width + 'px';
                canvas.style.height = canvas.height + 'px';
                
                if (gameActive) {
                    initGame();
                }
            }
            
            function handleMouseDown(e) {
                if (!gameActive) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                for (let i = gears.length - 1; i >= 0; i--) {
                    if (gears[i].containsPoint(x, y)) {
                        selectedGear = gears[i];
                        dragOffsetX = x - selectedGear.x;
                        dragOffsetY = y - selectedGear.y;
                        isDragging = true;
                        e.preventDefault();
                        return;
                    }
                }
            }
            
            function handleMouseMove(e) {
                if (!gameActive || !selectedGear || !isDragging) return;
                
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                selectedGear.x = x - dragOffsetX;
                selectedGear.y = y - dragOffsetY;
                
                selectedGear.x = Math.max(selectedGear.radius, Math.min(canvas.width - selectedGear.radius, selectedGear.x));
                selectedGear.y = Math.max(selectedGear.radius, Math.min(canvas.height - selectedGear.radius, selectedGear.y));
                
                updateConnections();
            }
            
            function handleMouseUp() {
                if (!gameActive || !selectedGear) return;
                
                isDragging = false;
                
                if (selectedGear.isAtTarget()) {
                    selectedGear.x = selectedGear.targetX;
                    selectedGear.y = selectedGear.targetY;
                }
                
                updateConnections();
                selectedGear = null;
            }
            
            function handleTouchStart(e) {
                if (!gameActive) return;
                
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                for (let i = gears.length - 1; i >= 0; i--) {
                    if (gears[i].containsPoint(x, y)) {
                        selectedGear = gears[i];
                        dragOffsetX = x - selectedGear.x;
                        dragOffsetY = y - selectedGear.y;
                        isDragging = true;
                        e.preventDefault();
                        return;
                    }
                }
            }
            
            function handleTouchMove(e) {
                if (!gameActive || !selectedGear || !isDragging) return;
                
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                selectedGear.x = x - dragOffsetX;
                selectedGear.y = y - dragOffsetY;
                
                selectedGear.x = Math.max(selectedGear.radius, Math.min(canvas.width - selectedGear.radius, selectedGear.x));
                selectedGear.y = Math.max(selectedGear.radius, Math.min(canvas.height - selectedGear.radius, selectedGear.y));
                
                updateConnections();
                e.preventDefault();
            }
            
            function handleTouchEnd() {
                handleMouseUp();
            }
            
            function handleKeyDown(e) {
                if (!gameActive || !selectedGear) return;
                
                switch(e.key) {
                    case 'ArrowLeft':
                        selectedGear.x -= 10;
                        break;
                    case 'ArrowRight':
                        selectedGear.x += 10;
                        break;
                    case 'ArrowUp':
                        selectedGear.y -= 10;
                        break;
                    case 'ArrowDown':
                        selectedGear.y += 10;
                        break;
                    case ' ':
                        selectedGear.rotation += Math.PI / 4;
                        break;
                }
                
        selectedGear.x = Math.max(selectedGear.radius, Math.min(canvas.width - selectedGear.radius, selectedGear.x));
        selectedGear.y = Math.max(selectedGear.radius, Math.min(canvas.height - selectedGear.radius, selectedGear.y));
        
        updateConnections();
    }
    
    function nextLevel() {
        currentLevel++;
        levelDisplay.textContent = currentLevel;
        startGame();
    }
    
    function restartGame() {
        score = 0;
        currentLevel = 1;
        levelDisplay.textContent = currentLevel;
        startGame();
    }
    
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', restartGame);
    nextBtn.addEventListener('click', nextLevel);
    
    canvas.addEventListener('mousedown', handleMouseDown);
    canvas.addEventListener('mousemove', handleMouseMove);
    canvas.addEventListener('mouseup', handleMouseUp);
    canvas.addEventListener('mouseleave', handleMouseUp);
    
    canvas.addEventListener('touchstart', handleTouchStart);
    canvas.addEventListener('touchmove', handleTouchMove);
    canvas.addEventListener('touchend', handleTouchEnd);
    canvas.addEventListener('touchcancel', handleTouchEnd);
    
    document.addEventListener('keydown', handleKeyDown);
    
    window.addEventListener('resize', resizeCanvas);
    
    resizeCanvas();
    
    scoreDisplay.textContent = score;
    levelDisplay.textContent = currentLevel;
})();
</script>

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');

  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚

        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚

}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

        '<div style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;">👤</div>' +
        '<div style="font-size:18px;font-weight:600;color:#333;">' + nickname + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;gap:30px;margin-bottom:15px;">' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + following + '</strong><span style="color:#999;font-size:12px;">关注</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + followers + '</strong><span style="color:#999;font-size:12px;">粉丝</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + games.length + '</strong><span style="color:#999;font-size:12px;">作品</span></div>' +
      '</div>' +
      followBtnHtml +
      gamesHtml;
    
    // 检查关注状态（只有不是自己时才检查）
    if (!isSelf) {
      checkFollowStatusForProfile();
    }
  }).catch(() => {
    content.innerHTML = '<div style="padding:20px;color:#999;">加载失败</div>';
  });
}

// 关闭作者主页
function closeAuthorProfile() {
  document.getElementById('author-profile-modal').style.display = 'none';
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
