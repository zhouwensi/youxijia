  <!-- 原游戏body内容 -->
  
    <div class="game-container">
        <div class="header">
            <h1>贪吃蛇</h1>
            <div class="subtitle">经典街机游戏 - 移动端和桌面端均可畅玩</div>
        </div>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startScreen" class="screen">
                <h2>贪吃蛇</h2>
                <p>控制蛇移动，吃掉食物让蛇变长。避免撞到墙壁或自己的身体！</p>
                <div class="score-display">最高分: <span id="highScoreDisplay">0</span></div>
                <button id="startBtn" class="btn">开始游戏</button>
                
                <div class="controls">
                    <div class="control-item">
                        <p>键盘控制</p>
                        <p>方向键 <span class="control-key">↑</span> <span class="control-key">↓</span> <span class="control-key">←</span> <span class="control-key">→</span></p>
                    </div>
                    <div class="control-item">
                        <p>触屏控制</p>
                        <p>使用下方虚拟按钮或滑动屏幕</p>
                    </div>
                </div>
            </div>
            
            <div id="gameOverScreen" class="screen hidden">
                <h2>游戏结束</h2>
                <p>你的蛇撞到了障碍物！</p>
                <div class="score-display">得分: <span id="finalScore">0</span></div>
                <div class="score-display">最高分: <span id="finalHighScore">0</span></div>
                <button id="restartBtn" class="btn">再玩一次</button>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div>得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div>长度</div>
                <div class="stat-value" id="length">3</div>
            </div>
            <div class="stat">
                <div>速度</div>
                <div class="stat-value" id="speed">1</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <button class="mobile-btn up">↑</button>
            <button class="mobile-btn down">↓</button>
            <button class="mobile-btn left">←</button>
            <button class="mobile-btn right">→</button>
            <button class="mobile-btn center">●</button>
        </div>
        
        <div class="instructions">
            提示: 在手机上可以滑动屏幕控制蛇的移动方向
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const GRID_SIZE = 20;
            const INITIAL_SPEED = 150; // 毫秒
            const SPEED_INCREMENT = 5; // 每吃5个食物速度增加
            const CANVAS_WIDTH = 600;
            const CANVAS_HEIGHT = 400;
            
            // 游戏变量
            let canvas, ctx;
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let gameInterval;
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameRunning = false;
            let gameSpeed = INITIAL_SPEED;
            let foodsEaten = 0;
            let touchStartX = 0;
            let touchStartY = 0;
            
            // DOM元素
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreDisplay = document.getElementById('score');
            const lengthDisplay = document.getElementById('length');
            const speedDisplay = document.getElementById('speed');
            const highScoreDisplay = document.getElementById('highScoreDisplay');
            const finalScore = document.getElementById('finalScore');
            const finalHighScore = document.getElementById('finalHighScore');
            
            // 移动控制按钮
            const upBtn = document.querySelector('.mobile-btn.up');
            const downBtn = document.querySelector('.mobile-btn.down');
            const leftBtn = document.querySelector('.mobile-btn.left');
            const rightBtn = document.querySelector('.mobile-btn.right');
            const centerBtn = document.querySelector('.mobile-btn.center');
            
            // 初始化游戏
            function init() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                // 更新最高分显示
                highScoreDisplay.textContent = highScore;
                
                // 初始化蛇
                resetGame();
                
                // 绘制初始游戏画面
                draw();
                
                // 事件监听
                setupEventListeners();
            }
            
            // 设置事件监听器
            function setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', handleKeyDown);
                
                // 按钮控制
                startBtn.addEventListener('click', startGame);
                restartBtn.addEventListener('click', startGame);
                
                // 移动端按钮控制
                upBtn.addEventListener('touchstart', () => changeDirection('up'));
                downBtn.addEventListener('touchstart', () => changeDirection('down'));
                leftBtn.addEventListener('touchstart', () => changeDirection('left'));
                rightBtn.addEventListener('touchstart', () => changeDirection('right'));
                centerBtn.addEventListener('touchstart', () => {
                    if (!gameRunning) {
                        startGame();
                    }
                });
                
                // 触摸滑动控制
                canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
                canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
                
                // 防止页面滚动
                document.addEventListener('touchmove', function(e) {
                    if (gameRunning) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
            
            // 重置游戏状态
            function resetGame() {
                // 重置蛇
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                
                // 重置方向
                direction = 'right';
                nextDirection = 'right';
                
                // 重置分数和速度
                score = 0;
                foodsEaten = 0;
                gameSpeed = INITIAL_SPEED;
                
                // 生成食物
                generateFood();
                
                // 更新显示
                updateDisplays();
            }
            
            // 开始游戏
            function startGame() {
                resetGame();
                gameRunning = true;
                
                // 隐藏屏幕
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                
                // 清除之前的游戏循环
                if (gameInterval) {
                    clearInterval(gameInterval);
                }
                
                // 开始游戏循环
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
            
            // 游戏结束
            function gameOver() {
                gameRunning = false;
                clearInterval(gameInterval);
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                // 更新结束屏幕
                finalScore.textContent = score;
                finalHighScore.textContent = highScore;
                
                // 显示结束屏幕
                gameOverScreen.classList.remove('hidden');
            }
            
            // 游戏主循环
            function gameLoop() {
                // 更新方向
                direction = nextDirection;
                
                // 移动蛇
                moveSnake();
                
                // 检查碰撞
                if (checkCollision()) {
                    gameOver();
                    return;
                }
                
                // 检查是否吃到食物
                if (checkFoodCollision()) {
                    eatFood();
                }
                
                // 绘制游戏
                draw();
                
                // 更新显示
                updateDisplays();
            }
            
            // 移动蛇
            function moveSnake() {
                // 获取蛇头
                const head = {...snake[0]};
                
                // 根据方向移动蛇头
                switch (direction) {
                    case 'up': head.y--; break;
                    case 'down': head.y++; break;
                    case 'left': head.x--; break;
                    case 'right': head.x++; break;
                }
                
                // 添加新的蛇头
                snake.unshift(head);
                
                // 如果没有吃到食物，移除蛇尾
                if (!checkFoodCollision()) {
                    snake.pop();
                }
            }
            
            // 检查碰撞
            function checkCollision() {
                const head = snake[0];
                
                // 检查墙壁碰撞
                if (head.x < 0 || head.x >= canvas.width / GRID_SIZE || 
                    head.y < 0 || head.y >= canvas.height / GRID_SIZE) {
                    return true;
                }
                
                // 检查自身碰撞
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // 生成食物
            function generateFood() {
                let foodOnSnake;
                
                do {
                    foodOnSnake = false;
                    food = {
                        x: Math.floor(Math.random() * (canvas.width / GRID_SIZE)),
                        y: Math.floor(Math.random() * (canvas.height / GRID_SIZE))
                    };
                    
                    // 确保食物不在蛇身上
                    for (let segment of snake) {
                        if (segment.x === food.x && segment.y === food.y) {
                            foodOnSnake = true;
                            break;
                        }
                    }
                } while (foodOnSnake);
            }
            
            // 检查食物碰撞
            function checkFoodCollision() {
                const head = snake[0];
                return head.x === food.x && head.y === food.y;
            }
            
            // 吃食物
            function eatFood() {
                // 增加分数
                score += 10;
                foodsEaten++;
                
                // 每吃5个食物增加速度
                if (foodsEaten % 5 === 0) {
                    gameSpeed = Math.max(50, gameSpeed - SPEED_INCREMENT);
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                }
                
                // 生成新食物
                generateFood();
            }
            
            // 绘制游戏
            function draw() {
                // 清除画布
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                drawGrid();
                
                // 绘制蛇
                drawSnake();
                
                // 绘制食物
                drawFood();
                
                // 绘制边界
                drawBorder();
            }
            
            // 绘制网格
            function drawGrid() {
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 0.5;
                
                // 垂直线
                for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 水平线
                for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 绘制蛇
            function drawSnake() {
                // 绘制蛇身
                for (let i = 0; i < snake.length; i++) {
                    const segment = snake[i];
                    
                    // 蛇头
                    if (i === 0) {
                        ctx.fillStyle = '#00dbde';
                        ctx.fillRect(
                            segment.x * GRID_SIZE, 
                            segment.y * GRID_SIZE, 
                            GRID_SIZE, 
                            GRID_SIZE
                        );
                        
                        // 蛇头眼睛
                        ctx.fillStyle = '#fff';
                        const eyeSize = GRID_SIZE / 5;
                        
                        // 根据方向绘制眼睛
                        let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
                        
                        switch (direction) {
                            case 'right':
                                leftEyeX = segment.x * GRID_SIZE + GRID_SIZE - eyeSize * 2;
                                leftEyeY = segment.y * GRID_SIZE + eyeSize * 2;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE - eyeSize * 2;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE - eyeSize * 3;
                                break;
                            case 'left':
                                leftEyeX = segment.x * GRID_SIZE + eyeSize;
                                leftEyeY = segment.y * GRID_SIZE + eyeSize * 2;
                                rightEyeX = segment.x * GRID_SIZE + eyeSize;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE - eyeSize * 3;
                                break;
                            case 'up':
                                leftEyeX = segment.x * GRID_SIZE + eyeSize * 2;
                                leftEyeY = segment.y * GRID_SIZE + eyeSize;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE - eyeSize * 3;
                                rightEyeY = segment.y * GRID_SIZE + eyeSize;
                                break;
                            case 'down':
                                leftEyeX = segment.x * GRID_SIZE + eyeSize * 2;
                                leftEyeY = segment.y * GRID_SIZE + GRID_SIZE - eyeSize * 2;
                                rightEyeX = segment.x * GRID_SIZE + GRID_SIZE - eyeSize * 3;
                                rightEyeY = segment.y * GRID_SIZE + GRID_SIZE - eyeSize * 2;
                                break;
                        }
                        
                        ctx.fillRect(leftEyeX, leftEyeY, eyeSize, eyeSize);
                        ctx.fillRect(rightEyeX, rightEyeY, eyeSize, eyeSize);
                    } 
                    // 蛇身
                    else {
                        // 渐变颜色
                        const colorValue = Math.max(100, 255 - i * 5);
                        ctx.fillStyle = `rgb(0, ${colorValue}, ${colorValue})`;
                        
                        ctx.fillRect(
                            segment.x * GRID_SIZE, 
                            segment.y * GRID_SIZE, 
                            GRID_SIZE, 
                            GRID_SIZE
                        );
                        
                        // 蛇身内部细节
                        ctx.fillStyle = `rgba(255, 255, 255, 0.2)`;
                        ctx.fillRect(
                            segment.x * GRID_SIZE + 2, 
                            segment.y * GRID_SIZE + 2, 
                            GRID_SIZE - 4, 
                            GRID_SIZE - 4
                        );
                    }
                }
            }
            
            // 绘制食物
            function drawFood() {
                // 食物主体
                ctx.fillStyle = '#fc00ff';
                ctx.beginPath();
                ctx.arc(
                    food.x * GRID_SIZE + GRID_SIZE / 2,
                    food.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // 食物高光
                ctx.fillStyle = '#ff66ff';
                ctx.beginPath();
                ctx.arc(
                    food.x * GRID_SIZE + GRID_SIZE / 3,
                    food.y * GRID_SIZE + GRID_SIZE / 3,
                    GRID_SIZE / 6,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            // 绘制边界
            function drawBorder() {
                ctx.strokeStyle = '#00dbde';
                ctx.lineWidth = 3;
                ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
            }
            
            // 更新显示
            function updateDisplays() {
                scoreDisplay.textContent = score;
                lengthDisplay.textContent = snake.length;
                speedDisplay.textContent = Math.round(INITIAL_SPEED / gameSpeed * 10) / 10;
            }
            
            // 处理键盘输入
            function handleKeyDown(e) {
                if (!gameRunning && e.key === ' ') {
                    startGame();
                    return;
                }
                
                switch (e.key) {
                    case 'ArrowUp':
                        if (direction !== 'down') changeDirection('up');
                        break;
                    case 'ArrowDown':
                        if (direction !== 'up') changeDirection('down');
                        break;
                    case 'ArrowLeft':
                        if (direction !== 'right') changeDirection('left');
                        break;
                    case 'ArrowRight':
                        if (direction !== 'left') changeDirection('right');
                        break;
                }
            }
            
            // 改变方向
            function changeDirection(newDirection) {
                // 防止直接反向移动
                if (
                    (newDirection === 'up' && direction !== 'down') ||
                    (newDirection === 'down' && direction !== 'up') ||
                    (newDirection === 'left' && direction !== 'right') ||
                    (newDirection === 'right' && direction !== 'left')
                ) {
                    nextDirection = newDirection;
                }
            }
            
            // 处理触摸开始
            function handleTouchStart(e) {
                e.preventDefault();
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }
            
            // 处理触摸移动
            function handleTouchMove(e) {
                if (!gameRunning) return;
                
                e.preventDefault();
                const touch = e.touches[0];
                const touchEndX = touch.clientX;
                const touchEndY = touch.clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定滑动方向（需要最小滑动距离）
                if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        // 水平滑动
                        if (dx > 0 && direction !== 'left') {
                            changeDirection('right');
                        } else if (dx < 0 && direction !== 'right') {
                            changeDirection('left');
                        }
                    } else {
                        // 垂直滑动
                        if (dy > 0 && direction !== 'up') {
                            changeDirection('down');
                        } else if (dy < 0 && direction !== 'down') {
                            changeDirection('up');
                        }
                    }
                    
                    // 更新起始位置，以便连续滑动
                    touchStartX = touchEndX;
                    touchStartY = touchEndY;
                }
            }
            
            // 初始化游戏
            init();
        });

    .then(res => res.json())
    .then(data => {

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const userToken = getUserToken();
    const canDelete = comment.is_mine || (userToken && comment.user_token === userToken);
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar">' + avatarInitial + '</div>' +
          '<span class="comment-author-name">' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}
