  <!-- 原游戏body内容 -->
  
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div id="startScreen" class="screen">
            <h1>像素小鸟飞行记</h1>
            <p>帮助愤怒的小鸟穿越管道障碍！</p>
            <div class="controls-info">
                <h3>操作说明</h3>
                <p>电脑：按空格键或点击鼠标让小鸟跳跃</p>
                <p>手机：点击屏幕或使用跳跃按钮</p>
                <p>避免撞到管道和地面！</p>
            </div>
            <button id="startButton" class="button">开始游戏</button>
            <div class="game-stats">
                <div class="high-score">最高分: <span id="highScoreValue">0</span></div>
            </div>
        </div>
        
        <div id="gameScreen" class="screen hidden">
            <h2>游戏进行中</h2>
            <div class="score-display">得分: <span id="currentScore">0</span></div>
            <p>点击屏幕或按空格键跳跃</p>
            <div class="mobile-controls">
                <div class="jump-button" id="mobileJumpBtn">跳跃</div>
            </div>
            <button id="pauseButton" class="button">暂停游戏</button>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2>游戏结束</h2>
            <div class="score-display">最终得分: <span id="finalScore">0</span></div>
            <p>你撞到了障碍物！</p>
            <div class="game-stats">
                <div class="high-score">最高分: <span id="finalHighScore">0</span></div>
            </div>
            <button id="restartButton" class="button">重新开始</button>
            <button id="menuButton" class="button">返回菜单</button>
        </div>
    </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏变量
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 屏幕元素
            const startScreen = document.getElementById('startScreen');
            const gameScreen = document.getElementById('gameScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startButton = document.getElementById('startButton');
            const pauseButton = document.getElementById('pauseButton');
            const restartButton = document.getElementById('restartButton');
            const menuButton = document.getElementById('menuButton');
            const mobileJumpBtn = document.getElementById('mobileJumpBtn');
            const currentScoreElement = document.getElementById('currentScore');
            const finalScoreElement = document.getElementById('finalScore');
            const highScoreElement = document.getElementById('highScoreValue');
            const finalHighScoreElement = document.getElementById('finalHighScore');
            
            // 游戏状态
            let gameState = 'start'; // start, playing, paused, gameOver
            let score = 0;
            let highScore = localStorage.getItem('pixelBirdHighScore') || 0;
            highScoreElement.textContent = highScore;
            
            // 游戏对象
            const bird = {
                x: 80,
                y: canvas.height / 2,
                width: 30,
                height: 30,
                velocity: 0,
                gravity: 0.5,
                jumpStrength: -10,
                color: '#FFCC00',
                outlineColor: '#FF6600'
            };
            
            // 管道数组
            const pipes = [];
            const pipeWidth = 60;
            const pipeGap = 150;
            const pipeSpeed = 3;
            let pipeTimer = 0;
            const pipeInterval = 120; // 帧数
            
            // 游戏循环变量
            let lastTime = 0;
            let gameLoopId;
            
            // 初始化游戏
            function initGame() {
                // 重置小鸟
                bird.y = canvas.height / 2;
                bird.velocity = 0;
                
                // 清空管道
                pipes.length = 0;
                pipeTimer = 0;
                
                // 重置分数
                score = 0;
                currentScoreElement.textContent = score;
                
                // 绘制初始画面
                draw();
            }
            
            // 绘制小鸟
            function drawBird() {
                // 绘制小鸟身体
                ctx.fillStyle = bird.color;
                ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
                
                // 绘制小鸟轮廓（像素风格）
                ctx.strokeStyle = bird.outlineColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(bird.x, bird.y, bird.width, bird.height);
                
                // 绘制小鸟眼睛
                ctx.fillStyle = '#000';
                ctx.fillRect(bird.x + 20, bird.y + 8, 6, 6);
                
                // 绘制小鸟嘴巴
                ctx.fillStyle = '#FF6600';
                ctx.fillRect(bird.x + 28, bird.y + 12, 10, 6);
            }
            
            // 绘制管道
            function drawPipes() {
                for (let i = 0; i < pipes.length; i++) {
                    const pipe = pipes[i];
                    
                    // 绘制上管道
                    ctx.fillStyle = '#66CC33';
                    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                    
                    // 绘制上管道轮廓
                    ctx.strokeStyle = '#339900';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                    
                    // 绘制下管道
                    ctx.fillStyle = '#66CC33';
                    ctx.fillRect(pipe.x, canvas.height - pipe.bottomHeight, pipeWidth, pipe.bottomHeight);
                    
                    // 绘制下管道轮廓
                    ctx.strokeStyle = '#339900';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pipe.x, canvas.height - pipe.bottomHeight, pipeWidth, pipe.bottomHeight);
                    
                    // 绘制管道顶部/底部（像素风格）
                    ctx.fillStyle = '#339900';
                    ctx.fillRect(pipe.x - 3, pipe.topHeight - 10, pipeWidth + 6, 10);
                    ctx.fillRect(pipe.x - 3, canvas.height - pipe.bottomHeight, pipeWidth + 6, 10);
                }
            }
            
            // 绘制背景
            function drawBackground() {
                // 绘制天空
                ctx.fillStyle = '#1A2B3C';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制地面
                ctx.fillStyle = '#8B7355';
                ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
                
                // 绘制地面顶部（像素风格）
                ctx.fillStyle = '#654321';
                ctx.fillRect(0, canvas.height - 40, canvas.width, 5);
                
                // 绘制星星
                ctx.fillStyle = '#FFFFFF';
                for (let i = 0; i < 20; i++) {
                    const x = (i * 37) % canvas.width;
                    const y = (i * 23) % (canvas.height - 100);
                    ctx.fillRect(x, y, 2, 2);
                }
                
                // 绘制云朵
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(50, 80, 40, 20);
                ctx.fillRect(200, 150, 60, 25);
                ctx.fillRect(350, 100, 50, 20);
            }
            
            // 绘制分数
            function drawScore() {
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 24px "Courier New", monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`得分: ${score}`, 10, 30);
                
                // 绘制最高分
                ctx.fillStyle = '#FFCC00';
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.fillText(`最高分: ${highScore}`, 10, 60);
            }
            
            // 绘制游戏画面
            function draw() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景
                drawBackground();
                
                // 绘制管道
                drawPipes();
                
                // 绘制小鸟
                drawBird();
                
                // 绘制分数
                drawScore();
                
                // 如果游戏暂停，绘制暂停文本
                if (gameState === 'paused') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 36px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏暂停', canvas.width / 2, canvas.height / 2 - 30);
                    
                    ctx.font = 'bold 20px "Courier New", monospace';
                    ctx.fillText('按空格键或点击按钮继续', canvas.width / 2, canvas.height / 2 + 20);
                }
            }
            
            // 更新小鸟位置
            function updateBird() {
                // 应用重力
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;
                
                // 限制小鸟位置（不能飞出屏幕顶部，不能掉到地面下）
                if (bird.y < 0) {
                    bird.y = 0;
                    bird.velocity = 0;
                }
                
                if (bird.y + bird.height > canvas.height - 40) {
                    bird.y = canvas.height - 40 - bird.height;
                    gameOver();
                }
            }
            
            // 更新管道
            function updatePipes() {
                // 增加管道计时器
                pipeTimer++;
                
                // 每隔一段时间添加新管道
                if (pipeTimer > pipeInterval) {
                    addPipe();
                    pipeTimer = 0;
                }
                
                // 更新所有管道位置
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= pipeSpeed;
                    
                    // 如果管道移出屏幕，移除它
                    if (pipes[i].x + pipeWidth < 0) {
                        pipes.splice(i, 1);
                        // 每通过一个管道得一分
                        score++;
                        currentScoreElement.textContent = score;
                    }
                    
                    // 检测碰撞
                    if (checkCollision(pipes[i])) {
                        gameOver();
                    }
                }
            }
            
            // 添加新管道
            function addPipe() {
                const topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 20;
                const bottomHeight = canvas.height - topHeight - pipeGap - 40;
                
                pipes.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    bottomHeight: bottomHeight,
                    passed: false
                });
            }
            
            // 检测碰撞
            function checkCollision(pipe) {
                // 小鸟的边界
                const birdLeft = bird.x;
                const birdRight = bird.x + bird.width;
                const birdTop = bird.y;
                const birdBottom = bird.y + bird.height;
                
                // 管道的边界
                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipeWidth;
                const pipeTopBottom = pipe.topHeight;
                const pipeBottomTop = canvas.height - pipe.bottomHeight;
                
                // 检测是否与上管道碰撞
                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    if (birdTop < pipeTopBottom) {
                        return true; // 撞到上管道
                    }
                }
                
                // 检测是否与下管道碰撞
                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    if (birdBottom > pipeBottomTop) {
                        return true; // 撞到下管道
                    }
                }
                
                return false;
            }
            
            // 小鸟跳跃
            function jump() {
                if (gameState === 'playing') {
                    bird.velocity = bird.jumpStrength;
                }
            }
            
            // 游戏结束
            function gameOver() {
                gameState = 'gameOver';
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('pixelBirdHighScore', highScore);
                }
                
                // 更新显示
                finalScoreElement.textContent = score;
                finalHighScoreElement.textContent = highScore;
                
                // 显示游戏结束屏幕
                gameScreen.classList.add('hidden');
                gameOverScreen.classList.remove('hidden');
                
                // 停止游戏循环
                cancelAnimationFrame(gameLoopId);
            }
            
            // 开始游戏
            function startGame() {
                gameState = 'playing';
                initGame();
                
                // 切换屏幕
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                
                // 开始游戏循环
                lastTime = 0;
                gameLoopId = requestAnimationFrame(gameLoop);
            }
            
            // 暂停/继续游戏
            function togglePause() {
                if (gameState === 'playing') {
                    gameState = 'paused';
                    pauseButton.textContent = '继续游戏';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseButton.textContent = '暂停游戏';
                    // 继续游戏循环
                    lastTime = 0;
                    gameLoopId = requestAnimationFrame(gameLoop);
                }
            }
            
            // 返回菜单
            function goToMenu() {
                gameState = 'start';
                
                // 切换屏幕
                gameScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                
                // 更新最高分显示
                highScoreElement.textContent = highScore;
                
                // 绘制开始画面
                draw();
            }
            
            // 游戏主循环
            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                const deltaTime = timestamp - lastTime;
                
                // 控制帧率
                if (deltaTime > 16) { // 大约60fps
                    if (gameState === 'playing') {
                        // 更新游戏状态
                        updateBird();
                        updatePipes();
                        
                        // 绘制游戏
                        draw();
                    }
                    
                    lastTime = timestamp;
                }
                
                // 继续游戏循环
                if (gameState === 'playing') {
                    gameLoopId = requestAnimationFrame(gameLoop);
                }
            }
            
            // 事件监听器
            startButton.addEventListener('click', startGame);
            pauseButton.addEventListener('click', togglePause);
            restartButton.addEventListener('click', startGame);
            menuButton.addEventListener('click', goToMenu);
            
            // 键盘控制
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    
                    if (gameState === 'start') {
                        startGame();
                    } else if (gameState === 'playing') {
                        jump();
                    } else if (gameState === 'paused') {
                        togglePause();
                    } else if (gameState === 'gameOver') {
                        startGame();
                    }
                }
                
                // P键暂停/继续
                if (e.code === 'KeyP' && (gameState === 'playing' || gameState === 'paused')) {
                    togglePause();
                }
            });
            
            // 鼠标/触屏控制
            canvas.addEventListener('click', function() {
                if (gameState === 'playing') {
                    jump();
                }
            });
            
            // 移动端跳跃按钮
            mobileJumpBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (gameState === 'playing') {
                    jump();
                    this.classList.add('active');
                }
            });
            
            mobileJumpBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                this.classList.remove('active');
            });
            
            // 移动端触摸控制（整个游戏区域）
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (gameState === 'playing') {
                    jump();
                } else if (gameState === 'start') {
                    startGame();
                } else if (gameState === 'gameOver') {
                    startGame();
                }
            });
            
            // 防止页面滚动
            document.addEventListener('touchmove', function(e) {
                if (e.target === canvas || e.target === mobileJumpBtn) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // 初始绘制
            draw();
            
            // 调整画布大小以适应容器
            function resizeCanvas() {
                const container = canvas.parentElement;
                const containerWidth = container.clientWidth;
                
                // 保持宽高比
                const aspectRatio = canvas.width / canvas.height;
                canvas.style.width = containerWidth + 'px';
                canvas.style.height = (containerWidth / aspectRatio) + 'px';
            }
            
            // 初始调整大小
            resizeCanvas();
            
            // 窗口大小改变时调整画布
            window.addEventListener('resize', resizeCanvas);
        });
    </script>

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {

  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {

          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量

          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚

        countEl.innerText = count;
      }
    })

}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

function closeAuthorProfile() {
  document.getElementById('author-profile-modal').style.display = 'none';
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
