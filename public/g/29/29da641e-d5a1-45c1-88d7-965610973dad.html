  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="startScreen" class="screen">
            <h1>✨卡哇伊射击✨</h1>
            <div class="instructions">
                移动鼠标或触摸屏幕控制飞船<br>
                点击或触摸射击，消灭所有小怪兽！<br>
                每击中一个得10分，漏掉3个游戏结束
            </div>
            <button id="startBtn" class="btn">开始游戏</button>
            <div class="controls">
                <div>电脑：鼠标移动 + 点击</div>
                <div>手机：触摸移动 + 点击</div>
            </div>
        </div>
        
        <div id="endScreen" class="screen hidden">
            <h2>游戏结束</h2>
            <div id="finalScore" class="score">得分: 0</div>
            <button id="restartBtn" class="btn">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScore = document.getElementById('finalScore');

        let game = {
            running: false,
            score: 0,
            lives: 3,
            level: 1,
            enemies: [],
            bullets: [],
            particles: [],
            lastShot: 0,
            shotDelay: 300
        };

        const player = {
            x: 0,
            y: 0,
            width: 60,
            height: 60,
            speed: 8
        };

        class Enemy {
            constructor() {
                this.size = 30 + Math.random() * 20;
                this.x = Math.random() * (canvas.width - this.size);
                this.y = -this.size;
                this.speed = 1 + Math.random() * 2 + game.level * 0.5;
                this.color = `hsl(${Math.random() * 60 + 300}, 100%, 65%)`;
                this.type = Math.floor(Math.random() * 3);
            }

            update() {
                this.y += this.speed;
                return this.y > canvas.height;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size/2, this.y + this.size/2);
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                
                if (this.type === 0) {
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                } else if (this.type === 1) {
                    ctx.rect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.roundRect(-this.size/2, -this.size/2, this.size, this.size, 10);
                } else {
                    ctx.moveTo(0, -this.size/2);
                    for (let i = 1; i < 6; i++) {
                        const angle = (i * Math.PI * 2) / 5;
                        const radius = i % 2 === 0 ? this.size/2 : this.size/3;
                        ctx.lineTo(Math.sin(angle) * radius, -Math.cos(angle) * radius);
                    }
                    ctx.closePath();
                }
                
                ctx.fill();
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-this.size/4, -this.size/6, this.size/8, 0, Math.PI * 2);
                ctx.arc(this.size/4, -this.size/6, this.size/8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                if (this.type === 2) {
                    ctx.arc(0, this.size/8, this.size/10, 0, Math.PI);
                } else {
                    ctx.arc(0, this.size/6, this.size/10, 0, Math.PI);
                }
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 8;
                this.height = 20;
                this.speed = 12;
                this.color = '#4cc9f0';
            }

            update() {
                this.y -= this.speed;
                return this.y < -this.height;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y, this.width, this.height, 4);
                ctx.fill();
                
                ctx.fillStyle = '#72efdd';
                ctx.beginPath();
                ctx.roundRect(this.x - this.width/2, this.y + this.height/2, this.width, this.height/2, 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = color;
                this.life = 1;
                this.decay = 0.02;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                return this.life <= 0;
            }

            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            
            ctx.fillStyle = '#ff6b9d';
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, player.height/3);
            ctx.lineTo(-player.width/4, player.height/2);
            ctx.lineTo(player.width/4, player.height/2);
            ctx.lineTo(player.width/2, player.height/3);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#f72585';
            ctx.beginPath();
            ctx.ellipse(0, -player.height/6, player.width/4, player.height/6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-player.width/6, -player.height/4, player.width/12, 0, Math.PI * 2);
            ctx.arc(player.width/6, -player.height/4, player.width/12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#4361ee';
            ctx.beginPath();
            ctx.arc(-player.width/6, -player.height/4, player.width/24, 0, Math.PI * 2);
            ctx.arc(player.width/6, -player.height/4, player.width/24, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawHUD() {
            ctx.fillStyle = '#4cc9f0';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`得分: ${game.score}`, 20, 40);
            
            ctx.fillStyle = '#ff6b9d';
            ctx.fillText(`生命: ${game.lives}`, 20, 80);
            
            ctx.fillStyle = '#72efdd';
            ctx.fillText(`关卡: ${game.level}`, 20, 120);
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(canvas.width - 220, 20, 200, 25);
            
            ctx.fillStyle = '#f72585';
            const progress = Math.min(game.score % 100, 100);
            ctx.fillRect(canvas.width - 220, 20, progress * 2, 25);
            
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(`下一关: ${progress}/100`, canvas.width - 120, 42);
        }

        function spawnEnemy() {
            if (Math.random() < 0.03 + game.level * 0.01) {
                game.enemies.push(new Enemy());
            }
        }

        function shoot() {
            const now = Date.now();
            if (now - game.lastShot > game.shotDelay) {
                game.bullets.push(new Bullet(player.x + player.width/2, player.y));
                game.lastShot = now;
                playSound('shoot');
            }
        }

        function checkCollisions() {
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                const enemy = game.enemies[i];
                
                if (enemy.y + enemy.size > player.y && 
                    enemy.x < player.x + player.width && 
                    enemy.x + enemy.size > player.x &&
                    enemy.y < player.y + player.height) {
                    game.enemies.splice(i, 1);
                    game.lives--;
                    playSound('hit');
                    
                    for (let j = 0; j < 15; j++) {
                        game.particles.push(new Particle(enemy.x + enemy.size/2, enemy.y + enemy.size/2, enemy.color));
                    }
                    
                    if (game.lives <= 0) {
                        endGame();
                    }
                    continue;
                }
                
                for (let j = game.bullets.length - 1; j >= 0; j--) {
                    const bullet = game.bullets[j];
                    
                    if (bullet.x > enemy.x && 
                        bullet.x < enemy.x + enemy.size &&
                        bullet.y > enemy.y && 
                        bullet.y < enemy.y + enemy.size) {
                        
                        game.enemies.splice(i, 1);
                        game.bullets.splice(j, 1);
                        game.score += 10;
                        playSound('score');
                        
                        for (let k = 0; k < 20; k++) {
                            game.particles.push(new Particle(enemy.x + enemy.size/2, enemy.y + enemy.size/2, enemy.color));
                        }
                        
                        if (game.score % 100 === 0) {
                            game.level++;
                            playSound('level');
                        }
                        break;
                    }
                }
            }
        }

        function updateGame() {
            if (!game.running) return;
            
            spawnEnemy();
            
            for (let i = game.enemies.length - 1; i >= 0; i--) {
                if (game.enemies[i].update()) {
                    game.enemies.splice(i, 1);
                    game.lives--;
                    if (game.lives <= 0) {
                        endGame();
                    }
                }
            }
            
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                if (game.bullets[i].update()) {
                    game.bullets.splice(i, 1);
                }
            }
            
            for (let i = game.particles.length - 1; i >= 0; i--) {
                if (game.particles[i].update()) {
                    game.particles.splice(i, 1);
                }
            }
            
            checkCollisions();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(15, 52, 96, 0.1)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 3;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            game.enemies.forEach(enemy => enemy.draw());
            game.bullets.forEach(bullet => bullet.draw());
            game.particles.forEach(particle => particle.draw());
            drawPlayer();
            drawHUD();
        }

        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            game = {
                running: true,
                score: 0,
                lives: 3,
                level: 1,
                enemies: [],
                bullets: [],
                particles: [],
                lastShot: 0,
                shotDelay: 300
            };
            
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            playSound('start');
        }

        function endGame() {
            game.running = false;
            finalScore.textContent = `得分: ${game.score}`;
            endScreen.classList.remove('hidden');
            playSound('end');
        }

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            switch(type) {
                case 'shoot':
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.type = 'sine';
                    break;
                case 'score':
                    oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.1);
                    oscillator.type = 'sine';
                    break;
                case 'hit':
                    oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.2);
                    oscillator.type = 'sawtooth';
                    break;
                case 'level':
                    oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.1);
                    oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.2);
                    oscillator.type = 'sine';
                    break;
                case 'start':
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.3);
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    break;
                case 'end':
                    oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.5);
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    break;
            }
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        function handleMouseMove(e) {
            if (!game.running) return;
            
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.width / 2;
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
        }

        function handleTouchMove(e) {
            if (!game.running) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            player.x = touch.clientX - rect.left - player.width / 2;
            player.x = Math.max(0, Math.min(player.x, canvas.width - player.width));
        }

        function handleClick(e) {
            if (!game.running) return;
            shoot();
        }

        function handleTouchStart(e) {
            if (!game.running) return;
            e.preventDefault();
            shoot();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('click', handleClick);
        canvas.addEventListener('touchstart', handleTouchStart);

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && game.running) {
                shoot();
            }
        });

        resizeCanvas();
        gameLoop();
        
        startScreen.classList.remove('hidden');
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = '29da641e-d5a1-45c1-88d7-965610973dad';
const gameTitle = '卡哇伊射击';
const authorToken = 'bc4f918d-df7f-42ac-96ba-dc2e46a88d29';
const authorName = 'MarsZhou';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

// 全屏模式状态
let isFullscreenMode = false;

// 切换全屏模式
function toggleFullscreenMode() {
  isFullscreenMode = !isFullscreenMode;
  
  if (isFullscreenMode) {
    // 进入全屏
    document.body.classList.add('fullscreen-mode');
    
    // 尝试请求浏览器全屏
    try {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && isFullscreenMode) {
    toggleFullscreenMode();
  }
});

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {

          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {

        }
      } else {

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
});
</script>
