<body>
  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="startScreen" class="screen">
            <h1>王者荣耀</h1>
            <h2>迷你战场</h2>
            <p>控制你的英雄，击败来袭的小兵和敌方英雄！使用技能，收集金币，升级你的英雄，成为战场上的王者！</p>
            <p class="mobile-only">使用下方按钮移动和攻击</p>
            <p>键盘操作：WASD移动，J攻击，K技能</p>
            <button class="button" id="startButton">开始战斗</button>
        </div>
        <div id="endScreen" class="screen" style="display: none;">
            <h1 id="endTitle">游戏结束</h1>
            <p id="endMessage">你坚持了 <span id="finalTime">0</span> 秒，击败了 <span id="finalKills">0</span> 个敌人</p>
            <button class="button" id="restartButton">再战一场</button>
        </div>
        <div id="stats" class="stats" style="display: none;">
            时间: <span id="time">0</span>s | 击败: <span id="kills">0</span> | 金币: <span id="gold">0</span>
        </div>
        <div id="controls" class="controls" style="display: none;">
            <div class="control-btn" id="leftBtn">←</div>
            <div class="control-btn" id="upBtn">↑</div>
            <div class="control-btn" id="downBtn">↓</div>
            <div class="control-btn" id="rightBtn">→</div>
            <div class="control-btn" id="attackBtn" style="background: rgba(255, 107, 107, 0.2); color: #ff6b6b; border-color: #ff6b6b;">J</div>
            <div class="control-btn" id="skillBtn" style="background: rgba(255, 215, 0, 0.2); color: #ffd700; border-color: #ffd700;">K</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const stats = document.getElementById('stats');
        const controls = document.getElementById('controls');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const timeSpan = document.getElementById('time');
        const killsSpan = document.getElementById('kills');
        const goldSpan = document.getElementById('gold');
        const finalTime = document.getElementById('finalTime');
        const finalKills = document.getElementById('finalKills');
        const endTitle = document.getElementById('endTitle');
        const endMessage = document.getElementById('endMessage');

        const controlBtns = ['leftBtn','upBtn','downBtn','rightBtn','attackBtn','skillBtn'].map(id=>document.getElementById(id));

        let gameActive = false;
        let gameTime = 0;
        let kills = 0;
        let gold = 0;
        let keys = {};
        let touchControls = {};

        function resizeCanvas() {
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Hero {
            constructor() {
                this.reset();
                this.skillCooldown = 0;
                this.maxSkillCooldown = 120;
                this.level = 1;
                this.exp = 0;
                this.maxExp = 10;
            }
            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 25;
                this.speed = 5;
                this.health = 100;
                this.maxHealth = 100;
                this.attackDamage = 20;
                this.attackCooldown = 0;
                this.attackSpeed = 20;
                this.color = '#4fc3f7';
            }
            update() {
                let dx = 0, dy = 0;
                if (keys['a'] || keys['ArrowLeft'] || touchControls.left) dx -= 1;
                if (keys['d'] || keys['ArrowRight'] || touchControls.right) dx += 1;
                if (keys['w'] || keys['ArrowUp'] || touchControls.up) dy -= 1;
                if (keys['s'] || keys['ArrowDown'] || touchControls.down) dy += 1;
                if (dx !== 0 || dy !== 0) {
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    dx /= dist; dy /= dist;
                    this.x += dx * this.speed;
                    this.y += dy * this.speed;
                }
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.skillCooldown > 0) this.skillCooldown--;

                if ((keys['j'] || touchControls.attack) && this.attackCooldown === 0) {
                    this.attack();
                    this.attackCooldown = this.attackSpeed;
                }
                if ((keys['k'] || touchControls.skill) && this.skillCooldown === 0) {
                    this.useSkill();
                    this.skillCooldown = this.maxSkillCooldown;
                }
            }
            attack() {
                projectiles.push(new Projectile(this.x, this.y, mouseX, mouseY, this.attackDamage, this.color));
            }
            useSkill() {
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    projectiles.push(new Projectile(this.x, this.y, this.x + Math.cos(angle)*100, this.y + Math.sin(angle)*100, this.attackDamage * 1.5, '#ffd700'));
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 10, (this.health / this.maxHealth) * this.radius * 2, 5);

                if (this.skillCooldown > 0) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 5, -Math.PI/2, -Math.PI/2 + (1 - this.skillCooldown/this.maxSkillCooldown) * Math.PI * 2);
                    ctx.lineTo(this.x, this.y);
                    ctx.fill();
                }
            }
            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    gameOver(false);
                }
            }
            gainExp(amount) {
                this.exp += amount;
                if (this.exp >= this.maxExp) {
                    this.level++;
                    this.exp -= this.maxExp;
                    this.maxExp = Math.floor(this.maxExp * 1.5);
                    this.maxHealth += 20;
                    this.health = this.maxHealth;
                    this.attackDamage += 5;
                    this.speed += 0.5;
                }
            }
        }

        class Enemy {
            constructor() {
                this.radius = 15 + Math.random() * 10;
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { this.x = -this.radius; this.y = Math.random() * canvas.height; }
                else if (side === 1) { this.x = canvas.width + this.radius; this.y = Math.random() * canvas.height; }
                else if (side === 2) { this.x = Math.random() * canvas.width; this.y = -this.radius; }
                else { this.x = Math.random() * canvas.width; this.y = canvas.height + this.radius; }
                this.speed = 1 + Math.random() * 2;
                this.health = 20 + Math.floor(this.radius);
                this.maxHealth = this.health;
                this.damage = 5;
                this.color = `hsl(${Math.random()*60}, 100%, 50%)`;
                this.isBoss = Math.random() < 0.02;
                if (this.isBoss) {
                    this.radius *= 2;
                    this.health *= 5;
                    this.maxHealth = this.health;
                    this.speed *= 0.7;
                    this.damage *= 3;
                    this.color = '#ff0000';
                }
            }
            update() {
                const dx = hero.x - this.x;
                const dy = hero.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 0) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                if (dist < this.radius + hero.radius) {
                    hero.takeDamage(this.damage);
                    this.health = 0;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 8, (this.health / this.maxHealth) * this.radius * 2, 4);

                if (this.isBoss) {
                    ctx.fillStyle = '#ff0000';
                    ctx.font = '12px Arial';
                    ctx.fillText('BOSS', this.x - 15, this.y + this.radius + 15);
                }
            }
        }

        class Projectile {
            constructor(x, y, tx, ty, damage, color) {
                this.x = x;
                this.y = y;
                const dx = tx - x;
                const dy = ty - y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                this.vx = (dx / dist) * 10;
                this.vy = (dy / dist) * 10;
                this.radius = 5;
                this.damage = damage;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                return this.x < -this.radius || this.x > canvas.width + this.radius || this.y < -this.radius || this.y > canvas.height + this.radius;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.value = 10;
            }
            update() {
                const dx = hero.x - this.x;
                const dy = hero.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < this.radius + hero.radius) {
                    gold += this.value;
                    return true;
                }
                return false;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.fillText('$', this.x - 3, this.y + 3);
            }
        }

        let hero, enemies, projectiles, coins, mouseX, mouseY;

        function initGame() {
            hero = new Hero();
            enemies = [];
            projectiles = [];
            coins = [];
            gameTime = 0;
            kills = 0;
            gold = 0;
            mouseX = canvas.width / 2;
            mouseY = canvas.height / 2;
        }

        function spawnEnemy() {
            enemies.push(new Enemy());
        }

        function gameOver(victory) {
            gameActive = false;
            finalTime.textContent = Math.floor(gameTime);
            finalKills.textContent = kills;
            if (victory) {
                endTitle.textContent = '胜利！';
                endMessage.textContent = `你击败了所有敌人，成为王者！`;
            } else {
                endTitle.textContent = '失败';
                endMessage.textContent = `你坚持了 ${Math.floor(gameTime)} 秒，击败了 ${kills} 个敌人`;
            }
            endScreen.style.display = 'flex';
            stats.style.display = 'none';
            controls.style.display = 'none';
        }

        function update() {
            if (!gameActive) return;

            gameTime += 1/60;
            timeSpan.textContent = Math.floor(gameTime);
            killsSpan.textContent = kills;
            goldSpan.textContent = gold;

            hero.update();

            if (Math.random() < 0.05) spawnEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                if (enemies[i].health <= 0) {
                    kills++;
                    gold += enemies[i].isBoss ? 100 : 20;
                    hero.gainExp(enemies[i].isBoss ? 5 : 1);
                    coins.push(new Coin(enemies[i].x, enemies[i].y));
                    enemies.splice(i, 1);
                }
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (projectiles[i].update()) {
                    projectiles.splice(i, 1);
                    continue;
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const dx = projectiles[i].x - enemies[j].x;
                    const dy = projectiles[i].y - enemies[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < projectiles[i].radius + enemies[j].radius) {
                        enemies[j].health -= projectiles[i].damage;
                        projectiles.splice(i, 1);
                        break;
                    }
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                if (coins[i].update()) {
                    coins.splice(i, 1);
                }
            }

            if (gameTime > 300) {
                gameOver(true);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(20, 25, 40, 0.1)';
            for (let i = 0; i < canvas.width; i += 50) {
                for (let j = 0; j < canvas.height; j += 50) {
                    ctx.fillRect(i, j, 2, 2);
                }
            }

            hero.draw();
            enemies.forEach(e => e.draw());
            projectiles.forEach(p => p.draw());
            coins.forEach(c => c.draw());

            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(10, canvas.height - 100, 200, 80);
            ctx.fillStyle = '#4fc3f7';
            ctx.font = '14px Arial';
            ctx.fillText(`英雄 Lv.${hero.level}`, 20, canvas.height - 80);
            ctx.fillText(`经验: ${hero.exp}/${hero.maxExp}`, 20, canvas.height - 60);
            ctx.fillText(`攻击: ${hero.attackDamage}`, 20, canvas.height - 40);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        startButton.addEventListener('click', () => {
            startScreen.style.display = 'none';
            stats.style.display = 'block';
            controls.style.display = 'flex';
            gameActive = true;
            initGame();
        });

        restartButton.addEventListener('click', () => {
            endScreen.style.display = 'none';
            stats.style.display = 'block';
            controls.style.display = 'flex';
            gameActive = true;
            initGame();
        });

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        controlBtns.forEach(btn => {
            const id = btn.id;
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchControls[id.replace('Btn','')] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls[id.replace('Btn','')] = false;
            });
            btn.addEventListener('mousedown', (e) => {

            });
            btn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                touchControls[id.replace('Btn','')] = false;
            });
            btn.addEventListener('mouseleave', () => {
                touchControls[id.replace('Btn','')] = false;
            });

    .then(data => {

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}

window.addEventListener('load', loadStats);
