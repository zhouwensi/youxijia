<body>
  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiOverlay">

            </div>
            
            <div class="mobile-controls">
                <div class="dpad">
                    <div class="dpad-btn dpad-up" id="upBtn">↑</div>
                    <div class="dpad-btn dpad-left" id="leftBtn">←</div>
                    <div class="dpad-btn dpad-center" id="fireBtn">🔥</div>
                    <div class="dpad-btn dpad-right" id="rightBtn">→</div>
                    <div class="dpad-btn dpad-down" id="downBtn">↓</div>
                </div>
                
                <div class="mobile-btn" id="mobileFire">开火</div>
            </div>
        </div>
        
        <div id="startScreen" class="screen">
            <h1>太空飞机大战</h1>
            <p>控制你的太空战机，在无尽的太空中生存下去！</p>
            <p>躲避敌机和子弹，射击消灭敌人获得分数。</p>
            
            <div class="instructions">
                <h2>操作说明</h2>
                <p><span class="highlight">键盘控制：</span> WASD 或方向键移动，空格键或 J 键射击</p>
                <p><span class="highlight">触屏控制：</span> 使用虚拟方向键移动，点击右侧按钮射击</p>
                <p><span class="highlight">游戏目标：</span> 尽可能生存更久，获得更高分数！</p>
            </div>
            
            <button id="startButton" class="button">开始游戏</button>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2>游戏结束</h2>
            <p>你的最终得分: <span id="finalScore" class="highlight">0</span></p>
            <p>击落敌机: <span id="enemiesDestroyed" class="highlight">0</span> 架</p>
            <button id="restartButton" class="button">重新开始</button>
        </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const CANVAS_WIDTH = 800;
            const CANVAS_HEIGHT = 600;
            const PLAYER_SPEED = 5;
            const PLAYER_FIRE_RATE = 300; // 毫秒
            const ENEMY_SPEED_MIN = 1;
            const ENEMY_SPEED_MAX = 3;
            const ENEMY_SPAWN_RATE = 1000; // 毫秒
            const BULLET_SPEED = 7;
            const ENEMY_BULLET_SPEED = 4;
            const ENEMY_FIRE_RATE = 1500; // 毫秒
            const PLAYER_MAX_HEALTH = 100;
            
            // 游戏变量
            let canvas, ctx;
            let gameRunning = false;
            let score = 0;
            let playerHealth = PLAYER_MAX_HEALTH;
            let enemiesDestroyed = 0;
            let lastPlayerFire = 0;
            let lastEnemySpawn = 0;
            let lastEnemyFire = 0;
            let keys = {};
            let touchControls = {
                up: false,
                down: false,
                left: false,
                right: false,
                fire: false
            };
            
            // 游戏对象
            let player = {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT - 100,
                width: 40,
                height: 60,
                color: '#00ffff'
            };
            
            let playerBullets = [];
            let enemies = [];
            let enemyBullets = [];
            let particles = [];
            let stars = [];
            
            // 初始化星星背景
            function initStars() {
                stars = [];
                for (let i = 0; i < 100; i++) {
                    stars.push({
                        x: Math.random() * CANVAS_WIDTH,
                        y: Math.random() * CANVAS_HEIGHT,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 0.5 + 0.2,
                        brightness: Math.random() * 0.5 + 0.5
                    });
                }
            }
            
            // 初始化游戏
            function initGame() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                // 重置游戏状态
                player.x = CANVAS_WIDTH / 2;
                player.y = CANVAS_HEIGHT - 100;
                playerHealth = PLAYER_MAX_HEALTH;
                score = 0;
                enemiesDestroyed = 0;
                playerBullets = [];
                enemies = [];
                enemyBullets = [];
                particles = [];
                
                // 初始化星星
                initStars();
                
                // 更新UI
                updateUI();
                
                // 开始游戏循环
                gameRunning = true;
                requestAnimationFrame(gameLoop);
            }
            
            // 绘制玩家
            function drawPlayer() {
                ctx.save();
                ctx.translate(player.x, player.y);
                
                // 绘制飞机主体
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(0, -player.height/2);
                ctx.lineTo(-player.width/2, player.height/2);
                ctx.lineTo(0, player.height/4);
                ctx.lineTo(player.width/2, player.height/2);
                ctx.closePath();
                ctx.fill();
                
                // 绘制飞机细节
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(0, -player.height/4, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制引擎火焰
                if (gameRunning && Date.now() % 200 < 100) {
                    ctx.fillStyle = '#ff9900';
                    ctx.beginPath();
                    ctx.moveTo(-10, player.height/4);
                    ctx.lineTo(0, player.height/2 + 15);
                    ctx.lineTo(10, player.height/4);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
            
            // 绘制子弹
            function drawBullets() {
                // 玩家子弹
                playerBullets.forEach(bullet => {
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 子弹尾迹
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y + 8, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // 敌人子弹
                enemyBullets.forEach(bullet => {
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 子弹尾迹
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y - 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            
            // 绘制敌人
            function drawEnemies() {
                enemies.forEach(enemy => {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    
                    // 绘制敌机主体
                    ctx.fillStyle = enemy.color;
                    ctx.beginPath();
                    ctx.moveTo(0, enemy.height/2);
                    ctx.lineTo(-enemy.width/2, -enemy.height/2);
                    ctx.lineTo(0, -enemy.height/4);
                    ctx.lineTo(enemy.width/2, -enemy.height/2);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 绘制敌机细节
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.arc(0, enemy.height/4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                });
            }
            
            // 绘制粒子效果
            function drawParticles() {
                particles.forEach((particle, index) => {
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 更新粒子
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.size *= 0.95;
                    particle.life--;
                    
                    // 移除死亡粒子
                    if (particle.life <= 0 || particle.size < 0.5) {
                        particles.splice(index, 1);
                    }
                });
            }
            
            // 绘制星星背景
            function drawStars() {
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 移动星星
                    star.y += star.speed;
                    if (star.y > CANVAS_HEIGHT) {
                        star.y = 0;
                        star.x = Math.random() * CANVAS_WIDTH;
                    }
                });
            }
            
            // 生成敌人
            function spawnEnemy() {
                const enemyTypes = [
                    { width: 30, height: 40, color: '#ff6666', health: 1, score: 10 },
                    { width: 40, height: 50, color: '#ff3333', health: 2, score: 20 },
                    { width: 50, height: 60, color: '#ff0000', health: 3, score: 30 }
                ];
                
                const type = Math.random() < 0.7 ? 0 : (Math.random() < 0.8 ? 1 : 2);
                const enemyType = enemyTypes[type];
                
                enemies.push({
                    x: Math.random() * (CANVAS_WIDTH - enemyType.width),
                    y: -enemyType.height,
                    width: enemyType.width,
                    height: enemyType.height,
                    color: enemyType.color,
                    speed: Math.random() * (ENEMY_SPEED_MAX - ENEMY_SPEED_MIN) + ENEMY_SPEED_MIN,
                    health: enemyType.health,
                    maxHealth: enemyType.health,
                    scoreValue: enemyType.score
                });
            }
            
            // 玩家射击
            function playerShoot() {
                const now = Date.now();
                if (now - lastPlayerFire > PLAYER_FIRE_RATE) {
                    playerBullets.push({
                        x: player.x,
                        y: player.y - player.height/2,
                        width: 5,
                        height: 10,
                        speed: BULLET_SPEED
                    });
                    
                    lastPlayerFire = now;
                    
                    // 射击音效模拟（视觉反馈）
                    createParticles(player.x, player.y - player.height/2, 3, '#ffff00');
                }
            }
            
            // 敌人射击
            function enemyShoot() {
                const now = Date.now();
                if (now - lastEnemyFire > ENEMY_FIRE_RATE && enemies.length > 0) {
                    // 随机选择一个敌人射击
                    const shooter = enemies[Math.floor(Math.random() * enemies.length)];
                    enemyBullets.push({
                        x: shooter.x,
                        y: shooter.y + shooter.height/2,
                        width: 4,
                        height: 8,
                        speed: ENEMY_BULLET_SPEED
                    });
                    
                    lastEnemyFire = now;
                    
                    // 射击效果
                    createParticles(shooter.x, shooter.y + shooter.height/2, 2, '#ff0000');
                }
            }
            
            // 创建粒子效果
            function createParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        size: Math.random() * 3 + 2,
                        color: color,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        life: 20
                    });
                }
            }
            
            // 更新游戏对象
            function updateGameObjects() {
                const now = Date.now();
                
                // 生成敌人
                if (now - lastEnemySpawn > ENEMY_SPAWN_RATE) {
                    spawnEnemy();
                    lastEnemySpawn = now;
                }
                
                // 敌人射击
                enemyShoot();
                
                // 更新玩家位置（键盘控制）
                if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchControls.left) {
                    player.x = Math.max(player.width/2, player.x - PLAYER_SPEED);
                }
                if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchControls.right) {
                    player.x = Math.min(CANVAS_WIDTH - player.width/2, player.x + PLAYER_SPEED);
                }
                if (keys['ArrowUp'] || keys['w'] || keys['W'] || touchControls.up) {
                    player.y = Math.max(player.height/2, player.y - PLAYER_SPEED);
                }
                if (keys['ArrowDown'] || keys['s'] || keys['S'] || touchControls.down) {
                    player.y = Math.min(CANVAS_HEIGHT - player.height/2, player.y + PLAYER_SPEED);
                }
                
                // 玩家射击（键盘）
                if (keys[' '] || keys['j'] || keys['J'] || touchControls.fire) {
                    playerShoot();
                }
                
                // 更新玩家子弹
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    const bullet = playerBullets[i];
                    bullet.y -= bullet.speed;
                    
                    // 移除屏幕外的子弹
                    if (bullet.y < -10) {
                        playerBullets.splice(i, 1);
                    }
                }
                
                // 更新敌人子弹
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const bullet = enemyBullets[i];
                    bullet.y += bullet.speed;
                    
                    // 移除屏幕外的子弹
                    if (bullet.y > CANVAS_HEIGHT + 10) {
                        enemyBullets.splice(i, 1);
                    }
                }
                
                // 更新敌人
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.y += enemy.speed;
                    
                    // 移除屏幕外的敌人
                    if (enemy.y > CANVAS_HEIGHT + enemy.height) {
                        enemies.splice(i, 1);
                    }
                }
                
                // 检测碰撞：玩家子弹 vs 敌人
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    const bullet = playerBullets[i];
                    
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        
                        if (bullet.x > enemy.x - enemy.width/2 && 
                            bullet.x < enemy.x + enemy.width/2 &&
                            bullet.y > enemy.y - enemy.height/2 && 
                            bullet.y < enemy.y + enemy.height/2) {
                            
                            // 击中敌人
                            enemy.health--;
                            
                            // 创建击中效果
                            createParticles(enemy.x, enemy.y, 10, '#ffff00');
                            
                            // 移除子弹
                            playerBullets.splice(i, 1);
                            
                            // 如果敌人死亡
                            if (enemy.health <= 0) {
                                // 增加分数
                                score += enemy.scoreValue;
                                enemiesDestroyed++;
                                
                                // 创建爆炸效果
                                createParticles(enemy.x, enemy.y, 20, '#ff6600');
                                
                                // 移除敌人
                                enemies.splice(j, 1);
                            }
                            
                            break;
                        }
                    }
                }
                
                // 检测碰撞：敌人子弹 vs 玩家
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const bullet = enemyBullets[i];
                    
                    if (bullet.x > player.x - player.width/2 && 
                        bullet.x < player.x + player.width/2 &&
                        bullet.y > player.y - player.height/2 && 
                        bullet.y < player.y + player.height/2) {
                        
                        // 击中玩家
                        playerHealth -= 10;
                        createParticles(player.x, player.y, 15, '#ff0000');
                        
                        // 移除子弹
                        enemyBullets.splice(i, 1);
                        
                        // 检查游戏结束
                        if (playerHealth <= 0) {
                            gameOver();
                        }
                        
                        break;
                    }
                }
                
                // 检测碰撞：敌人 vs 玩家
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    
                    if (player.x - player.width/2 < enemy.x + enemy.width/2 &&
                        player.x + player.width/2 > enemy.x - enemy.width/2 &&
                        player.y - player.height/2 < enemy.y + enemy.height/2 &&
                        player.y + player.height/2 > enemy.y - enemy.height/2) {
                        
                        // 碰撞造成伤害
                        playerHealth -= 20;
                        createParticles(player.x, player.y, 20, '#ff0000');
                        
                        // 敌人也被摧毁
                        score += enemy.scoreValue;
                        enemiesDestroyed++;
                        createParticles(enemy.x, enemy.y, 20, '#ff6600');
                        enemies.splice(i, 1);
                        
                        // 检查游戏结束
                        if (playerHealth <= 0) {
                            gameOver();
                        }
                        
                        break;
                    }
                }
            }
            
            // 更新UI
            function updateUI() {
                document.getElementById('score').textContent = score;
                document.getElementById('healthFill').style.width = `${(playerHealth / PLAYER_MAX_HEALTH) * 100}%`;
                
                // 根据生命值改变颜色
                const healthFill = document.getElementById('healthFill');
                if (playerHealth > 60) {
                    healthFill.style.background = 'linear-gradient(90deg, #00ff00, #80ff00)';
                } else if (playerHealth > 30) {
                    healthFill.style.background = 'linear-gradient(90deg, #ffff00, #ff8000)';
                } else {
                    healthFill.style.background = 'linear-gradient(90deg, #ff0000, #ff4000)';
                }
            }
            
            // 游戏结束
            function gameOver() {
                gameRunning = false;
                document.getElementById('finalScore').textContent = score;
                document.getElementById('enemiesDestroyed').textContent = enemiesDestroyed;
                document.getElementById('gameOverScreen').classList.remove('hidden');
            }
            
            // 游戏主循环
            function gameLoop() {
                if (!gameRunning) return;
                
                // 清空画布
                ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                // 绘制背景
                drawStars();
                
                // 更新游戏对象
                updateGameObjects();
                
                // 绘制游戏对象
                drawEnemies();
                drawBullets();
                drawPlayer();
                drawParticles();
                
                // 更新UI
                updateUI();
                
                // 继续循环
                requestAnimationFrame(gameLoop);
            }
            
            // 事件监听器
            function setupEventListeners() {
                // 键盘事件
                window.addEventListener('keydown', function(e) {
                    keys[e.key] = true;
                    
                    // 防止空格键滚动页面
                    if (e.key === ' ') {
                        e.preventDefault();
                    }
                });
                
                window.addEventListener('keyup', function(e) {
                    keys[e.key] = false;
                });
                
                // 开始按钮
                document.getElementById('startButton').addEventListener('click', function() {
                    document.getElementById('startScreen').classList.add('hidden');
                    initGame();
                });
                
                // 重新开始按钮
                document.getElementById('restartButton').addEventListener('click', function() {
                    document.getElementById('gameOverScreen').classList.add('hidden');
                    initGame();
                });
                
                // 移动端控制按钮
                const controlButtons = ['upBtn', 'downBtn', 'leftBtn', 'rightBtn', 'fireBtn', 'mobileFire'];
                
                controlButtons.forEach(btnId => {
                    const btn = document.getElementById(btnId);
                    
                    // 触摸开始
                    btn.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        
                        switch(btnId) {
                            case 'upBtn': touchControls.up = true; break;
                            case 'downBtn': touchControls.down = true; break;
                            case 'leftBtn': touchControls.left = true; break;
                            case 'rightBtn': touchControls.right = true; break;
                            case 'fireBtn':
                            case 'mobileFire': touchControls.fire = true; break;
                        }
                        
                        this.style.background = 'rgba(0, 255, 255, 0.9)';
                    });
                    
                    // 触摸结束
                    btn.addEventListener('touchend', function(e) {
                        e.preventDefault();
                        
                        switch(btnId) {
                            case 'upBtn': touchControls.up = false; break;
                            case 'downBtn': touchControls.down = false; break;
                            case 'leftBtn': touchControls.left = false; break;
                            case 'rightBtn': touchControls.right = false; break;
                            case 'fireBtn':
                            case 'mobileFire': touchControls.fire = false; break;
                        }
                        
                        this.style.background = btnId === 'fireBtn' ? 'rgba(255, 0, 0, 0.7)' : 'rgba(0, 128, 255, 0.7)';
                    });
                    
                    // 鼠标事件（用于桌面测试）
                    btn.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        
                        switch(btnId) {
                            case 'upBtn': touchControls.up = true; break;
                            case 'downBtn': touchControls.down = true; break;
                            case 'leftBtn': touchControls.left = true; break;
                            case 'rightBtn': touchControls.right = true; break;
                            case 'fireBtn':
                            case 'mobileFire': touchControls.fire = true; break;
                        }
                        
                        this.style.background = 'rgba(0, 255, 255, 0.9)';
                    });
                    
                    btn.addEventListener('mouseup', function(e) {
                        e.preventDefault();
                        
                        switch(btnId) {
                            case 'upBtn': touchControls.up = false; break;
                            case 'downBtn': touchControls.down = false; break;
                            case 'leftBtn': touchControls.left = false; break;
                            case 'rightBtn': touchControls.right = false; break;
                            case 'fireBtn':
                            case 'mobileFire': touchControls.fire = false; break;
                        }
                        
                        this.style.background = btnId === 'fireBtn' ? 'rgba(255, 0, 0, 0.7)' : 'rgba(0, 128, 255, 0.7)';
                    });
                    
                    btn.addEventListener('mouseleave', function(e) {
                        // 确保鼠标离开时按钮状态重置
                        switch(btnId) {
                            case 'upBtn': touchControls.up = false; break;
                            case 'downBtn': touchControls.down = false; break;
                            case 'leftBtn': touchControls.left = false; break;
                            case 'rightBtn': touchControls.right = false; break;
                            case 'fireBtn':
                            case 'mobileFire': touchControls.fire = false; break;
                        }
                        
                        this.style.background = btnId === 'fireBtn' ? 'rgba(255, 0, 0, 0.7)' : 'rgba(0, 128, 255, 0.7)';
                    });
                });
                
                // 防止画布上的触摸滚动
                canvas.addEventListener('touchstart', function(e) {
                    if (e.target === canvas) {
                        e.preventDefault();
                    }
                }, { passive: false });
                
                canvas.addEventListener('touchmove', function(e) {
                    if (e.target === canvas) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
            
            // 初始化事件监听器
            setupEventListeners();
            
            // 显示开始画面
            document.getElementById('startScreen').classList.remove('hidden');
        });
    </script>

const gameId = '32c794d2-3098-4f22-858a-652c88d5965e';

console.log('[DEBUG] 游戏页面初始化');

console.log('[DEBUG] authorToken:', authorToken);

function getUserToken() {

}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩

// 获取统计数据和用户状态
function loadStats() {

  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {

      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

}

  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {

        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');

        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
