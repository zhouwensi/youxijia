                <div class="controls">

                <p>消灭敌人: <span id="enemiesDefeated" class="highlight">0</span> 个</p>
                <button id="restartBtn" class="btn">重新开始</button>
                <button id="menuBtn" class="btn">返回主菜单</button>
            </div>
        </div>
    </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const CANVAS_WIDTH = 800;
            const CANVAS_HEIGHT = 600;
            const PLAYER_SPEED = 5;
            const BULLET_SPEED = 8;
            const ENEMY_SPEED_MIN = 1;
            const ENEMY_SPEED_MAX = 3;
            const ENEMY_SPAWN_RATE = 60; // 每60帧生成一个敌人
            const PLAYER_MAX_HEALTH = 100;
            
            // 游戏变量
            let canvas, ctx;
            let gameState = 'start'; // start, playing, end
            let score = 0;
            let playerHealth = PLAYER_MAX_HEALTH;
            let enemiesDefeated = 0;
            let animationId;
            let keys = {};
            let touchControls = {
                left: false,
                right: false,
                up: false,
                down: false,
                fire: false
            };
            
            // 游戏对象
            let player = {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT - 100,
                width: 40,
                height: 60,
                color: '#4a4aff',
                lastShot: 0,
                shotDelay: 15 // 射击间隔帧数
            };
            
            let bullets = [];
            let enemies = [];
            let particles = [];
            let stars = [];
            
            // 初始化星星背景
            function initStars() {
                stars = [];
                for (let i = 0; i < 100; i++) {
                    stars.push({
                        x: Math.random() * CANVAS_WIDTH,
                        y: Math.random() * CANVAS_HEIGHT,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 0.5 + 0.2,
                        brightness: Math.random() * 0.5 + 0.5
                    });
                }
            }
            
            // 初始化游戏
            function initGame() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');
                
                // 设置Canvas尺寸
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                // 初始化游戏对象
                player.x = CANVAS_WIDTH / 2;
                player.y = CANVAS_HEIGHT - 100;
                playerHealth = PLAYER_MAX_HEALTH;
                score = 0;
                enemiesDefeated = 0;
                bullets = [];
                enemies = [];
                particles = [];
                
                // 初始化星星
                initStars();
                
                // 更新UI
                updateUI();
                
                // 开始游戏循环
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                gameLoop();
            }
            
            // 游戏主循环
            function gameLoop() {
                update();
                render();
                animationId = requestAnimationFrame(gameLoop);
            }
            
            // 更新游戏状态
            function update() {
                if (gameState !== 'playing') return;
                
                // 更新星星
                stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > CANVAS_HEIGHT) {
                        star.y = 0;
                        star.x = Math.random() * CANVAS_WIDTH;
                    }
                });
                
                // 玩家移动
                let moveX = 0, moveY = 0;
                
                // 键盘控制
                if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchControls.left) moveX -= PLAYER_SPEED;
                if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchControls.right) moveX += PLAYER_SPEED;
                if (keys['ArrowUp'] || keys['w'] || keys['W'] || touchControls.up) moveY -= PLAYER_SPEED;
                if (keys['ArrowDown'] || keys['s'] || keys['S'] || touchControls.down) moveY += PLAYER_SPEED;
                
                // 更新玩家位置
                player.x += moveX;
                player.y += moveY;
                
                // 边界检查
                player.x = Math.max(player.width/2, Math.min(CANVAS_WIDTH - player.width/2, player.x));
                player.y = Math.max(player.height/2, Math.min(CANVAS_HEIGHT - player.height/2, player.y));
                
                // 玩家射击
                if ((keys[' '] || keys['j'] || keys['J'] || touchControls.fire) && player.lastShot >= player.shotDelay) {
                    bullets.push({
                        x: player.x,
                        y: player.y - player.height/2,
                        width: 4,
                        height: 15,
                        color: '#ffcc00',
                        speed: BULLET_SPEED
                    });
                    player.lastShot = 0;
                    
                    // 添加射击粒子效果
                    for (let i = 0; i < 5; i++) {
                        particles.push({
                            x: player.x,
                            y: player.y - player.height/2,
                            vx: (Math.random() - 0.5) * 2,
                            vy: -Math.random() * 3,
                            size: Math.random() * 3 + 1,
                            color: '#ffcc00',
                            life: 20
                        });
                    }
                }
                player.lastShot++;
                
                // 生成敌人
                if (Math.random() * ENEMY_SPAWN_RATE < 1) {
                    const enemySize = Math.random() * 20 + 20;
                    enemies.push({
                        x: Math.random() * (CANVAS_WIDTH - enemySize),
                        y: -enemySize,
                        width: enemySize,
                        height: enemySize,
                        color: `hsl(${Math.random() * 60 + 300}, 80%, 60%)`, // 紫色到红色
                        speed: Math.random() * (ENEMY_SPEED_MAX - ENEMY_SPEED_MIN) + ENEMY_SPEED_MIN,
                        health: Math.floor(enemySize / 10)
                    });
                }
                
                // 更新子弹
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= bullets[i].speed;
                    
                    // 移除屏幕外的子弹
                    if (bullets[i].y < -bullets[i].height) {
                        bullets.splice(i, 1);
                    }
                }
                
                // 更新敌人
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].y += enemies[i].speed;
                    
                    // 敌人射击（随机）
                    if (Math.random() < 0.01) {
                        bullets.push({
                            x: enemies[i].x + enemies[i].width/2,
                            y: enemies[i].y + enemies[i].height,
                            width: 4,
                            height: 15,
                            color: '#ff6666',
                            speed: -BULLET_SPEED * 0.7,
                            isEnemy: true
                        });
                    }
                    
                    // 移除屏幕外的敌人
                    if (enemies[i].y > CANVAS_HEIGHT + enemies[i].height) {
                        enemies.splice(i, 1);
                    }
                }
                
                // 检测子弹与敌人的碰撞
                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (bullets[i].isEnemy) continue;
                    
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (checkCollision(bullets[i], enemies[j])) {
                            // 敌人受伤
                            enemies[j].health--;
                            
                            // 添加击中效果
                            for (let k = 0; k < 10; k++) {
                                particles.push({
                                    x: bullets[i].x,
                                    y: bullets[i].y,
                                    vx: (Math.random() - 0.5) * 4,
                                    vy: (Math.random() - 0.5) * 4,
                                    size: Math.random() * 4 + 2,
                                    color: enemies[j].color,
                                    life: 30
                                });
                            }
                            
                            // 移除子弹
                            bullets.splice(i, 1);
                            
                            // 如果敌人生命值为0，消灭敌人
                            if (enemies[j].health <= 0) {
                                score += 100;
                                enemiesDefeated++;
                                
                                // 添加爆炸效果
                                for (let k = 0; k < 20; k++) {
                                    particles.push({
                                        x: enemies[j].x + enemies[j].width/2,
                                        y: enemies[j].y + enemies[j].height/2,
                                        vx: (Math.random() - 0.5) * 8,
                                        vy: (Math.random() - 0.5) * 8,
                                        size: Math.random() * 5 + 2,
                                        color: enemies[j].color,
                                        life: 40
                                    });
                                }
                                
                                enemies.splice(j, 1);
                            }
                            
                            updateUI();
                            break;
                        }
                    }
                }
                
                // 检测玩家与敌人子弹的碰撞
                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (!bullets[i].isEnemy) continue;
                    
                    if (checkCollision(bullets[i], player)) {
                        playerHealth -= 20;
                        bullets.splice(i, 1);
                        
                        // 添加受伤效果
                        for (let k = 0; k < 10; k++) {
                            particles.push({
                                x: player.x,
                                y: player.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                size: Math.random() * 4 + 2,
                                color: '#ff6666',
                                life: 25
                            });
                        }
                        
                        updateUI();
                        
                        if (playerHealth <= 0) {
                            gameOver();
                        }
                    }
                }
                
                // 检测玩家与敌人的碰撞
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (checkCollision(player, enemies[i])) {
                        playerHealth -= 30;
                        
                        // 添加碰撞效果
                        for (let k = 0; k < 15; k++) {
                            particles.push({
                                x: player.x,
                                y: player.y,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                size: Math.random() * 5 + 2,
                                color: '#ff6666',
                                life: 30
                            });
                        }
                        
                        enemies.splice(i, 1);
                        updateUI();
                        
                        if (playerHealth <= 0) {
                            gameOver();
                        }
                    }
                }
                
                // 更新粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life--;
                    
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }
            
            // 渲染游戏
            function render() {
                // 清空画布
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                // 绘制星星
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                // 绘制粒子
                particles.forEach(particle => {
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = particle.life / 40;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                
                // 绘制子弹
                bullets.forEach(bullet => {
                    ctx.fillStyle = bullet.color;
                    ctx.fillRect(bullet.x - bullet.width/2, bullet.y, bullet.width, bullet.height);
                    
                    // 子弹光效
                    ctx.fillStyle = bullet.color === '#ffcc00' ? 'rgba(255, 255, 200, 0.7)' : 'rgba(255, 200, 200, 0.7)';
                    ctx.fillRect(bullet.x - bullet.width/2, bullet.y, bullet.width, bullet.height/3);
                });
                
                // 绘制敌人
                enemies.forEach(enemy => {
                    // 敌人主体
                    ctx.fillStyle = enemy.color;
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width/2, enemy.y);
                    ctx.lineTo(enemy.x + enemy.width, enemy.y + enemy.height);
                    ctx.lineTo(enemy.x, enemy.y + enemy.height);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 敌人光效
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width/2, enemy.y + 5);
                    ctx.lineTo(enemy.x + enemy.width - 5, enemy.y + enemy.height - 5);
                    ctx.lineTo(enemy.x + 5, enemy.y + enemy.height - 5);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 敌人生命条
                    if (enemy.health < 3) {
                        const healthWidth = enemy.width * (enemy.health / 3);
                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(enemy.x, enemy.y - 8, enemy.width, 4);
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(enemy.x, enemy.y - 8, healthWidth, 4);
                    }
                });
                
                // 绘制玩家
                // 玩家主体
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.height/2);
                ctx.lineTo(player.x + player.width/2, player.y + player.height/2);
                ctx.lineTo(player.x - player.width/2, player.y + player.height/2);
                ctx.closePath();
                ctx.fill();
                
                // 玩家光效
                ctx.fillStyle = 'rgba(150, 150, 255, 0.7)';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.height/2 + 5);
                ctx.lineTo(player.x + player.width/2 - 5, player.y + player.height/2 - 5);
                ctx.lineTo(player.x - player.width/2 + 5, player.y + player.height/2 - 5);
                ctx.closePath();
                ctx.fill();
                
                // 玩家引擎效果
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.moveTo(player.x - player.width/4, player.y + player.height/2);
                ctx.lineTo(player.x, player.y + player.height/2 + 15);
                ctx.lineTo(player.x + player.width/4, player.y + player.height/2);
                ctx.closePath();
                ctx.fill();
                
                // 闪烁效果（当受伤时）
                if (playerHealth < 50 && Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.strokeStyle = '#ff6666';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y - player.height/2);
                    ctx.lineTo(player.x + player.width/2, player.y + player.height/2);
                    ctx.lineTo(player.x - player.width/2, player.y + player.height/2);
                    ctx.closePath();
                    ctx.stroke();
                }
            }
            
            // 碰撞检测
            function checkCollision(obj1, obj2) {
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + (obj1.width || 0) > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       (obj1.y + (obj1.height || 0)) > obj2.y;
            }
            
            // 更新UI
            function updateUI() {
                document.getElementById('score').textContent = score;
                document.getElementById('healthFill').style.width = `${(playerHealth / PLAYER_MAX_HEALTH) * 100}%`;
                
                // 根据生命值改变颜色
                const healthFill = document.getElementById('healthFill');
                if (playerHealth > 70) {
                    healthFill.style.background = 'linear-gradient(90deg, #00ff00, #ffcc00)';
                } else if (playerHealth > 30) {
                    healthFill.style.background = 'linear-gradient(90deg, #ffcc00, #ff9900)';
                } else {
                    healthFill.style.background = 'linear-gradient(90deg, #ff9900, #ff0000)';
                }
            }
            
            // 游戏结束
            function gameOver() {
                gameState = 'end';
                document.getElementById('finalScore').textContent = score;
                document.getElementById('enemiesDefeated').textContent = enemiesDefeated;
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('endScreen').classList.remove('hidden');
                
                cancelAnimationFrame(animationId);
            }
            
            // 开始游戏
            function startGame() {
                gameState = 'playing';
                document.getElementById('startScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.remove('hidden');
                document.getElementById('endScreen').classList.add('hidden');
                
                initGame();
            }
            
            // 返回主菜单
            function goToMenu() {
                gameState = 'start';
                document.getElementById('startScreen').classList.remove('hidden');
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('endScreen').classList.add('hidden');
                
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
            }
            
            // 事件监听
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('menuBtn').addEventListener('click', goToMenu);
            
            // 键盘控制
            window.addEventListener('keydown', function(e) {
                keys[e.key] = true;
                
                // 防止空格键滚动页面
                if (e.key === ' ' && gameState === 'playing') {
                    e.preventDefault();
                }
            });
            
            window.addEventListener('keyup', function(e) {
                keys[e.key] = false;
            });
            
            // 移动端控制
            function setupMobileControls() {
                const leftBtn = document.getElementById('leftBtn');
                const rightBtn = document.getElementById('rightBtn');
                const upBtn = document.getElementById('upBtn');
                const downBtn = document.getElementById('downBtn');
                const fireBtn = document.getElementById('fireBtn');
                
                // 触摸开始
                function touchStart(control) {
                    return function(e) {
                        touchControls[control] = true;
                        e.preventDefault();
                    };
                }
                
                // 触摸结束
                function touchEnd(control) {
                    return function(e) {
                        touchControls[control] = false;
                        e.preventDefault();
                    };
                }
                
                // 绑定事件
                leftBtn.addEventListener('touchstart', touchStart('left'));
                leftBtn.addEventListener('touchend', touchEnd('left'));
                leftBtn.addEventListener('touchcancel', touchEnd('left'));
                
                rightBtn.addEventListener('touchstart', touchStart('right'));
                rightBtn.addEventListener('touchend', touchEnd('right'));
                rightBtn.addEventListener('touchcancel', touchEnd('right'));
                
                upBtn.addEventListener('touchstart', touchStart('up'));
                upBtn.addEventListener('touchend', touchEnd('up'));
                upBtn.addEventListener('touchcancel', touchEnd('up'));
                
                downBtn.addEventListener('touchstart', touchStart('down'));
                downBtn.addEventListener('touchend', touchEnd('down'));
                downBtn.addEventListener('touchcancel', touchEnd('down'));
                
                fireBtn.addEventListener('touchstart', touchStart('fire'));
                fireBtn.addEventListener('touchend', touchEnd('fire'));
                fireBtn.addEventListener('touchcancel', touchEnd('fire'));
                
                // 防止游戏区域滚动
                const gameContainer = document.getElementById('gameContainer');
                gameContainer.addEventListener('touchmove', function(e) {
                    if (gameState === 'playing') {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
            
            // 初始化移动控制
            setupMobileControls();
            
            // 初始渲染
            initStars();
            render();
        });
    </script>

// 全屏模式状态
let isFullscreenMode = false;

// 切换全屏模式
function toggleFullscreenMode() {
  isFullscreenMode = !isFullscreenMode;
  
  if (isFullscreenMode) {
    // 进入全屏
    document.body.classList.add('fullscreen-mode');
    
    // 尝试请求浏览器全屏
    try {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && isFullscreenMode) {
    toggleFullscreenMode();
  }
});

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {

          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

      '<button onclick="toggleFollowCommentAuthor(\'' + commentAuthorToken + '\')" id="comment-author-follow-btn" style="width:100%;padding:10px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">+ 关注</button>' +
      gamesHtml;
    
    // 检查是否已关注
    fetch('/api/users/' + commentAuthorToken + '/follow-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.following) {
          const btn = document.getElementById('comment-author-follow-btn');
          if (btn) {
            btn.textContent = '已关注';
            btn.style.background = '#f5f5f5';
            btn.style.color = '#999';
          }
        }
      }).catch(() => {});
  }).catch(() => {
    content.innerHTML = '<div style="padding:20px;color:#999;">加载失败</div>';
  });
}

// 关注/取关评论者
function toggleFollowCommentAuthor(targetToken) {
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再关注');
    return;
  }
  
  const btn = document.getElementById('comment-author-follow-btn');
  const isFollowing = btn && btn.textContent === '已关注';
  
  fetch('/api/users/' + targetToken + '/follow', {
    method: isFollowing ? 'DELETE' : 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success && btn) {
        if (isFollowing) {
          btn.textContent = '+ 关注';
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
        } else {
          btn.textContent = '已关注';
          btn.style.background = '#f5f5f5';
          btn.style.color = '#999';
        }
      }
    }).catch(() => {
      alert('操作失败，请重试');
    });
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 切换留言板面板
function toggleCommentsPanel() {
  const panel = document.getElementById('game-comments-section');
  const sidebar = document.querySelector('.tiktok-sidebar');
  const authorInfo = document.getElementById('tiktok-author-info');
  const overlay = document.getElementById('comments-overlay');
  if (panel) {
    const isExpanding = !panel.classList.contains('expanded');
    panel.classList.toggle('expanded');
    // 评论面板展开时隐藏右侧按钮和作者信息（使用class覆盖!important）
    if (sidebar) {
      sidebar.classList.toggle('comments-open', isExpanding);
    }
    if (authorInfo) {
      authorInfo.classList.toggle('comments-open', isExpanding);
    }
    // 控制蒙版显示
    if (overlay) {
      overlay.classList.toggle('visible', isExpanding);
    }
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
});
