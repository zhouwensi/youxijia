  <!-- 原游戏body内容 -->
  
    <div class="game-container">
        <div class="header">
            <h1>贪吃蛇</h1>
        </div>
        
        <div class="score-container">
            <div class="score-item">
                <div class="score-label">得分</div>
                <div id="score" class="score-value">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">长度</div>
                <div id="length" class="score-value">3</div>
            </div>
            <div class="score-item">
                <div class="score-label">最高分</div>
                <div id="high-score" class="score-value">0</div>
            </div>
        </div>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
            
            <div id="startScreen" class="screen active">
                <h2>贪吃蛇</h2>
                <p>使用方向键或滑动控制蛇的移动<br>吃到红色食物可以增加长度和得分<br>不要撞到墙壁或自己的身体</p>
                <div class="controls-info">
                    <strong>控制方式：</strong><br>
                    PC: 方向键或WASD<br>
                    手机: 屏幕上的方向按钮或滑动
                </div>
                <button id="startBtn" class="btn">开始游戏</button>
            </div>
            
            <div id="gameOverScreen" class="screen">
                <h2>游戏结束</h2>
                <p id="finalScoreText">你的得分: <span id="finalScore">0</span></p>
                <p id="newHighScore" style="color:#4cd964; display:none;">新纪录! 🎉</p>
                <button id="restartBtn" class="btn">重新开始</button>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="dpad">
                <button class="dpad-btn dpad-up" id="upBtn">↑</button>
                <button class="dpad-btn dpad-left" id="leftBtn">←</button>
                <div class="dpad-btn dpad-center"></div>
                <button class="dpad-btn dpad-right" id="rightBtn">→</button>
                <button class="dpad-btn dpad-down" id="downBtn">↓</button>
            </div>
        </div>
        
        <div class="instructions">
            提示: 游戏速度会随着长度增加而逐渐加快
        </div>
    </div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏变量
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreElement = document.getElementById('score');
            const lengthElement = document.getElementById('length');
            const highScoreElement = document.getElementById('high-score');
            const finalScoreElement = document.getElementById('finalScore');
            const finalScoreText = document.getElementById('finalScoreText');
            const newHighScoreElement = document.getElementById('newHighScore');
            
            // 移动控制按钮
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 游戏参数
            const gridSize = 20;
            const gridWidth = canvas.width / gridSize;
            const gridHeight = canvas.height / gridSize;
            
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let gameSpeed = 120; // 毫秒
            let gameLoop;
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameRunning = false;
            let touchStartX = 0;
            let touchStartY = 0;
            
            // 初始化显示最高分
            highScoreElement.textContent = highScore;
            
            // 初始化游戏
            function initGame() {
                // 初始化蛇
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                
                // 初始化食物
                generateFood();
                
                // 重置方向
                direction = 'right';
                nextDirection = 'right';
                
                // 重置分数
                score = 0;
                scoreElement.textContent = score;
                lengthElement.textContent = snake.length;
                
                // 重置游戏速度
                gameSpeed = 120;
                
                // 绘制初始游戏状态
                draw();
            }
            
            // 生成食物
            function generateFood() {
                let foodOnSnake;
                
                do {
                    foodOnSnake = false;
                    food = {
                        x: Math.floor(Math.random() * gridWidth),
                        y: Math.floor(Math.random() * gridHeight)
                    };
                    
                    // 检查食物是否在蛇身上
                    for (let segment of snake) {
                        if (segment.x === food.x && segment.y === food.y) {
                            foodOnSnake = true;
                            break;
                        }
                    }
                } while (foodOnSnake);
            }
            
            // 绘制游戏
            function draw() {
                // 清空画布
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格线
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 0.5;
                
                for (let x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 绘制蛇
                for (let i = 0; i < snake.length; i++) {
                    const segment = snake[i];
                    
                    // 蛇头
                    if (i === 0) {
                        ctx.fillStyle = '#4cd964';
                        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                        
                        // 蛇头高亮
                        ctx.fillStyle = '#2ecc71';
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, gridSize - 8, gridSize - 8);
                        
                        // 绘制眼睛
                        ctx.fillStyle = '#111';
                        let eyeSize = 3;
                        let eyeOffset = 5;
                        
                        if (direction === 'right') {
                            ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                        } else if (direction === 'left') {
                            ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                        } else if (direction === 'up') {
                            ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset - eyeSize, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        } else if (direction === 'down') {
                            ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                            ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset - eyeSize, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                        }
                    } 
                    // 蛇身
                    else {
                        ctx.fillStyle = '#3498db';
                        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                        
                        // 蛇身内部颜色
                        ctx.fillStyle = '#2980b9';
                        ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
                    }
                }
                
                // 绘制食物
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // 食物内部高亮
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 3,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            // 更新游戏状态
            function update() {
                // 更新方向
                direction = nextDirection;
                
                // 根据方向移动蛇头
                const head = {x: snake[0].x, y: snake[0].y};
                
                switch(direction) {
                    case 'up':
                        head.y--;
                        break;
                    case 'down':
                        head.y++;
                        break;
                    case 'left':
                        head.x--;
                        break;
                    case 'right':
                        head.x++;
                        break;
                }
                
                // 检查是否撞墙
                if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                    gameOver();
                    return;
                }
                
                // 检查是否撞到自己
                for (let segment of snake) {
                    if (head.x === segment.x && head.y === segment.y) {
                        gameOver();
                        return;
                    }
                }
                
                // 将新头部添加到蛇
                snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    // 增加分数
                    score += 10;
                    scoreElement.textContent = score;
                    lengthElement.textContent = snake.length;
                    
                    // 生成新食物
                    generateFood();
                    
                    // 每得50分增加游戏速度
                    if (score % 50 === 0 && gameSpeed > 60) {
                        gameSpeed -= 10;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(gameStep, gameSpeed);
                    }
                } else {
                    // 如果没有吃到食物，移除尾部
                    snake.pop();
                }
                
                // 绘制更新后的游戏状态
                draw();
            }
            
            // 游戏主循环步骤
            function gameStep() {
                update();
            }
            
            // 开始游戏
            function startGame() {
                initGame();
                gameRunning = true;
                
                // 隐藏开始屏幕
                startScreen.classList.remove('active');
                
                // 开始游戏循环
                clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, gameSpeed);
            }
            
            // 游戏结束
            function gameOver() {
                gameRunning = false;
                clearInterval(gameLoop);
                
                // 更新最终分数
                finalScoreElement.textContent = score;
                
                // 检查是否打破纪录
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreElement.textContent = highScore;
                    newHighScoreElement.style.display = 'block';
                } else {
                    newHighScoreElement.style.display = 'none';
                }
                
                // 显示游戏结束屏幕
                gameOverScreen.classList.add('active');
            }
            
            // 重新开始游戏
            function restartGame() {
                gameOverScreen.classList.remove('active');
                startGame();
            }
            
            // 键盘控制
            function handleKeyDown(e) {
                if (!gameRunning) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        if (direction !== 'down') nextDirection = 'up';
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        if (direction !== 'up') nextDirection = 'down';
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        if (direction !== 'right') nextDirection = 'left';
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        if (direction !== 'left') nextDirection = 'right';
                        e.preventDefault();
                        break;
                }
            }
            
            // 触摸控制
            function handleTouchStart(e) {
                if (!gameRunning) return;
                
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                
                // 防止页面滚动
                e.preventDefault();
            }
            
            function handleTouchMove(e) {
                if (!gameRunning) return;
                
                // 防止页面滚动
                e.preventDefault();
            }
            
            function handleTouchEnd(e) {
                if (!gameRunning || !touchStartX) return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                
                // 确定滑动方向（只响应明显的滑动）
                if (Math.abs(dx) > Math.abs(dy)) {
                    // 水平滑动
                    if (Math.abs(dx) > 20) {
                        if (dx > 0 && direction !== 'left') {
                            nextDirection = 'right';
                        } else if (dx < 0 && direction !== 'right') {
                            nextDirection = 'left';
                        }
                    }
                } else {
                    // 垂直滑动
                    if (Math.abs(dy) > 20) {
                        if (dy > 0 && direction !== 'up') {
                            nextDirection = 'down';
                        } else if (dy < 0 && direction !== 'down') {
                            nextDirection = 'up';
                        }
                    }
                }
                
                // 重置触摸起点
                touchStartX = 0;
                touchStartY = 0;
                
                // 防止页面滚动
                e.preventDefault();
            }
            
            // 移动端按钮控制
            function setupMobileControls() {
                upBtn.addEventListener('touchstart', function(e) {
                    if (gameRunning && direction !== 'down') nextDirection = 'up';
                    e.preventDefault();
                });
                
                downBtn.addEventListener('touchstart', function(e) {
                    if (gameRunning && direction !== 'up') nextDirection = 'down';
                    e.preventDefault();
                });
                
                leftBtn.addEventListener('touchstart', function(e) {
                    if (gameRunning && direction !== 'right') nextDirection = 'left';
                    e.preventDefault();
                });
                
                rightBtn.addEventListener('touchstart', function(e) {
                    if (gameRunning && direction !== 'left') nextDirection = 'right';
                    e.preventDefault();
                });
                
                // 防止按钮点击时页面滚动
                const dpadButtons = [upBtn, downBtn, leftBtn, rightBtn];
                dpadButtons.forEach(btn => {
                    btn.addEventListener('touchmove', function(e) {
                        e.preventDefault();
                    });
                });
            }
            
            // 事件监听
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', restartGame);
            
            // 键盘控制
            document.addEventListener('keydown', handleKeyDown);
            
            // 触摸控制
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
            
            // 设置移动端控制
            setupMobileControls();
            
            // 初始绘制
            initGame();
        });
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = '4647ecf5-af54-41bc-bd18-96b2c8778174';
const gameTitle = '贪吃蛇';
const authorToken = '08dd73cc-e9ac-4279-aaa2-304fc9e59334';
const authorName = 'player_wydk7w';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

  const text = document.getElementById('share-text').value;

    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {

  }

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量

}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
});
</script>
