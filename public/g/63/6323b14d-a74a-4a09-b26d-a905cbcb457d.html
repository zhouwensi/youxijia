            const restartBtn = document.getElementById('restartBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const specialBtn = document.getElementById('specialBtn');
            
            // 设置画布尺寸
            function resizeCanvas() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 游戏状态
            let gameState = 'start'; // start, playing, paused, ended
            let score = 0;
            let level = 1;
            let birdsLeft = 5;
            let currentBird = null;
            let isDragging = false;
            let dragStart = {x: 0, y: 0};
            let power = 0;
            let isCharging = false;
            let specialActive = false;
            
            // 游戏对象
            const slingshot = {
                x: 150,
                y: canvas.height - 150,
                width: 40,
                height: 80
            };
            
            const ground = {
                y: canvas.height - 50,
                height: 50
            };
            
            let birds = [];
            let pigs = [];
            let blocks = [];
            let particles = [];
            
            // 初始化游戏
            function initGame() {
                score = 0;
                birdsLeft = 5;
                updateUI();
                
                // 创建小鸟
                birds = [];
                for (let i = 0; i < birdsLeft; i++) {
                    birds.push({
                        x: slingshot.x + 50 + i * 30,
                        y: slingshot.y,
                        radius: 15,
                        color: '#FF4500',
                        velocity: {x: 0, y: 0},
                        launched: false,
                        active: false
                    });
                }
                
                // 设置当前小鸟
                if (birds.length > 0) {
                    currentBird = birds[0];
                    currentBird.active = true;
                }
                
                // 创建猪猪和障碍物
                createLevel(level);
                
                // 重置粒子
                particles = [];
            }
            
            // 创建关卡
            function createLevel(levelNum) {
                pigs = [];
                blocks = [];
                
                // 根据关卡增加难度
                const pigCount = 2 + levelNum;
                const blockCount = 3 + levelNum * 2;
                
                // 创建猪猪
                for (let i = 0; i < pigCount; i++) {
                    pigs.push({
                        x: canvas.width - 200 - i * 80,
                        y: ground.y - 20,
                        radius: 20,
                        color: '#32CD32',
                        health: 1,
                        alive: true
                    });
                }
                
                // 创建障碍物（木箱）
                for (let i = 0; i < blockCount; i++) {
                    const blockType = Math.floor(Math.random() * 3);
                    let color, width, height;
                    
                    switch(blockType) {
                        case 0: // 木箱
                            color = '#8B4513';
                            width = 40;
                            height = 40;
                            break;
                        case 1: // 石箱
                            color = '#808080';
                            width = 50;
                            height = 50;
                            break;
                        case 2: // 玻璃
                            color = '#87CEEB';
                            width = 35;
                            height = 35;
                            break;
                    }
                    
                    blocks.push({
                        x: canvas.width - 250 - (i % 5) * 60,
                        y: ground.y - height - Math.floor(i / 5) * 70,
                        width: width,
                        height: height,
                        color: color,
                        health: blockType === 1 ? 2 : 1,
                        broken: false
                    });
                }
            }
            
            // 更新UI
            function updateUI() {
                scoreValue.textContent = score;
                levelValue.textContent = level;
                birdsValue.textContent = birdsLeft;
            }
            
            // 绘制游戏
            function draw() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制天空
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#98D8E8');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制云朵
                drawClouds();
                
                // 绘制地面
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(0, ground.y, canvas.width, ground.height);
                ctx.fillStyle = '#556B2F';
                ctx.fillRect(0, ground.y, canvas.width, 10);
                
                // 绘制弹弓
                drawSlingshot();
                
                // 绘制障碍物
                blocks.forEach(block => {
                    if (!block.broken) {
                        ctx.fillStyle = block.color;
                        ctx.fillRect(block.x - block.width/2, block.y - block.height/2, block.width, block.height);
                        
                        // 边框
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(block.x - block.width/2, block.y - block.height/2, block.width, block.height);
                    }
                });
                
                // 绘制猪猪
                pigs.forEach(pig => {
                    if (pig.alive) {
                        // 身体
                        ctx.fillStyle = pig.color;
                        ctx.beginPath();
                        ctx.arc(pig.x, pig.y, pig.radius, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 眼睛
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(pig.x - 8, pig.y - 5, 5, 0, Math.PI * 2);
                        ctx.arc(pig.x + 8, pig.y - 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 瞳孔
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.arc(pig.x - 8, pig.y - 5, 2, 0, Math.PI * 2);
                        ctx.arc(pig.x + 8, pig.y - 5, 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 鼻子
                        ctx.fillStyle = '#FF69B4';
                        ctx.beginPath();
                        ctx.arc(pig.x, pig.y + 5, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                // 绘制小鸟
                birds.forEach(bird => {
                    if (!bird.launched || bird.active) {
                        ctx.fillStyle = bird.color;
                        ctx.beginPath();
                        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 眼睛
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(bird.x - 5, bird.y - 5, 4, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = 'black';
                        ctx.beginPath();
                        ctx.arc(bird.x - 5, bird.y - 5, 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 眉毛（愤怒的表情）
                        ctx.strokeStyle = 'black';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(bird.x - 10, bird.y - 10);
                        ctx.lineTo(bird.x - 2, bird.y - 8);
                        ctx.stroke();
                    }
                });
                
                // 绘制粒子效果
                particles.forEach((particle, index) => {
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 更新粒子
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.1; // 重力
                    particle.life--;
                    
                    // 移除死亡的粒子
                    if (particle.life <= 0) {
                        particles.splice(index, 1);
                    }
                });
                
                // 如果正在拖动小鸟，绘制弹力线
                if (isDragging && currentBird && !currentBird.launched) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(slingshot.x, slingshot.y);
                    ctx.lineTo(currentBird.x, currentBird.y);
                    ctx.stroke();
                    
                    // 绘制力量指示器
                    const angle = Math.atan2(slingshot.y - currentBird.y, slingshot.x - currentBird.x);
                    const force = Math.min(Math.sqrt(
                        Math.pow(currentBird.x - slingshot.x, 2) + 
                        Math.pow(currentBird.y - slingshot.y, 2)
                    ) / 100, 1);
                    
                    const endX = currentBird.x + Math.cos(angle) * force * 50;
                    const endY = currentBird.y + Math.sin(angle) * force * 50;
                    
                    ctx.strokeStyle = 'rgba(255, 69, 0, 0.8)';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(currentBird.x, currentBird.y);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                }
                
                // 如果特殊技能激活，绘制特效
                if (specialActive && currentBird && currentBird.launched) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(currentBird.x, currentBird.y, 30, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 绘制弹弓
            function drawSlingshot() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(slingshot.x - slingshot.width/2, slingshot.y, slingshot.width, slingshot.height);
                
                // 弹弓的Y形支架
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.moveTo(slingshot.x - 30, slingshot.y + slingshot.height);
                ctx.lineTo(slingshot.x, slingshot.y - 20);
                ctx.lineTo(slingshot.x + 30, slingshot.y + slingshot.height);
                ctx.stroke();
                
                // 皮筋连接点
                ctx.fillStyle = '#D2691E';
                ctx.beginPath();
                ctx.arc(slingshot.x, slingshot.y - 20, 8, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制云朵
            function drawClouds() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                // 云朵1
                ctx.beginPath();
                ctx.arc(100, 80, 30, 0, Math.PI * 2);
                ctx.arc(140, 70, 40, 0, Math.PI * 2);
                ctx.arc(180, 80, 30, 0, Math.PI * 2);
                ctx.arc(140, 90, 35, 0, Math.PI * 2);
                ctx.fill();
                
                // 云朵2
                ctx.beginPath();
                ctx.arc(canvas.width - 150, 120, 25, 0, Math.PI * 2);
                ctx.arc(canvas.width - 120, 110, 35, 0, Math.PI * 2);
                ctx.arc(canvas.width - 90, 120, 25, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 创建粒子效果
            function createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        radius: Math.random() * 5 + 2,
                        color: color,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: Math.random() * 30 + 20
                    });
                }
            }
            
            // 更新游戏逻辑
            function update() {
                if (gameState !== 'playing') return;
                
                // 更新小鸟位置
                birds.forEach(bird => {
                    if (bird.launched && bird.active) {
                        // 应用重力
                        bird.velocity.y += 0.5;
                        
                        // 更新位置
                        bird.x += bird.velocity.x;
                        bird.y += bird.velocity.y;
                        
                        // 边界检查
                        if (bird.x < 0 || bird.x > canvas.width || bird.y > canvas.height) {
                            bird.active = false;
                            nextBird();
                        }
                        
                        // 地面碰撞
                        if (bird.y + bird.radius > ground.y) {
                            bird.y = ground.y - bird.radius;
                            bird.velocity.y *= -0.6; // 反弹
                            bird.velocity.x *= 0.8; // 摩擦力
                            
                            // 如果速度很小，停止小鸟
                            if (Math.abs(bird.velocity.x) < 0.5 && Math.abs(bird.velocity.y) < 0.5) {
                                bird.active = false;
                                setTimeout(nextBird, 500);
                            }
                        }
                        
                        // 与障碍物碰撞
                        blocks.forEach((block, blockIndex) => {
                            if (!block.broken) {
                                if (bird.x + bird.radius > block.x - block.width/2 &&
                                    bird.x - bird.radius < block.x + block.width/2 &&
                                    bird.y + bird.radius > block.y - block.height/2 &&
                                    bird.y - bird.radius < block.y + block.height/2) {
                                    
                                    // 碰撞反应
                                    const dx = bird.x - block.x;
                                    const dy = bird.y - block.y;
                                    
                                    if (Math.abs(dx) > Math.abs(dy)) {
                                        bird.velocity.x *= -0.8;
                                        bird.x += dx > 0 ? 5 : -5;
                                    } else {
                                        bird.velocity.y *= -0.8;
                                        bird.y += dy > 0 ? 5 : -5;
                                    }
                                    
                                    // 障碍物受损
                                    block.health--;
                                    if (block.health <= 0) {
                                        block.broken = true;
                                        score += 50;
                                        createParticles(block.x, block.y, block.color, 15);
                                    } else {
                                        score += 20;
                                        createParticles(block.x, block.y, block.color, 5);
                                    }
                                    
                                    updateUI();
                                }
                            }
                        });
                        
                        // 与猪猪碰撞
                        pigs.forEach((pig, pigIndex) => {
                            if (pig.alive) {
                                const dx = bird.x - pig.x;
                                const dy = bird.y - pig.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                
                                if (distance < bird.radius + pig.radius) {
                                    // 猪猪受到伤害
                                    pig.health--;
                                    
                                    if (specialActive) {
                                        pig.health = 0; // 特殊技能直接击败猪猪
                                    }
                                    
                                    if (pig.health <= 0) {
                                        pig.alive = false;
                                        score += 100;
                                        createParticles(pig.x, pig.y, pig.color, 20);
                                        
                                        // 检查是否所有猪猪都被击败
                                        checkLevelComplete();
                                    } else {
                                        score += 30;
                                        createParticles(pig.x, pig.y, pig.color, 10);
                                    }
                                    
                                    // 小鸟反弹
                                    bird.velocity.x = dx / distance * 10;
                                    bird.velocity.y = dy / distance * 10;
                                    
                                    updateUI();
                                }
                            }
                        });
                    }
                });
                
                // 更新UI
                if (isCharging && currentBird && !currentBird.launched) {
                    power = Math.min(Math.sqrt(
                        Math.pow(currentBird.x - slingshot.x, 2) + 
                        Math.pow(currentBird.y - slingshot.y, 2)
                    ) / 100, 1);
                    
                    powerBar.style.width = (power * 100) + '%';
                }
            }
            
            // 切换到下一只小鸟
            function nextBird() {
                if (birdsLeft > 0) {
                    const nextActiveIndex = birds.findIndex(bird => !bird.launched);
                    
                    if (nextActiveIndex !== -1) {
                        if (currentBird) currentBird.active = false;
                        currentBird = birds[nextActiveIndex];
                        currentBird.active = true;
                    } else {
                        // 没有更多小鸟了
                        currentBird = null;
                        birdsLeft = 0;
                        birdsValue.textContent = birdsLeft;
                        
                        // 检查游戏是否结束
                        setTimeout(() => {
                            const alivePigs = pigs.filter(pig => pig.alive).length;
                            if (alivePigs > 0) {
                                endGame(false);
                            }
                        }, 1000);
                    }
                }
            }
            
            // 检查关卡是否完成
            function checkLevelComplete() {
                const alivePigs = pigs.filter(pig => pig.alive).length;
                
                if (alivePigs === 0) {
                    setTimeout(() => {
                        endGame(true);
                    }, 1000);
                }
            }
            
            // 结束游戏
            function endGame(win) {
                gameState = 'ended';
                finalScore.textContent = score;
                
                if (win) {
                    endTitle.textContent = `关卡 ${level} 完成！`;
                    endMessage.textContent = `你击败了所有猪猪！得分: ${score}`;
                    nextLevelBtn.style.display = 'block';
                } else {
                    endTitle.textContent = '游戏结束';
                    endMessage.textContent = `猪猪们逃走了！最终得分: ${score}`;
                    nextLevelBtn.style.display = 'none';
                }
                
                gameScreen.classList.add('hidden');
                endScreen.classList.remove('hidden');
            }
            
            // 游戏循环
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
            
            // 事件监听器
            startBtn.addEventListener('click', () => {
                gameState = 'playing';
                startScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                initGame();
            });
            
            resumeBtn.addEventListener('click', () => {
                gameState = 'playing';
                pauseScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
            });
            
            restartFromPauseBtn.addEventListener('click', () => {
                gameState = 'playing';
                pauseScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                initGame();
            });
            
            nextLevelBtn.addEventListener('click', () => {
                level++;
                gameState = 'playing';
                endScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                initGame();
            });
            
            restartEndBtn.addEventListener('click', () => {
                level = 1;
                gameState = 'playing';
                endScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                initGame();
            });
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && gameState === 'playing' && currentBird && currentBird.launched) {
                    // 激活特殊技能
                    specialActive = true;
                    setTimeout(() => {
                        specialActive = false;
                    }, 3000);
                }
                
                if (e.code === 'KeyR') {
                    // 重新开始
                    if (gameState === 'playing') {
                        initGame();
                    }
                }
                
                if (e.code === 'KeyP') {
                    // 暂停/继续
                    if (gameState === 'playing') {
                        gameState = 'paused';
                        gameScreen.classList.add('hidden');
                        pauseScreen.classList.remove('hidden');
                    } else if (gameState === 'paused') {
                        gameState = 'playing';
                        pauseScreen.classList.add('hidden');
                        gameScreen.classList.remove('hidden');
                    }
                }
            });
            
            // 鼠标/触摸控制
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('touchstart', handleStart);
            
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('touchmove', handleMove);
            
            canvas.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('touchend', handleEnd);
            
            // 触摸按钮控制
            restartBtn.addEventListener('click', () => initGame());
            pauseBtn.addEventListener('click', () => {
                if (gameState === 'playing') {
                    gameState = 'paused';
                    gameScreen.classList.add('hidden');
                    pauseScreen.classList.remove('hidden');
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    pauseScreen.classList.add('hidden');
                    gameScreen.classList.remove('hidden');
                }
            });
            specialBtn.addEventListener('click', () => {
                if (gameState === 'playing' && currentBird && currentBird.launched) {
                    specialActive = true;
                    setTimeout(() => {
                        specialActive = false;
                    }, 3000);
                }
            });
            
            function handleStart(e) {
                if (gameState !== 'playing' || !currentBird || currentBird.launched) return;
                
                e.preventDefault();
                const pos = getEventPosition(e);
                
                // 检查是否点击了小鸟
                const dx = pos.x - currentBird.x;
                const dy = pos.y - currentBird.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < currentBird.radius) {
                    isDragging = true;
                    isCharging = true;
                    dragStart.x = pos.x;
                    dragStart.y = pos.y;
                }
            }
            
            function handleMove(e) {
                if (!isDragging || !currentBird || currentBird.launched) return;
                
                e.preventDefault();
                const pos = getEventPosition(e);
                
                // 限制拖动范围
                const maxDrag = 100;
                const dx = pos.x - slingshot.x;
                const dy = pos.y - slingshot.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > maxDrag) {
                    const angle = Math.atan2(dy, dx);
                    currentBird.x = slingshot.x + Math.cos(angle) * maxDrag;
                    currentBird.y = slingshot.y + Math.sin(angle) * maxDrag;
                } else {
                    currentBird.x = pos.x;
                    currentBird.y = pos.y;
                }
            }
            
            function handleEnd(e) {
                if (!isDragging || !currentBird || currentBird.launched) return;
                
                e.preventDefault();
                isDragging = false;
                
                // 发射小鸟
                const dx = slingshot.x - currentBird.x;
                const dy = slingshot.y - currentBird.y;
                
                currentBird.velocity.x = dx * 0.2;
                currentBird.velocity.y = dy * 0.2;
                currentBird.launched = true;
                
                // 减少小鸟数量
                birdsLeft--;
                birdsValue.textContent = birdsLeft;
                
                // 重置力量条
                isCharging = false;
                powerBar.style.width = '0%';
                
                // 创建发射粒子效果
                createParticles(currentBird.x, currentBird.y, currentBird.color, 10);
            }
            
            function getEventPosition(e) {
                let x, y;
                
                if (e.type.includes('touch')) {
                    const touch = e.touches[0] || e.changedTouches[0];
                    const rect = canvas.getBoundingClientRect();
                    x = touch.clientX - rect
