    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <canvas id="touchCanvas"></canvas>

        <div id="startScreen" class="ui-overlay">
            <h1 class="title">贪吃蛇</h1>
            <button class="btn" id="startBtn">开始游戏</button>
            <button class="btn" id="instructionsBtn">游戏说明</button>
        </div>
        
        <!-- 游戏说明界面 -->
        <div id="instructionsScreen" class="ui-overlay hidden">
            <div class="instructions">
                <h3>游戏说明</h3>
                <p><span class="key">键盘控制</span>: 使用方向键或WASD控制蛇的移动方向</p>
                <p><span class="key">触屏控制</span>: 触摸屏幕左侧区域并滑动手指控制方向</p>
                <p>控制贪吃蛇吃掉食物<span style="color:#4af">●</span>，每吃到一个食物得分增加，蛇身变长</p>
                <p>注意不要撞到墙壁或自己的身体，否则游戏结束</p>
                <p>游戏速度会随着得分增加而逐渐加快</p>
                <button class="btn" id="backBtn">返回</button>
            </div>
        </div>

        <div id="endScreen" class="ui-overlay hidden">
            <h1 class="title">游戏结束</h1>
            <div style="font-size: 2rem; margin: 20px 0; color: #4af;">
                最终得分: <span id="finalScore">0</span>
            </div>
            <button class="btn" id="restartBtn">重新开始</button>
            <button class="btn" id="menuBtn">返回主菜单</button>
        </div>
    </div>

    <script>
        // 游戏常量
        const GRID_SIZE = 20;
        const INITIAL_SPEED = 120;
        const SPEED_INCREMENT = 2;
        
        // 游戏状态
        let game = {
            running: false,
            score: 0,
            highScore: 0,
            speed: INITIAL_SPEED,
            lastUpdate: 0,
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            snake: [{x: 5, y: 10}, {x: 4, y: 10}, {x: 3, y: 10}],
            food: {x: 15, y: 10},
            gridWidth: 0,
            gridHeight: 0,
            canvas: null,
            ctx: null,
            touchCanvas: null,
            touchCtx: null,
            touchStartX: 0,
            touchStartY: 0,
            isTouching: false,
            touchDirection: { x: 0, y: 0 }
        };
        
        // DOM元素
        const gameCanvas = document.getElementById('gameCanvas');
        const touchCanvas = document.getElementById('touchCanvas');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const instructionsScreen = document.getElementById('instructionsScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const instructionsBtn = document.getElementById('instructionsBtn');
        const backBtn = document.getElementById('backBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const helpBtn = document.getElementById('helpBtn');
        const touchIndicator = document.getElementById('touchIndicator');
        
        // 初始化
        function init() {
            game.canvas = gameCanvas;
            game.ctx = gameCanvas.getContext('2d');
            game.touchCanvas = touchCanvas;
            game.touchCtx = touchCanvas.getContext('2d');
            
            resizeCanvases();
            resetGame();
            
            // 事件监听
            window.addEventListener('resize', resizeCanvases);
            window.addEventListener('keydown', handleKeyDown);
            
            // 触摸事件
            touchCanvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            touchCanvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            touchCanvas.addEventListener('touchend', handleTouchEnd);
            
            // 按钮事件
            startBtn.addEventListener('click', startGame);
            instructionsBtn.addEventListener('click', showInstructions);
            backBtn.addEventListener('click', hideInstructions);
            restartBtn.addEventListener('click', restartGame);
            menuBtn.addEventListener('click', returnToMenu);
            helpBtn.addEventListener('click', toggleInstructions);
            
            // 游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 调整画布尺寸
        function resizeCanvases() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const size = Math.min(width, height) * 0.9;
            
            gameCanvas.width = size;
            gameCanvas.height = size;
            touchCanvas.width = size;
            touchCanvas.height = size;
            
            game.gridWidth = Math.floor(gameCanvas.width / GRID_SIZE);
            game.gridHeight = Math.floor(gameCanvas.height / GRID_SIZE);
            
            // 确保食物在有效范围内
            if (game.food.x >= game.gridWidth) game.food.x = game.gridWidth - 1;
            if (game.food.y >= game.gridHeight) game.food.y = game.gridHeight - 1;
        }
        
        // 重置游戏
        function resetGame() {
            game.score = 0;
            game.speed = INITIAL_SPEED;
            game.direction = { x: 1, y: 0 };
            game.nextDirection = { x: 1, y: 0 };
            game.snake = [
                {x: Math.floor(game.gridWidth/2), y: Math.floor(game.gridHeight/2)},
                {x: Math.floor(game.gridWidth/2)-1, y: Math.floor(game.gridHeight/2)},
                {x: Math.floor(game.gridWidth/2)-2, y: Math.floor(game.gridHeight/2)}
            ];
            generateFood();
            scoreElement.textContent = game.score;
        }
        
        // 开始游戏
        function startGame() {
            resetGame();
            game.running = true;
            startScreen.classList.add('hidden');
            touchIndicator.classList.remove('hidden');
        }
        
        // 重新开始游戏
        function restartGame() {
            endScreen.classList.add('hidden');
            startGame();
        }
        
        // 返回主菜单
        function returnToMenu() {
            endScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            game.running = false;
            touchIndicator.classList.add('hidden');
        }
        
        // 显示游戏说明
        function showInstructions() {
            startScreen.classList.add('hidden');
            instructionsScreen.classList.remove('hidden');
        }
        
        // 隐藏游戏说明
        function hideInstructions() {
            instructionsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }
        
        // 切换游戏说明显示
        function toggleInstructions() {
            if (!game.running) return;
            
            if (instructionsScreen.classList.contains('hidden')) {
                instructionsScreen.classList.remove('hidden');
                game.running = false;
            } else {
                instructionsScreen.classList.add('hidden');
                game.running = true;
            }
        }
        
        // 游戏结束
        function gameOver() {
            game.running = false;
            finalScoreElement.textContent = game.score;
            endScreen.classList.remove('hidden');
            touchIndicator.classList.add('hidden');
            
            // 更新最高分
            if (game.score > game.highScore) {
                game.highScore = game.score;
            }
        }
        
        // 生成食物
        function generateFood() {
            let newFood;
            let foodOnSnake;
            
            do {
                foodOnSnake = false;
                newFood = {
                    x: Math.floor(Math.random() * game.gridWidth),
                    y: Math.floor(Math.random() * game.gridHeight)
                };
                
                for (let segment of game.snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
            
            game.food = newFood;
        }
        
        // 处理键盘输入
        function handleKeyDown(e) {
            if (!game.running) return;
            
            // 防止滚动
            if ([37, 38, 39, 40, 65, 87, 68, 83].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // 方向键和WASD
            switch(e.keyCode) {
                case 37: // 左箭头
                case 65: // A
                    if (game.direction.x !== 1) game.nextDirection = { x: -1, y: 0 };
                    break;
                case 38: // 上箭头
                case 87: // W
                    if (game.direction.y !== 1) game.nextDirection = { x: 0, y: -1 };
                    break;
                case 39: // 右箭头
                case 68: // D
                    if (game.direction.x !== -1) game.nextDirection = { x: 1, y: 0 };
                    break;
                case 40: // 下箭头
                case 83: // S
                    if (game.direction.y !== -1) game.nextDirection = { x: 0, y: 1 };
                    break;
            }
        }
        
        // 处理触摸开始
        function handleTouchStart(e) {
            if (!game.running) return;
            
            e.preventDefault();
            const rect = touchCanvas.getBoundingClientRect();
            const touch = e.touches[0];
            
            game.touchStartX = touch.clientX - rect.left;
            game.touchStartY = touch.clientY - rect.top;
            game.isTouching = true;
            
            // 只在屏幕左侧区域响应触摸控制
            if (game.touchStartX < touchCanvas.width / 2) {
                updateTouchDirection(0, 0);
            }
        }
        
        // 处理触摸移动
        function handleTouchMove(e) {
            if (!game.running || !game.isTouching) return;
            
            e.preventDefault();
            const rect = touchCanvas.getBoundingClientRect();
            const touch = e.touches[0];
            
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;
            
            // 只在屏幕左侧区域响应触摸控制
            if (touchX < touchCanvas.width / 2) {
                const dx = touchX - game.touchStartX;
                const dy = touchY - game.touchStartY;
                
                // 计算方向
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                    let dirX = 0, dirY = 0;
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        dirX = dx > 0 ? 1 : -1;
                    } else {
                        dirY = dy > 0 ? 1 : -1;
                    }
                    
                    updateTouchDirection(dirX, dirY);
                }
            }
        }
        
        // 处理触摸结束
        function handleTouchEnd() {
            game.isTouching = false;
            game.touchDirection = { x: 0, y: 0 };
            drawTouchIndicator(0, 0);
        }
        
        // 更新触摸方向
        function updateTouchDirection(dirX, dirY) {
            game.touchDirection = { x: dirX, y: dirY };
            
            // 应用方向到蛇，但不能直接反向
            if (dirX === 1 && game.direction.x !== -1) game.nextDirection = { x: 1, y: 0 };
            if (dirX === -1 && game.direction.x !== 1) game.nextDirection = { x: -1, y: 0 };
            if (dirY === 1 && game.direction.y !== -1) game.nextDirection = { x: 0, y: 1 };
            if (dirY === -1 && game.direction.y !== 1) game.nextDirection = { x: 0, y: -1 };
            
            drawTouchIndicator(dirX, dirY);
        }
        
        // 绘制触摸指示器
        function drawTouchIndicator(dirX, dirY) {
            game.touchCtx.clearRect(0, 0, touchCanvas.width, touchCanvas.height);
            
            // 绘制触摸区域
            game.touchCtx.fillStyle = 'rgba(74, 175, 255, 0.1)';
            game.touchCtx.fillRect(0, 0, touchCanvas.width/2, touchCanvas.height);
            
            // 绘制方向指示
            if (dirX !== 0 || dirY !== 0) {
                const centerX = touchCanvas.width/4;
                const centerY = touchCanvas.height/2;
                const radius = Math.min(touchCanvas.width, touchCanvas.height) * 0.1;
                
                game.touchCtx.beginPath();
                game.touchCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                game.touchCtx.fillStyle = 'rgba(74, 175, 255, 0.3)';
                game.touchCtx.fill();
                
                // 方向箭头
                game.touchCtx.beginPath();
                game.touchCtx.moveTo(centerX, centerY);
                game.touchCtx.lineTo(centerX + dirX * radius * 0.7, centerY + dirY * radius * 0.7);
                game.touchCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                game.touchCtx.lineWidth = 4;
                game.touchCtx.stroke();
            }
        }
        
        // 更新游戏状态
        function updateGame(currentTime) {
            if (!game.running) return;
            
            // 控制游戏速度
            if (currentTime - game.lastUpdate < game.speed) return;
            game.lastUpdate = currentTime;
            
            // 更新方向
            game.direction = game.nextDirection;
            
            // 计算新头部位置
            const head = { ...game.snake[0] };
            head.x += game.direction.x;
            head.y += game.direction.y;
            
            // 检查碰撞
            // 墙壁碰撞
            if (head.x < 0 || head.x >= game.gridWidth || head.y < 0 || head.y >= game.gridHeight) {
                gameOver();
                return;
            }
            
            // 自身碰撞
            for (let segment of game.snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // 添加新头部
            game.snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === game.food.x && head.y === game.food.y) {
                game.score += 10;
                scoreElement.textContent = game.score;
                
                // 增加速度
                if (game.speed > 50) {
                    game.speed -= SPEED_INCREMENT;
                }
                
                generateFood();
            } else {
                // 没吃到食物则移除尾部
                game.snake.pop();
            }
        }
        
        // 绘制游戏
        function drawGame() {
            const ctx = game.ctx;
            const canvas = game.canvas;
            
            // 清除画布
            ctx.fillStyle = '#111122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            for (let x = 0; x < game.gridWidth; x++) {
                ctx.beginPath();
                ctx.moveTo(x * GRID_SIZE, 0);
                ctx.lineTo(x * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y < game.gridHeight; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * GRID_SIZE);
                ctx.lineTo(canvas.width, y * GRID_SIZE);
                ctx.stroke();
            }
            
            // 绘制蛇
            game.snake.forEach((segment, index) => {
                const x = segment.x * GRID_SIZE;
                const y = segment.y * GRID_SIZE;
                
                // 蛇头
                if (index === 0) {
                    ctx.fillStyle = '#4af';
                    ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
                    
                    // 蛇头眼睛
                    ctx.fillStyle = '#fff';
                    const eyeSize = GRID_SIZE / 5;
                    const offset = GRID_SIZE / 3;
                    
                    // 根据方向确定眼睛位置
                    if (game.direction.x === 1) { // 向右
                        ctx.fillRect(x + GRID_SIZE - offset, y + offset, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - offset, y + GRID_SIZE - offset - eyeSize, eyeSize, eyeSize);
                    } else if (game.direction.x === -1) { // 向左
                        ctx.fillRect(x + offset - eyeSize, y + offset, eyeSize, eyeSize);
                        ctx.fillRect(x + offset - eyeSize, y + GRID_SIZE - offset - eyeSize, eyeSize, eyeSize);
                    } else if (game.direction.y === 1) { // 向下
                        ctx.fillRect(x + offset, y + GRID_SIZE - offset, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - offset - eyeSize, y + GRID_SIZE - offset, eyeSize, eyeSize);
                    } else if (game.direction.y === -1) { // 向上
                        ctx.fillRect(x + offset, y + offset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - offset - eyeSize, y + offset - eyeSize, eyeSize, eyeSize);
                    }
                } else {
                    // 蛇身
                    const gradient = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                    gradient.addColorStop(0, '#28f');
                    gradient.addColorStop(1, '#4af');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, GRID_SIZE, GRID_SIZE);
                    
                    // 蛇身内部
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(x + 4, y + 4, GRID_SIZE - 8, GRID_SIZE - 8);
                }
            });
            
            // 绘制食物
            const foodX = game.food.x * GRID_SIZE;
            const foodY = game.food.y * GRID_SIZE;
            
            // 食物发光效果
            ctx.shadowColor = '#4af';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#4af';
            ctx.beginPath();
            ctx.arc(foodX + GRID_SIZE/2, foodY + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // 食物内部
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(foodX + GRID_SIZE/2, foodY + GRID_SIZE/2, GRID_SIZE/4, 0, Math.PI * 2);
            ctx.fill();
            
            // 绘制得分和最高分
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#4af';
            ctx.textAlign = 'left';
            ctx.fillText(`最高分: ${game.highScore}`, 10, 30);
        }
        
        // 游戏主循环
        function gameLoop(currentTime) {
            updateGame(currentTime);
            drawGame();
            requestAnimationFrame(gameLoop);
        }
        
        // 初始化游戏
        window.addEventListener('load', init);
    </script>

      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {

});

// 显示 Toast 提示
function showToast(message, type) {
  // 移除已存在的 toast
  var existingToast = document.getElementById('game-detail-toast');
  if (existingToast) existingToast.remove();
  
  var toast = document.createElement('div');
  toast.id = 'game-detail-toast';
  toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:8px;z-index:10000;font-size:14px;max-width:80%;text-align:center;animation:fadeIn 0.3s ease;';
  if (type === 'success') {
    toast.style.background = 'rgba(16,185,129,0.95)';
  }
  toast.innerText = message;
  document.body.appendChild(toast);
  
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
  }, 2500);
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('感谢点赞！❤️ ' + data.creditMessage, 'success');
        } else if (data.liked) {
          showToast('感谢点赞！❤️', 'success');
        } else {
          showToast('已取消点赞');
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
        showToast('操作失败，请重试');
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
      showToast('网络错误，请重试');
    });
}

      alert('分享内容已复制，快去分享给好友吧！');

    }).catch(() => {

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// ====== 弹窗层级管理器 ======
// 基础层级（高于所有固定 UI 元素如 tiktok-sidebar 的 999998）
const modalZIndexManager = {
  baseZIndex: 1000000,
  currentZIndex: 1000000,
  modalStack: [], // 弹窗栈，用于追踪打开的弹窗
  
  // 获取下一个层级（打开新弹窗时调用）
  getNextZIndex: function(modalId) {
    this.currentZIndex += 10;
    this.modalStack.push({ id: modalId, zIndex: this.currentZIndex });
    return this.currentZIndex;
  },
  
  // 移除弹窗（关闭弹窗时调用）
  removeModal: function(modalId) {
    const index = this.modalStack.findIndex(m => m.id === modalId);
    if (index > -1) {
      this.modalStack.splice(index, 1);
    }
    // 如果没有弹窗了，重置层级
    if (this.modalStack.length === 0) {
      this.currentZIndex = this.baseZIndex;
    }
  },
  
  // 重置（关闭所有弹窗时调用）
  reset: function() {
    this.currentZIndex = this.baseZIndex;
    this.modalStack = [];
  }
};

// 获取头像emoji
function getAvatarEmoji(token) {
  const emojis = ['🎮', '🎯', '🎲', '🎪', '🎨', '🎭', '🎪', '🎰', '🎳', '🎸', '🎹', '🎺', '🎻', '🥁', '🎤'];
  if (!token) return '👤';
  const hash = token.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return emojis[hash % emojis.length];
}

// 获取游戏emoji
function getGameEmoji(title) {
  const keywords = {
    '贪吃蛇': '🐍', '蛇': '🐍', 'snake': '🐍',
    '2048': '🔢', '数字': '🔢',
    '飞机': '✈️', '打飞机': '✈️', '射击': '🔫',
    '砖块': '🧱', '打砖块': '🧱', '弹球': '🏓',
    '俄罗斯方块': '🟦', '方块': '🟦', 'tetris': '🟦',
    '跳跃': '🦘', '跑酷': '🏃', '跳': '🦘',
    '消除': '💎', '消消乐': '💎', '三消': '💎',
    '迷宫': '🔲', '棋': '♟️', '象棋': '♟️',
    '扑克': '🃏', '纸牌': '🃏', '斗地主': '🃏'
  };
  const t = (title || '').toLowerCase();
  for (const [k, v] of Object.entries(keywords)) {
    if (t.includes(k.toLowerCase())) return v;
  }
  return '🎮';
}

// 格式化数字
function formatNumber(num) {
  if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}

function loadMoreUserGames() {
  const { games, displayedCount, pageSize } = userProfileGamesState;
  if (displayedCount >= games.length) return;

  const grid = document.getElementById('user-games-grid');
  const loadMoreEl = document.getElementById('user-games-load-more');
  if (!grid) return;

  const newCount = Math.min(displayedCount + pageSize, games.length);
  const newGames = games.slice(displayedCount, newCount);

  newGames.forEach(function(game) {
    const card = document.createElement('div');
    card.className = 'user-game-card';
    card.onclick = function() { window.location.href = '/g/' + game.id.substring(0,2) + '/' + game.id + '.html'; };
    card.innerHTML = '<div class="user-game-emoji">' + getGameEmoji(game.title) + '</div>' +
      '<div class="user-game-title">' + escapeHtml(game.title) + '</div>' +
      '<div class="user-game-stats">' +
        '<span>🎮 ' + formatNumber(game.play_count || 0) + '</span>' +
        '<span>❤️ ' + formatNumber(game.like_count || 0) + '</span>' +
        '<span>💬 ' + formatNumber(game.comment_count || 0) + '</span>' +
      '</div>';
    grid.appendChild(card);
  });

  userProfileGamesState.displayedCount = newCount;
  if (newCount >= games.length && loadMoreEl) {
    loadMoreEl.style.display = 'none';
  }
}

  modal.className = 'modal active follow-modal-instance';

  modal.innerHTML = 
    '<div class="modal-content modal-medium">' +
      '<div class="modal-header">' +

            '关注 <span class="follow-tab-count" data-type="following">0</span>' +
          '</button>' +
          '<button class="follow-tab-btn ' + (tab === 'followers' ? 'active' : '') + '" data-tab="followers" onclick="switchFollowTabGameById(\x27' + modalId + '\x27, \x27followers\x27)">' +

          '<div class="follow-loading"><div class="loading-spinner"></div><span>加载中...</span></div>' +

    const statsRes = await fetch('/api/users/' + currentViewingUserToken + '/follow-stats', { headers: getAuthHeaders() });

    if (statsData.success) {
      const following = statsData.followingCount || statsData.following || 0;
      const followers = statsData.followerCount || statsData.followers || 0;
      // 使用 modal 内的选择器
      const followingCountEl = modal.querySelector('.follow-tab-count[data-type="following"]');

  await loadFollowListGameById(modalId, currentFollowTab);

// 加载关注/粉丝列表（通过弹窗ID）
async function loadFollowListGameById(modalId, type) {
  const modal = document.getElementById(modalId);
  if (!modal) return;
  
  const listContainer = modal.querySelector('.follow-list');
  if (!listContainer) return;
  
  listContainer.innerHTML = '<div class="follow-loading"><div class="loading-spinner"></div><span>加载中...</span></div>';
  
  try {
    const endpoint = type === 'following' 
      ? '/api/users/' + currentViewingUserToken + '/following'
      : '/api/users/' + currentViewingUserToken + '/followers';
    
    const response = await fetch(endpoint, { headers: getAuthHeaders() });
    const data = await response.json();
    
    if (data.success && data.users && data.users.length > 0) {
      listContainer.innerHTML = data.users.map(function(user) {
        return '<div class="follow-user-item" data-token="' + user.token + '">' +
          '<div class="follow-user-avatar" onclick="openUserProfile(\x27' + user.token + '\x27)">' +
            (user.avatar || getAvatarEmoji(user.token)) +

          '<div class="follow-user-info" onclick="openUserProfile(\x27' + user.token + '\x27)">' +
            '<div class="follow-user-name">' + escapeHtml(user.nickname || '游戏家用户') + '</div>' +
            '<div class="follow-user-stats">' +
              '<span>🎮 ' + (user.games_count || 0) + ' 作品</span>' +
              '<span>👥 ' + (user.followers_count || 0) + ' 粉丝</span>' +
            '</div>' +
          '</div>' +
          '<button class="follow-action-btn ' + (user.is_following ? 'following' : '') + '" onclick="event.stopPropagation(); toggleFollowUserGame(\x27' + user.token + '\x27, this)">' +
            (user.is_following ? '已关注' : '关注') +
          '</button>' +
        '</div>';
      }).join('');
    } else {
      listContainer.innerHTML = 
        '<div class="follow-empty">' +
          '<div class="follow-empty-icon">' + (type === 'following' ? '👤' : '🌟') + '</div>' +
          '<div class="follow-empty-text">' + (type === 'following' ? '还没有关注任何人' : '还没有粉丝') + '</div>' +
        '</div>';

    listContainer.innerHTML = '<div class="follow-empty"><div class="follow-empty-icon">😕</div><div class="follow-empty-text">加载失败，请重试</div></div>';

  const isFollowing = btn.classList.contains('following');

  try {
    const response = await fetch('/api/users/' + targetToken + '/follow', {
      method: 'POST',
      headers: getAuthHeaders()

    if (data.success) {
      btn.classList.toggle('following', data.following);
      btn.textContent = data.following ? '已关注' : '关注';
    } else {
      // 回滚
      btn.classList.toggle('following', isFollowing);
      btn.textContent = isFollowing ? '已关注' : '关注';
    }
  } catch (e) {
    // 回滚
    btn.classList.toggle('following', isFollowing);
    btn.textContent = isFollowing ? '已关注' : '关注';
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  // 添加滚动加载状态提示
  if (commentsData.hasMore) {
    html += '<div class="comments-scroll-loading" id="comments-scroll-hint">下拉加载更多...</div>';
  }
  
  listEl.innerHTML = html;
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('留言发布成功！' + data.creditMessage, 'success');
        } else {
          showToast('留言发布成功', 'success');
        }
      } else {
        showToast(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      showToast('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化滚动加载
function initCommentsScroll() {
  const wrapper = document.querySelector('.comments-body-wrapper');
  if (!wrapper) return;
  
  wrapper.addEventListener('scroll', function() {
    if (commentsData.isLoading || !commentsData.hasMore) return;
    
    // 距离底部50px时触发加载
    const scrollBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight;
    if (scrollBottom < 50) {
      loadGameComments(false);
    }
  });
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
  initCommentsScroll();
});
</script>
