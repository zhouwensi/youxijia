<body>
  <!-- 原游戏body内容 -->
  
    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <p class="subtitle">滑动合并相同数字，目标是得到2048！</p>
            
            <div class="score-container">
                <div class="score-box">
                    <div class="score-title">分数</div>
                    <div id="score" class="score-value">0</div>
                </div>
                <div class="score-box">
                    <div class="score-title">最高分</div>
                    <div id="bestScore" class="score-value">0</div>
                </div>
            </div>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas" width="450" height="450"></canvas>
            
            <div id="startScreen" class="screen">
                <h2>2048</h2>
                <p>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 滑动方块。<br>当两个相同数字的方块碰撞时，它们会合并成一个！<br>目标是得到 <strong>2048</strong> 方块！</p>
                <button id="startBtn" class="btn">开始游戏</button>
            </div>
            
            <div id="gameOverScreen" class="screen hidden">
                <h2>游戏结束</h2>
                <p class="game-over-message">没有可移动的方块了！</p>
                <p>你的最终分数：<span id="finalScore">0</span></p>
                <button id="restartBtn" class="btn">重新开始</button>
            </div>
            
            <div id="winScreen" class="screen hidden">
                <h2>恭喜！</h2>
                <p class="win-message">你成功得到了2048！</p>
                <p>你的分数：<span id="winScore">0</span></p>
                <p>继续游戏挑战更高分！</p>
                <button id="continueBtn" class="btn">继续游戏</button>
            </div>
        </div>
        
        <div class="controls">
            <div class="key-controls">
                <div class="key up">↑</div>
                <div class="key left">←</div>
                <div class="key right">→</div>
                <div class="key down">↓</div>
            </div>
            
            <div class="mobile-controls">
                <div class="mobile-controls-row">
                    <div class="mobile-btn" id="upBtn">↑</div>
                </div>
                <div class="mobile-controls-row">
                    <div class="mobile-btn" id="leftBtn">←</div>
                    <div class="mobile-btn" id="downBtn">↓</div>
                    <div class="mobile-btn" id="rightBtn">→</div>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            <p>提示：使用键盘方向键或WASD控制，手机用户可使用屏幕上的方向按钮。</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const GRID_SIZE = 4;
            const CELL_SIZE = 100;
            const CELL_GAP = 10;
            const BOARD_SIZE = CELL_SIZE * GRID_SIZE + CELL_GAP * (GRID_SIZE + 1);
            
            // 游戏状态
            let grid = [];
            let score = 0;
            let bestScore = localStorage.getItem('2048-bestScore') || 0;
            let gameOver = false;
            let gameWon = false;
            let isMoving = false;
            
            // DOM元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('score');
            const bestScoreElement = document.getElementById('bestScore');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const winScreen = document.getElementById('winScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const continueBtn = document.getElementById('continueBtn');
            const finalScoreElement = document.getElementById('finalScore');
            const winScoreElement = document.getElementById('winScore');
            
            // 移动端控制按钮
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 颜色映射
            const colors = {
                0: '#3a3a5d',
                2: '#2a4b8c',
                4: '#1e5aa8',
                8: '#0066cc',
                16: '#0088ff',
                32: '#00aaff',
                64: '#00ccff',
                128: '#00ddff',
                256: '#00eeff',
                512: '#55ffff',
                1024: '#88ffff',
                2048: '#bbffff',
                4096: '#ffffff'
            };
            
            // 文本颜色映射
            const textColors = {
                0: '#ffffff',
                2: '#ffffff',
                4: '#ffffff',
                8: '#ffffff',
                16: '#ffffff',
                32: '#ffffff',
                64: '#ffffff',
                128: '#000000',
                256: '#000000',
                512: '#000000',
                1024: '#000000',
                2048: '#000000',
                4096: '#000000'
            };
            
            // 初始化游戏
            function initGame() {
                // 重置游戏状态
                grid = [];
                score = 0;
                gameOver = false;
                gameWon = false;
                
                // 创建空网格
                for (let i = 0; i < GRID_SIZE; i++) {
                    grid[i] = [];
                    for (let j = 0; j < GRID_SIZE; j++) {
                        grid[i][j] = 0;
                    }
                }
                
                // 添加两个初始方块
                addRandomTile();
                addRandomTile();
                
                // 更新分数显示
                updateScore();
                
                // 隐藏所有屏幕，显示游戏画面
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                winScreen.classList.add('hidden');
                
                // 绘制初始游戏状态
                drawGame();
            }
            
            // 添加随机方块
            function addRandomTile() {
                // 查找所有空位置
                const emptyCells = [];
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) {
                            emptyCells.push({x: i, y: j});
                        }
                    }
                }
                
                // 如果有空位置，随机选择一个并放置2或4
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    // 90%概率生成2，10%概率生成4
                    grid[randomCell.x][randomCell.y] = Math.random() < 0.9 ? 2 : 4;
                }
            }
            
            // 绘制游戏
            function drawGame() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景
                ctx.fillStyle = '#2a2a4a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const x = j * (CELL_SIZE + CELL_GAP) + CELL_GAP;
                        const y = i * (CELL_SIZE + CELL_GAP) + CELL_GAP;
                        
                        // 绘制单元格背景
                        ctx.fillStyle = colors[grid[i][j]] || colors[0];
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                        
                        // 如果单元格有值，绘制数字
                        if (grid[i][j] !== 0) {
                            const value = grid[i][j];
                            ctx.fillStyle = textColors[value] || '#000000';
                            ctx.font = getFontSize(value) + 'px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(
                                value.toString(), 
                                x + CELL_SIZE / 2, 
                                y + CELL_SIZE / 2
                            );
                        }
                    }
                }
            }
            
            // 根据数字大小获取字体大小
            function getFontSize(value) {
                if (value < 100) return 40;
                if (value < 1000) return 35;
                return 30;
            }
            
            // 移动方块
            function move(direction) {
                if (isMoving || gameOver) return;
                
                let moved = false;
                const oldGrid = JSON.parse(JSON.stringify(grid));
                
                // 根据方向处理移动
                switch(direction) {
                    case 'up':
                        moved = moveUp();
                        break;
                    case 'down':
                        moved = moveDown();
                        break;
                    case 'left':
                        moved = moveLeft();
                        break;
                    case 'right':
                        moved = moveRight();
                        break;
                }
                
                // 如果发生了移动，添加新方块并检查游戏状态
                if (moved) {
                    addRandomTile();
                    updateScore();
                    drawGame();
                    checkGameStatus();
                }
                
                // 短暂延迟防止连续快速移动
                isMoving = true;
                setTimeout(() => {
                    isMoving = false;
                }, 150);
            }
            
            // 向上移动
            function moveUp() {
                let moved = false;
                
                for (let j = 0; j < GRID_SIZE; j++) {
                    // 合并相同数字
                    for (let i = 0; i < GRID_SIZE; i++) {
                        if (grid[i][j] !== 0) {
                            let k = i - 1;
                            while (k >= 0 && grid[k][j] === 0) {
                                grid[k][j] = grid[k+1][j];
                                grid[k+1][j] = 0;
                                moved = true;
                                k--;
                            }
                            
                            // 检查是否可以合并
                            if (k >= 0 && grid[k][j] === grid[k+1][j]) {
                                grid[k][j] *= 2;
                                grid[k+1][j] = 0;
                                score += grid[k][j];
                                moved = true;
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向下移动
            function moveDown() {
                let moved = false;
                
                for (let j = 0; j < GRID_SIZE; j++) {
                    // 合并相同数字
                    for (let i = GRID_SIZE - 1; i >= 0; i--) {
                        if (grid[i][j] !== 0) {
                            let k = i + 1;
                            while (k < GRID_SIZE && grid[k][j] === 0) {
                                grid[k][j] = grid[k-1][j];
                                grid[k-1][j] = 0;
                                moved = true;
                                k++;
                            }
                            
                            // 检查是否可以合并
                            if (k < GRID_SIZE && grid[k][j] === grid[k-1][j]) {
                                grid[k][j] *= 2;
                                grid[k-1][j] = 0;
                                score += grid[k][j];
                                moved = true;
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向左移动
            function moveLeft() {
                let moved = false;
                
                for (let i = 0; i < GRID_SIZE; i++) {
                    // 合并相同数字
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] !== 0) {
                            let k = j - 1;
                            while (k >= 0 && grid[i][k] === 0) {
                                grid[i][k] = grid[i][k+1];
                                grid[i][k+1] = 0;
                                moved = true;
                                k--;
                            }
                            
                            // 检查是否可以合并
                            if (k >= 0 && grid[i][k] === grid[i][k+1]) {
                                grid[i][k] *= 2;
                                grid[i][k+1] = 0;
                                score += grid[i][k];
                                moved = true;
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向右移动
            function moveRight() {
                let moved = false;
                
                for (let i = 0; i < GRID_SIZE; i++) {
                    // 合并相同数字
                    for (let j = GRID_SIZE - 1; j >= 0; j--) {
                        if (grid[i][j] !== 0) {
                            let k = j + 1;
                            while (k < GRID_SIZE && grid[i][k] === 0) {
                                grid[i][k] = grid[i][k-1];
                                grid[i][k-1] = 0;
                                moved = true;
                                k++;
                            }
                            
                            // 检查是否可以合并
                            if (k < GRID_SIZE && grid[i][k] === grid[i][k-1]) {
                                grid[i][k] *= 2;
                                grid[i][k-1] = 0;
                                score += grid[i][k];
                                moved = true;
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 更新分数显示
            function updateScore() {
                scoreElement.textContent = score;
                
                // 更新最高分
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('2048-bestScore', bestScore);
                }
                
                bestScoreElement.textContent = bestScore;
            }
            
            // 检查游戏状态
            function checkGameStatus() {
                // 检查是否获胜
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 2048 && !gameWon) {
                            gameWon = true;
                            winScoreElement.textContent = score;
                            winScreen.classList.remove('hidden');
                            return;
                        }
                    }
                }
                
                // 检查是否游戏结束（没有空位且无法合并）
                let hasEmpty = false;
                let canMerge = false;
                
                // 检查是否有空位
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (grid[i][j] === 0) {
                            hasEmpty = true;
                        }
                    }
                }
                
                // 检查是否可以合并
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const current = grid[i][j];
                        if (current !== 0) {
                            // 检查右侧
                            if (j < GRID_SIZE - 1 && grid[i][j+1] === current) {
                                canMerge = true;
                            }
                            // 检查下方
                            if (i < GRID_SIZE - 1 && grid[i+1][j] === current) {
                                canMerge = true;
                            }
                        }
                    }
                }
                
                // 如果没有空位且无法合并，游戏结束
                if (!hasEmpty && !canMerge) {
                    gameOver = true;
                    finalScoreElement.textContent = score;
                    gameOverScreen.classList.remove('hidden');
                }
            }
            
            // 触摸控制变量
            let touchStartX = 0;
            let touchStartY = 0;
            
            // 事件监听器
            function setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', function(e) {
                    if (gameOver && !gameWon) return;
                    
                    switch(e.key) {
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            e.preventDefault();
                            move('up');
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            e.preventDefault();
                            move('down');
                            break;
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            e.preventDefault();
                            move('left');
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            e.preventDefault();
                            move('right');
                            break;
                    }
                });
                
                // 触摸控制
                canvas.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                }, { passive: false });
                
                canvas.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                }, { passive: false });
                
                canvas.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (gameOver && !gameWon) return;
                    
                    const touch = e.changedTouches[0];
                    const touchEndX = touch.clientX;
                    const touchEndY = touch.clientY;
                    
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;
                    
                    // 确定滑动方向
                    if (Math.abs(dx) > Math.abs(dy)) {
                        // 水平滑动
                        if (Math.abs(dx) > 30) {
                            if (dx > 0) {
                                move('right');
                            } else {
                                move('left');
                            }
                        }
                    } else {
                        // 垂直滑动
                        if (Math.abs(dy) > 30) {
                            if (dy > 0) {
                                move('down');
                            } else {
                                move('up');
                            }
                        }
                    }
                }, { passive: false });
                
                // 移动端按钮控制
                upBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    move('up');
                }, { passive: false });
                
                downBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    move('down');
                }, { passive: false });
                
                leftBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    move('left');
                }, { passive: false });
                
                rightBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    move('right');
                }, { passive: false });
                
                // 按钮事件
                startBtn.addEventListener('click', initGame);
                restartBtn.addEventListener('click', initGame);
                continueBtn.addEventListener('click', function() {
                    winScreen.classList.add('hidden');
                });
                
                // 防止页面滚动
                document.addEventListener('touchmove', function(e) {
                    if (e.target === canvas || 
                        e.target === upBtn || 
                        e.target === downBtn || 
                        e.target === leftBtn || 
                        e.target === rightBtn) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
            
            // 初始化
            function init() {
                // 设置画布尺寸
                canvas.width = BOARD_SIZE;
                canvas.height = BOARD_SIZE;
                
                // 更新最高分显示
                bestScoreElement.textContent = bestScore;
                
                // 设置事件监听器
                setupEventListeners();
                
                // 绘制初始游戏状态
                drawGame();
            }
            
            // 启动游戏
            init();
        });
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = '8282fb4b-ce35-45a2-94a0-5688eacfba5c';
const gameTitle = '2048 数字合并游戏';
const authorToken = '854e9951-0f87-4d3e-b1cc-f6b8559fbe9c';
const authorName = '测试1号';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 打开分享面板
function openSharePanel() {
  const url = window.location.href;
  const shareText = '🎮 我发现了一个有趣的AI游戏：「' + gameTitle + '」\n\n👆 点击链接立即游玩：\n' + url + '\n\n💡 关注公众号「游戏开发技术教程」，一句话免费生成你的专属游戏！';
  document.getElementById('share-text').value = shareText;
  document.getElementById('share-panel').style.display = 'flex';
}

// 关闭分享面板
function closeSharePanel() {
  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 打开作者主页
function openAuthorProfile() {
  console.log('[DEBUG] openAuthorProfile 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  console.log('[DEBUG] 显示作者主页弹窗');
  const modal = document.getElementById('author-profile-modal');
  const content = document.getElementById('author-profile-content');
  content.innerHTML = '<div style="padding:20px;color:#999;">加载中...</div>';
  modal.style.display = 'flex';
  
  // 加载作者信息
  Promise.all([
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({})),
    fetch('/api/users/' + authorToken + '/follow-stats', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({})),
    fetch('/api/users/' + authorToken + '/games?limit=4', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({ games: [] }))
  ]).then(([profileData, statsData, gamesData]) => {
    const nickname = (profileData.profile && profileData.profile.nickname) || authorName || '游戏创作者';
    const followers = statsData.followerCount || statsData.followers || 0;
    const following = statsData.followingCount || statsData.following || 0;
    const games = gamesData.games || [];
    const userToken = getUserToken();
    const isSelf = authorToken === userToken;
    
    let gamesHtml = '';
    if (games.length > 0) {
      gamesHtml = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px;">' +
        games.slice(0, 4).map(g => '<a href="/g/' + g.id.substring(0,2) + '/' + g.id + '.html" style="background:#f5f5f5;border-radius:8px;padding:10px;text-decoration:none;color:#333;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🎮 ' + (g.title || '未命名').substring(0, 10) + '</a>').join('') +
        '</div>';
    }
    
    // 如果是自己，不显示关注按钮
    const followBtnHtml = isSelf ? '' : '<button id="profile-follow-btn" onclick="toggleFollowFromProfile()" style="width:100%;padding:10px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">+ 关注</button>';
    
    content.innerHTML = 
      '<div style="margin-bottom:15px;">' +
        '<div style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;">👤</div>' +
        '<div style="font-size:18px;font-weight:600;color:#333;">' + nickname + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;gap:30px;margin-bottom:15px;">' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + following + '</strong><span style="color:#999;font-size:12px;">关注</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + followers + '</strong><span style="color:#999;font-size:12px;">粉丝</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + games.length + '</strong><span style="color:#999;font-size:12px;">作品</span></div>' +
      '</div>' +
      followBtnHtml +
      gamesHtml;
    
    // 检查关注状态（只有不是自己时才检查）
    if (!isSelf) {
      checkFollowStatusForProfile();
    }
  }).catch(() => {
    content.innerHTML = '<div style="padding:20px;color:#999;">加载失败</div>';
  });
}

// 关闭作者主页
function closeAuthorProfile() {
  document.getElementById('author-profile-modal').style.display = 'none';
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
