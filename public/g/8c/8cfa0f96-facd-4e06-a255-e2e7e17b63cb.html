<body>
  <!-- 原游戏body内容 -->
  
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="screen">
        <h1>最终幻想</h1>
        <div class="subtitle">水晶守护者</div>
        <div class="instructions">
            使用方向键或触屏移动，躲避怪物，收集水晶。<br>
            每收集10个水晶可释放一次魔法攻击！
        </div>
        <button id="startBtn" class="btn">开始冒险</button>
        <div class="controls">
            键盘: 方向键移动, 空格攻击 | 触屏: 滑动移动, 点击攻击按钮
        </div>
    </div>

    <div id="endScreen" class="screen hidden">
        <h2>游戏结束</h2>
        <div class="score-display">最终得分: <span id="finalScore">0</span></div>
        <div class="score-display">收集水晶: <span id="finalCrystals">0</span></div>
        <button id="restartBtn" class="btn">再次挑战</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScore = document.getElementById('finalScore');
        const finalCrystals = document.getElementById('finalCrystals');

        let game = {
            running: false,
            score: 0,
            crystals: 0,
            player: null,
            enemies: [],
            crystalsList: [],
            particles: [],
            keys: {},
            touch: { x: 0, y: 0, active: false },
            lastTime: 0,
            enemySpawnTimer: 0,
            crystalSpawnTimer: 0
        };

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 20;
                this.speed = 5;
                this.color = '#4ec0e9';
                this.attackCooldown = 0;
                this.attacks = [];
                this.hp = 100;
            }

            update(keys, touch) {
                let dx = 0, dy = 0;
                
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
                
                if (touch.active) {
                    const angle = Math.atan2(touch.y - this.y, touch.x - this.x);
                    dx += Math.cos(angle) * 0.5;
                    dy += Math.sin(angle) * 0.5;
                }
                
                if (dx !== 0 || dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                    this.x += dx * this.speed;
                    this.y += dy * this.speed;
                }
                
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                
                if (this.attackCooldown > 0) this.attackCooldown--;
                
                this.attacks.forEach((attack, index) => {
                    attack.x += attack.vx;
                    attack.y += attack.vy;
                    attack.life--;
                    if (attack.life <= 0) this.attacks.splice(index, 1);
                });
            }

            attack() {
                if (this.attackCooldown === 0 && game.crystals >= 10) {
                    game.crystals -= 10;
                    this.attackCooldown = 30;
                    
                    for (let i = 0; i < 8; i++) {
                        const angle = (Math.PI * 2 * i) / 8;
                        this.attacks.push({
                            x: this.x,
                            y: this.y,
                            vx: Math.cos(angle) * 8,
                            vy: Math.sin(angle) * 8,
                            radius: 10,
                            color: '#ffcc00',
                            life: 60
                        });
                    }
                    
                    for (let i = 0; i < 20; i++) {
                        game.particles.push({
                            x: this.x,
                            y: this.y,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            radius: Math.random() * 4 + 2,
                            color: '#ffcc00',
                            life: 30
                        });
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = '#2a8ca8';
                ctx.fill();
                
                this.attacks.forEach(attack => {
                    ctx.beginPath();
                    ctx.arc(attack.x, attack.y, attack.radius, 0, Math.PI * 2);
                    ctx.fillStyle = attack.color;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                });
            }
        }

        class Enemy {
            constructor() {
                const side = Math.floor(Math.random() * 4);
                switch(side) {
                    case 0: this.x = -20; this.y = Math.random() * canvas.height; break;
                    case 1: this.x = canvas.width + 20; this.y = Math.random() * canvas.height; break;
                    case 2: this.x = Math.random() * canvas.width; this.y = -20; break;
                    case 3: this.x = Math.random() * canvas.width; this.y = canvas.height + 20; break;
                }
                this.radius = 15 + Math.random() * 10;
                this.speed = 1 + Math.random() * 2;
                this.color = '#ff4444';
                this.hp = 2;
            }

            update() {
                const dx = game.player.x - this.x;
                const dy = game.player.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                this.x += (dx / dist) * this.speed;
                this.y += (dy / dist) * this.speed;
                
                const playerDist = Math.sqrt(
                    Math.pow(this.x - game.player.x, 2) + 
                    Math.pow(this.y - game.player.y, 2)
                );
                
                if (playerDist < this.radius + game.player.radius) {
                    game.player.hp -= 0.5;
                    game.particles.push({
                        x: this.x,
                        y: this.y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        radius: Math.random() * 3 + 1,
                        color: '#ff4444',
                        life: 20
                    });
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.radius);
                ctx.lineTo(this.x - this.radius * 0.7, this.y + this.radius * 0.7);
                ctx.lineTo(this.x + this.radius * 0.7, this.y + this.radius * 0.7);
                ctx.closePath();
                ctx.fillStyle = '#cc2222';
                ctx.fill();
            }
        }

        class Crystal {
            constructor() {
                this.x = Math.random() * (canvas.width - 40) + 20;
                this.y = Math.random() * (canvas.height - 40) + 20;
                this.radius = 10;
                this.color = '#00ff88';
                this.pulse = 0;
            }

            update() {
                this.pulse += 0.1;
                
                const dist = Math.sqrt(
                    Math.pow(this.x - game.player.x, 2) + 
                    Math.pow(this.y - game.player.y, 2)
                );
                
                if (dist < this.radius + game.player.radius) {
                    game.score += 100;
                    game.crystals++;
                    
                    for (let i = 0; i < 15; i++) {
                        game.particles.push({
                            x: this.x,
                            y: this.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6,
                            radius: Math.random() * 3 + 1,
                            color: '#00ff88',
                            life: 40
                        });
                    }
                    
                    return true;
                }
                return false;
            }

            draw() {
                const pulseRadius = this.radius + Math.sin(this.pulse) * 3;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, pulseRadius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - pulseRadius);
                ctx.lineTo(this.x - pulseRadius * 0.8, this.y + pulseRadius * 0.5);
                ctx.lineTo(this.x, this.y + pulseRadius * 0.3);
                ctx.lineTo(this.x + pulseRadius * 0.8, this.y + pulseRadius * 0.5);
                ctx.closePath();
                ctx.fillStyle = '#00cc66';
                ctx.fill();
            }
        }

        function initGame() {
            game.running = true;
            game.score = 0;
            game.crystals = 0;
            game.player = new Player();
            game.enemies = [];
            game.crystalsList = [];
            game.particles = [];
            game.enemySpawnTimer = 0;
            game.crystalSpawnTimer = 0;
            game.player.hp = 100;
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
        }

        function gameOver() {
            game.running = false;
            finalScore.textContent = game.score;
            finalCrystals.textContent = game.crystals;
            endScreen.classList.remove('hidden');
        }

        function updateGame(deltaTime) {
            if (!game.running) return;
            
            game.player.update(game.keys, game.touch);
            
            game.enemySpawnTimer += deltaTime;
            if (game.enemySpawnTimer > 60) {
                game.enemies.push(new Enemy());
                game.enemySpawnTimer = 0;
            }
            
            game.crystalSpawnTimer += deltaTime;
            if (game.crystalSpawnTimer > 120) {
                game.crystalsList.push(new Crystal());
                game.crystalSpawnTimer = 0;
            }
            
            game.enemies.forEach((enemy, eIndex) => {
                enemy.update();
                
                game.player.attacks.forEach((attack, aIndex) => {
                    const dist = Math.sqrt(
                        Math.pow(attack.x - enemy.x, 2) + 
                        Math.pow(attack.y - enemy.y, 2)
                    );
                    
                    if (dist < attack.radius + enemy.radius) {
                        enemy.hp--;
                        game.player.attacks.splice(aIndex, 1);
                        
                        for (let i = 0; i < 10; i++) {
                            game.particles.push({
                                x: enemy.x,
                                y: enemy.y,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                radius: Math.random() * 3 + 1,
                                color: '#ffcc00',
                                life: 25
                            });
                        }
                        
                        if (enemy.hp <= 0) {
                            game.enemies.splice(eIndex, 1);
                            game.score += 200;
                            
                            for (let i = 0; i < 15; i++) {
                                game.particles.push({
                                    x: enemy.x,
                                    y: enemy.y,
                                    vx: (Math.random() - 0.5) * 6,
                                    vy: (Math.random() - 0.5) * 6,
                                    radius: Math.random() * 2 + 1,
                                    color: '#ff4444',
                                    life: 30
                                });
                            }
                        }
                    }
                });
            });
            
            game.crystalsList = game.crystalsList.filter(crystal => !crystal.update());
            
            game.particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                particle.vy += 0.1;
                
                if (particle.life <= 0) {
                    game.particles.splice(index, 1);
                }
            });
            
            if (game.player.hp <= 0) {
                gameOver();
            }
        }

        function drawGame() {
            ctx.fillStyle = 'rgba(0, 0, 10, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 2
            );
            gradient.addColorStop(0, 'rgba(20, 20, 60, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 20, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < 100; i++) {
                const x = (i * 37) % canvas.width;
                const y = (i * 23) % canvas.height;
                const size = Math.sin(Date.now() * 0.001 + i) * 2 + 2;
                ctx.fillStyle = 'rgba(100, 100, 255, 0.3)';
                ctx.fillRect(x, y, size, size);
            }
            
            game.crystalsList.forEach(crystal => crystal.draw());
            game.enemies.forEach(enemy => enemy.draw());
            game.player.draw();
            game.particles.forEach(particle => {
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fillStyle = particle.color;
                ctx.fill();
            });
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 200, 80);
            ctx.fillStyle = '#4ec0e9';
            ctx.font = '20px Arial';
            ctx.fillText(`得分: ${game.score}`, 20, 40);
            ctx.fillText(`水晶: ${game.crystals}/10`, 20, 70);
            
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(10, canvas.height - 40, 200, 20);
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(10, canvas.height - 40, game.player.hp * 2, 20);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, canvas.height - 40, 200, 20);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(game.player.hp))}`, 20, canvas.height - 25);
            
            if (game.crystals >= 10) {
                ctx.fillStyle = 'rgba(255, 204, 0, 0.3)';
                ctx.fillRect(canvas.width - 120, 10, 110, 50);
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 18px Arial';
                ctx.fillText('魔法就绪!', canvas.width - 110, 40);
                ctx.font = '14px Arial';
                ctx.fillText('点击/空格攻击', canvas.width - 110, 60);
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function gameLoop(timestamp) {
            const deltaTime = timestamp - game.lastTime || 0;
            game.lastTime = timestamp;
            
            updateGame(deltaTime);
            drawGame();
            
            requestAnimationFrame(gameLoop);
        }

        function handleKeyDown(e) {
            game.keys[e.code] = true;
            if (e.code === 'Space' && game.running) {
                game.player.attack();
                e.preventDefault();
            }
        }

        function handleKeyUp(e) {
            game.keys[e.code] = false;
        }

        function handleTouchStart(e) {
            game.touch.active = true;
            const rect = canvas.getBoundingClientRect();
            game.touch.x = e.touches[0].clientX - rect.left;
            game.touch.y = e.touches[0].clientY - rect.top;
            
            if (game.running && game.crystals >= 10) {
                const attackBtnX = canvas.width - 120;
                const attackBtnY = 10;
                const attackBtnWidth = 110;
                const attackBtnHeight = 50;
                
                if (game.touch.x >= attackBtnX && game.touch.x <= attackBtnX + attackBtnWidth &&
                    game.touch.y >= attackBtnY && game.touch.y <= attackBtnY + attackBtnHeight) {
                    game.player.attack();
                }
            }
        }

        function handleTouchMove(e) {
            if (game.touch.active) {
                const rect = canvas.getBoundingClientRect();
                game.touch.x = e.touches[0].clientX - rect.left;
                game.touch.y = e.touches[0].clientY - rect.top;
                e.preventDefault();
            }
        }

        function handleTouchEnd() {
            game.touch.active = false;
        }

        startBtn.addEventListener('click', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

        restartBtn.addEventListener('click', () => {
            initGame();
            requestAnimationFrame(gameLoop);
        });

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawGame();
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = '8cfa0f96-facd-4e06-a255-e2e7e17b63cb';
const gameTitle = '最终幻想：水晶守护者';
const authorToken = '854e9951-0f87-4d3e-b1cc-f6b8559fbe9c';
const authorName = 'MarsZhou';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

// 全屏模式状态
let isFullscreenMode = false;

// 切换全屏模式
function toggleFullscreenMode() {
  isFullscreenMode = !isFullscreenMode;
  
  if (isFullscreenMode) {
    // 进入全屏
    document.body.classList.add('fullscreen-mode');
    
    // 尝试请求浏览器全屏
    try {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && isFullscreenMode) {
    toggleFullscreenMode();
  }
});

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
    
    // 检查是否为作者，显示编辑按钮
    checkIsAuthorAndShowEditBtn();
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 切换留言板面板
function toggleCommentsPanel() {
  const panel = document.getElementById('game-comments-section');
  const sidebar = document.querySelector('.tiktok-sidebar');
  const authorInfo = document.getElementById('tiktok-author-info');
  const overlay = document.getElementById('comments-overlay');
  if (panel) {
    const isExpanding = !panel.classList.contains('expanded');
    panel.classList.toggle('expanded');
    // 评论面板展开时隐藏右侧按钮和作者信息（使用class覆盖!important）
    if (sidebar) {
      sidebar.classList.toggle('comments-open', isExpanding);
    }
    if (authorInfo) {
      authorInfo.classList.toggle('comments-open', isExpanding);
    }
    // 控制蒙版显示
    if (overlay) {
      overlay.classList.toggle('visible', isExpanding);
    }
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
});
</script>
