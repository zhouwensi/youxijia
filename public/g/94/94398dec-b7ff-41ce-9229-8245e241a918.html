            gap: 30px;

        #lightBtn {
            border-color: #4a6fff;

            background: linear-gradient(145deg, #3a4a8a, #2a3a7a);

        }

            justify-content: center;

            max-width: 600px;

            background: rgba(30, 30, 60, 0.7);

            border-radius: 8px;
            border-left: 4px solid #4a6fff;
            pointer-events: auto;
        }
        
        .stats {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 10, 40, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a3a7a;
            pointer-events: none;
            min-width: 200px;

        .stats h3 {
            color: #6a8eff;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        
        .stats div {
            margin-bottom: 5px;

        }
        
        .stats span {
            color: #4affff;
        }
        
        .game-info {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(10, 10, 40, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a3a7a;
            pointer-events: none;
            min-width: 200px;
        }
        
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        
        .joystick-area {
            width: 150px;
            height: 150px;
            background: rgba(30, 30, 60, 0.5);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        
        .joystick {
            width: 70px;
            height: 70px;
            background: rgba(74, 111, 255, 0.8);
            border-radius: 50%;
            position: absolute;
            top: 40px;
            left: 40px;
            transition: transform 0.1s;
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }
        
        .action-btn {
            width: 80px;
            height: 80px;
            background: rgba(157, 77, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 15px rgba(157, 77, 255, 0.5);
            touch-action: none;

        .skill-btn {
            background: rgba(255, 100, 100, 0.8);
            box-shadow: 0 0 15px rgba(255, 100, 100, 0.5);
        }
        
        .player {
            position: absolute;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        
        .light-player {
            background: radial-gradient(circle, #4a6fff, #2a3a9a);
            border: 2px solid #8ab4ff;
        }
        
        .dark-player {
            background: radial-gradient(circle, #9d4dff, #5a2a9a);
            border: 2px solid #d4a4ff;
        }
        
        .npc {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ffaa44, #cc7700);
            border: 2px solid #ffcc77;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        
        .projectile {
            position: absolute;
            border-radius: 50%;
        }
        
        .light-projectile {
            background: radial-gradient(circle, #8ab4ff, #4a6fff);
        }
        
        .dark-projectile {
            background: radial-gradient(circle, #d4a4ff, #9d4dff);
        }
        
        .health-bar {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: #4aff4a;
            transition: width 0.3s;
        }
        
        .damage-text {
            position: absolute;
            color: #ff5555;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0; }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.8rem; }
            p { font-size: 1rem; }
            .stats, .game-info {

            .joystick-area {
                width: 120px;
                height: 120px;

            .joystick {

                height: 60px;
                top: 30px;
                left: 30px;
            }
            .action-btn {
                width: 70px;
                height: 70px;
                font-size: 1rem;

        .npc {

<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiOverlay">
            <!-- 开始屏幕 -->
            <div id="startScreen" class="screen">
                <h1>神泣手游</h1>
                <p>体验经典的战场对决！选择你的阵营，与敌人战斗，占领据点获得胜利！</p>
                <div class="faction">
                    <button id="lightBtn" class="faction-btn">光明联盟</button>
                    <button id="darkBtn" class="faction-btn">黑暗军团</button>
                </div>
                <p class="highlight">选择阵营开始游戏</p>
                <div class="controls">
                    <div class="control-item">
                        <h3>PC控制</h3>
                        <p>移动: WASD 或 方向键</p>
                        <p>攻击: 空格键</p>
                        <p>技能: Q, E, R</p>
                    </div>
                    <div class="control-item">
                        <h3>移动端控制</h3>
                        <p>使用虚拟摇杆移动</p>
                        <p>点击按钮攻击和使用技能</p>
                    </div>
                </div>
            </div>
            
            <!-- 游戏界面 -->
            <div id="gameScreen" class="screen hidden">
                <div class="stats">
                    <h3>玩家状态</h3>
                    <div>生命: <span id="playerHealth">100</span>/100</div>
                    <div>魔法: <span id="playerMana">100</span>/100</div>
                    <div>等级: <span id="playerLevel">1</span></div>
                    <div>击杀: <span id="playerKills">0</span></div>
                    <div>阵营: <span id="playerFaction">光明联盟</span></div>
                </div>
                
                <div class="game-info">
                    <h3>战场信息</h3>
                    <div>光明据点: <span id="lightPoints">0</span></div>
                    <div>黑暗据点: <span id="darkPoints">0</span></div>
                    <div>剩余时间: <span id="gameTime">300</span>秒</div>
                    <div>游戏状态: <span id="gameStatus">进行中</span></div>
                </div>
                
                <!-- 移动端控制 -->
                <div class="mobile-controls">
                    <div class="joystick-area" id="joystickArea">
                        <div class="joystick" id="joystick"></div>

                        <div class="action-btn skill-btn" id="skillBtn">技</div>
                    </div>

            <!-- 结束屏幕 -->
            <div id="endScreen" class="screen hidden">
                <h2 id="endTitle">游戏结束</h2>
                <p id="endMessage">光明联盟获得了胜利！</p>
                <div class="stats" style="position: relative; top: 0; left: 0; margin: 20px 0;">
                    <h3>最终统计</h3>
                    <div>击杀数: <span id="finalKills">0</span></div>
                    <div>死亡数: <span id="finalDeaths">0</span></div>
                    <div>造成伤害: <span id="finalDamage">0</span></div>
                    <div>获得经验: <span id="finalExp">0</span></div>
                </div>
                <button id="restartBtn" class="btn">重新开始</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const CANVAS_WIDTH = 900;
            const CANVAS_HEIGHT = 600;
            const GAME_DURATION = 300; // 5分钟游戏时间
            const PLAYER_SIZE = 20;
            const NPC_SIZE = 16;
            const PROJECTILE_SIZE = 8;
            const LIGHT_COLOR = '#4a6fff';
            const DARK_COLOR = '#9d4dff';
            
            // 游戏变量
            let canvas, ctx;
            let gameState = 'start'; // start, playing, ended
            let playerFaction = 'light'; // light, dark
            let player = {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT / 2,
                size: PLAYER_SIZE,
                health: 100,
                maxHealth: 100,
                mana: 100,
                maxMana: 100,
                level: 1,
                kills: 0,
                deaths: 0,
                damageDealt: 0,
                speed: 3,
                attackCooldown: 0,
                skillCooldown: 0
            };
            
            let npcs = [];
            let projectiles = [];
            let lightPoints = 0;
            let darkPoints = 0;
            let gameTime = GAME_DURATION;
            let gameTimer;
            let keys = {};
            let touchJoystick = { active: false, x: 0, y: 0, dx: 0, dy: 0 };
            let damageTexts = [];
            
            // DOM元素
            const startScreen = document.getElementById('startScreen');
            const gameScreen = document.getElementById('gameScreen');
            const endScreen = document.getElementById('endScreen');
            const lightBtn = document.getElementById('lightBtn');
            const darkBtn = document.getElementById('darkBtn');
            const restartBtn = document.getElementById('restartBtn');
            const attackBtn = document.getElementById('attackBtn');
            const skillBtn = document.getElementById('skillBtn');
            const joystickArea = document.getElementById('joystickArea');
            const joystick = document.getElementById('joystick');
            
            // 初始化游戏
            function init() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                canvas.width = CANVAS_WIDTH;
                canvas.height = CANVAS_HEIGHT;
                
                // 事件监听器
                setupEventListeners();
                
                // 初始渲染
                render();
            }
            
            // 设置事件监听器
            function setupEventListeners() {
                // 阵营选择
                lightBtn.addEventListener('click', () => selectFaction('light'));
                darkBtn.addEventListener('click', () => selectFaction('dark'));
                restartBtn.addEventListener('click', restartGame);
                
                // 键盘控制
                window.addEventListener('keydown', (e) => {
                    keys[e.key.toLowerCase()] = true;
                    
                    // 攻击
                    if (e.key === ' ' && gameState === 'playing') {
                        attack();
                    }
                    
                    // 技能
                    if ((e.key === 'q' || e.key === 'e' || e.key === 'r') && gameState === 'playing') {
                        useSkill();
                    }
                });
                
                window.addEventListener('keyup', (e) => {
                    keys[e.key.toLowerCase()] = false;
                });
                
                // 移动端攻击按钮
                attackBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (gameState === 'playing') attack();
                });
                
                skillBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (gameState === 'playing') useSkill();
                });
                
                // 虚拟摇杆
                let joystickStartX = 0, joystickStartY = 0;
                
                joystickArea.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = joystickArea.getBoundingClientRect();
                    
                    joystickStartX = rect.left + rect.width / 2;
                    joystickStartY = rect.top + rect.height / 2;
                    
                    touchJoystick.active = true;
                    updateJoystick(touch.clientX, touch.clientY);
                });
                
                joystickArea.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (!touchJoystick.active) return;
                    
                    const touch = e.touches[0];
                    updateJoystick(touch.clientX, touch.clientY);
                });
                
                joystickArea.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    touchJoystick.active = false;
                    touchJoystick.dx = 0;
                    touchJoystick.dy = 0;
                    joystick.style.transform = 'translate(0, 0)';
                });
                
                // 防止页面滚动
                document.addEventListener('touchmove', (e) => {
                    if (e.target === canvas || e.target === joystickArea || 
                        e.target === attackBtn || e.target === skillBtn) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
            
            // 更新虚拟摇杆
            function updateJoystick(touchX, touchY) {
                const rect = joystickArea.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = touchX - centerX;
                let dy = touchY - centerY;
                
                // 限制摇杆移动范围
                const maxDistance = rect.width / 2 - joystick.offsetWidth / 2;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > maxDistance) {
                    dx = (dx / distance) * maxDistance;
                    dy = (dy / distance) * maxDistance;
                }
                
                // 更新摇杆位置
                joystick.style.transform = `translate(${dx}px, ${dy}px)`;
                
                // 标准化移动向量
                touchJoystick.dx = dx / maxDistance;
                touchJoystick.dy = dy / maxDistance;
            }
            
            // 选择阵营
            function selectFaction(faction) {
                playerFaction = faction;
                document.getElementById('playerFaction').textContent = 
                    faction === 'light' ? '光明联盟' : '黑暗军团';
                
                // 初始化玩家位置
                player.x = faction === 'light' ? 100 : CANVAS_WIDTH - 100;
                player.y = CANVAS_HEIGHT / 2;
                
                // 切换到游戏界面
                startScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                gameState = 'playing';
                
                // 初始化NPC
                initNPCs();
                
                // 开始游戏计时器
                gameTimer = setInterval(updateGameTime, 1000);
                
                // 开始游戏循环
                gameLoop();
            }
            
            // 初始化NPC
            function initNPCs() {
                npcs = [];
                
                // 添加光明NPC
                for (let i = 0; i < 5; i++) {
                    npcs.push({
                        x: 100 + Math.random() * 200,
                        y: 100 + Math.random() * (CANVAS_HEIGHT - 200),
                        size: NPC_SIZE,
                        health: 50,
                        maxHealth: 50,
                        faction: 'light',
                        speed: 1.5,
                        target: null,
                        attackCooldown: 0
                    });
                }
                
                // 添加黑暗NPC
                for (let i = 0; i < 5; i++) {
                    npcs.push({
                        x: CANVAS_WIDTH - 300 + Math.random() * 200,
                        y: 100 + Math.random() * (CANVAS_HEIGHT - 200),
                        size: NPC_SIZE,
                        health: 50,
                        maxHealth: 50,
                        faction: 'dark',
                        speed: 1.5,
                        target: null,
                        attackCooldown: 0
                    });
                }
                
                // 添加中立NPC（据点）
                for (let i = 0; i < 3; i++) {
                    npcs.push({
                        x: 300 + i * 150,
                        y: CANVAS_HEIGHT / 2,
                        size: NPC_SIZE * 1.5,
                        health: 100,
                        maxHealth: 100,
                        faction: 'neutral',
                        speed: 0,
                        target: null,
                        attackCooldown: 0,
                        isPoint: true
                    });
                }
            }
            
            // 游戏主循环
            function gameLoop() {
                if (gameState !== 'playing') return;
                
                update();
                render();
                
                requestAnimationFrame(gameLoop);
            }
            
            // 更新游戏状态
            function update() {
                // 更新玩家位置
                updatePlayer();
                
                // 更新NPC
                updateNPCs();
                
                // 更新投射物
                updateProjectiles();
                
                // 更新伤害文本
                updateDamageTexts();
                
                // 更新冷却时间
                if (player.attackCooldown > 0) player.attackCooldown--;
                if (player.skillCooldown > 0) player.skillCooldown--;
                
                // 更新UI
                updateUI();
                
                // 检查游戏结束条件
                checkGameEnd();
            }
            
            // 更新玩家位置
            function updatePlayer() {
                let dx = 0, dy = 0;
                
                // 键盘控制
                if (keys['w'] || keys['arrowup']) dy -= 1;
                if (keys['s'] || keys['arrowdown']) dy += 1;
                if (keys['a'] || keys['arrowleft']) dx -= 1;
                if (keys['d'] || keys['arrowright']) dx += 1;
                
                // 虚拟摇杆控制
                if (touchJoystick.active) {
                    dx += touchJoystick.dx;
                    dy += touchJoystick.dy;
                }
                
                // 标准化移动向量
                if (dx !== 0 || dy !== 0) {
                    const magnitude = Math.sqrt(dx * dx + dy * dy);
                    dx = (dx / magnitude) * player.speed;
                    dy = (dy / magnitude) * player.speed;
                }
                
                // 更新位置（边界检查）
                player.x = Math.max(player.size, Math.min(CANVAS_WIDTH - player.size, player.x + dx));
                player.y = Math.max(player.size, Math.min(CANVAS_HEIGHT - player.size, player.y + dy));
                
                // 自动恢复魔法
                if (player.mana < player.maxMana) {
                    player.mana = Math.min(player.maxMana, player.mana + 0.1);
                }
            }
            
            // 更新NPC
            function updateNPCs() {
                for (let i = npcs.length - 1; i >= 0; i--) {
                    const npc = npcs[i];
                    
                    // 更新冷却时间
                    if (npc.attackCooldown > 0) npc.attackCooldown--;
                    
                    // 如果是据点，跳过移动逻辑
                    if (npc.isPoint) {
                        // 检查玩家是否在据点内
                        const distance = Math.sqrt(
                            Math.pow(player.x - npc.x, 2) + 
                            Math.pow(player.y - npc.y, 2)
                        );
                        
                        if (distance < 50) {
                            // 玩家占领据点
                            if (npc.faction !== playerFaction) {
                                npc.faction = playerFaction;
                                if (playerFaction === 'light') {
                                    lightPoints++;
                                } else {
                                    darkPoints++;
                                }
                            }
                        }
                        continue;
                    }
                    
                    // 寻找目标
                    if (!npc.target || npc.target.health <= 0) {
                        // 寻找敌对目标
                        npc.target = findTarget(npc);
                    }
                    
                    // 如果有目标，移动向目标
                    if (npc.target) {
                        const target = npc.target;
                        const angle = Math.atan2(target.y - npc.y, target.x - npc.x);
                        
                        npc.x += Math.cos(angle) * npc.speed;
                        npc.y += Math.sin(angle) * npc.speed;
                        
                        // 检查是否在攻击范围内
                        const distance = Math.sqrt(
                            Math.pow(target.x - npc.x, 2) + 
                            Math.pow(target.y - npc.y, 2)
                        );
                        
                        if (distance < 30 && npc.attackCooldown === 0) {
                            // 攻击目标
                            const damage = 10;
                            target.health -= damage;
                            
                            // 添加伤害文本
                            damageTexts.push({
                                x: target.x,
                                y: target.y,
                                text: `-${damage}`,
                                lifetime: 60
                            });
                            
                            npc.attackCooldown = 60; // 1秒冷却
                            
                            // 如果目标是玩家
                            if (target === player) {
                                player.damageDealt += damage;
                            }
                            
                            // 如果目标死亡
                            if (target.health <= 0) {
                                if (target === player) {
                                    player.deaths++;
                                    player.health = player.maxHealth;
                                    player.x = playerFaction === 'light' ? 100 : CANVAS_WIDTH - 100;
                                    player.y = CANVAS_HEIGHT / 2;
                                } else {
                                    // NPC死亡
                                    const index = npcs.indexOf(target);
                                    if (index > -1) {
                                        npcs.splice(index, 1);
                                        
                                        // 玩家击杀
                                        if (npc.faction === playerFaction) {
                                            player.kills++;
                                            player.damageDealt += 50;
                                            
                                            // 经验值
                                            player.level = Math.floor(player.kills / 5) + 1;
                                        }
                                    }
                                }
                                npc.target = null;
                            }
                        }
                    }
                    
                    // 边界检查
                    npc.x = Math.max(npc.size, Math.min(CANVAS_WIDTH - npc.size, npc.x));
                    npc.y = Math.max(npc.size, Math.min(CANVAS_HEIGHT - npc.size, npc.y));
                }
            }
            
            // 寻找目标
            function findTarget(npc) {
                let closest = null;
                let closestDistance = Infinity;
                
                // 寻找玩家（如果是敌对阵营）
                if (npc.faction !== playerFaction) {
                    const distance = Math.sqrt(
                        Math.pow(player.x - npc.x, 2) + 
                        Math.pow(player.y - npc.y, 2)
                    );
                    
                    if (distance < 300) {
                        closest = player;
                        closestDistance = distance;
                    }
                }
                
                // 寻找敌对NPC
                for (let other of npcs) {
                    if (other === npc || other.faction === npc.faction || other.health <= 0) continue;
                    
                    const distance = Math.sqrt(
                        Math.pow(other.x - npc.x, 2) + 
                        Math.pow(other.y - npc.y, 2)
                    );
                    
                    if (distance < closestDistance) {
                        closest = other;
                        closestDistance = distance;
                    }
                }
                
                return closest;
            }
            
            // 更新投射物
            function updateProjectiles() {
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const proj = projectiles[i];
                    
                    // 移动投射物
                    proj.x += proj.dx;
                    proj.y += proj.dy;
                    
                    // 边界检查
                    if (proj.x < 0 || proj.x > CANVAS_WIDTH || 
                        proj.y < 0 || proj.y > CANVAS_HEIGHT) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                    
                    // 检查碰撞
                    for (let j = npcs.length - 1; j >= 0; j--) {
                        const npc = npcs[j];
                        
                        // 跳过友方单位
                        if (proj.faction === npc.faction) continue;
                        
                        const distance = Math.sqrt(
                            Math.pow(proj.x - npc.x, 2) + 
                            Math.pow(proj.y - npc.y, 2)
                        );
                        
                        if (distance < proj.size + npc.size) {
                            // 命中目标
                            const damage = proj.damage;
                            npc.health -= damage;
                            
                            // 添加伤害文本
                            damageTexts.push({
                                x: npc.x,
                                y: npc.y,
                                text: `-${damage}`,
                                lifetime: 60
                            });
                            
                            // 玩家造成的伤害
                            if (proj.faction === playerFaction) {
                                player.damageDealt += damage;
                            }
                            
                            // 如果目标死亡
                            if (npc.health <= 0 && !npc.isPoint) {
                                npcs.splice(j, 1);
                                
                                // 玩家击杀
                                if (proj.faction === playerFaction) {
                                    player.kills++;
                                    player.damageDealt += 50;
                                    
                                    // 经验值
                                    player.level = Math.floor(player.kills / 5) + 1;
                                }
                            }
                            
                            // 移除投射物
                            projectiles.splice(i, 1);
                            break;
                        }
                    }
                }
            }
            
            // 更新伤害文本
            function updateDamageTexts() {
                for (let i = damageTexts.length - 1; i >= 0; i--) {
                    const text = damageTexts[i];
                    text.lifetime--;
                    text.y -= 0.5;
                    
                    if (text.lifetime <= 0) {
                        damageTexts.splice(i, 1);
                    }
                }
            }
            
            // 攻击
            function attack() {
