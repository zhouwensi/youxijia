<body>
  <!-- 原游戏body内容 -->
  
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1>⚔️ 流星蝴蝶剑 ⚔️</h1>
        <p class="instructions">控制剑客躲避流星，击败蝴蝶敌人<br>WASD/方向键移动，空格/点击攻击<br>触屏可使用下方按钮</p>
        <button id="startBtn">开始游戏</button>
    </div>
    
    <div id="endScreen" class="screen hidden">
        <h2>游戏结束</h2>
        <div class="score">最终得分: <span id="finalScore">0</span></div>
        <button id="restartBtn">重新开始</button>
    </div>
    
    <div class="controls">
        <div class="control-btn" id="leftBtn">←</div>
        <div class="control-btn" id="rightBtn">→</div>
        <div class="control-btn" id="upBtn">↑</div>
        <div class="control-btn" id="downBtn">↓</div>
        <div class="control-btn" id="attackBtn">⚔️</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScore = document.getElementById('finalScore');
        
        const controlBtns = {
            left: document.getElementById('leftBtn'),
            right: document.getElementById('rightBtn'),
            up: document.getElementById('upBtn'),
            down: document.getElementById('downBtn'),
            attack: document.getElementById('attackBtn')
        };
        
        let game = {
            running: false,
            score: 0,
            player: {
                x: 400,
                y: 300,
                width: 40,
                height: 60,
                speed: 5,
                health: 100,
                attacking: false,
                attackCooldown: 0,
                attackRange: 80
            },
            meteors: [],
            butterflies: [],
            particles: [],
            keys: {},
            lastTime: 0,
            spawnTimer: 0,
            butterflySpawnTimer: 0
        };
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        function initGame() {
            game = {
                running: true,
                score: 0,
                player: {
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    width: 40,
                    height: 60,
                    speed: 5,
                    health: 100,
                    attacking: false,
                    attackCooldown: 0,
                    attackRange: 80
                },
                meteors: [],
                butterflies: [],
                particles: [],
                keys: {},
                lastTime: 0,
                spawnTimer: 0,
                butterflySpawnTimer: 0
            };
            
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
        }
        
        function drawPlayer() {
            ctx.save();
            ctx.translate(game.player.x, game.player.y);
            
            ctx.fillStyle = game.player.attacking ? '#ffaa00' : '#4a6fdd';
            ctx.fillRect(-game.player.width/2, -game.player.height/2, game.player.width, game.player.height);
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-game.player.width/4, -game.player.height/3, game.player.width/2, game.player.height/6);
            
            if (game.player.attacking) {
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(game.player.attackRange, 0, 10, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(game.player.width/2, 0);
                ctx.lineTo(game.player.attackRange, 0);
                ctx.stroke();
            }
            
            ctx.restore();
            
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(game.player.x - 30, game.player.y - 50, 60, 8);
            ctx.fillStyle = '#33ff33';
            ctx.fillRect(game.player.x - 30, game.player.y - 50, 60 * (game.player.health / 100), 8);
        }
        
        function drawMeteors() {
            game.meteors.forEach(meteor => {
                ctx.save();
                ctx.translate(meteor.x, meteor.y);
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, meteor.size);
                gradient.addColorStop(0, '#ffaa00');
                gradient.addColorStop(1, '#ff5500');
                ctx.fillStyle = gradient;
                
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (i * Math.PI * 2) / 8;
                    const radius = meteor.size * (i % 2 === 0 ? 1 : 0.7);
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        function drawButterflies() {
            game.butterflies.forEach(butterfly => {
                ctx.save();
                ctx.translate(butterfly.x, butterfly.y);
                
                const wingOffset = Math.sin(Date.now() * 0.01 + butterfly.id) * 10;
                
                ctx.fillStyle = '#ff66cc';
                ctx.beginPath();
                ctx.ellipse(-15, wingOffset, 20, 10, 0, 0, Math.PI * 2);
                ctx.ellipse(15, -wingOffset, 20, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#cc44aa';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(butterfly.x - 20, butterfly.y - 30, 40, 5);
                ctx.fillStyle = '#33ff33';
                ctx.fillRect(butterfly.x - 20, butterfly.y - 30, 40 * (butterfly.health / 50), 5);
            });
        }
        
        function drawParticles() {
            game.particles.forEach((particle, index) => {
                ctx.globalAlpha = particle.life / 100;
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                ctx.globalAlpha = 1;
            });
        }
        
        function drawHUD() {
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Microsoft YaHei';
            ctx.fillText(`得分: ${game.score}`, 20, 40);
            ctx.fillText(`生命: ${Math.max(0, game.player.health)}`, 20, 70);
        }
        
        function updatePlayer(deltaTime) {
            if (game.keys['ArrowLeft'] || game.keys['a'] || game.keys['A'] || controlBtns.left.pressed) {
                game.player.x -= game.player.speed;
            }
            if (game.keys['ArrowRight'] || game.keys['d'] || game.keys['D'] || controlBtns.right.pressed) {
                game.player.x += game.player.speed;
            }
            if (game.keys['ArrowUp'] || game.keys['w'] || game.keys['W'] || controlBtns.up.pressed) {
                game.player.y -= game.player.speed;
            }
            if (game.keys['ArrowDown'] || game.keys['s'] || game.keys['S'] || controlBtns.down.pressed) {
                game.player.y += game.player.speed;
            }
            
            game.player.x = Math.max(game.player.width/2, Math.min(canvas.width - game.player.width/2, game.player.x));
            game.player.y = Math.max(game.player.height/2, Math.min(canvas.height - game.player.height/2, game.player.y));
            
            if (game.player.attackCooldown > 0) {
                game.player.attackCooldown -= deltaTime;
            }
            
            if ((game.keys[' '] || controlBtns.attack.pressed) && game.player.attackCooldown <= 0) {
                game.player.attacking = true;
                game.player.attackCooldown = 300;
                
                game.butterflies.forEach((butterfly, index) => {
                    const dx = butterfly.x - game.player.x;
                    const dy = butterfly.y - game.player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < game.player.attackRange) {
                        butterfly.health -= 20;
                        
                        for (let i = 0; i < 10; i++) {
                            game.particles.push({
                                x: butterfly.x,
                                y: butterfly.y,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                color: '#ff66cc',
                                size: Math.random() * 4 + 2,
                                life: 100
                            });
                        }
                        
                        if (butterfly.health <= 0) {
                            game.butterflies.splice(index, 1);
                            game.score += 50;
                            
                            for (let i = 0; i < 20; i++) {
                                game.particles.push({
                                    x: butterfly.x,
                                    y: butterfly.y,
                                    vx: (Math.random() - 0.5) * 15,
                                    vy: (Math.random() - 0.5) * 15,
                                    color: '#ff66cc',
                                    size: Math.random() * 6 + 3,
                                    life: 100
                                });
                            }
                        }
                    }
                });
                
                setTimeout(() => {
                    game.player.attacking = false;
                }, 200);
            }
        }
        
        function updateMeteors(deltaTime) {
            game.meteors.forEach((meteor, index) => {
                meteor.x += meteor.vx * deltaTime * 0.05;
                meteor.y += meteor.vy * deltaTime * 0.05;
                
                const dx = meteor.x - game.player.x;
                const dy = meteor.y - game.player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < meteor.size + game.player.width/2) {
                    game.player.health -= 10;
                    game.meteors.splice(index, 1);
                    
                    for (let i = 0; i < 15; i++) {
                        game.particles.push({
                            x: meteor.x,
                            y: meteor.y,
                            vx: (Math.random() - 0.5) * 12,
                            vy: (Math.random() - 0.5) * 12,
                            color: '#ffaa00',
                            size: Math.random() * 5 + 2,
                            life: 100
                        });
                    }
                }
                
                if (meteor.x < -50 || meteor.x > canvas.width + 50 || 
                    meteor.y < -50 || meteor.y > canvas.height + 50) {
                    game.meteors.splice(index, 1);
                }
            });
            
            game.spawnTimer += deltaTime;
            if (game.spawnTimer > 1000) {
                game.spawnTimer = 0;
                
                const side = Math.floor(Math.random() * 4);
                let x, y, vx, vy;
                
                switch(side) {
                    case 0: 
                        x = Math.random() * canvas.width;
                        y = -50;
                        vx = (Math.random() - 0.5) * 3;
                        vy = Math.random() * 2 + 1;
                        break;
                    case 1:
                        x = canvas.width + 50;
                        y = Math.random() * canvas.height;
                        vx = -Math.random() * 2 - 1;
                        vy = (Math.random() - 0.5) * 3;
                        break;
                    case 2:
                        x = Math.random() * canvas.width;
                        y = canvas.height + 50;
                        vx = (Math.random() - 0.5) * 3;
                        vy = -Math.random() * 2 - 1;
                        break;
                    case 3:
                        x = -50;
                        y = Math.random() * canvas.height;
                        vx = Math.random() * 2 + 1;
                        vy = (Math.random() - 0.5) * 3;
                        break;
                }
                
                game.meteors.push({
                    x, y, vx, vy,
                    size: Math.random() * 20 + 15
                });
            }
        }
        
        function updateButterflies(deltaTime) {
            game.butterflies.forEach((butterfly, index) => {
                const dx = game.player.x - butterfly.x;
                const dy = game.player.y - butterfly.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 100) {
                    butterfly.x += (dx / distance) * butterfly.speed * deltaTime * 0.05;
                    butterfly.y += (dy / distance) * butterfly.speed * deltaTime * 0.05;
                }
                
                const playerDx = butterfly.x - game.player.x;
                const playerDy = butterfly.y - game.player.y;
                const playerDistance = Math.sqrt(playerDx * playerDx + playerDy * playerDy);
                
                if (playerDistance < butterfly.size + game.player.width/2 && !game.player.attacking) {
                    game.player.health -= 0.5;
                }
            });
            
            game.butterflySpawnTimer += deltaTime;
            if (game.butterflySpawnTimer > 3000) {
                game.butterflySpawnTimer = 0;
                
                if (game.butterflies.length < 5) {
                    game.butterflies.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        health: 50,
                        size: 25,
                        speed: Math.random() * 2 + 1,
                        id: Math.random()
                    });
                }
            }
        }
        
        function updateParticles(deltaTime) {
            game.particles.forEach((particle, index) => {
                particle.x += particle.vx * deltaTime * 0.05;
                particle.y += particle.vy * deltaTime * 0.05;
                particle.life -= deltaTime * 0.1;
                
                if (particle.life <= 0) {
                    game.particles.splice(index, 1);
                }
            });
        }
        
        function checkGameOver() {
            if (game.player.health <= 0) {
                game.running = false;
                finalScore.textContent = game.score;
                endScreen.classList.remove('hidden');
            }
        }
        
        function gameLoop(timestamp) {
            if (!game.lastTime) game.lastTime = timestamp;
            const deltaTime = timestamp - game.lastTime;
            game.lastTime = timestamp;
            
            if (game.running) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                updatePlayer(deltaTime);
                updateMeteors(deltaTime);
                updateButterflies(deltaTime);
                updateParticles(deltaTime);
                
                drawMeteors();
                drawButterflies();
                drawParticles();
                drawPlayer();
                drawHUD();
                
                checkGameOver();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function setupControls() {
            Object.values(controlBtns).forEach(btn => {
                btn.pressed = false;
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.pressed = true;
                });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.pressed = false;
                });
                
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.pressed = false;
                });
                
                btn.addEventListener('mousedown', () => {
                    btn.pressed = true;
                });
                
                btn.addEventListener('mouseup', () => {
                    btn.pressed = false;
                });
                
                btn.addEventListener('mouseleave', () => {
                    btn.pressed = false;
                });
            });
        }
        
        window.addEventListener('keydown', (e) => {
            game.keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            game.keys[e.key] = false;
        });
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (game.running) {
                game.player.x = Math.max(game.player.width/2, Math.min(canvas.width - game.player.width/2, game.player.x));
                game.player.y = Math.max(game.player.height/2, Math.min(canvas.height - game.player.height/2, game.player.y));
            }
        });
        
        startBtn.addEventListener('click', () => {
            initGame();
        });
        
        restartBtn.addEventListener('click', () => {
            initGame();
        });
        
        resizeCanvas();
        setupControls();
        requestAnimationFrame(gameLoop);
    </script>

  }

}

function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {

          document.getElementById('stat-fav-btn').classList.add('favorited');

      })
      .catch(() => {});

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚

        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });

function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
