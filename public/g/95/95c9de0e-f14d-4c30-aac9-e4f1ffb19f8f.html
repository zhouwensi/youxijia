  <!-- 原游戏body内容 -->
  
    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="score">0</div>

        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="startScreen" class="screen">
            <h1>打砖块弹球</h1>
            <div class="controls-info">
                <p>使用 <span class="highlight">← → 方向键</span> 或 <span class="highlight">A/D 键</span> 移动挡板</p>
                <p>在手机上可以使用下方的虚拟按钮控制</p>

            </div>

        </div>
        
        <div id="levelCompleteScreen" class="screen hidden">

            <p>恭喜你通过了第 <span class="highlight" id="completedLevel">1</span> 关</p>

    <div class="instructions">
        <p>游戏提示: 击中砖块不同位置会影响反弹角度，连续击中有额外分数奖励</p>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏变量
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const levelCompleteScreen = document.getElementById('levelCompleteScreen');
            const startButton = document.getElementById('startButton');
            const restartButton = document.getElementById('restartButton');
            const nextLevelButton = document.getElementById('nextLevelButton');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 统计元素
            const scoreElement = document.getElementById('score');
            const livesElement = document.getElementById('lives');
            const levelElement = document.getElementById('level');
            const bricksElement = document.getElementById('bricks');
            const finalScoreElement = document.getElementById('finalScore');
            const finalLevelElement = document.getElementById('finalLevel');
            const completedLevelElement = document.getElementById('completedLevel');
            
            // 游戏状态
            let gameState = 'start'; // start, playing, gameOver, levelComplete
            let score = 0;
            let lives = 3;
            let level = 1;
            let bricksRemaining = 0;
            let paddleWidth = 100;
            let paddleHeight = 15;
            let paddleX;
            let ballRadius = 10;
            let ballX, ballY;
            let ballSpeedX = 5;
            let ballSpeedY = -5;
            let rightPressed = false;
            let leftPressed = false;
            let bricks = [];
            let brickRowCount = 5;
            let brickColumnCount = 8;
            let brickWidth = 70;
            let brickHeight = 20;
            let brickPadding = 10;
            let brickOffsetTop = 60;
            let brickOffsetLeft = 35;
            let combo = 0;
            let lastHitTime = 0;
            
            // 设置画布尺寸
            function resizeCanvas() {
                const container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientWidth * 0.75; // 4:3 比例
                
                // 重新计算砖块布局
                brickWidth = (canvas.width - brickOffsetLeft * 2 - brickPadding * (brickColumnCount - 1)) / brickColumnCount;
                
                // 重置挡板位置
                paddleX = (canvas.width - paddleWidth) / 2;
                
                // 重置球位置
                if (gameState === 'playing') {
                    ballX = canvas.width / 2;
                    ballY = canvas.height - 50;
                }
                
                // 重新生成砖块
                if (gameState === 'playing' || gameState === 'levelComplete') {
                    initBricks();
                }
            }
            
            // 初始化砖块
            function initBricks() {
                bricks = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[c] = [];
                    for (let r = 0; r < brickRowCount; r++) {
                        // 根据行数设置不同颜色
                        let color;
                        if (r === 0) color = '#ff595e';
                        else if (r === 1) color = '#ffca3a';
                        else if (r === 2) color = '#8ac926';
                        else if (r === 3) color = '#1982c4';
                        else color = '#6a4c93';
                        
                        // 根据关卡增加砖块生命值
                        let health = level;
                        
                        bricks[c][r] = { 
                            x: 0, 
                            y: 0, 
                            status: health, 
                            color: color,
                            originalColor: color
                        };
                    }
                }
                bricksRemaining = brickRowCount * brickColumnCount * level;
                bricksElement.textContent = bricksRemaining;
            }
            
            // 绘制砖块
            function drawBricks() {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        if (bricks[c][r].status > 0) {
                            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                            bricks[c][r].x = brickX;
                            bricks[c][r].y = brickY;
                            
                            // 根据生命值调整颜色亮度
                            let color = bricks[c][r].color;
                            if (bricks[c][r].status < level) {
                                // 降低亮度
                                const rgb = hexToRgb(color);
                                const factor = 0.5 + (bricks[c][r].status / level) * 0.5;
                                color = `rgb(${Math.round(rgb.r * factor)}, ${Math.round(rgb.g * factor)}, ${Math.round(rgb.b * factor)})`;
                            }
                            
                            ctx.beginPath();
                            ctx.rect(brickX, brickY, brickWidth, brickHeight);
                            ctx.fillStyle = color;
                            ctx.fill();
                            ctx.closePath();
                            
                            // 绘制砖块边框
                            ctx.beginPath();
                            ctx.rect(brickX, brickY, brickWidth, brickHeight);
                            ctx.lineWidth = 2;
                            ctx.strokeStyle = '#333';
                            ctx.stroke();
                            ctx.closePath();
                        }
                    }
                }
            }
            
            // 将十六进制颜色转换为RGB
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 0, g: 0, b: 0 };
            }
            
            // 绘制挡板
            function drawPaddle() {
                ctx.beginPath();
                ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
                ctx.fillStyle = '#4361ee';
                ctx.fill();
                ctx.closePath();
                
                // 添加挡板光泽效果
                ctx.beginPath();
                ctx.rect(paddleX + 5, canvas.height - paddleHeight - 10, paddleWidth - 10, 5);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();
                ctx.closePath();
            }
            
            // 绘制球
            function drawBall() {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#f72585';
                ctx.fill();
                ctx.closePath();
                
                // 添加球的高光效果
                ctx.beginPath();
                ctx.arc(ballX - ballRadius/3, ballY - ballRadius/3, ballRadius/3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                ctx.closePath();
            }
            
            // 绘制游戏元素
            function draw() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景网格
                drawBackground();
                
                // 绘制游戏元素
                drawBricks();
                drawPaddle();
                drawBall();
                
                // 绘制连击提示
                if (combo > 1) {
                    ctx.font = 'bold 24px Arial';
                    ctx.fillStyle = '#ffca3a';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${combo} 连击!`, canvas.width / 2, 40);
                }
            }
            
            // 绘制背景网格
            function drawBackground() {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                
                // 垂直线
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 水平线
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 碰撞检测
            function collisionDetection() {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const brick = bricks[c][r];
                        if (brick.status > 0) {
                            if (
                                ballX > brick.x && 
                                ballX < brick.x + brickWidth && 
                                ballY > brick.y && 
                                ballY < brick.y + brickHeight
                            ) {
                                // 击中砖块
                                ballSpeedY = -ballSpeedY;
                                brick.status--;
                                
                                // 计算连击
                                const currentTime = Date.now();
                                if (currentTime - lastHitTime < 500) {
                                    combo++;
                                } else {
                                    combo = 1;
                                }
                                lastHitTime = currentTime;
                                
                                // 更新分数
                                let points = 10 * combo;
                                if (brick.status === 0) {
                                    points *= 2; // 摧毁砖块额外奖励
                                    bricksRemaining--;
                                    bricksElement.textContent = bricksRemaining;
                                }
                                score += points;
                                scoreElement.textContent = score;
                                
                                // 检查是否所有砖块都被摧毁
                                if (bricksRemaining <= 0) {
                                    levelComplete();
                                }
                                
                                return;
                            }
                        }
                    }
                }
            }
            
            // 移动球
            function moveBall() {
                ballX += ballSpeedX;
                ballY += ballSpeedY;
                
                // 左右墙碰撞
                if (ballX + ballRadius > canvas.width || ballX - ballRadius < 0) {
                    ballSpeedX = -ballSpeedX;
                }
                
                // 上墙碰撞
                if (ballY - ballRadius < 0) {
                    ballSpeedY = -ballSpeedY;
                }
                
                // 挡板碰撞
                if (
                    ballY + ballRadius > canvas.height - paddleHeight - 10 &&
                    ballY - ballRadius < canvas.height - 10 &&
                    ballX > paddleX &&
                    ballX < paddleX + paddleWidth
                ) {
                    // 根据击中挡板的位置改变反弹角度
                    const hitPosition = (ballX - paddleX) / paddleWidth;
                    ballSpeedX = 8 * (hitPosition - 0.5); // -4 到 4
                    ballSpeedY = -Math.abs(ballSpeedY); // 确保向上反弹
                    
                    // 增加一点速度
                    const speedIncrease = 1 + (level * 0.05);
                    ballSpeedX *= speedIncrease;
                    ballSpeedY *= speedIncrease;
                    
                    // 重置连击
                    combo = 0;
                }
                
                // 球掉落
                if (ballY + ballRadius > canvas.height) {
                    lives--;
                    livesElement.textContent = lives;
                    
                    if (lives <= 0) {
                        gameOver();
                    } else {
                        resetBall();
                    }
                }
            }
            
            // 移动挡板
            function movePaddle() {
                const speed = 10;
                
                if (rightPressed && paddleX < canvas.width - paddleWidth) {
                    paddleX += speed;
                }
                
                if (leftPressed && paddleX > 0) {
                    paddleX -= speed;
                }
            }
            
            // 重置球位置
            function resetBall() {
                ballX = canvas.width / 2;
                ballY = canvas.height - 50;
                ballSpeedX = 5 * (Math.random() > 0.5 ? 1 : -1);
                ballSpeedY = -5;
                combo = 0;
            }
            
            // 游戏主循环
            function gameLoop() {
                if (gameState === 'playing') {
                    movePaddle();
                    moveBall();
                    collisionDetection();
                    draw();
                }
                
                requestAnimationFrame(gameLoop);
            }
            
            // 开始游戏
            function startGame() {
                gameState = 'playing';
                score = 0;
                lives = 3;
                level = 1;
                paddleWidth = 100;
                
                scoreElement.textContent = score;
                livesElement.textContent = lives;
                levelElement.textContent = level;
                
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                levelCompleteScreen.classList.add('hidden');
                
                initBricks();
                resetBall();
                paddleX = (canvas.width - paddleWidth) / 2;
            }
            
            // 关卡完成
            function levelComplete() {
                gameState = 'levelComplete';
                completedLevelElement.textContent = level;
                levelCompleteScreen.classList.remove('hidden');
            }
            
            // 进入下一关
            function nextLevel() {
                level++;
                levelElement.textContent = level;
                
                // 增加难度
                paddleWidth = Math.max(60, paddleWidth - 10); // 挡板变窄
                ballSpeedX *= 1.1;
                ballSpeedY *= 1.1;
                
                gameState = 'playing';
                levelCompleteScreen.classList.add('hidden');
                
                initBricks();
                resetBall();
                paddleX = (canvas.width - paddleWidth) / 2;
            }
            
            // 游戏结束
            function gameOver() {
                gameState = 'gameOver';
                finalScoreElement.textContent = score;
                finalLevelElement.textContent = level - 1;
                gameOverScreen.classList.remove('hidden');
            }
            
            // 重新开始游戏
            function restartGame() {
                startGame();
            }
            
            // 事件监听器
            function initEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', keyDownHandler);
                document.addEventListener('keyup', keyUpHandler);
                
                // 按钮控制
                startButton.addEventListener('click', startGame);
                restartButton.addEventListener('click', restartGame);
                nextLevelButton.addEventListener('click', nextLevel);
                
                // 空格键开始游戏
                document.addEventListener('keydown', function(event) {
                    if (event.code === 'Space') {
                        if (gameState === 'start') {
                            startGame();
                        } else if (gameState === 'gameOver') {
                            restartGame();
                        } else if (gameState === 'levelComplete') {
                            nextLevel();
                        }
                    }
                });
                
                // 移动端触摸控制
                let touchStartX = 0;
                let touchMoveX = 0;
                
                canvas.addEventListener('touchstart', function(event) {
                    event.preventDefault();
                    touchStartX = event.touches[0].clientX;
                    
                    // 点击屏幕开始游戏
                    if (gameState === 'start') {
                        startGame();
                    } else if (gameState === 'gameOver') {
                        restartGame();
                    } else if (gameState === 'levelComplete') {
                        nextLevel();
                    }
                });
                
                canvas.addEventListener('touchmove', function(event) {
                    event.preventDefault();
                    touchMoveX = event.touches[0].clientX;
                    const touchDiff = touchMoveX - touchStartX;
                    
                    // 根据触摸移动控制挡板
                    if (touchDiff > 10) {
                        rightPressed = true;
                        leftPressed = false;
                    } else if (touchDiff < -10) {
                        leftPressed = true;
                        rightPressed = false;
                    }
                });
                
                canvas.addEventListener('touchend', function(event) {
                    event.preventDefault();
                    leftPressed = false;
                    rightPressed = false;
                });
                
                // 虚拟按钮控制
                leftBtn.addEventListener('touchstart', function(event) {
                    event.preventDefault();
                    leftPressed = true;
                });
                
                leftBtn.addEventListener('touchend', function(event) {
                    event.preventDefault();
                    leftPressed = false;
                });
                
                rightBtn.addEventListener('touchstart', function(event) {
                    event.preventDefault();
                    rightPressed = true;
                });
                
                rightBtn.addEventListener('touchend', function(event) {
                    event.preventDefault();
                    rightPressed = false;
                });
                
                // 鼠标控制（桌面端）
                canvas.addEventListener('mousemove', function(event) {
                    event.preventDefault();
                    const relativeX = event.clientX - canvas.getBoundingClientRect().left;
                    
                    if (relativeX > 0 && relativeX < canvas.width) {
                        paddleX = relativeX - paddleWidth / 2;
                        
                        // 限制挡板不超出画布
                        if (paddleX < 0) {
                            paddleX = 0;
                        }
                        
                        if (paddleX + paddleWidth > canvas.width) {
                            paddleX = canvas.width - paddleWidth;
                        }
                    }
                });
                
                // 窗口大小变化时调整画布
                window.addEventListener('resize', resizeCanvas);
            }
            
            // 键盘按下处理
            function keyDownHandler(event) {
                if (event.key === 'Right' || event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                    rightPressed = true;
                } else if (event.key === 'Left' || event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
                    leftPressed = true;
                }
            }
            
            // 键盘释放处理
            function keyUpHandler(event) {
                if (event.key === 'Right' || event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                    rightPressed = false;
                } else if (event.key === 'Left' || event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
                    leftPressed = false;
                }
            }
            
            // 初始化游戏
            function init() {
                resizeCanvas();
                initEventListeners();
                gameLoop();
                
                // 初始绘制
                draw();
            }
            
            // 启动游戏
            init();
        });
    </script>
