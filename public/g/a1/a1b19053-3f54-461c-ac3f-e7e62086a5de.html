    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #87CEEB;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        #gameCanvas {
            display: block;
            background-color: #8FBC8F;
            border: 4px solid #654321;

        #ui {
            position: absolute;

            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }

        #controls {
            display: flex;

        .control-btn {
            padding: 12px 24px;

<body>
  <!-- 原游戏body内容 -->
  
    <h1 style="color: #2E7D32; margin-bottom: 20px; text-align: center;">🌱 像素农场物语 🌻</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>金币: <span id="gold">100</span></div>
            <div>季节: <span id="season">春</span></div>
            <div>时间: <span id="time">08:00</span></div>
            <div>工具: <span id="tool">锄头</span></div>
        </div>
        <div id="inventory">
            背包: <span id="inventoryItems">种子x5, 胡萝卜x0, 小麦x0</span>
        </div>
    </div>

    <div id="controls">
        <button class="control-btn" onclick="changeTool('hoe')">锄头</button>
        <button class="control-btn" onclick="changeTool('water')">水壶</button>
        <button class="control-btn" onclick="changeTool('seed')">种子</button>
        <button class="control-btn" onclick="changeTool('harvest')">收割</button>
        <button class="control-btn" onclick="sellCrops()">出售作物</button>
        <button class="control-btn" onclick="buySeeds()">购买种子</button>
    </div>

    <div id="instructions">
        <p><strong>游戏说明：</strong>使用鼠标/触摸点击地块进行耕作、种植、浇水和收割。按数字键1-4切换工具。每天时间会自动流逝，作物需要及时浇水才能生长。收获的作物可以出售换取金币，用来购买更多种子。</p>
        <p><strong>控制方式：</strong> 1=锄头, 2=水壶, 3=种子, 4=收割 | 鼠标点击/触摸 = 使用工具</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布大小
        canvas.width = 800;
        canvas.height = 500;
        
        // 游戏状态
        const gameState = {
            gold: 100,
            day: 1,
            season: '春',
            time: 480, // 以分钟计，8:00 = 480
            selectedTool: 'hoe',
            inventory: {
                seeds: 5,
                carrot: 0,
                wheat: 0
            },
            farmSize: 8,
            tileSize: 50
        };
        
        // 农场地块数据
        let farmTiles = [];
        
        // 作物类型
        const crops = {
            carrot: {
                name: '胡萝卜',
                growthTime: 3,
                value: 20,
                color: '#FF8C00'
            },
            wheat: {
                name: '小麦',
                growthTime: 5,
                value: 35,
                color: '#DAA520'
            }
        };
        
        // 初始化农场
        function initFarm() {
            farmTiles = [];
            const offsetX = (canvas.width - gameState.farmSize * gameState.tileSize) / 2;
            const offsetY = (canvas.height - gameState.farmSize * gameState.tileSize) / 2;
            
            for (let y = 0; y < gameState.farmSize; y++) {
                for (let x = 0; x < gameState.farmSize; x++) {
                    farmTiles.push({
                        x: offsetX + x * gameState.tileSize,
                        y: offsetY + y * gameState.tileSize,
                        width: gameState.tileSize,
                        height: gameState.tileSize,
                        state: 'soil', // soil, tilled, planted, growing, ready
                        cropType: null,
                        growthStage: 0,
                        watered: false,
                        lastWatered: 0
                    });
                }
            }
        }
        
        // 绘制游戏
        function draw() {
            // 绘制天空
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制云朵
            drawClouds();
            
            // 绘制农场背景
            ctx.fillStyle = '#8FBC8F';
            const farmWidth = gameState.farmSize * gameState.tileSize;
            const farmHeight = gameState.farmSize * gameState.tileSize;
            const farmX = (canvas.width - farmWidth) / 2;
            const farmY = (canvas.height - farmHeight) / 2;
            ctx.fillRect(farmX, farmY, farmWidth, farmHeight);
            
            // 绘制地块
            farmTiles.forEach(tile => {
                // 绘制地块边框
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 1;
                ctx.strokeRect(tile.x, tile.y, tile.width, tile.height);
                
                // 根据地块状态绘制
                switch(tile.state) {
                    case 'soil':
                        ctx.fillStyle = '#8B4513';
                        break;
                    case 'tilled':
                        ctx.fillStyle = '#A0522D';
                        break;
                    case 'planted':
                    case 'growing':
                    case 'ready':
                        ctx.fillStyle = '#A0522D';
                        break;
                }
                
                ctx.fillRect(tile.x + 1, tile.y + 1, tile.width - 2, tile.height - 2);
                
                // 如果浇水了，显示水渍
                if (tile.watered) {
                    ctx.fillStyle = 'rgba(64, 164, 223, 0.3)';
                    ctx.fillRect(tile.x + 1, tile.y + 1, tile.width - 2, tile.height - 2);
                }
                
                // 绘制作物
                if (tile.cropType && tile.state !== 'soil' && tile.state !== 'tilled') {
                    const crop = crops[tile.cropType];
                    const growthPercent = tile.growthStage / crop.growthTime;
                    
                    if (tile.state === 'ready') {
                        // 成熟的作物
                        ctx.fillStyle = crop.color;
                        ctx.beginPath();
                        ctx.arc(
                            tile.x + tile.width / 2,
                            tile.y + tile.height / 2,
                            tile.width / 3,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                        
                        // 绘制叶子
                        ctx.fillStyle = '#228B22';
                        ctx.beginPath();
                        ctx.ellipse(
                            tile.x + tile.width / 3,
                            tile.y + tile.height / 3,
                            tile.width / 6,
                            tile.width / 8,
                            0,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.ellipse(
                            tile.x + tile.width * 2/3,
                            tile.y + tile.height / 3,
                            tile.width / 6,
                            tile.width / 8,
                            0,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                    } else if (tile.state === 'growing' || tile.state === 'planted') {
                        // 生长中的作物
                        const height = 10 + growthPercent * 20;
                        ctx.fillStyle = crop.color;
                        ctx.fillRect(
                            tile.x + tile.width / 2 - 3,
                            tile.y + tile.height - height - 5,
                            6,
                            height
                        );
                        
                        // 根据生长阶段绘制叶子
                        if (growthPercent > 0.3) {
                            ctx.fillStyle = '#228B22';
                            ctx.fillRect(
                                tile.x + tile.width / 2 - 8,
                                tile.y + tile.height - height,
                                5,
                                8
                            );
                        }
                        if (growthPercent > 0.6) {
                            ctx.fillStyle = '#228B22';
                            ctx.fillRect(
                                tile.x + tile.width / 2 + 3,
                                tile.y + tile.height - height + 5,
                                5,
                                8
                            );
                        }
                    }
                }
                
                // 高亮选中的地块（用于触摸反馈）
                if (tile.highlight) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.fillRect(tile.x, tile.y, tile.width, tile.height);
                    tile.highlight = false;
                }
            });
            
            // 绘制工具光标
            drawToolCursor();
            
            // 绘制UI
            updateUI();
        }
        
        // 绘制云朵
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            
            // 云朵1
            ctx.beginPath();
            ctx.arc(100, 60, 20, 0, Math.PI * 2);
            ctx.arc(130, 50, 25, 0, Math.PI * 2);
            ctx.arc(160, 60, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // 云朵2
            ctx.beginPath();
            ctx.arc(600, 80, 20, 0, Math.PI * 2);
            ctx.arc(630, 70, 25, 0, Math.PI * 2);
            ctx.arc(660, 80, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // 云朵3
            ctx.beginPath();
            ctx.arc(300, 100, 15, 0, Math.PI * 2);
            ctx.arc(320, 95, 20, 0, Math.PI * 2);
            ctx.arc(340, 100, 15, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制工具光标
        function drawToolCursor() {
            // 在实际游戏中，这里会根据鼠标位置绘制工具图标
            // 简化版：在右下角显示当前工具
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(canvas.width - 120, canvas.height - 50, 110, 40);
            
            ctx.fillStyle = 'white';
            ctx.font = '16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(
                `当前工具: ${getToolName(gameState.selectedTool)}`,
                canvas.width - 65,
                canvas.height - 25
            );
        }
        
        // 获取工具名称
        function getToolName(tool) {
            const names = {
                'hoe': '锄头',
                'water': '水壶',
                'seed': '种子',
                'harvest': '收割'
            };
            return names[tool] || tool;
        }
        
        // 更新UI显示
        function updateUI() {
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('season').textContent = gameState.season;
            
            // 更新时间显示
            const hours = Math.floor(gameState.time / 60);
            const minutes = gameState.time % 60;
            document.getElementById('time').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            document.getElementById('tool').textContent = getToolName(gameState.selectedTool);
            
            // 更新背包显示
            const inventoryText = 
                `种子x${gameState.inventory.seeds}, ` +
                `胡萝卜x${gameState.inventory.carrot}, ` +
                `小麦x${gameState.inventory.wheat}`;
            document.getElementById('inventoryItems').textContent = inventoryText;
        }
        
        // 处理地块点击
        function handleTileClick(tile) {
            tile.highlight = true;
            
            switch(gameState.selectedTool) {
                case 'hoe':
                    if (tile.state === 'soil') {
                        tile.state = 'tilled';
                        playSound('till');
                    }
                    break;
                    
                case 'water':
                    if (tile.state === 'tilled' || tile.state === 'planted' || tile.state === 'growing') {
                        tile.watered = true;
                        tile.lastWatered = gameState.time;
                        playSound('water');
                    }
                    break;
                    
                case 'seed':
                    if (tile.state === 'tilled' && gameState.inventory.seeds > 0) {
                        tile.state = 'planted';
                        tile.cropType = Math.random() > 0.5 ? 'carrot' : 'wheat';
                        tile.growthStage = 0;
                        gameState.inventory.seeds--;
                        playSound('plant');
                    }
                    break;
                    
                case 'harvest':
                    if (tile.state === 'ready') {
                        const crop = crops[tile.cropType];
                        gameState.inventory[tile.cropType]++;
                        tile.state = 'soil';
                        tile.cropType = null;
                        tile.growthStage = 0;
                        tile.watered = false;
                        playSound('harvest');
                    }
                    break;
            }
            
            draw();
        }
        
        // 播放音效（简化版，使用Web Audio API）
        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                let frequency = 440;
                let duration = 0.1;
                
                switch(type) {
                    case 'till':
                        frequency = 200;
                        duration = 0.2;
                        break;
                    case 'water':
                        frequency = 600;
                        duration = 0.3;
                        break;
                    case 'plant':
                        frequency = 800;
                        duration = 0.1;
                        break;
                    case 'harvest':
                        frequency = 1000;
                        duration = 0.2;
                        break;
                }
                
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                // 如果音频API不可用，静默失败
            }
        }
        
        // 切换工具
        function changeTool(tool) {
            gameState.selectedTool = tool;
            updateUI();
            draw();
        }
        
        // 出售作物
        function sellCrops() {
            let totalValue = 0;
            
            if (gameState.inventory.carrot > 0) {
                totalValue += gameState.inventory.carrot * crops.carrot.value;
                gameState.inventory.carrot = 0;
            }
            
            if (gameState.inventory.wheat > 0) {
                totalValue += gameState.inventory.wheat * crops.wheat.value;
                gameState.inventory.wheat = 0;
            }
            
            if (totalValue > 0) {
                gameState.gold += totalValue;
                alert(`出售作物获得 ${totalValue} 金币！`);
                updateUI();
                draw();
            } else {
                alert('没有可出售的作物！');
            }
        }
        
        // 购买种子
        function buySeeds() {
            if (gameState.gold >= 10) {
                gameState.gold -= 10;
                gameState.inventory.seeds += 5;
                alert('购买了5包种子！');
                updateUI();
                draw();
            } else {
                alert('金币不足！');
            }
        }
        
        // 游戏时间流逝
        function advanceTime() {
            gameState.time += 10; // 10分钟
            
            // 如果时间超过24小时（1440分钟），进入下一天
            if (gameState.time >= 1440) {
                gameState.time = 480; // 重置到8:00
                gameState.day++;
                
                // 每30天换季
                if (gameState.day % 30 === 0) {
                    const seasons = ['春', '夏', '秋', '冬'];
                    const currentIndex = seasons.indexOf(gameState.season);
                    gameState.season = seasons[(currentIndex + 1) % 4];
                }
                
                // 更新作物生长
                updateCrops();
            }
            
            // 检查浇水状态（水分在2小时内蒸发）
            farmTiles.forEach(tile => {
                if (tile.watered && gameState.time - tile.lastWatered > 120) {
                    tile.watered = false;
                }
            });
            
            updateUI();
            draw();
        }
        
        // 更新作物生长
        function updateCrops() {
            farmTiles.forEach(tile => {
                if ((tile.state === 'planted' || tile.state === 'growing') && tile.watered) {
                    tile.growthStage++;
                    
                    if (tile.growthStage >= crops[tile.cropType].growthTime) {
                        tile.state = 'ready';
                    } else if (tile.growthStage > 0) {
                        tile.state = 'growing';
                    }
                } else if (tile.state === 'planted' && !tile.watered) {
                    // 如果没浇水，作物会枯萎
                    if (Math.random() < 0.3) {
                        tile.state = 'soil';
                        tile.cropType = null;
                        tile.growthStage = 0;
                    }
                }
            });
        }
        
        // 事件监听
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 查找点击的地块
            const tile = farmTiles.find(t => 
                x >= t.x && x <= t.x + t.width &&
                y >= t.y && y <= t.y + t.height
            );
            
            if (tile) {
                handleTileClick(tile);
            }
        });
        
        // 触摸支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            // 查找触摸的地块
            const tile = farmTiles.find(t => 
                x >= t.x && x <= t.x + t.width &&
                y >= t.y && y <= t.y + t.height
            );
            
            if (tile) {
                handleTileClick(tile);
            }
        }, { passive: false });
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    changeTool('hoe');
                    break;
                case '2':
                    changeTool('water');
                    break;
                case '3':
                    changeTool('seed');
                    break;
                case '4':
                    changeTool('harvest');
                    break;
                case 's':
                case 'S':
                    sellCrops();
                    break;
                case 'b':
                case 'B':
                    buySeeds();
                    break;
            }
        });
        
        // 初始化游戏
        function initGame() {
            initFarm();
            draw();
            
            // 启动游戏时钟（每2秒推进10分钟游戏时间）
            setInterval(advanceTime, 2000);
        }
        
        // 页面加载完成后启动游戏
        window.addEventListener('load', initGame);
        
        // 防止触摸滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target === canvas) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>

let loginToastEl = null;

function ensureLoginToast() {
  if (loginToastEl) return loginToastEl;
  loginToastEl = document.getElementById('login-toast');
  if (loginToastEl) return loginToastEl;
  
  // 创建Toast元素和样式
  if (!document.getElementById('login-toast-style')) {
    const style = document.createElement('style');
    style.id = 'login-toast-style';
    style.textContent = '.login-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(20,20,30,0.95);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:10000;opacity:0;transition:all 0.3s ease;box-shadow:0 10px 40px rgba(0,0,0,0.5);}.login-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}.login-toast-text{color:rgba(255,255,255,0.9);font-size:14px;}.login-toast-btn{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);border:none;color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}.login-toast-btn:hover{filter:brightness(1.1);}';
    document.head.appendChild(style);
  }
  
  const toast = document.createElement('div');
  toast.id = 'login-toast';
  toast.className = 'login-toast';
  toast.innerHTML = '<span class="login-toast-text" id="login-toast-text">🔐 登录后可进行此操作</span><button class="login-toast-btn" onclick="goToWebLogin()">去登录</button>';
  document.body.appendChild(toast);
  loginToastEl = toast;
  return toast;
}

function showLoginToast(message) {
  const toast = ensureLoginToast();
  const textEl = document.getElementById('login-toast-text');
  if (!toast) return;
  if (textEl) textEl.textContent = message || '🔐 登录后可进行此操作';
  toast.classList.add('show');
  if (loginToastTimer) clearTimeout(loginToastTimer);
  loginToastTimer = setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

function hideLoginToast() {
  if (loginToastEl) loginToastEl.classList.remove('show');
  if (loginToastTimer) clearTimeout(loginToastTimer);
}

// 检查是否需要网站登录才能互动
function isWebInteractDisabled() {
  return siteConfig.webInteractDisabled;
}

// 要求登录的操作包装器
function requireWebLogin(actionName, callback) {
  // 如果全局禁用了网站互动，引导去小程序
  if (isWebInteractDisabled()) {
    showMiniprogramGuide(actionName, '/pages/game-detail/game-detail');
    return false;
  }
  // 检查是否已登录
  if (isWebLoggedIn()) {
    if (callback && typeof callback === 'function') callback();
    return true;
  } else {
    showLoginToast('🔐 登录后可' + actionName);
    return false;
  }
}

// 获取页面最高的 z-index 值
function getMaxZIndex() {
  return Math.max(
    ...Array.from(document.querySelectorAll('body *'))
      .map(el => parseFloat(window.getComputedStyle(el).zIndex))
      .filter(zIndex => !isNaN(zIndex)),
    999999 // 最低保底值
  );
}

// 全屏模式状态
let isFullscreenMode = false;

// 切换全屏模式
function toggleFullscreenMode() {
  isFullscreenMode = !isFullscreenMode;
  
  if (isFullscreenMode) {
    // 进入全屏
    document.body.classList.add('fullscreen-mode');
    
    // 尝试请求浏览器全屏
    try {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && isFullscreenMode) {
    toggleFullscreenMode();
  }
});

function showToast(message, type) {
  // 移除已存在的 toast
  var existingToast = document.getElementById('game-detail-toast');
  if (existingToast) existingToast.remove();
  
  var toast = document.createElement('div');
  toast.id = 'game-detail-toast';
  toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:8px;z-index:10000;font-size:14px;max-width:80%;text-align:center;animation:fadeIn 0.3s ease;';
  if (type === 'success') {
    toast.style.background = 'rgba(16,185,129,0.95)';
  }
  toast.innerText = message;
  document.body.appendChild(toast);
  
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
    
    // 检查是否为作者，显示编辑按钮
    checkIsAuthorAndShowEditBtn();
  }
}

// 检查是否可以编辑游戏（作者或管理员）并显示编辑按钮
function checkIsAuthorAndShowEditBtn() {
  const userToken = getUserToken();
  if (!userToken) return;
  
  // 调用后端API检查编辑权限（包括作者和管理员）
  fetch(API_BASE + '/' + gameId + '/can-edit', {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.canEdit) {
        const editBtn = document.getElementById('stat-edit-btn');
        const repairBtn = document.getElementById('stat-repair-btn');
        if (editBtn) {
          editBtn.classList.add('visible');
          // 如果是管理员编辑别人的游戏，添加提示
          if (data.isAdmin && !data.isAuthor) {
            editBtn.title = '管理员编辑模式';
          }
        }
        if (repairBtn) {
          repairBtn.classList.add('visible');
        }
      }
    })
    .catch(err => {
      console.error('[编辑权限检查] 失败:', err);
      // 降级处理：只检查是否为作者
      if (userToken === authorToken) {
        const editBtn = document.getElementById('stat-edit-btn');
        const repairBtn = document.getElementById('stat-repair-btn');
        if (editBtn) {
          editBtn.classList.add('visible');
        }
        if (repairBtn) {
          repairBtn.classList.add('visible');
        }
      }
    });
}

// AI修复游戏（异步后台任务）
function repairGame() {
  // 检查是否禁用网站写操作
  if (isWebWriteDisabled()) {
    showMiniprogramGuide('游戏修复', '/pages/game-detail/game-detail');
    return;
  }
  
  const REPAIR_CREDIT_COST = 0.5;
  const userToken = getUserToken();
  
  if (!userToken) {
    showToast('请先登录');
    return;
  }
  
  if (!confirm('AI修复需要消耗 ' + REPAIR_CREDIT_COST + ' 积分\n\nAI将在后台自动分析并修复游戏代码中的错误\n修复完成后请刷新页面查看\n\n确定要修复吗？')) {
    return;
  }
  
  const repairBtn = document.getElementById('stat-repair-btn');
  if (repairBtn) {
    repairBtn.classList.add('repairing');
  }
  
  fetch(API_BASE + '/' + gameId + '/repair', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-User-Token': userToken
    },
    body: JSON.stringify({ creditCost: REPAIR_CREDIT_COST })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.status === 'already_running') {
          showToast('该游戏已有修复任务正在进行中，请稍后刷新页面', 'info');
        } else {
          showToast('🔧 修复任务已启动！AI正在后台处理，完成后请刷新页面查看', 'success');
        }
      } else {
        showToast(data.error || '修复失败，请重试', 'error');
      }
    })
    .catch(err => {
      console.error('AI修复失败:', err);
      showToast('网络错误，请稍后重试', 'error');
    })
    .finally(() => {
      if (repairBtn) {
        repairBtn.classList.remove('repairing');
      }
    });
}

// 点赞（支持取消）
function likeGame() {
  // 检查登录状态（requireWebLogin 会处理未登录提示和禁用检测）
  if (!requireWebLogin('点赞')) return;
  
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('感谢点赞！❤️ ' + data.creditMessage, 'success');
        } else if (data.liked) {
          showToast('感谢点赞！❤️', 'success');
        } else {
          showToast('已取消点赞');
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
        showToast('操作失败，请重试');
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
      showToast('网络错误，请重试');
    });
}

// 收藏
function toggleFavorite() {
  // 检查登录状态（requireWebLogin 会处理未登录提示和禁用检测）
  if (!requireWebLogin('收藏')) return;
  
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('已添加到收藏 ⭐ ' + data.creditMessage, 'success');
        } else if (data.favorited) {
          showToast('已添加到收藏 ⭐', 'success');
        } else {
          showToast('已取消收藏');
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
        showToast('操作失败，请重试');
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
      showToast('网络错误，请重试');
    });
}

  const panel = document.getElementById('share-panel');
  panel.classList.remove('active');
  panel.style.display = 'none';

  if (!document.querySelector('.modal.active')) {
    document.body.classList.remove('modal-open');
  }
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';

// ====== 弹窗层级管理器 ======
// 基础层级（高于所有固定 UI 元素如 tiktok-sidebar 的 999998）
const modalZIndexManager = {
  baseZIndex: 1000000,
  currentZIndex: 1000000,
  modalStack: [], // 弹窗栈，用于追踪打开的弹窗
  
  // 获取下一个层级（打开新弹窗时调用）
  getNextZIndex: function(modalId) {
    this.currentZIndex += 10;
    this.modalStack.push({ id: modalId, zIndex: this.currentZIndex });
    return this.currentZIndex;
  },
  
  // 移除弹窗（关闭弹窗时调用）
  removeModal: function(modalId) {
    const index = this.modalStack.findIndex(m => m.id === modalId);
    if (index > -1) {
      this.modalStack.splice(index, 1);
    }
    // 如果没有弹窗了，重置层级
    if (this.modalStack.length === 0) {
      this.currentZIndex = this.baseZIndex;
    }
  },
  
  // 重置（关闭所有弹窗时调用）
  reset: function() {
    this.currentZIndex = this.baseZIndex;
    this.modalStack = [];
  }
};

// 获取头像emoji
function getAvatarEmoji(token) {
  const emojis = ['🎮', '🎯', '🎲', '🎪', '🎨', '🎭', '🎪', '🎰', '🎳', '🎸', '🎹', '🎺', '🎻', '🥁', '🎤'];
  if (!token) return '👤';
  const hash = token.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return emojis[hash % emojis.length];
}

// 获取游戏emoji
function getGameEmoji(title) {
  const keywords = {
    '贪吃蛇': '🐍', '蛇': '🐍', 'snake': '🐍',
    '2048': '🔢', '数字': '🔢',
    '飞机': '✈️', '打飞机': '✈️', '射击': '🔫',
    '砖块': '🧱', '打砖块': '🧱', '弹球': '🏓',
    '俄罗斯方块': '🟦', '方块': '🟦', 'tetris': '🟦',
    '跳跃': '🦘', '跑酷': '🏃', '跳': '🦘',
    '消除': '💎', '消消乐': '💎', '三消': '💎',
    '迷宫': '🔲', '棋': '♟️', '象棋': '♟️',
    '扑克': '🃏', '纸牌': '🃏', '斗地主': '🃏'
  };
  const t = (title || '').toLowerCase();
  for (const [k, v] of Object.entries(keywords)) {
    if (t.includes(k.toLowerCase())) return v;
  }
  return '🎮';
}

// 格式化数字
function formatNumber(num) {
  if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
  return String(num);
}

// HTML转义
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

    const profileData = await profileRes.json();
    const statsData = await statsRes.json();
    const gamesData = await gamesRes.json();
    const followStatusData = await followStatusRes.json();

    const isFollowing = followStatusData.success && followStatusData.following;

    }
    
    // 构建作品列表

      const gameCards = games.slice(0, 6).map(function(game) {
        const gameUrl = '/g/' + game.id.substring(0,2) + '/' + game.id + '.html';
        return '<div class="user-game-card" onclick="window.location.href=\x27' + gameUrl + '\x27">' +

            '<span>💬 ' + formatNumber(game.comment_count || 0) + '</span>' +

function handleUserGamesScroll(e) {

  if (scrollHeight - scrollTop - clientHeight < 50) {
    loadMoreUserGames();

// 加载更多作品
function loadMoreUserGames() {
  const { games, displayedCount, pageSize } = userProfileGamesState;
  if (displayedCount >= games.length) return;

  const grid = document.getElementById('user-games-grid');
  const loadMoreEl = document.getElementById('user-games-load-more');
  if (!grid) return;

  const newCount = Math.min(displayedCount + pageSize, games.length);
  const newGames = games.slice(displayedCount, newCount);

  newGames.forEach(function(game) {
    const card = document.createElement('div');
    card.className = 'user-game-card';
    card.onclick = function() { window.location.href = '/g/' + game.id.substring(0,2) + '/' + game.id + '.html'; };
    card.innerHTML = '<div class="user-game-emoji">' + getGameEmoji(game.title) + '</div>' +
      '<div class="user-game-title">' + escapeHtml(game.title) + '</div>' +
      '<div class="user-game-stats">' +
        '<span>🎮 ' + formatNumber(game.play_count || 0) + '</span>' +
        '<span>❤️ ' + formatNumber(game.like_count || 0) + '</span>' +
        '<span>💬 ' + formatNumber(game.comment_count || 0) + '</span>' +
      '</div>';
    grid.appendChild(card);
  });

  userProfileGamesState.displayedCount = newCount;
  if (newCount >= games.length && loadMoreEl) {
    loadMoreEl.style.display = 'none';
  }
}

  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  btn.classList.toggle('following', !isFollowing);
  btn.textContent = isFollowing ? '关注' : '已关注';
  
  try {
    const response = await fetch('/api/users/' + targetToken + '/follow', {
      method: 'POST',
      headers: getAuthHeaders()
    });
    const data = await response.json();
    
    if (data.success) {
      btn.classList.toggle('following', data.following);
      btn.textContent = data.following ? '已关注' : '关注';
    } else {
      // 回滚
      btn.classList.toggle('following', isFollowing);
      btn.textContent = isFollowing ? '已关注' : '关注';
    }
  } catch (e) {
    // 回滚
    btn.classList.toggle('following', isFollowing);
    btn.textContent = isFollowing ? '已关注' : '关注';
  }
}

// 切换关注状态
function toggleFollow() {
  // 检查登录状态（requireWebLogin 会处理未登录提示和禁用检测）
  if (!requireWebLogin('关注')) return;
  
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('关注成功 ✨ ' + data.creditMessage, 'success');
        } else if (data.following) {
          showToast('关注成功 ✨', 'success');
        } else {
          showToast('已取消关注');
        }
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        showToast('操作失败，请重试');
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      showToast('网络错误，请重试');
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile(targetToken) {
  // 检查登录状态（requireWebLogin 会处理未登录提示和禁用检测）
  if (!requireWebLogin('关注')) return;
  
  const targetUser = targetToken || authorToken;
  if (!targetUser) return;
  
  const currentUserToken = getUserToken();
  if (!currentUserToken) {
    alert('请先登录');
    return;
  }
  
  if (targetUser === currentUserToken) {
    alert('不能关注自己哦');
    return;
  }
  
  // 新弹窗的按钮
  const btn = document.getElementById('user-profile-follow-btn') || document.getElementById('profile-follow-btn');
  if (!btn) return;
  
  const isFollowing = btn.classList.contains('yxj-btn-secondary') || btn.classList.contains('btn-secondary') || btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.className = 'yxj-btn yxj-btn-primary yxj-follow-btn';
    btn.innerHTML = '+ 关注';
  } else {
    btn.className = 'yxj-btn yxj-btn-secondary yxj-follow-btn';
    btn.innerHTML = '已关注';
  }
  
  fetch('/api/users/' + targetUser + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.className = 'yxj-btn yxj-btn-secondary yxj-follow-btn';
          btn.innerHTML = '已关注';
        } else {
          btn.className = 'yxj-btn yxj-btn-primary yxj-follow-btn';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {
      // 回滚
      if (isFollowing) {
        btn.className = 'yxj-btn yxj-btn-secondary yxj-follow-btn';
        btn.innerHTML = '已关注';
      } else {
        btn.className = 'yxj-btn yxj-btn-primary yxj-follow-btn';
        btn.innerHTML = '+ 关注';
      }
    });
}

// ==================== 留言板功能 ====================

// 切换留言板面板
function toggleCommentsPanel() {
  const panel = document.getElementById('game-comments-section');
  const sidebar = document.querySelector('.tiktok-sidebar');
  const authorInfo = document.getElementById('tiktok-author-info');
  const overlay = document.getElementById('comments-overlay');
  if (panel) {
    const isExpanding = !panel.classList.contains('expanded');
    panel.classList.toggle('expanded');
    // 评论面板展开时隐藏右侧按钮和作者信息（使用class覆盖!important）
    if (sidebar) {
      sidebar.classList.toggle('comments-open', isExpanding);
    }
    if (authorInfo) {
      authorInfo.classList.toggle('comments-open', isExpanding);
    }
    // 控制蒙版显示
    if (overlay) {
      overlay.classList.toggle('visible', isExpanding);
    }
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  // 添加滚动加载状态提示
  if (commentsData.hasMore) {
    html += '<div class="comments-scroll-loading" id="comments-scroll-hint">下拉加载更多...</div>';
  }
  
  listEl.innerHTML = html;
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  // 检查登录状态（requireWebLogin 会处理未登录提示和禁用检测）
  if (!requireWebLogin('评论留言')) return;
  
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
        // 显示提示
        if (data.creditAwarded && data.creditMessage) {
          showToast('留言发布成功！' + data.creditMessage, 'success');
        } else {
          showToast('留言发布成功', 'success');
        }
      } else {
        showToast(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      showToast('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  // 检查登录状态
  if (!requireWebLogin('删除留言')) return;
  
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

// 初始化滚动加载
function initCommentsScroll() {
  const wrapper = document.querySelector('.comments-body-wrapper');
  if (!wrapper) return;
  
  wrapper.addEventListener('scroll', function() {
    if (commentsData.isLoading || !commentsData.hasMore) return;
    
    // 距离底部50px时触发加载
    const scrollBottom = wrapper.scrollHeight - wrapper.scrollTop - wrapper.clientHeight;
    if (scrollBottom < 50) {
      loadGameComments(false);
    }
  });
}

// 初始化
window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
  initCommentsScroll();
  checkIsAuthorAndShowEditBtn();
});
