<body>
  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="uiOverlay">
            <div id="startScreen" class="screen">
                <h1>打砖块弹球</h1>
                <p>使用 <span class="highlight">左右箭头键</span> 或 <span class="highlight">A/D键</span> 移动挡板</p>
                <p>弹球打掉所有砖块即可过关！</p>
                <p>小心不要让球掉下去！</p>
                <p>你有 <span class="highlight">3</span> 条生命</p>
                <button id="startButton" class="button">开始游戏</button>
                <div id="mobileHint" style="margin-top: 20px; display: none;">
                    <p>移动设备：使用下方按钮控制</p>
                </div>
            </div>
            
            <div id="gameOverScreen" class="screen" style="display: none;">
                <h2>游戏结束</h2>
                <p id="gameOverMessage"></p>
                <p>最终得分: <span id="finalScore" class="highlight">0</span></p>
                <button id="restartButton" class="button">再玩一次</button>
            </div>
        </div>
        
        <div id="stats">
            得分: <span id="score">0</span> | 生命: <span id="lives">3</span> | 关卡: <span id="level">1</span>
        </div>
        
        <div id="controls">
            <button id="leftBtn" class="control-btn">←</button>
            <button id="rightBtn" class="control-btn">→</button>
        </div>
    </div>

    <script>
        // 游戏变量
        let canvas, ctx;
        let gameState = 'start'; // start, playing, gameOver
        let score = 0;
        let lives = 3;
        let level = 1;
        let bricks = [];
        let ball, paddle;
        let leftPressed = false;
        let rightPressed = false;
        let isMobile = false;
        
        // 游戏常量
        const BRICK_ROWS = 6;
        const BRICK_COLUMNS = 10;
        const BRICK_WIDTH = 70;
        const BRICK_HEIGHT = 20;
        const BRICK_PADDING = 5;
        const BRICK_OFFSET_TOP = 60;
        const BRICK_OFFSET_LEFT = 35;
        const PADDLE_WIDTH = 100;
        const PADDLE_HEIGHT = 15;
        const BALL_RADIUS = 10;
        const BALL_SPEED = 5;
        
        // 初始化游戏
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // 设置画布尺寸
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 检测是否为移动设备
            isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                document.getElementById('mobileHint').style.display = 'block';
            }
            
            // 初始化游戏对象
            initGameObjects();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 调整画布尺寸
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = Math.min(container.clientWidth * 0.7, window.innerHeight * 0.8);
            
            // 重新初始化游戏对象（如果游戏已开始）
            if (gameState === 'playing') {
                initGameObjects();
            }
        }
        
        // 初始化游戏对象
        function initGameObjects() {
            // 初始化挡板
            paddle = {
                x: canvas.width / 2 - PADDLE_WIDTH / 2,
                y: canvas.height - 30,
                width: PADDLE_WIDTH,
                height: PADDLE_HEIGHT,
                speed: 8,
                color: '#4a4aff'
            };
            
            // 初始化小球
            ball = {
                x: canvas.width / 2,
                y: canvas.height - 50,
                radius: BALL_RADIUS,
                dx: BALL_SPEED * (Math.random() > 0.5 ? 1 : -1),
                dy: -BALL_SPEED,
                color: '#ff6b6b'
            };
            
            // 初始化砖块
            bricks = [];
            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    // 根据行数设置不同颜色
                    let hue = 200 + (r * 30);
                    let color = `hsl(${hue}, 70%, 60%)`;
                    
                    bricks.push({
                        x: c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT,
                        y: r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP,
                        width: BRICK_WIDTH,
                        height: BRICK_HEIGHT,
                        color: color,
                        visible: true
                    });
                }
            }
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 键盘控制
            document.addEventListener('keydown', keyDownHandler);
            document.addEventListener('keyup', keyUpHandler);
            
            // 按钮控制
            document.getElementById('startButton').addEventListener('click', startGame);
            document.getElementById('restartButton').addEventListener('click', restartGame);
            
            // 移动端按钮控制
            document.getElementById('leftBtn').addEventListener('touchstart', () => leftPressed = true);
            document.getElementById('leftBtn').addEventListener('touchend', () => leftPressed = false);
            document.getElementById('rightBtn').addEventListener('touchstart', () => rightPressed = true);
            document.getElementById('rightBtn').addEventListener('touchend', () => rightPressed = false);
            
            // 移动端触摸控制（在画布上滑动）
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', handleTouchEnd);
            
            // 防止页面滚动
            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas || e.target === document.getElementById('leftBtn') || e.target === document.getElementById('rightBtn')) {
                    e.preventDefault();
                }
            }, { passive: false });
        }
        
        // 键盘按下事件
        function keyDownHandler(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = true;
            }
        }
        
        // 键盘释放事件
        function keyUpHandler(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = false;
            }
        }
        
        // 触摸开始事件
        function handleTouchStart(e) {
            e.preventDefault();
            if (gameState === 'playing') {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const touchX = touch.clientX - rect.left;
                
                // 设置挡板位置到触摸点
                paddle.x = touchX - paddle.width / 2;
            }
        }
        
        // 触摸移动事件
        function handleTouchMove(e) {
            e.preventDefault();
            if (gameState === 'playing') {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const touchX = touch.clientX - rect.left;
                
                // 设置挡板位置到触摸点
                paddle.x = touchX - paddle.width / 2;
            }
        }
        
        // 触摸结束事件
        function handleTouchEnd(e) {
            e.preventDefault();
        }
        
        // 开始游戏
        function startGame() {
            gameState = 'playing';
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            // 重置游戏状态
            score = 0;
            lives = 3;
            level = 1;
            updateStats();
            
            initGameObjects();
        }
        
        // 重新开始游戏
        function restartGame() {
            startGame();
        }
        
        // 游戏结束
        function gameOver(isWin) {
            gameState = 'gameOver';
            
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            
            if (isWin) {
                document.getElementById('gameOverMessage').textContent = `恭喜！你通过了第${level}关！`;
            } else {
                document.getElementById('gameOverMessage').textContent = '球掉下去了！再试一次吧！';
            }
        }
        
        // 更新游戏状态
        function update() {
            if (gameState !== 'playing') return;
            
            // 移动挡板
            if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            }
            
            // 移动小球
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 边界碰撞检测（左右墙）
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            
            // 边界碰撞检测（上墙）
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // 底部边界检测（球掉下去）
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                updateStats();
                
                if (lives <= 0) {
                    gameOver(false);
                } else {
                    // 重置球的位置
                    ball.x = canvas.width / 2;
                    ball.y = canvas.height - 50;
                    ball.dx = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
                    ball.dy = -BALL_SPEED;
                    
                    // 重置挡板位置
                    paddle.x = canvas.width / 2 - paddle.width / 2;
                }
            }
            
            // 挡板碰撞检测
            if (
                ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width &&
                ball.dy > 0
            ) {
                // 根据击中挡板的位置改变反弹角度
                let hitPoint = (ball.x - paddle.x) / paddle.width;
                ball.dx = 8 * (hitPoint - 0.5); // -4 到 4
                ball.dy = -Math.abs(ball.dy);
                
                // 增加一点分数
                score += 5;
                updateStats();
            }
            
            // 砖块碰撞检测
            for (let brick of bricks) {
                if (brick.visible) {
                    if (
                        ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height
                    ) {
                        // 确定从哪边碰撞
                        let fromLeft = ball.x < brick.x;
                        let fromRight = ball.x > brick.x + brick.width;
                        let fromTop = ball.y < brick.y;
                        let fromBottom = ball.y > brick.y + brick.height;
                        
                        // 根据碰撞方向反弹
                        if (fromLeft || fromRight) {
                            ball.dx = -ball.dx;
                        }
                        if (fromTop || fromBottom) {
                            ball.dy = -ball.dy;
                        }
                        
                        brick.visible = false;
                        score += 10;
                        updateStats();
                        
                        // 检查是否所有砖块都被打掉了
                        if (bricks.every(b => !b.visible)) {
                            levelUp();
                        }
                        
                        break; // 一次只处理一个碰撞
                    }
                }
            }
        }
        
        // 升级关卡
        function levelUp() {
            level++;
            updateStats();
            
            // 重置球和挡板
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = BALL_SPEED * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -BALL_SPEED;
            paddle.x = canvas.width / 2 - paddle.width / 2;
            
            // 增加球速
            ball.dx *= 1.1;
            ball.dy *= 1.1;
            
            // 重新生成砖块（更多行）
            bricks = [];
            const rows = Math.min(BRICK_ROWS + level - 1, 10);
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < BRICK_COLUMNS; c++) {
                    let hue = 200 + (r * 30);
                    let color = `hsl(${hue}, 70%, 60%)`;
                    
                    bricks.push({
                        x: c * (BRICK_WIDTH + BRICK_PADDING) + BRICK_OFFSET_LEFT,
                        y: r * (BRICK_HEIGHT + BRICK_PADDING) + BRICK_OFFSET_TOP,
                        width: BRICK_WIDTH,
                        height: BRICK_HEIGHT,
                        color: color,
                        visible: true
                    });
                }
            }
            
            // 如果关卡达到5，玩家获胜
            if (level > 5) {
                gameOver(true);
            }
        }
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }
        
        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景网格
            drawBackground();
            
            // 绘制砖块
            for (let brick of bricks) {
                if (brick.visible) {
                    drawBrick(brick);
                }
            }
            
            // 绘制挡板
            drawPaddle();
            
            // 绘制小球
            drawBall();
            
            // 绘制粒子效果（如果球在移动）
            if (gameState === 'playing' && (Math.abs(ball.dx) > 0.1 || Math.abs(ball.dy) > 0.1)) {
                drawParticles();
            }
        }
        
        // 绘制背景网格
        function drawBackground() {
            ctx.fillStyle = 'rgba(20, 20, 40, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格线
            ctx.strokeStyle = 'rgba(100, 100, 200, 0.1)';
            ctx.lineWidth = 1;
            
            // 垂直线
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 绘制砖块
        function drawBrick(brick) {
            // 砖块主体
            ctx.fillStyle = brick.color;
            ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
            
            // 砖块高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(brick.x, brick.y, brick.width, 3);
            ctx.fillRect(brick.x, brick.y, 3, brick.height);
            
            // 砖块阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(brick.x + brick.width - 3, brick.y, 3, brick.height);
            ctx.fillRect(brick.x, brick.y + brick.height - 3, brick.width, 3);
        }
        
        // 绘制挡板
        function drawPaddle() {
            // 挡板主体
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // 挡板高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, 4);
            
            // 挡板阴影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(paddle.x, paddle.y + paddle.height - 2, paddle.width, 2);
        }
        
        // 绘制小球
        function drawBall() {
            // 小球发光效果
            let gradient = ctx.createRadialGradient(
                ball.x, ball.y, 0,
                ball.x, ball.y, ball.radius * 1.5
            );
            gradient.addColorStop(0, 'rgba(255, 107, 107, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 107, 107, 0.1)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 小球主体
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 小球高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制粒子效果
        function drawParticles() {
            // 在球后面绘制一些粒子
            for (let i = 0; i < 3; i++) {
                let size = Math.random() * 3 + 1;
                let x = ball.x - ball.dx * (i * 0.5) + (Math.random() * 6 - 3);
                let y = ball.y - ball.dy * (i * 0.5) + (Math.random() * 6 - 3);
                let alpha = 0.7 - i * 0.2;
                
                ctx.fillStyle = `rgba(255, 107, 107, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 游戏主循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // 页面加载完成后初始化游戏
        document.addEventListener('DOMContentLoaded', init);
    </script>

        '<div style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;">👤</div>' +
        '<div style="font-size:18px;font-weight:600;color:#333;">' + nickname + '</div>' +
      '</div>' +
      '<div style="display:flex;justify-content:center;gap:30px;margin-bottom:15px;">' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + following + '</strong><span style="color:#999;font-size:12px;">关注</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + followers + '</strong><span style="color:#999;font-size:12px;">粉丝</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + games.length + '</strong><span style="color:#999;font-size:12px;">作品</span></div>' +
      '</div>' +
      followBtnHtml +
      gamesHtml;
    
    // 检查关注状态（只有不是自己时才检查）
    if (!isSelf) {
      checkFollowStatusForProfile();
    }
  }).catch(() => {
    content.innerHTML = '<div style="padding:20px;color:#999;">加载失败</div>';
  });
}

// 关闭作者主页
function closeAuthorProfile() {
  document.getElementById('author-profile-modal').style.display = 'none';
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
