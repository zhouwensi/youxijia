            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;

            border-radius: 10px;

        }

  <!-- 原游戏body内容 -->
  
    <div class="container">
        <header>
            <h1><i class="fas fa-snake"></i> 经典贪吃蛇</h1>
            <p class="subtitle">控制小蛇吃掉食物，避免撞墙或撞到自己</p>
        </header>
        
        <div class="game-wrapper">
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="score">0</div>
                    <div class="stat-label">得分</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="high-score">0</div>
                    <div class="stat-label">最高分</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="length">3</div>
                    <div class="stat-label">长度</div>
                </div>
            </div>
            
            <div class="game-container">
                <canvas id="gameCanvas"></canvas>
                
                <div class="screen" id="startScreen">
                    <h2>经典贪吃蛇</h2>
                    <p>控制小蛇移动，吃掉红色食物来增长身体和得分。</p>
                    <p>避免撞到墙壁或自己的身体！</p>
                    <button id="startBtn">
                        <i class="fas fa-play"></i> 开始游戏
                    </button>
                </div>
                
                <div class="screen hidden" id="gameOverScreen">
                    <h2>游戏结束</h2>
                    <div class="final-score" id="finalScore">0</div>
                    <p>你的小蛇撞到了障碍物！</p>
                    <button id="restartBtn">
                        <i class="fas fa-redo"></i> 重新开始
                    </button>
                </div>
            </div>
            
            <div class="controls">
                <div class="buttons">
                    <button id="pauseBtn">
                        <i class="fas fa-pause"></i> 暂停
                    </button>
                    <button id="resumeBtn" disabled>
                        <i class="fas fa-play"></i> 继续
                    </button>
                    <button id="resetBtn">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                </div>
                
                <div class="mobile-controls">
                    <button class="mobile-btn up-btn" id="upBtn">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                    <button class="mobile-btn left-btn" id="leftBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button class="mobile-btn right-btn" id="rightBtn">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <button class="mobile-btn down-btn" id="downBtn">
                        <i class="fas fa-arrow-down"></i>
                    </button>
                </div>
            </div>
            
            <div class="instructions">
                <h3><i class="fas fa-info-circle"></i> 游戏说明</h3>
                <p><span class="key">W</span> <span class="key">↑</span> 向上移动</p>
                <p><span class="key">A</span> <span class="key">←</span> 向左移动</p>
                <p><span class="key">S</span> <span class="key">↓</span> 向下移动</p>
                <p><span class="key">D</span> <span class="key">→</span> 向右移动</p>
                <p>每吃到一个食物得10分，小蛇长度增加1</p>
                <p>游戏速度会随着得分增加而逐渐加快</p>
            </div>
        </div>
    </div>

    <script>
        // 游戏变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const lengthElement = document.getElementById('length');
        const finalScoreElement = document.getElementById('finalScore');
        
        // 移动控制按钮
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        
        // 游戏设置
        const gridSize = 20;
        const initialSpeed = 150; // 初始速度（毫秒）
        const speedIncrease = 2; // 每得100分速度增加
        
        // 游戏状态
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameSpeed = initialSpeed;
        let gameLoop;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        
        // 初始化游戏
        function initGame() {
            // 设置画布尺寸
            const container = document.querySelector('.game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // 初始化蛇
            snake = [
                {x: 5, y: 10},
                {x: 4, y: 10},
                {x: 3, y: 10}
            ];
            
            // 初始化食物
            generateFood();
            
            // 重置游戏状态
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameSpeed = initialSpeed;
            isPaused = false;
            isGameOver = false;
            
            // 更新UI
            updateScore();
            highScoreElement.textContent = highScore;
            
            // 隐藏游戏结束屏幕
            gameOverScreen.classList.add('hidden');
            
            // 绘制初始状态
            draw();
        }
        
        // 生成食物
        function generateFood() {
            const maxX = Math.floor(canvas.width / gridSize) - 1;
            const maxY = Math.floor(canvas.height / gridSize) - 1;
            
            // 确保食物不会生成在蛇身上
            let foodOnSnake;
            do {
                foodOnSnake = false;
                food = {
                    x: Math.floor(Math.random() * maxX),
                    y: Math.floor(Math.random() * maxY)
                };
                
                // 检查食物是否在蛇身上
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
        }
        
        // 绘制游戏
        function draw() {
            // 清除画布
            ctx.fillStyle = '#0f3460';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格（背景）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            // 绘制垂直线
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 绘制水平线
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 绘制蛇
            snake.forEach((segment, index) => {
                // 蛇头
                if (index === 0) {
                    ctx.fillStyle = '#4cc9f0';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    
                    // 蛇头眼睛
                    ctx.fillStyle = '#fff';
                    let eyeSize = gridSize / 5;
                    let eyeOffset = gridSize / 3;
                    
                    // 根据方向确定眼睛位置
                    let leftEyeX, leftEyeY, rightEyeX, rightEyeY;
                    
                    if (direction === 'right') {
                        leftEyeX = segment.x * gridSize + gridSize - eyeOffset;
                        leftEyeY = segment.y * gridSize + eyeOffset;
                        rightEyeX = segment.x * gridSize + gridSize - eyeOffset;
                        rightEyeY = segment.y * gridSize + gridSize - eyeOffset * 1.5;
                    } else if (direction === 'left') {
                        leftEyeX = segment.x * gridSize + eyeOffset;
                        leftEyeY = segment.y * gridSize + eyeOffset;
                        rightEyeX = segment.x * gridSize + eyeOffset;
                        rightEyeY = segment.y * gridSize + gridSize - eyeOffset * 1.5;
                    } else if (direction === 'up') {
                        leftEyeX = segment.x * gridSize + eyeOffset;
                        leftEyeY = segment.y * gridSize + eyeOffset;
                        rightEyeX = segment.x * gridSize + gridSize - eyeOffset * 1.5;
                        rightEyeY = segment.y * gridSize + eyeOffset;
                    } else { // down
                        leftEyeX = segment.x * gridSize + eyeOffset;
                        leftEyeY = segment.y * gridSize + gridSize - eyeOffset;
                        rightEyeX = segment.x * gridSize + gridSize - eyeOffset * 1.5;
                        rightEyeY = segment.y * gridSize + gridSize - eyeOffset;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(leftEyeX, leftEyeY, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(rightEyeX, rightEyeY, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                } 
                // 蛇身
                else {
                    // 渐变颜色从头部到尾部
                    let colorValue = 200 - (index / snake.length) * 100;
                    ctx.fillStyle = `rgb(76, ${colorValue}, 240)`;
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    
                    // 蛇身内部细节
                    ctx.fillStyle = `rgba(255, 255, 255, 0.2)`;
                    ctx.fillRect(
                        segment.x * gridSize + gridSize/4, 
                        segment.y * gridSize + gridSize/4, 
                        gridSize/2, 
                        gridSize/2
                    );
                }
                
                // 蛇身边框
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 1;
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
            
            // 绘制食物
            ctx.fillStyle = '#f72585';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 食物光泽效果
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/3,
                food.y * gridSize + gridSize/3,
                gridSize/6,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // 更新游戏状态
        function update() {
            // 更新方向
            direction = nextDirection;
            
            // 计算新的蛇头位置
            let head = {...snake[0]};
            
            switch(direction) {
                case 'up':
                    head.y -= 1;
                    break;
                case 'down':
                    head.y += 1;
                    break;
                case 'left':
                    head.x -= 1;
                    break;
                case 'right':
                    head.x += 1;
                    break;
            }
            
            // 检查游戏结束条件
            // 1. 撞墙
            if (
                head.x < 0 || 
                head.y < 0 || 
                head.x >= canvas.width / gridSize || 
                head.y >= canvas.height / gridSize
            ) {
                gameOver();
                return;
            }
            
            // 2. 撞到自己
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // 将新头部添加到蛇
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                // 更新游戏速度
                gameSpeed = Math.max(50, initialSpeed - Math.floor(score / 100) * speedIncrease);
                
                // 生成新食物
                generateFood();
                
                // 更新UI
                updateScore();
                
                // 重新设置游戏循环以应用新速度
                if (isGameStarted && !isPaused && !isGameOver) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                // 如果没有吃到食物，移除尾部
                snake.pop();
            }
            
            // 绘制更新后的游戏状态
            draw();
        }
        
        // 游戏步骤（更新+绘制）
        function gameStep() {
            if (!isPaused && !isGameOver) {
                update();
            }
        }
        
        // 更新分数显示
        function updateScore() {
            scoreElement.textContent = score;
            highScoreElement.textContent = highScore;
            lengthElement.textContent = snake.length;
        }
        
        // 游戏结束
        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            
            // 显示游戏结束屏幕
            gameOverScreen.classList.remove('hidden');
            finalScoreElement.textContent = score;
            
            // 更新按钮状态
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
        }
        
        // 开始游戏
        function startGame() {
            isGameStarted = true;
            startScreen.classList.add('hidden');
            
            // 初始化游戏
            initGame();
            
            // 开始游戏循环
            gameLoop = setInterval(gameStep, gameSpeed);
            
            // 更新按钮状态
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
        }
        
        // 暂停游戏
        function pauseGame() {
            isPaused = true;
            clearInterval(gameLoop);
            
            // 更新按钮状态
            pauseBtn.disabled = true;
            resumeBtn.disabled = false;
        }
        
        // 继续游戏
        function resumeGame() {
            isPaused = false;
            
            // 重新开始游戏循环
            gameLoop = setInterval(gameStep, gameSpeed);
            
            // 更新按钮状态
            pauseBtn.disabled = false;
            resumeBtn.disabled = true;
        }
        
        // 重置游戏
        function resetGame() {
            clearInterval(gameLoop);
            isGameStarted = false;
            startScreen.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            
            // 更新按钮状态
            pauseBtn.disabled = true;
            resumeBtn.disabled = true;
            
            // 绘制初始状态
            initGame();
        }
        
        // 键盘控制
        function handleKeyDown(e) {
            // 防止方向键滚动页面
            if ([37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // 游戏未开始或已结束时不响应方向键
            if (!isGameStarted || isGameOver) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
                case ' ':
                    // 空格键切换暂停/继续
                    if (isPaused) {
                        resumeGame();
                    } else {
                        pauseGame();
                    }
                    break;
            }
        }
        
        // 移动端控制
        function setupMobileControls() {
            upBtn.addEventListener('click', () => {
                if (direction !== 'down') nextDirection = 'up';
            });
            
            downBtn.addEventListener('click', () => {
                if (direction !== 'up') nextDirection = 'down';
            });
            
            leftBtn.addEventListener('click', () => {
                if (direction !== 'right') nextDirection = 'left';
            });
            
            rightBtn.addEventListener('click', () => {
                if (direction !== 'left') nextDirection = 'right';
            });
        }
        
        // 窗口大小变化时调整画布
        function handleResize() {
            if (!isGameStarted) {
                initGame();
            }
        }
        
        // 事件监听
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resumeBtn.addEventListener('click', resumeGame);
        resetBtn.addEventListener('click', resetGame);
        
        document.addEventListener('keydown', handleKeyDown);
        window.addEventListener('resize', handleResize);
        
        // 初始化移动端控制
        setupMobileControls();
        
        // 初始化游戏
        initGame();
        
        // 加载最高分
        highScoreElement.textContent = highScore;
    </script>

// 获取游戏ID和作者信息
const gameId = 'ae58a3ae-60a3-4cfe-88be-3e427ee7f560';
const gameTitle = '经典贪吃蛇';

const authorName = 'MarsZhou';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

function showPromoModal() {

  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {

}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩

  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {

        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;

        }

    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })

        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});

  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量

          countEl.innerText = data.favorite_count;
        }

        // 失败回滚

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const userToken = getUserToken();
    const canDelete = comment.is_mine || (userToken && comment.user_token === userToken);
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar">' + avatarInitial + '</div>' +
          '<span class="comment-author-name">' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();

      inputArea.style.display = 'none';

}
