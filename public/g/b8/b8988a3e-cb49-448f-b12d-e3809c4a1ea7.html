    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 100%);
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            margin: 0 auto;
        }

        canvas {
            display: block;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 40, 0.95);

            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.7);
            letter-spacing: 2px;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ffcc00;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 10px;
            line-height: 1.5;
            max-width: 500px;
        }

        .highlight {
            color: #4fc3f7;
            font-weight: bold;
        }

        .score-display {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1.5rem;
            color: #ffcc00;

        .health-bar {

        .health-fill {

            background: linear-gradient(90deg, #00e676, #76ff03);
            border-radius: 10px;
            transition: width 0.3s;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .control-item {
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid #4fc3f7;
            border-radius: 8px;
            padding: 10px 15px;
            min-width: 120px;
        }

        .btn {
            background: linear-gradient(135deg, #4fc3f7, #2979ff);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(41, 121, 255, 0.6);
        }

        .btn:active {
            transform: translateY(1px);

        .mobile-controls {
            position: absolute;

            display: flex;

<body>
  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="score-display">得分: <span id="score">0</span></div>
        <div class="health-bar">
            <div id="healthFill" class="health-fill" style="width: 100%"></div>
        </div>
        
        <div id="startScreen" class="screen">
            <h1>太空飞机大战</h1>
            <p>在浩瀚的宇宙中，驾驶你的战机消灭敌人，生存下去！</p>
            
            <div class="controls">
                <div class="control-item">
                    <div class="highlight">移动控制</div>
                    <div>键盘: WASD 或 方向键</div>
                    <div>触屏: 虚拟摇杆</div>
                </div>
                <div class="control-item">
                    <div class="highlight">射击控制</div>
                    <div>键盘: 空格键 或 J 键</div>
                    <div>触屏: 射击按钮</div>
                </div>
                <div class="control-item">
                    <div class="highlight">游戏目标</div>
                    <div>消灭敌机获得分数</div>
                    <div>躲避敌机和子弹</div>
                </div>
            </div>
            
            <button id="startBtn" class="btn">开始游戏</button>
            <p style="margin-top: 20px; font-size: 0.9rem; color: #aaa;">适配电脑和手机，自动检测控制方式</p>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore" class="highlight">0</span></p>
            <p>击落敌机: <span id="enemiesDestroyed" class="highlight">0</span> 架</p>
            <button id="restartBtn" class="btn">重新开始</button>
        </div>
        
        <div id="mobileControls" class="mobile-controls hidden">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick" id="joystick"></div>
            </div>
            <div class="mobile-btn" id="shootBtn">射击</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const CANVAS_WIDTH = 800;
            const CANVAS_HEIGHT = 600;
            const PLAYER_SPEED = 5;
            const BULLET_SPEED = 8;
            const ENEMY_SPEED_MIN = 1;
            const ENEMY_SPEED_MAX = 3;
            const ENEMY_SPAWN_RATE = 60; // 每60帧生成一个敌人
            const PLAYER_MAX_HEALTH = 100;
            
            // 游戏变量
            let canvas, ctx;
            let gameActive = false;
            let score = 0;
            let playerHealth = PLAYER_MAX_HEALTH;
            let enemiesDestroyed = 0;
            let animationId;
            let isMobile = false;
            
            // 玩家对象
            const player = {
                x: CANVAS_WIDTH / 2,
                y: CANVAS_HEIGHT - 100,
                width: 40,
                height: 60,
                speed: PLAYER_SPEED,
                color: '#4fc3f7',
                lastShot: 0,
                shotDelay: 15 // 射击间隔（帧）
            };
            
            // 子弹数组
            let bullets = [];
            
            // 敌机数组
            let enemies = [];
            
            // 爆炸效果数组
            let explosions = [];
            
            // 控制状态
            const keys = {};
            const touchState = {
                joystickActive: false,
                joystickX: 0,
                joystickY: 0,
                shooting: false
            };
            
            // DOM元素
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreElement = document.getElementById('score');
            const finalScoreElement = document.getElementById('finalScore');
            const enemiesDestroyedElement = document.getElementById('enemiesDestroyed');
            const healthFill = document.getElementById('healthFill');
            const mobileControls = document.getElementById('mobileControls');
            const joystickArea = document.getElementById('joystickArea');
            const joystick = document.getElementById('joystick');
            const shootBtn = document.getElementById('shootBtn');
            
            // 初始化游戏
            function init() {
                canvas = document.getElementById('gameCanvas');
                ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                
                // 检测是否为移动设备
                isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // 设置事件监听器
                setupEventListeners();
                
                // 显示开始画面
                showScreen(startScreen);
                
                // 绘制初始游戏画面
                drawBackground();
                drawPlayer();
                drawHUD();
            }
            
            // 调整画布尺寸
            function resizeCanvas() {
                const container = document.getElementById('gameContainer');
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                
                // 保持宽高比
                const aspectRatio = CANVAS_WIDTH / CANVAS_HEIGHT;
                let newWidth = containerWidth;
                let newHeight = containerWidth / aspectRatio;
                
                if (newHeight > containerHeight) {
                    newHeight = containerHeight;
                    newWidth = containerHeight * aspectRatio;
                }
                
                canvas.width = newWidth;
                canvas.height = newHeight;
                canvas.style.width = newWidth + 'px';
                canvas.style.height = newHeight + 'px';
                
                // 重新绘制
                if (ctx) {
                    drawBackground();
                    if (gameActive) {
                        drawGame();
                    } else {
                        drawPlayer();
                        drawHUD();
                    }
                }
            }
            
            // 设置事件监听器
            function setupEventListeners() {
                // 键盘事件
                window.addEventListener('keydown', function(e) {
                    keys[e.key.toLowerCase()] = true;
                    
                    // 空格键或J键射击
                    if ((e.key === ' ' || e.key === 'j' || e.key === 'J') && gameActive) {
                        shoot();
                    }
                    
                    // 防止空格键滚动页面
                    if (e.key === ' ') {
                        e.preventDefault();
                    }
                });
                
                window.addEventListener('keyup', function(e) {
                    keys[e.key.toLowerCase()] = false;
                });
                
                // 开始游戏按钮
                startBtn.addEventListener('click', startGame);
                restartBtn.addEventListener('click', startGame);
                
                // 移动端触摸事件
                if (isMobile) {
                    // 虚拟摇杆
                    joystickArea.addEventListener('touchstart', handleJoystickStart);
                    joystickArea.addEventListener('touchmove', handleJoystickMove);
                    joystickArea.addEventListener('touchend', handleJoystickEnd);
                    
                    // 射击按钮
                    shootBtn.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        touchState.shooting = true;
                        if (gameActive) shoot();
                    });
                    
                    shootBtn.addEventListener('touchend', function(e) {
                        e.preventDefault();
                        touchState.shooting = false;
                    });
                    
                    // 防止游戏区域滚动
                    canvas.addEventListener('touchstart', function(e) {
                        if (e.target === canvas) e.preventDefault();
                    }, { passive: false });
                    
                    canvas.addEventListener('touchmove', function(e) {
                        if (e.target === canvas) e.preventDefault();
                    }, { passive: false });
                }
            }
            
            // 虚拟摇杆处理
            function handleJoystickStart(e) {
                e.preventDefault();
                touchState.joystickActive = true;
                updateJoystickPosition(e);
            }
            
            function handleJoystickMove(e) {
                if (!touchState.joystickActive) return;
                e.preventDefault();
                updateJoystickPosition(e);
            }
            
            function handleJoystickEnd(e) {
                e.preventDefault();
                touchState.joystickActive = false;
                touchState.joystickX = 0;
                touchState.joystickY = 0;
                joystick.style.transform = 'translate(0, 0)';
            }
            
            function updateJoystickPosition(e) {
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                
                // 计算触摸点相对于摇杆区域中心的位置
                const touchX = touch.clientX - rect.left - rect.width / 2;
                const touchY = touch.clientY - rect.top - rect.height / 2;
                
                // 限制摇杆移动范围
                const distance = Math.sqrt(touchX * touchX + touchY * touchY);
                const maxDistance = rect.width / 2 - joystick.clientWidth / 2;
                
                let joystickX = touchX;
                let joystickY = touchY;
                
                if (distance > maxDistance) {
                    joystickX = (touchX / distance) * maxDistance;
                    joystickY = (touchY / distance) * maxDistance;
                }
                
                // 更新摇杆位置
                joystick.style.transform = `translate(${joystickX}px, ${joystickY}px)`;
                
                // 标准化控制向量
                touchState.joystickX = joystickX / maxDistance;
                touchState.joystickY = joystickY / maxDistance;
            }
            
            // 显示屏幕
            function showScreen(screen) {
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                mobileControls.classList.add('hidden');
                
                screen.classList.remove('hidden');
                
                if (screen === startScreen && isMobile) {
                    mobileControls.classList.remove('hidden');
                }
            }
            
            // 开始游戏
            function startGame() {
                // 重置游戏状态
                gameActive = true;
                score = 0;
                playerHealth = PLAYER_MAX_HEALTH;
                enemiesDestroyed = 0;
                
                // 重置玩家位置
                player.x = CANVAS_WIDTH / 2;
                player.y = CANVAS_HEIGHT - 100;
                
                // 清空数组
                bullets = [];
                enemies = [];
                explosions = [];
                
                // 更新UI
                scoreElement.textContent = score;
                healthFill.style.width = '100%';
                
                // 隐藏所有屏幕
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                
                // 显示移动控制（如果是移动设备）
                if (isMobile) {
                    mobileControls.classList.remove('hidden');
                }
                
                // 开始游戏循环
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                gameLoop();
            }
            
            // 游戏结束
            function gameOver() {
                gameActive = false;
                
                // 更新最终分数
                finalScoreElement.textContent = score;
                enemiesDestroyedElement.textContent = enemiesDestroyed;
                
                // 显示游戏结束画面
                showScreen(gameOverScreen);
                
                // 停止游戏循环
                cancelAnimationFrame(animationId);
            }
            
            // 游戏主循环
            function gameLoop() {
                update();
                drawGame();
                
                if (gameActive) {
                    animationId = requestAnimationFrame(gameLoop);
                }
            }
            
            // 更新游戏状态
            function update() {
                // 更新玩家位置
                updatePlayer();
                
                // 自动射击（如果射击按钮被按住）
                if (touchState.shooting && gameActive) {
                    shoot();
                }
                
                // 更新子弹
                updateBullets();
                
                // 生成敌机
                if (Math.random() < 1 / ENEMY_SPAWN_RATE) {
                    spawnEnemy();
                }
                
                // 更新敌机
                updateEnemies();
                
                // 更新爆炸效果
                updateExplosions();
                
                // 检测碰撞
                checkCollisions();
                
                // 更新UI
                scoreElement.textContent = score;
                healthFill.style.width = `${(playerHealth / PLAYER_MAX_HEALTH) * 100}%`;
                
                // 检查游戏结束条件
                if (playerHealth <= 0) {
                    gameOver();
                }
            }
            
            // 更新玩家位置
            function updatePlayer() {
                // 键盘控制
                let moveX = 0;
                let moveY = 0;
                
                if (keys['arrowleft'] || keys['a']) moveX -= 1;
                if (keys['arrowright'] || keys['d']) moveX += 1;
                if (keys['arrowup'] || keys['w']) moveY -= 1;
                if (keys['arrowdown'] || keys['s']) moveY += 1;
                
                // 虚拟摇杆控制（移动设备）
                if (touchState.joystickActive) {
                    moveX += touchState.joystickX;
                    moveY += touchState.joystickY;
                }
                
                // 标准化移动向量（防止斜向移动更快）
                if (moveX !== 0 || moveY !== 0) {
                    const length = Math.sqrt(moveX * moveX + moveY * moveY);
                    moveX /= length;
                    moveY /= length;
                }
                
                // 应用移动
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;
                
                // 边界检查
                player.x = Math.max(player.width / 2, Math.min(CANVAS_WIDTH - player.width / 2, player.x));
                player.y = Math.max(player.height / 2, Math.min(CANVAS_HEIGHT - player.height / 2, player.y));
                
                // 更新射击冷却
                if (player.lastShot > 0) {
                    player.lastShot--;
                }
            }
            
            // 射击
            function shoot() {
                if (player.lastShot > 0) return;
                
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    width: 4,
                    height: 15,
                    speed: BULLET_SPEED,
                    color: '#ffcc00'
                });
                
                player.lastShot = player.shotDelay;
            }
            
            // 生成敌机
            function spawnEnemy() {
                const size = 20 + Math.random() * 20;
                const speed = ENEMY_SPEED_MIN + Math.random() * (ENEMY_SPEED_MAX - ENEMY_SPEED_MIN);
                
                enemies.push({
                    x: Math.random() * (CANVAS_WIDTH - size),
                    y: -size,
                    width: size,
                    height: size,
                    speed: speed,
                    color: `hsl(${Math.random() * 60}, 100%, 60%)`, // 红色到黄色
                    health: Math.ceil(size / 10)
                });
            }
            
            // 更新子弹
            function updateBullets() {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    bullet.y -= bullet.speed;
                    
                    // 移除超出屏幕的子弹
                    if (bullet.y + bullet.height < 0) {
                        bullets.splice(i, 1);
                    }
                }
            }
            
            // 更新敌机
            function updateEnemies() {
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    enemy.y += enemy.speed;
                    
                    // 移除超出屏幕的敌机
                    if (enemy.y - enemy.height > CANVAS_HEIGHT) {
                        enemies.splice(i, 1);
                    }
                }
            }
            
            // 更新爆炸效果
            function updateExplosions() {
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const explosion = explosions[i];
                    explosion.radius += explosion.growth;
                    explosion.alpha -= 0.02;
                    
                    // 移除消失的爆炸效果
                    if (explosion.alpha <= 0) {
                        explosions.splice(i, 1);
                    }
                }
            }
            
            // 检测碰撞
            function checkCollisions() {
                // 子弹与敌机碰撞
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        
                        if (rectCollision(bullet, enemy)) {
                            // 敌机受伤
                            enemy.health--;
                            
                            // 移除子弹
                            bullets.splice(i, 1);
                            
                            // 如果敌机被摧毁
                            if (enemy.health <= 0) {
                                // 创建爆炸效果
                                createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                                
                                // 移除敌机
                                enemies.splice(j, 1);
                                
                                // 增加分数
                                score += 10;
                                enemiesDestroyed++;
                            }
                            
                            break;
                        }
                    }
                }
                
                // 玩家与敌机碰撞
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    
                    if (rectCollision(player, enemy)) {
                        // 创建爆炸效果
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        
                        // 移除敌机
                        enemies.splice(i, 1);
                        
                        // 玩家受伤
                        playerHealth -= 20;
                        
                        // 增加分数（即使碰撞也奖励一点分数）
                        score += 5;
                    }
                }
            }
            
            // 矩形碰撞检测
            function rectCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }
            
            // 创建爆炸效果
            function createExplosion(x, y) {
                explosions.push({
                    x: x,
                    y: y,
                    radius: 5,
                    growth: 1,
                    alpha: 1,
                    color: `hsl(${Math.random() * 30 + 20}, 100%, 60%)`
                });
            }
            
            // 绘制游戏
            function drawGame() {
                // 清除画布
                drawBackground();
                
                // 绘制爆炸效果
                drawExplosions();
                
                // 绘制子弹
                drawBullets();
                
                // 绘制敌机
                drawEnemies();
                
                // 绘制玩家
                drawPlayer();
                
                // 绘制HUD
                drawHUD();
            }
            
            // 绘制背景
            function drawBackground() {
                // 黑色背景
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制星空
                ctx.fillStyle = 'white';
                for (let i = 0; i < 100; i++) {
                    const x = (i * 7.9) % canvas.width;
                    const y = (i * 5.3) % canvas.height;
                    const size = (i % 3) * 0.5 + 0.5;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // 绘制渐变底部（表示地面/边界）
                const gradient = ctx.createLinearGradient(0, canvas.height - 50, 0, canvas.height);
                gradient.addColorStop(0, 'rgba(79, 195, 247, 0.2)');
                gradient.addColorStop(1, 'rgba(79, 195, 247, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            }
            
            // 绘制玩家
            function drawPlayer() {
                // 保存画布状态
                ctx.save();
                
                // 转换坐标到玩家位置
                const scaleX = canvas.width / CANVAS_WIDTH;
                const scaleY = canvas.height / CANVAS_HEIGHT;
                const x = player.x * scaleX;
                const y = player.y * scaleY;
                const width = player.width * scaleX;
                const height = player.height * scaleY;
                
                // 绘制玩家飞船
                ctx.translate(x, y);
                
                // 飞船主体
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.moveTo(0, -height / 2);
                ctx.lineTo(-width / 2, height / 2);
                ctx.lineTo(0, height / 4);
                ctx.lineTo(width / 2, height / 2);
                ctx.closePath();
                ctx.fill();
                
                // 飞船细节
                ctx.fillStyle = '#2979ff';
                ctx.beginPath();
                ctx.ellipse(0, -height / 6, width / 4, height / 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 飞船引擎光效
                if (gameActive && (keys['arrowup'] || keys['w'] || touchState.joystickY < -0.1)) {
                    const gradient = ctx.createLinearGradient(0, height / 2, 0, height);
                    gradient.addColorStop(0, '#ff9800');
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.moveTo(-width / 4, height / 2);
                    ctx.lineTo(0, height);
                    ctx.lineTo(width / 4, height / 2);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
            
            // 绘制子弹
            function drawBullets() {
                const scaleX = canvas.width / CANVAS_WIDTH;
                const scaleY = canvas.height / CANVAS_HEIGHT;
                
                bullets.forEach(bullet => {
                    const x = bullet.x * scaleX;
                    const y = bullet.y * scaleY;
                    const width = bullet.width * scaleX;
                    const height = bullet.height * scaleY;
                    
                    // 子弹发光效果
                    const gradient = ctx.createRadialGradient(
                        x + width / 2, y + height / 2, 0,
                        x + width / 2, y + height / 2, width * 2
                    );
                    gradient.addColorStop(0, bullet.color);
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, width, height * 2);
                    
                    // 子弹主体
                    ctx.fillStyle = bullet.color;
                    ctx.fillRect(x, y, width, height);
                });
            }
            
            // 绘制敌机
            function drawEnemies() {
                const scaleX = canvas.width / CANVAS_WIDTH;
                const scaleY = canvas.height / CANVAS_HEIGHT;
                
                enemies.forEach(enemy => {
                    const x = enemy.x * scaleX;
                    const y = enemy.y * scaleY;
                    const width = enemy.width * scaleX;
                    const height = enemy.height * scaleY;
                    
                    // 敌机主体
                    ctx.fillStyle = enemy.color;
                    ctx.beginPath();
                    ctx.moveTo(x + width / 2, y);
                    ctx.lineTo(x + width, y + height);
                    ctx.lineTo(x, y + height);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 敌机细节
                    ctx.fillStyle = '#ff5252';
                    ctx.beginPath();
                    ctx.arc(x + width / 2, y + height / 3, width / 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            
            // 绘制爆炸效果
            function drawExplosions() {
                const scaleX = canvas.width / CANVAS_WIDTH;
                const scaleY = canvas.height / CANVAS_HEIGHT;
                
                explosions.forEach(explosion => {
                    const x = explosion.x * scaleX;
                    const y = explosion.y * scaleY;
                    const radius = explosion.radius * Math.min(scaleX, scaleY);
                    
                    // 爆炸发光效果
                    const gradient = ctx.createRadialGradient(
                        x, y, 0,
                        x, y, radius * 2
                    );
                    gradient.addColorStop(0, `rgba(255, 200, 0, ${explosion.alpha})`);
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 爆炸核心
                    ctx.fillStyle = explosion.color;
                    ctx.globalAlpha = explosion.alpha;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });
            }
            
            // 绘制HUD
            function drawHUD() {
                // 分数和生命值已经在HTML中显示
                // 这里可以添加额外的Canvas绘制HUD元素
            }
            
            // 初始化游戏
            init();
        });
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = 'b8988a3e-cb49-448f-b12d-e3809c4a1ea7';
const gameTitle = '太空飞机大战';
const authorToken = '327b68c4-ae7d-4ad7-855f-0ba45371adcd';
const authorName = '游戏玩家';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

}

// 关闭分享面板
function closeSharePanel() {
  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
