<body>
  <!-- 原游戏body内容 -->
  
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1>⚔️ 流星蝴蝶剑 ⚔️</h1>
        <p class="score">斩落流星，守护剑心</p>
        <button id="startButton">开始游戏</button>
        <div class="controls">
            PC: WASD移动 | 空格攻击 | 鼠标瞄准<br>
            手机: 虚拟摇杆 | 攻击按钮
        </div>
    </div>
    
    <div id="endScreen" class="screen hidden">
        <h2>游戏结束</h2>
        <p class="score" id="finalScore">得分: 0</p>
        <button id="restartButton">再战一场</button>
    </div>
    
    <div class="mobile-controls">
        <div class="mobile-btn" id="leftBtn">←</div>
        <div class="mobile-btn" id="rightBtn">→</div>
        <div class="mobile-btn" id="upBtn">↑</div>
        <div class="mobile-btn" id="downBtn">↓</div>
        <div class="mobile-btn" id="attackBtn" style="background: rgba(255, 51, 102, 0.7);">⚔️</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const finalScore = document.getElementById('finalScore');
        
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const attackBtn = document.getElementById('attackBtn');
        
        let gameActive = false;
        let score = 0;
        let playerHealth = 100;
        let player = { x: 0, y: 0, radius: 20, speed: 5, color: '#66ccff' };
        let sword = { length: 40, width: 8, angle: 0, swinging: false, swingSpeed: 0.3 };
        let meteors = [];
        let butterflies = [];
        let particles = [];
        let keys = {};
        let mouse = { x: 0, y: 0 };
        let touchControls = { left: false, right: false, up: false, down: false, attack: false };
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        }
        
        function initGame() {
            gameActive = true;
            score = 0;
            playerHealth = 100;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            meteors = [];
            butterflies = [];
            particles = [];
            sword.swinging = false;
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
        }
        
        function createMeteor() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            const speed = 2 + Math.random() * 3;
            const size = 15 + Math.random() * 25;
            
            switch(side) {
                case 0: x = -size; y = Math.random() * canvas.height; break;
                case 1: x = canvas.width + size; y = Math.random() * canvas.height; break;
                case 2: x = Math.random() * canvas.width; y = -size; break;
                case 3: x = Math.random() * canvas.width; y = canvas.height + size; break;
            }
            
            const angle = Math.atan2(player.y - y, player.x - x);
            meteors.push({
                x, y, size,
                speedX: Math.cos(angle) * speed,
                speedY: Math.sin(angle) * speed,
                color: `hsl(${Math.random() * 30 + 330}, 100%, 60%)`
            });
        }
        
        function createButterfly() {
            butterflies.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: 8 + Math.random() * 12,
                speedX: (Math.random() - 0.5) * 3,
                speedY: (Math.random() - 0.5) * 3,
                color: `hsl(${Math.random() * 60 + 240}, 100%, 70%)`,
                wingPhase: Math.random() * Math.PI * 2
            });
        }
        
        function createParticles(x, y, color, count) {
            for(let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    speedX: (Math.random() - 0.5) * 8,
                    speedY: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color,
                    life: 30
                });
            }
        }
        
        function update() {
            if(!gameActive) return;
            
            const moveX = (keys['a'] || keys['ArrowLeft'] || touchControls.left ? -1 : 0) + 
                         (keys['d'] || keys['ArrowRight'] || touchControls.right ? 1 : 0);
            const moveY = (keys['w'] || keys['ArrowUp'] || touchControls.up ? -1 : 0) + 
                         (keys['s'] || keys['ArrowDown'] || touchControls.down ? 1 : 0);
            
            player.x += moveX * player.speed;
            player.y += moveY * player.speed;
            
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
            
            sword.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            
            if((keys[' '] || touchControls.attack) && !sword.swinging) {
                sword.swinging = true;
            }
            
            if(sword.swinging) {
                sword.swingSpeed += 0.5;
                if(sword.swingSpeed > 15) {
                    sword.swingSpeed = 0.3;
                    sword.swinging = false;
                }
            }
            
            if(Math.random() < 0.02) createMeteor();
            if(Math.random() < 0.01 && butterflies.length < 15) createButterfly();
            
            for(let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.speedX;
                m.y += m.speedY;
                
                const dx = m.x - player.x;
                const dy = m.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if(distance < m.size + player.radius) {
                    playerHealth -= 20;
                    createParticles(m.x, m.y, m.color, 15);
                    meteors.splice(i, 1);
                    if(playerHealth <= 0) {
                        gameOver();
                    }
                    continue;
                }
                
                if(sword.swinging) {
                    const swordX = player.x + Math.cos(sword.angle) * sword.length;
                    const swordY = player.y + Math.sin(sword.angle) * sword.length;
                    const swordDist = Math.sqrt(
                        Math.pow(swordX - m.x, 2) + Math.pow(swordY - m.y, 2)
                    );
                    
                    if(swordDist < m.size + sword.width) {
                        score += Math.floor(m.size);
                        createParticles(m.x, m.y, m.color, 20);
                        meteors.splice(i, 1);
                    }
                }
                
                if(m.x < -100 || m.x > canvas.width + 100 || 
                   m.y < -100 || m.y > canvas.height + 100) {
                    meteors.splice(i, 1);
                }
            }
            
            for(let i = butterflies.length - 1; i >= 0; i--) {
                const b = butterflies[i];
                b.x += b.speedX;
                b.y += b.speedY;
                b.wingPhase += 0.2;
                
                if(b.x < -50) b.x = canvas.width + 50;
                if(b.x > canvas.width + 50) b.x = -50;
                if(b.y < -50) b.y = canvas.height + 50;
                if(b.y > canvas.height + 50) b.y = -50;
                
                if(sword.swinging) {
                    const swordX = player.x + Math.cos(sword.angle) * sword.length;
                    const swordY = player.y + Math.sin(sword.angle) * sword.length;
                    const swordDist = Math.sqrt(
                        Math.pow(swordX - b.x, 2) + Math.pow(swordY - b.y, 2)
                    );
                    
                    if(swordDist < b.size + sword.width) {
                        score += 5;
                        playerHealth = Math.min(100, playerHealth + 5);
                        createParticles(b.x, b.y, b.color, 10);
                        butterflies.splice(i, 1);
                    }
                }
            }
            
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.life--;
                p.speedX *= 0.95;
                p.speedY *= 0.95;
                
                if(p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function draw() {
            ctx.fillStyle = '#111122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for(let i = 0; i < butterflies.length; i++) {
                const b = butterflies[i];
                ctx.save();
                ctx.translate(b.x, b.y);
                
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, b.size, b.size / 3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = b.color + '80';
                const wingY = Math.sin(b.wingPhase) * 3;
                ctx.beginPath();
                ctx.ellipse(-b.size/2, wingY, b.size/2, b.size, 0, 0, Math.PI * 2);
                ctx.ellipse(b.size/2, -wingY, b.size/2, b.size, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            for(let i = 0; i < meteors.length; i++) {
                const m = meteors[i];
                ctx.save();
                ctx.translate(m.x, m.y);
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, m.size);
                gradient.addColorStop(0, m.color);
                gradient.addColorStop(1, m.color + '00');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, m.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-m.size * 1.5, 0);
                ctx.stroke();
                
                ctx.restore();
            }
            
            for(let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = p.life / 30;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            if(sword.swinging) {
                const swordX = player.x + Math.cos(sword.angle) * sword.length;
                const swordY = player.y + Math.sin(sword.angle) * sword.length;
                
                const gradient = ctx.createLinearGradient(player.x, player.y, swordX, swordY);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#ff66aa');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = sword.width;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y);
                ctx.lineTo(swordX, swordY);
                ctx.stroke();
                
                ctx.fillStyle = '#ff3366';
                ctx.beginPath();
                ctx.arc(swordX, swordY, sword.width/2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#ffff66';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`得分: ${score}`, 20, 40);
            
            ctx.fillStyle = '#66ff66';
            ctx.fillText(`生命: ${playerHealth}`, 20, 80);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('斩落流星(红色)，躲避蝴蝶(蓝色)', canvas.width/2, canvas.height - 30);
        }
        
        function gameOver() {
            gameActive = false;
            finalScore.textContent = `得分: ${score}`;
            endScreen.classList.remove('hidden');
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if(e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.touches[0].clientX - rect.left;
                mouse.y = e.touches[0].clientY - rect.top;
            }
        }
        
        startButton.addEventListener('click', initGame);
        restartButton.addEventListener('click', initGame);
        
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        
        function setupTouchControl(btn, control) {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchControls[control] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchControls[control] = false;
            });
            btn.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                touchControls[control] = false;
            });
            
            btn.addEventListener('mousedown', () => {
                touchControls[control] = true;
            });
            btn.addEventListener('mouseup', () => {
                touchControls[control] = false;
            });
            btn.addEventListener('mouseleave', () => {
                touchControls[control] = false;
            });
        }
        
        setupTouchControl(leftBtn, 'left');
        setupTouchControl(rightBtn, 'right');
        setupTouchControl(upBtn, 'up');
        setupTouchControl(downBtn, 'down');
        setupTouchControl(attackBtn, 'attack');
        
        window.addEventListener('resize', resizeCanvas);
        
        resizeCanvas();
        gameLoop();
        
        window.addEventListener('click', (e) => {
            if(e.target === canvas && !gameActive) {
                initGame();
            }
        });

function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {

      .then(data => {

          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 切换关注状态
function toggleFollow() {

    btn.classList.add('following');

    method: 'POST',

    .catch(() => {

      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';

    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}

// 初始化
window.addEventListener('load', loadStats);
</script>

</body>
</html>
