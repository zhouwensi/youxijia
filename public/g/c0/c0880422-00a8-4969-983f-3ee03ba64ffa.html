<body>
  <!-- 原游戏body内容 -->
  
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="score" id="scoreDisplay">得分: 0</div>
        <div class="lives" id="livesDisplay">生命: 3</div>
        
        <div id="startScreen" class="screen">
            <h1>钢铁洪流</h1>
            <h2>坦克大战</h2>
            <p>指挥你的坦克，摧毁所有敌人，保卫基地！</p>
            
            <div class="controls">
                <p><span class="key">W/A/S/D</span> 或 <span class="key">↑/←/↓/→</span> 控制坦克移动</p>
                <p><span class="key">空格键</span> 或 <span class="key">鼠标点击</span> 发射炮弹</p>
                <p>摧毁敌方坦克获得分数，避免被敌人击中</p>
                <p>保护基地（绿色方块）不被摧毁</p>
            </div>
            
            <button class="btn" id="startBtn">开始战斗</button>
            
            <p style="margin-top: 30px; font-size: 1rem; color: #74c0fc;">
                支持键盘和触屏操作 | 适配手机和电脑
            </p>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2>战斗结束</h2>
            <div class="game-over-stats">
                <p id="finalScore">最终得分: 0</p>
                <p id="tanksDestroyed">摧毁坦克: 0</p>
                <p id="gameResult">结果: 失败</p>
            </div>
            <button class="btn" id="restartBtn">再战一场</button>
            <p style="margin-top: 20px; color: #74c0fc;">点击按钮重新开始游戏</p>
        </div>
        
        <div class="mobile-controls">
            <div class="mobile-btn" id="upBtn">↑</div>
            <div class="mobile-btn" id="leftBtn">←</div>
            <div class="mobile-btn" id="downBtn">↓</div>
            <div class="mobile-btn" id="rightBtn">→</div>
            <div class="mobile-btn" id="fireBtn">🔥</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const finalScore = document.getElementById('finalScore');
            const tanksDestroyed = document.getElementById('tanksDestroyed');
            const gameResult = document.getElementById('gameResult');
            
            // 移动控制按钮
            const upBtn = document.getElementById('upBtn');
            const leftBtn = document.getElementById('leftBtn');
            const downBtn = document.getElementById('downBtn');
            const rightBtn = document.getElementById('rightBtn');
            const fireBtn = document.getElementById('fireBtn');
            
            // 设置画布尺寸
            function resizeCanvas() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 游戏变量
            let game = {
                running: false,
                score: 0,
                lives: 3,
                level: 1,
                player: null,
                enemies: [],
                bullets: [],
                enemyBullets: [],
                walls: [],
                base: null,
                keys: {},
                lastTime: 0,
                enemySpawnTimer: 0,
                gameTime: 0
            };
            
            // 坦克类
            class Tank {
                constructor(x, y, color, isPlayer = false) {
                    this.x = x;
                    this.y = y;
                    this.width = 30;
                    this.height = 30;
                    this.color = color;
                    this.speed = isPlayer ? 4 : 2;
                    this.direction = 0; // 0:上, 1:右, 2:下, 3:左
                    this.isPlayer = isPlayer;
                    this.cooldown = 0;
                    this.cooldownTime = isPlayer ? 15 : 60;
                    this.health = 1;
                }
                
                update() {
                    if (this.cooldown > 0) this.cooldown--;
                    
                    // 玩家坦克控制
                    if (this.isPlayer) {
                        if (game.keys['ArrowUp'] || game.keys['w'] || game.keys['W']) {
                            this.direction = 0;
                            this.y -= this.speed;
                        }
                        if (game.keys['ArrowRight'] || game.keys['d'] || game.keys['D']) {
                            this.direction = 1;
                            this.x += this.speed;
                        }
                        if (game.keys['ArrowDown'] || game.keys['s'] || game.keys['S']) {
                            this.direction = 2;
                            this.y += this.speed;
                        }
                        if (game.keys['ArrowLeft'] || game.keys['a'] || game.keys['A']) {
                            this.direction = 3;
                            this.x -= this.speed;
                        }
                        
                        // 边界检查
                        if (this.x < 0) this.x = 0;
                        if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
                        if (this.y < 0) this.y = 0;
                        if (this.y > canvas.height - this.height) this.y = canvas.height - this.height;
                    } else {
                        // 敌方AI - 简单追踪玩家
                        if (game.player) {
                            const dx = game.player.x - this.x;
                            const dy = game.player.y - this.y;
                            
                            // 随机移动和射击
                            if (Math.random() < 0.02) {
                                if (Math.abs(dx) > Math.abs(dy)) {
                                    this.direction = dx > 0 ? 1 : 3;
                                } else {
                                    this.direction = dy > 0 ? 2 : 0;
                                }
                            }
                            
                            // 移动
                            if (this.direction === 0) this.y -= this.speed;
                            if (this.direction === 1) this.x += this.speed;
                            if (this.direction === 2) this.y += this.speed;
                            if (this.direction === 3) this.x -= this.speed;
                            
                            // 边界检查
                            if (this.x < 0) { this.x = 0; this.direction = 1; }
                            if (this.x > canvas.width - this.width) { this.x = canvas.width - this.width; this.direction = 3; }
                            if (this.y < 0) { this.y = 0; this.direction = 2; }
                            if (this.y > canvas.height - this.height) { this.y = canvas.height - this.height; this.direction = 0; }
                            
                            // 随机射击
                            if (Math.random() < 0.02 && this.cooldown === 0) {
                                this.shoot();
                            }
                        }
                    }
                    
                    // 检查与墙壁的碰撞
                    for (const wall of game.walls) {
                        if (this.collidesWith(wall)) {
                            // 回退位置
                            if (this.direction === 0) this.y += this.speed;
                            if (this.direction === 1) this.x -= this.speed;
                            if (this.direction === 2) this.y -= this.speed;
                            if (this.direction === 3) this.x += this.speed;
                        }
                    }
                }
                
                shoot() {
                    if (this.cooldown > 0) return;
                    
                    let bulletX, bulletY;
                    
                    switch(this.direction) {
                        case 0: // 上
                            bulletX = this.x + this.width/2 - 2.5;
                            bulletY = this.y - 5;
                            break;
                        case 1: // 右
                            bulletX = this.x + this.width + 5;
                            bulletY = this.y + this.height/2 - 2.5;
                            break;
                        case 2: // 下
                            bulletX = this.x + this.width/2 - 2.5;
                            bulletY = this.y + this.height + 5;
                            break;
                        case 3: // 左
                            bulletX = this.x - 10;
                            bulletY = this.y + this.height/2 - 2.5;
                            break;
                    }
                    
                    const bullet = new Bullet(bulletX, bulletY, this.direction, this.isPlayer);
                    
                    if (this.isPlayer) {
                        game.bullets.push(bullet);
                    } else {
                        game.enemyBullets.push(bullet);
                    }
                    
                    this.cooldown = this.cooldownTime;
                }
                
                collidesWith(obj) {
                    return this.x < obj.x + obj.width &&
                           this.x + this.width > obj.x &&
                           this.y < obj.y + obj.height &&
                           this.y + this.height > obj.y;
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x + this.width/2, this.y + this.height/2);
                    ctx.rotate(this.direction * Math.PI/2);
                    
                    // 坦克主体
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    
                    // 坦克履带
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-this.width/2 - 3, -this.height/2, 3, this.height);
                    ctx.fillRect(this.width/2, -this.height/2, 3, this.height);
                    
                    // 坦克炮管
                    ctx.fillStyle = '#666';
                    ctx.fillRect(0, -2.5, 20, 5);
                    
                    // 玩家坦克标识
                    if (this.isPlayer) {
                        ctx.fillStyle = '#4dabf7';
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                }
            }
            
            // 子弹类
            class Bullet {
                constructor(x, y, direction, isPlayer) {
                    this.x = x;
                    this.y = y;
                    this.width = 5;
                    this.height = 5;
                    this.speed = 8;
                    this.direction = direction;
                    this.isPlayer = isPlayer;
                    this.color = isPlayer ? '#4dabf7' : '#ff6b6b';
                }
                
                update() {
                    switch(this.direction) {
                        case 0: this.y -= this.speed; break;
                        case 1: this.x += this.speed; break;
                        case 2: this.y += this.speed; break;
                        case 3: this.x -= this.speed; break;
                    }
                    
                    // 检查是否超出屏幕
                    return this.x >= 0 && this.x <= canvas.width && 
                           this.y >= 0 && this.y <= canvas.height;
                }
                
                collidesWith(obj) {
                    return this.x < obj.x + obj.width &&
                           this.x + this.width > obj.x &&
                           this.y < obj.y + obj.height &&
                           this.y + this.height > obj.y;
                }
                
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 子弹光晕效果
                    ctx.fillStyle = this.isPlayer ? 'rgba(77, 171, 247, 0.3)' : 'rgba(255, 107, 107, 0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 墙壁类
            class Wall {
                constructor(x, y, width, height) {
                    this.x = x;
                    this.y = y;
                    this.width = width;
                    this.height = height;
                }
                
                draw() {
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // 墙壁纹理
                    ctx.fillStyle = '#a0522d';
                    for (let i = 0; i < this.width; i += 5) {
                        for (let j = 0; j < this.height; j += 5) {
                            if ((i + j) % 10 === 0) {
                                ctx.fillRect(this.x + i, this.y + j, 3, 3);
                            }
                        }
                    }
                }
            }
            
            // 基地类
            class Base {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.width = 40;
                    this.height = 40;
                    this.health = 1;
                }
                
                draw() {
                    // 基地主体
                    ctx.fillStyle = this.health > 0 ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // 基地标志
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', this.x + this.width/2, this.y + this.height/2);
                    
                    // 基地边框
                    ctx.strokeStyle = this.health > 0 ? '#27ae60' : '#c0392b';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x, this.y, this.width, this.height);
                }
            }
            
            // 初始化游戏
            function initGame() {
                game.score = 0;
                game.lives = 3;
                game.level = 1;
                game.enemies = [];
                game.bullets = [];
                game.enemyBullets = [];
                game.walls = [];
                game.enemySpawnTimer = 0;
                game.gameTime = 0;
                
                // 创建玩家坦克
                game.player = new Tank(canvas.width/2 - 15, canvas.height - 60, '#4dabf7', true);
                
                // 创建基地
                game.base = new Base(canvas.width/2 - 20, canvas.height - 40);
                
                // 创建墙壁
                createWalls();
                
                // 创建初始敌人
                for (let i = 0; i < 3; i++) {
                    spawnEnemy();
                }
                
                updateUI();
            }
            
            // 创建墙壁
            function createWalls() {
                // 随机生成墙壁
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * (canvas.width - 60) + 10;
                    const y = Math.random() * (canvas.height - 150) + 10;
                    const width = Math.random() * 40 + 20;
                    const height = Math.random() * 40 + 20;
                    
                    // 确保墙壁不覆盖玩家出生点或基地
                    if (x > canvas.width/2 - 50 && x < canvas.width/2 + 50 && 
                        y > canvas.height - 100 && y < canvas.height) continue;
                    
                    game.walls.push(new Wall(x, y, width, height));
                }
                
                // 添加一些保护基地的墙壁
                game.walls.push(new Wall(game.base.x - 30, game.base.y - 30, 30, 100));
                game.walls.push(new Wall(game.base.x + game.base.width, game.base.y - 30, 30, 100));
            }
            
            // 生成敌人
            function spawnEnemy() {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                
                switch(side) {
                    case 0: // 上边
                        x = Math.random() * (canvas.width - 30);
                        y = -30;
                        break;
                    case 1: // 右边
                        x = canvas.width;
                        y = Math.random() * (canvas.height - 30);
                        break;
                    case 2: // 下边
                        x = Math.random() * (canvas.width - 30);
                        y = canvas.height;
                        break;
                    case 3: // 左边
                        x = -30;
                        y = Math.random() * (canvas.height - 30);
                        break;
                }
                
                const enemy = new Tank(x, y, '#ff6b6b');
                game.enemies.push(enemy);
            }
            
            // 更新UI
            function updateUI() {
                scoreDisplay.textContent = `得分: ${game.score}`;
                livesDisplay.textContent = `生命: ${game.lives}`;
            }
            
            // 游戏结束
            function gameOver(isWin) {
                game.running = false;
                
                finalScore.textContent = `最终得分: ${game.score}`;
                tanksDestroyed.textContent = `摧毁坦克: ${Math.floor(game.score / 100)}`;
                gameResult.textContent = `结果: ${isWin ? '胜利!' : '失败'}`;
                gameResult.style.color = isWin ? '#2ecc71' : '#ff6b6b';
                
                gameOverScreen.classList.remove('hidden');
            }
            
            // 游戏循环
            function gameLoop(timestamp) {
                if (!game.running) return;
                
                const deltaTime = timestamp - game.lastTime || 0;
                game.lastTime = timestamp;
                game.gameTime += deltaTime;
                
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景网格
                drawBackground();
                
                // 更新和绘制所有对象
                game.player.update();
                game.player.draw();
                
                // 更新敌人
                for (let i = game.enemies.length - 1; i >= 0; i--) {
                    const enemy = game.enemies[i];
                    enemy.update();
                    enemy.draw();
                    
                    // 检查敌人是否被玩家子弹击中
                    for (let j = game.bullets.length - 1; j >= 0; j--) {
                        const bullet = game.bullets[j];
                        if (bullet.collidesWith(enemy)) {
                            game.enemies.splice(i, 1);
                            game.bullets.splice(j, 1);
                            game.score += 100;
                            updateUI();
                            break;
                        }
                    }
                }
                
                // 更新玩家子弹
                for (let i = game.bullets.length - 1; i >= 0; i--) {
                    const bullet = game.bullets[i];
                    if (!bullet.update()) {
                        game.bullets.splice(i, 1);
                        continue;
                    }
                    
                    bullet.draw();
                    
                    // 检查子弹是否击中墙壁
                    for (const wall of game.walls) {
                        if (bullet.collidesWith(wall)) {
                            game.bullets.splice(i, 1);
                            break;
                        }
                    }
                    
                    // 检查子弹是否击中基地
                    if (bullet.collidesWith(game.base)) {
                        game.bullets.splice(i, 1);
                        game.base.health = 0;
                    }
                }
                
                // 更新敌人子弹
                for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
                    const bullet = game.enemyBullets[i];
                    if (!bullet.update()) {
                        game.enemyBullets.splice(i, 1);
                        continue;
                    }
                    
                    bullet.draw();
                    
                    // 检查子弹是否击中玩家
                    if (bullet.collidesWith(game.player)) {
                        game.enemyBullets.splice(i, 1);
                        game.lives--;
                        updateUI();
                        
                        if (game.lives <= 0) {
                            gameOver(false);
                            return;
                        }
                    }
                    
                    // 检查子弹是否击中墙壁
                    for (const wall of game.walls) {
                        if (bullet.collidesWith(wall)) {
                            game.enemyBullets.splice(i, 1);
                            break;
                        }
                    }
                    
                    // 检查子弹是否击中基地
                    if (bullet.collidesWith(game.base)) {
                        game.enemyBullets.splice(i, 1);
                        game.base.health = 0;
                        gameOver(false);
                        return;
                    }
                }
                
                // 绘制墙壁
                for (const wall of game.walls) {
                    wall.draw();
                }
                
                // 绘制基地
                game.base.draw();
                
                // 生成新敌人
                game.enemySpawnTimer += deltaTime;
                if (game.enemySpawnTimer > 2000) { // 每2秒生成一个敌人
                    if (game.enemies.length < 5 + game.level) {
                        spawnEnemy();
                    }
                    game.enemySpawnTimer = 0;
                }
                
                // 检查胜利条件
                if (game.score >= 1000 * game.level) {
                    game.level++;
                    // 每升一级增加生命
                    game.lives++;
                    updateUI();
                }
                
                // 检查基地是否被摧毁
                if (game.base.health <= 0) {
                    gameOver(false);
                    return;
                }
                
                // 继续游戏循环
                requestAnimationFrame(gameLoop);
            }
            
            // 绘制背景网格
            function drawBackground() {
                // 深色背景
                ctx.fillStyle = '#0a1929';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 网格线
                ctx.strokeStyle = 'rgba(77, 171, 247, 0.05)';
                ctx.lineWidth = 1;
                
                // 垂直线
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 水平线
                for (let y = 0; y < canvas.height; y += 50) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 战场边界
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 2;
                ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            }
            
            // 事件监听
            startBtn.addEventListener('click', function() {
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                game.running = true;
                initGame();
                requestAnimationFrame(gameLoop);
            });
            
            restartBtn.addEventListener('click', function() {
                gameOverScreen.classList.add('hidden');
                game.running = true;
                initGame();
                requestAnimationFrame(gameLoop);
            });
            
            // 键盘控制
            document.addEventListener('keydown', function(e) {
                game.keys[e.key] = true;
                
                // 空格键射击
                if (e.key === ' ' && game.running) {
                    e.preventDefault();
                    game.player.shoot();
                }
            });
            
            document.addEventListener('keyup', function(e) {
                game.keys[e.key] = false;
            });
            
            // 鼠标/触屏射击
            canvas.addEventListener('click', function() {
                if (game.running) {
                    game.player.shoot();
                }
            });
            
            // 移动控制按钮事件
            function setupMobileButton(btn, key) {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    game.keys[key] = true;
                });
                
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    game.keys[key] = false;
                });
                
                btn.addEventListener('mousedown', function() {
                    game.keys[key] = true;
                });
                
                btn.addEventListener('mouseup', function() {
                    game.keys[key] = false;
                });
                
                btn.addEventListener('mouseleave', function() {
                    game.keys[key] = false;
                });
            }
            
            setupMobileButton(upBtn, 'ArrowUp');
            setupMobileButton(leftBtn, 'ArrowLeft');
            setupMobileButton(downBtn, 'ArrowDown');
            setupMobileButton(rightBtn, 'ArrowRight');
            
            fireBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (game.running) game.player.shoot();
            });
            
            fireBtn.addEventListener('mousedown', function() {
                if (game.running) game.player.shoot();
            });
            
            // 初始绘制
            drawBackground();
            
            // 显示开始画面
            startScreen.classList.remove('hidden');
        });
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = 'c0880422-00a8-4969-983f-3ee03ba64ffa';
const gameTitle = '钢铁洪流：坦克大战';
const authorToken = 'ec27c2f8-1e74-4417-9a0c-4169d4baa83e';
const authorName = 'MarsZhou';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
