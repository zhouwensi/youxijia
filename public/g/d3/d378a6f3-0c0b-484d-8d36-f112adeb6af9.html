    <script>

                const container = document.getElementById('gameContainer');

                canvas.height = container.clientHeight;
                gameState.tileSize = Math.min(canvas.width, canvas.height) / 12;
                drawGame();

            // 加载地图

                gameState.gameMap = JSON.parse(JSON.stringify(mapConfigs[floor]));
                
                // 寻找玩家位置
                for (let y = 0; y < gameState.gameMap.length; y++) {
                    for (let x = 0; x < gameState.gameMap[y].length; x++) {
                        if (gameState.gameMap[y][x] === 2) {
                            gameState.player.x = x;
                            gameState.player.y = y;
                        }
                    }
                }
            }
            
            // 游戏主循环
            function gameLoop() {
                drawGame();
                requestAnimationFrame(gameLoop);
            }
            
            // 绘制游戏
            function drawGame() {
                if (gameState.currentScreen !== 'game') return;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const map = gameState.gameMap;
                const tileSize = gameState.tileSize;
                const offsetX = (canvas.width - map[0].length * tileSize) / 2;
                const offsetY = (canvas.height - map.length * tileSize) / 2;
                
                // 绘制地图
                for (let y = 0; y < map.length; y++) {
                    for (let x = 0; x < map[y].length; x++) {
                        const tile = TILES[map[y][x]];
                        ctx.fillStyle = tile.color;
                        ctx.fillRect(offsetX + x * tileSize, offsetY + y * tileSize, tileSize, tileSize);
                        
                        // 绘制边框
                        ctx.strokeStyle = '#1a2438';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(offsetX + x * tileSize, offsetY + y * tileSize, tileSize, tileSize);
                        
                        // 绘制特殊图块图标
                        if (tile.type === 'player') {
                            drawPlayer(offsetX + x * tileSize, offsetY + y * tileSize, tileSize);
                        } else if (tile.type.includes('monster') || tile.type === 'boss') {
                            drawMonster(offsetX + x * tileSize, offsetY + y * tileSize, tileSize);
                        } else if (tile.type === 'chest') {
                            drawChest(offsetX + x * tileSize, offsetY + y * tileSize, tileSize);
                        } else if (tile.type === 'potion') {
                            drawPotion(offsetX + x * tileSize, offsetY + y * tileSize, tileSize);
                        } else if (tile.type.includes('stairs')) {
                            drawStairs(offsetX + x * tileSize, offsetY + y * tileSize, tileSize);
                        }
                    }
                }
            }
            
            // 绘制玩家
            function drawPlayer(x, y, size) {
                ctx.fillStyle = '#4cc9f0';
                ctx.beginPath();
                ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制剑
                ctx.fillStyle = '#e0e0ff';
                ctx.fillRect(x + size/2, y + size/3, size/4, size/3);
            }
            
            // 绘制怪物
            function drawMonster(x, y, size) {
                ctx.fillStyle = '#f72585';
                ctx.beginPath();
                ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制眼睛
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(x + size/2 - size/6, y + size/2 - size/8, size/8, 0, Math.PI * 2);
                ctx.arc(x + size/2 + size/6, y + size/2 - size/8, size/8, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 绘制宝箱
            function drawChest(x, y, size) {
                ctx.fillStyle = '#fca311';
                ctx.fillRect(x + size/4, y + size/3, size/2, size/3);
                
                ctx.fillStyle = '#d68c00';
                ctx.fillRect(x + size/4, y + size/3, size/2, size/6);
            }
            
            // 绘制药水
            function drawPotion(x, y, size) {
                ctx.fillStyle = '#06d6a0';
                ctx.beginPath();
                ctx.ellipse(x + size/2, y + size/2, size/4, size/3, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#04966c';
                ctx.fillRect(x + size/2 - size/8, y + size/4, size/4, size/8);
            }
            
            // 绘制楼梯
            function drawStairs(x, y, size) {
                ctx.fillStyle = '#72efdd';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(x + size/4, y + size/4 + i * size/8, size/2, size/12);
                }
            }
            
            // 处理键盘输入
            function handleKeyDown(e) {
                if (gameState.currentScreen === 'game') {
                    switch(e.key) {
                        case 'ArrowUp': movePlayer(0, -1); break;
                        case 'ArrowDown': movePlayer(0, 1); break;
                        case 'ArrowLeft': movePlayer(-1, 0); break;
                        case 'ArrowRight': movePlayer(1, 0); break;
                        case 'r':
                        case 'R': restartGame(); break;
                    }
                } else if (gameState.currentScreen === 'start' && e.key === 'Enter') {
                    startGame();
                } else if (gameState.currentScreen === 'end' && e.key === 'Enter') {
                    restartGame();
                }
            }
            
            // 设置触摸控制
            function setupTouchControls() {
                const controlBtns = document.querySelectorAll('.control-btn');
                controlBtns.forEach(btn => {
                    btn.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const key = btn.getAttribute('data-key');
                        simulateKeyPress(key);
                        btn.style.background = '#4cc9f0';
                    });
                    
                    btn.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        btn.style.background = '#3a506b';
                    });
                });
            }
            
            // 模拟按键
            function simulateKeyPress(key) {
                const event = new KeyboardEvent('keydown', { key: key });
                document.dispatchEvent(event);
            }
            
            // 移动玩家
            function movePlayer(dx, dy) {
                const newX = gameState.player.x + dx;
                const newY = gameState.player.y + dy;
                
                if (newX < 0 || newX >= gameState.gameMap[0].length || 
                    newY < 0 || newY >= gameState.gameMap.length) {
                    return;
                }
                
                const targetTile = gameState.gameMap[newY][newX];
                const tileInfo = TILES[targetTile];
                
                if (!tileInfo.walkable) {
                    // 检查是否是怪物
                    if (tileInfo.type.includes('monster') || tileInfo.type === 'boss') {
                        fightMonster(newX, newY, tileInfo);
                        return;
                    }
                    // 检查是否是门
                    if (targetTile === 11 && gameState.player.yellowKey > 0) {
                        gameState.player.yellowKey--;
                        gameState.gameMap[newY][newX] = 0;
                        moveTo(newX, newY);
                        showMessage('使用了黄钥匙！');
                    } else if (targetTile === 12 && gameState.player.blueKey > 0) {
                        gameState.player.blueKey--;
                        gameState.gameMap[newY][newX] = 0;
                        moveTo(newX, newY);
                        showMessage('使用了蓝钥匙！');
                    }
                    return;
                }
                
                // 检查特殊图块
                switch(targetTile) {
                    case 3: // 上楼
                        if (gameState.floor > 1) {
                            gameState.floor--;
                            loadMap(gameState.floor);
                            showMessage(`到达第${gameState.floor}层`);
                        }
                        break;
                    case 7: // 宝箱
                        gameState.player.gold += tileInfo.gold;
                        gameState.gameMap[newY][newX] = 0;
                        moveTo(newX, newY);
                        showMessage(`获得${tileInfo.gold}金币！`);
                        break;
                    case 8: // 药水
                        gameState.player.hp = Math.min(gameState.player.maxHp, gameState.player.hp + tileInfo.heal);
                        gameState.gameMap[newY][newX] = 0;
                        moveTo(newX, newY);
                        showMessage(`恢复${tileInfo.heal}生命值！`);
                        break;
                    case 9: // 下楼
                        if (gameState.floor < 5) {
                            gameState.floor++;
                            loadMap(gameState.floor);
                            showMessage(`到达第${gameState.floor}层`);
                        }
                        break;
                    default:
                        moveTo(newX, newY);
                }
                
                updateUI();
            }
            
            // 移动到新位置
            function moveTo(x, y) {
                gameState.gameMap[gameState.player.y][gameState.player.x] = 0;
                gameState.player.x = x;
                gameState.player.y = y;
                gameState.gameMap[y][x] = 2;
            }
            
            // 战斗怪物
            function fightMonster(x, y, monster) {
                // 计算伤害
                const playerDamage = Math.max(1, gameState.player.attack - monster.defense);
                const monsterDamage = Math.max(1, monster.attack - gameState.player.defense);
                
                // 计算需要多少回合
                const rounds = Math.ceil(monster.hp / playerDamage);
                const damageTaken = monsterDamage * (rounds - 1);
                
                if (damageTaken < gameState.player.hp) {
                    // 胜利
                    gameState.player.hp -= damageTaken;
                    gameState.player.gold += monster.gold;
                    gameState.monstersKilled++;
                    
                    // 移除怪物
                    gameState.gameMap[y][x] = 0;
                    moveTo(x, y);
                    
                    showMessage(`击败怪物！获得${monster.gold}金币，损失${damageTaken}生命值`);
                    
                    // 检查是否是Boss
                    if (monster.type === 'boss') {
                        endGame(true);
                    }
                } else {
                    // 失败
                    showMessage('怪物太强了！需要提升属性');
                }
                
                updateUI();
            }
            
            // 显示消息
            function showMessage(text) {
                message.textContent = text;
                message.style.opacity = 1;
                
                setTimeout(() => {
                    message.style.opacity = 0;
                }, 2000);
            }
            
            // 更新UI
            function updateUI() {
                document.getElementById('floor').textContent = gameState.floor;
                document.getElementById('hp').textContent = gameState.player.hp;
                document.getElementById('attack').textContent = gameState.player.attack;
                document.getElementById('defense').textContent = gameState.player.defense;
                document.getElementById('gold').textContent = gameState.player.gold;
                document.getElementById('yellowKey').textContent = gameState.player.yellowKey;
                document.getElementById('blueKey').textContent = gameState.player.blueKey;
            }
            
            // 开始游戏
            function startGame() {
                gameState.currentScreen = 'game';
                startScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                endScreen.classList.add('hidden');
                
                // 重置游戏状态
                gameState.floor = 1;
                gameState.player = {
                    x: 1,
                    y: 1,
                    hp: 100,
                    maxHp: 100,
                    attack: 10,
                    defense: 5,
                    gold: 0,
                    yellowKey: 1,
                    blueKey: 0
                };
                gameState.monstersKilled = 0;
                
                loadMap(gameState.floor);
                updateUI();
                drawGame();
            }
            
            // 结束游戏
            function endGame(victory) {
                gameState.currentScreen = 'end';
                gameScreen.classList.add('hidden');
                endScreen.classList.remove('hidden');
                
                if (victory) {
                    document.getElementById('endTitle').textContent = '🎉 胜利！';
                    document.getElementById('endMessage').textContent = '你成功击败了魔塔Boss！';
                } else {
                    document.getElementById('endTitle').textContent = '💀 游戏结束';
                    document.getElementById('endMessage').textContent = '你的冒险在此终结...';
                }
                
                document.getElementById('finalFloor').textContent = gameState.floor;
                document.getElementById('monstersKilled').textContent = gameState.monstersKilled;
                document.getElementById('finalGold').textContent = gameState.player.gold;
            }
            
            // 重新开始游戏
            function restartGame() {
                startGame();
            }
            
            // 绑定按钮事件
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            document.getElementById('playAgainBtn').addEventListener('click', restartGame);
            
            // 初始化游戏
            initGame();
            
            // 检查游戏结束
            setInterval(() => {
                if (gameState.currentScreen === 'game' && gameState.player.hp <= 0) {
                    endGame(false);
                }
            }, 1000);
        });
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = 'd378a6f3-0c0b-484d-8d36-f112adeb6af9';
const gameTitle = '像素魔塔';
const authorToken = 'ec27c2f8-1e74-4417-9a0c-4169d4baa83e';
const authorName = 'MarsZhou';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const isFav = btn.classList.contains('favorited');
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.favorited !== undefined) {
        btn.classList.toggle('favorited', data.favorited);
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
    });
}

// 打开分享面板
function openSharePanel() {
  const url = window.location.href;
  const shareText = '🎮 我发现了一个有趣的AI游戏：「' + gameTitle + '」\n\n👆 点击链接立即游玩：\n' + url + '\n\n💡 关注公众号「游戏开发技术教程」，一句话免费生成你的专属游戏！';
  document.getElementById('share-text').value = shareText;
  document.getElementById('share-panel').style.display = 'flex';
}

// 关闭分享面板
function closeSharePanel() {
  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 检查关注状态
function checkFollowStatus() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.following) {
        const btn = document.getElementById('tiktok-follow-btn');
        if (btn) {
          btn.classList.add('following');
          btn.innerHTML = '✓ 已关注';
        }
      }
    })
    .catch(() => {});
}

// 检查关注状态（主页弹窗）
function checkFollowStatusForProfile() {
  if (!authorToken) return;
  fetch('/api/users/' + authorToken + '/follow-status', { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      const btn = document.getElementById('profile-follow-btn');
      if (btn && data.success && data.following) {
        btn.style.background = '#eee';
        btn.style.color = '#666';
        btn.innerHTML = '✓ 已关注';
      }
    })
    .catch(() => {});
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 从主页弹窗切换关注
function toggleFollowFromProfile() {
  if (!authorToken) return;
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录');
    return;
  }
  
  const btn = document.getElementById('profile-follow-btn');
  const isFollowing = btn.innerHTML.includes('已关注');
  
  // 乐观更新
  if (isFollowing) {
    btn.style.background = '#fe2c55';
    btn.style.color = '#fff';
    btn.innerHTML = '+ 关注';
  } else {
    btn.style.background = '#eee';
    btn.style.color = '#666';
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.following) {
          btn.style.background = '#eee';
          btn.style.color = '#666';
          btn.innerHTML = '✓ 已关注';
        } else {
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
          btn.innerHTML = '+ 关注';
        }
        // 同步更新底部的关注按钮
        const tikBtn = document.getElementById('tiktok-follow-btn');
        if (tikBtn) {
          tikBtn.classList.toggle('following', data.following);
          tikBtn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
        }
      }
    })
    .catch(() => {});
}
