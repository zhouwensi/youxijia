    <div class="rotate-warning">请将设备横屏以获得最佳游戏体验</div>
    <canvas id="gameCanvas"></canvas>
    <div id="startScreen" class="screen">

    </div>

        <p class="subtitle" id="endScore">得分: 0</p>
        <button id="restartBtn" class="btn">重新开始</button>
    </div>
    <div class="controls">
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-base"></div>
            <div class="joystick-thumb" id="joystickThumb"></div>
        </div>
        <div class="skills">
            <div class="skill-btn" id="skill1" data-key="Q">
                <div class="skill-key">Q</div>
                <div>斩击</div>
            </div>
            <div class="skill-btn" id="skill2" data-key="W">
                <div class="skill-key">W</div>
                <div>突进</div>
            </div>
            <div class="skill-btn" id="skill3" data-key="E">
                <div class="skill-key">E</div>
                <div>护盾</div>
            </div>
            <div class="skill-btn" id="skill4" data-key="R">
                <div class="skill-key">R</div>
                <div>大招</div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const endScreen = document.getElementById('endScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const joystickThumb = document.getElementById('joystickThumb');
            const joystickArea = document.getElementById('joystickArea');
            const skillButtons = [
                document.getElementById('skill1'),
                document.getElementById('skill2'),
                document.getElementById('skill3'),
                document.getElementById('skill4')
            ];
            const endScore = document.getElementById('endScore');

            let gameRunning = false;
            let score = 0;
            let playerHealth = 100;
            let maxHealth = 100;
            let player = null;
            let enemies = [];
            let projectiles = [];
            let effects = [];
            let keys = {};
            let joystickActive = false;
            let joystickVector = { x: 0, y: 0 };
            let joystickOrigin = { x: 0, y: 0 };
            let skillCooldowns = [0, 0, 0, 0];
            const skillCooldownTimes = [1, 2, 3, 5];
            let lastTime = 0;

            class Player {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 25;
                    this.speed = 5;
                    this.color = '#ff9900';
                    this.damage = 10;
                    this.shield = 0;
                    this.shieldTime = 0;
                }
                update(deltaTime) {
                    let moveX = 0, moveY = 0;
                    if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
                    if (keys['ArrowRight'] || keys['d']) moveX += 1;
                    if (keys['ArrowUp'] || keys['w']) moveY -= 1;
                    if (keys['ArrowDown'] || keys['s']) moveY += 1;
                    if (joystickActive) {
                        moveX += joystickVector.x;
                        moveY += joystickVector.y;
                    }
                    if (moveX !== 0 || moveY !== 0) {
                        const len = Math.sqrt(moveX * moveX + moveY * moveY);
                        moveX /= len;
                        moveY /= len;
                        this.x += moveX * this.speed;
                        this.y += moveY * this.speed;
                        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                    }
                    if (this.shieldTime > 0) {
                        this.shieldTime -= deltaTime;
                        if (this.shieldTime <= 0) this.shield = 0;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    if (this.shield > 0) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius + 10, 0, Math.PI * 2);
                        ctx.strokeStyle = '#55aaff';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('英雄', this.x, this.y + 5);
                }
                takeDamage(damage) {
                    const shieldDamage = Math.min(this.shield, damage);
                    this.shield -= shieldDamage;
                    const healthDamage = damage - shieldDamage;
                    playerHealth -= healthDamage;
                    if (playerHealth <= 0) {
                        playerHealth = 0;
                        gameOver();
                    }
                }
                addShield(amount, duration) {
                    this.shield = amount;
                    this.shieldTime = duration;
                }
            }

            class Enemy {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = 20;
                    this.speed = 1.5;
                    this.color = '#ff5555';
                    this.health = 30;
                    this.maxHealth = 30;
                }
                update() {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 0) {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    }
                    if (dist < this.radius + player.radius) {
                        player.takeDamage(5);
                        this.health = 0;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('小兵', this.x, this.y + 5);
                    const healthWidth = 40;
                    const healthPercent = this.health / this.maxHealth;
                    ctx.fillStyle = '#333333';
                    ctx.fillRect(this.x - healthWidth/2, this.y - this.radius - 15, healthWidth, 6);
                    ctx.fillStyle = healthPercent > 0.5 ? '#44ff44' : healthPercent > 0.25 ? '#ffff44' : '#ff4444';
                    ctx.fillRect(this.x - healthWidth/2, this.y - this.radius - 15, healthWidth * healthPercent, 6);
                }
                takeDamage(damage) {
                    this.health -= damage;
                    if (this.health <= 0) {
                        score += 10;
                        return true;
                    }
                    return false;
                }
            }

            class Projectile {
                constructor(x, y, dx, dy, damage, color, radius = 8) {
                    this.x = x;
                    this.y = y;
                    this.dx = dx;
                    this.dy = dy;
                    this.damage = damage;
                    this.color = color;
                    this.radius = radius;
                    this.speed = 10;
                }
                update() {
                    this.x += this.dx * this.speed;
                    this.y += this.dy * this.speed;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                isOutOfBounds() {
                    return this.x < -50 || this.x > canvas.width + 50 || this.y < -50 || this.y > canvas.height + 50;
                }
            }

            class Effect {
                constructor(x, y, type, duration) {
                    this.x = x;
                    this.y = y;
                    this.type = type;
                    this.duration = duration;
                    this.maxDuration = duration;
                    this.radius = 30;
                }
                update(deltaTime) {
                    this.duration -= deltaTime;
                    return this.duration > 0;
                }
                draw() {
                    const alpha = this.duration / this.maxDuration;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    if (this.type === 'slash') {
                        ctx.strokeStyle = '#ffaa00';
                        ctx.lineWidth = 5;
                        ctx.stroke();
                    } else if (this.type === 'dash') {
                        ctx.strokeStyle = '#ff6600';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                    } else if (this.type === 'shield') {
                        ctx.strokeStyle = '#55aaff';
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    } else if (this.type === 'ultimate') {
                        ctx.strokeStyle = '#ff00ff';
                        ctx.lineWidth = 8;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }
            }

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                if (player) {
                    player.x = Math.min(player.x, canvas.width - player.radius);
                    player.y = Math.min(player.y, canvas.height - player.radius);
                }
            }

            function initGame() {
                player = new Player(canvas.width / 2, canvas.height / 2);
                enemies = [];
                projectiles = [];
                effects = [];
                score = 0;
                playerHealth = maxHealth;
                skillCooldowns.fill(0);
                gameRunning = true;
                startScreen.classList.add('hidden');
                endScreen.classList.add('hidden');
            }

            function gameOver() {
                gameRunning = false;
                endScore.textContent = `得分: ${score}`;
                endScreen.classList.remove('hidden');
            }

            function spawnEnemy() {
                if (!gameRunning) return;
                const side = Math.floor(Math.random() * 4);
                let x, y;
                switch(side) {
                    case 0: x = -30; y = Math.random() * canvas.height; break;
                    case 1: x = canvas.width + 30; y = Math.random() * canvas.height; break;
                    case 2: x = Math.random() * canvas.width; y = -30; break;
                    case 3: x = Math.random() * canvas.width; y = canvas.height + 30; break;
                }
                enemies.push(new Enemy(x, y));
            }

            function useSkill(index) {
                if (!gameRunning || skillCooldowns[index] > 0) return;
                skillCooldowns[index] = skillCooldownTimes[index];
                const angle = Math.atan2(joystickVector.y || 0, joystickVector.x || 0) || Math.PI/2;
                switch(index) {
                    case 0:
                        for(let i = 0; i < 8; i++) {
                            const a = angle + (i - 4) * 0.2;
                            projectiles.push(new Projectile(player.x, player.y, Math.cos(a), Math.sin(a), 15, '#ffaa00'));
                        }
                        effects.push(new Effect(player.x, player.y, 'slash', 0.3));
                        break;
                    case 1:
                        player.x += Math.cos(angle) * 80;
                        player.y += Math.sin(angle) * 80;
                        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
                        effects.push(new Effect(player.x, player.y, 'dash', 0.4));
                        break;
                    case 2:
                        player.addShield(30, 3);
                        effects.push(new Effect(player.x, player.y, 'shield', 0.5));
                        break;
                    case 3:
                        for(let i = 0; i < 12; i++) {
                            const a = (i / 12) * Math.PI * 2;
                            projectiles.push(new Projectile(player.x, player.y, Math.cos(a), Math.sin(a), 25, '#ff00ff', 12));
                        }
                        effects.push(new Effect(player.x, player.y, 'ultimate', 0.6));
                        break;
                }
            }

            function updateGame(deltaTime) {
                if (!gameRunning) return;
                player.update(deltaTime);
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].update();
                    if (enemies[i].health <= 0) {
                        enemies.splice(i, 1);
                    }
                }
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].update();
                    if (projectiles[i].isOutOfBounds()) {
                        projectiles.splice(i, 1);
                        continue;
                    }
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const dx = projectiles[i].x - enemies[j].x;
                        const dy = projectiles[i].y - enemies[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < projectiles[i].radius + enemies[j].radius) {
                            if (enemies[j].takeDamage(projectiles[i].damage)) {
                                enemies.splice(j, 1);
                            }
                            projectiles.splice(i, 1);
                            break;
                        }
                    }
                }
                for (let i = effects.length - 1; i >= 0; i--) {
                    if (!effects[i].update(deltaTime)) {
                        effects.splice(i, 1);
                    }
                }
                for (let i = 0; i < skillCooldowns.length; i++) {
                    if (skillCooldowns[i] > 0) {
                        skillCooldowns[i] -= deltaTime;
                        if (skillCooldowns[i] < 0) skillCooldowns[i] = 0;
                        const btn = skillButtons[i];
                        const cdText = skillCooldowns[i].toFixed(1);
                        let cdEl = btn.querySelector('.skill-cd');
                        if (!cdEl) {
                            cdEl = document.createElement('div');
                            cdEl.className = 'skill-cd';
                            btn.appendChild(cdEl);
                        }
                        cdEl.textContent = cdText;
                        btn.style.opacity = skillCooldowns[i] > 0 ? '0.6' : '1';
                    }
                }
                if (Math.random() < 0.02) spawnEnemy();
            }

            function drawGame() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(20, 20, 40, 0.1)';
                for(let i = 0; i < canvas.width; i += 50) {
                    for(let j = 0; j < canvas.height; j += 50) {
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
                player.draw();
                enemies.forEach(enemy => enemy.draw());
                projectiles.forEach(p => p.draw());
                effects.forEach(e => e.draw());
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`得分: ${score}`, 20, 40);
                const healthPercent = playerHealth / maxHealth;
                const healthWidth = 200;
                ctx.fillStyle = '#333333';
                ctx.fillRect(20, 60, healthWidth, 20);
                ctx.fillStyle = healthPercent > 0.5 ? '#44ff44' : healthPercent > 0.25 ? '#ffff44' : '#ff4444';
                ctx.fillRect(20, 60, healthWidth * healthPercent, 20);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(20, 60, healthWidth, 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px Arial';
                ctx.fillText(`生命: ${playerHealth}/${maxHealth}`, 30, 77);
            }

            function gameLoop(timestamp) {
                const deltaTime = (timestamp - lastTime) / 1000 || 0;
                lastTime = timestamp;
                updateGame(deltaTime);
                drawGame();
                requestAnimationFrame(gameLoop);
            }

            function setupJoystick() {
                let touchId = null;
                joystickArea.addEventListener('touchstart', (e) => {
                    if (touchId !== null) return;
                    const touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    const rect = joystickArea.getBoundingClientRect();
                    joystickOrigin.x = rect.left + rect.width / 2;
                    joystickOrigin.y = rect.top + rect.height / 2;
                    joystickActive = true;
                    updateJoystick(touch.clientX, touch.clientY);
                    e.preventDefault();
                });
                document.addEventListener('touchmove', (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === touchId) {
                            updateJoystick(touch.clientX, touch.clientY);
                            e.preventDefault();
                            break;
                        }
                    }
                });
                document.addEventListener('touchend', (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === touchId) {
                            touchId = null;
                            joystickActive = false;
                            joystickVector.x = 0;
                            joystickVector.y = 0;
                            joystickThumb.style.transform = 'translate(-50%, -50%)';
                            break;
                        }
                    }
                });
                function updateJoystick(x, y) {
                    const dx = x - joystickOrigin.x;
                    const dy = y - joystickOrigin.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 60;
                    const limitedDist = Math.min(dist, maxDist);
                    const angle = Math.atan2(dy, dx);
                    joystickVector.x = Math.cos(angle) * (limitedDist / maxDist);
                    joystickVector.y = Math.sin(angle) * (limitedDist / maxDist);
                    const thumbX = Math.cos(angle) * limitedDist;
                    const thumbY = Math.sin(angle) * limitedDist;
                    joystickThumb.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;
                }
            }

            function setupControls() {
                document.addEventListener('keydown', (e) => {
                    keys[e.key] = true;
                    if (e.key === 'q' || e.key === 'Q') useSkill(0);
                    if (e.key === 'w' || e.key === 'W') useSkill(1);
                    if (e.key === 'e' || e.key === 'E') useSkill(2);
                    if (e.key === 'r' || e.key === 'R') useSkill(3);
                });
                document.addEventListener('keyup', (e) => {
                    keys[e.key] = false;
                });
                skillButtons.forEach((btn, index) => {
                    btn.addEventListener('touchstart', (e) => {
                        useSkill(index);
                        e.preventDefault();
                    });
                    btn.addEventListener('mousedown', () => useSkill(index));
                });
                setupJoystick();
            }

            startBtn.addEventListener('click', () => {
                initGame();
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            });
            restartBtn.addEventListener('click', () => {
                initGame();
                lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            });

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            setupControls();
            setInterval(spawnEnemy, 2000);
        })();
    </script>

<script>
// 获取游戏ID和作者信息
const gameId = 'e45f5c1c-d7b6-445b-8537-5e96e5457f5d';
const gameTitle = '单机MOBA';
const authorToken = '854e9951-0f87-4d3e-b1cc-f6b8559fbe9c';
const authorName = '匿名';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const userToken = getUserToken();
    const canDelete = comment.is_mine || (userToken && comment.user_token === userToken);
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar">' + avatarInitial + '</div>' +
          '<span class="comment-author-name">' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}
