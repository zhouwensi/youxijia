    <style>
        * {
            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color: transparent;
        }

            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            text-align: center;
            width: 100%;
        }

            font-size: 3.5rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff9a00, #ff0058);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 90, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .score-container, .best-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px 20px;
            text-align: center;
            min-width: 120px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-label, .best-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .score, .best {
            font-size: 2rem;
            font-weight: bold;
            color: #ffcc00;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(142, 45, 226, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions h3 {
            margin-bottom: 15px;
            color: #4cc9f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions p {
            margin-bottom: 10px;
            line-height: 1.5;
            opacity: 0.9;
        }

        .key-controls, .touch-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .key {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .touch-controls {
            display: none;
        }

        .mobile-controls {
            display: none;
            width: 100%;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 180px;
            height: 180px;

            background: rgba(76, 201, 240, 0.3);
            transform: scale(0.95);
        }

            grid-column: 2;
            grid-row: 1;
        }

        .dpad-left {
            grid-column: 1;
            grid-row: 2;
        }

        .dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: transparent;
            border: none;
        }

        .dpad-right {
            grid-column: 3;
            grid-row: 2;
        }

        .dpad-down {
            grid-column: 2;
            grid-row: 3;
        }

        .game-over, .game-win, .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);

            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 80%;
            line-height: 1.5;
        }

            }

            }
        }

            h1 {
                font-size: 2.2rem;

                font-size: 1.7rem;
            }
            
            .game-over h2, .game-win h2, .start-screen h2 {
                font-size: 2.5rem;
            }
        }
    </style>

    <div class="container">
        <div class="header">
            <h1>2048</h1>
            <p class="subtitle">滑动合并相同数字，目标是得到2048！</p>
        </div>
        
        <div class="game-info">
            <div class="score-container">
                <div class="score-label">分数</div>
                <div class="score" id="score">0</div>
            </div>
            
            <div class="best-container">
                <div class="best-label">最高分</div>
                <div class="best" id="best">0</div>
            </div>
        </div>
        
        <div class="controls">
            <button id="newGameBtn">
                <i class="fas fa-redo"></i> 新游戏
            </button>
            <button id="undoBtn">
                <i class="fas fa-undo"></i> 撤销
            </button>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            
            <div class="start-screen" id="startScreen">
                <h2>2048</h2>
                <p>使用键盘方向键或触屏滑动来移动方块。<br>当两个相同数字的方块碰撞时，它们会合并成一个！</p>
                <button id="startBtn">
                    <i class="fas fa-play"></i> 开始游戏
                </button>
            </div>

            <div class="game-win hidden" id="gameWinScreen">
                <h2>恭喜！</h2>
                <p>你成功合成了2048！<br>你的得分: <span id="winScore">0</span></p>
                <button id="continueBtn">
                    <i class="fas fa-forward"></i> 继续游戏
                </button>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="dpad">
                <div class="dpad-btn dpad-up" id="upBtn">
                    <i class="fas fa-arrow-up"></i>

                    <i class="fas fa-arrow-right"></i>

        <div class="instructions">
            <h3><i class="fas fa-info-circle"></i> 游戏说明</h3>
            <p>通过上下左右滑动来移动所有方块。当两个相同数字的方块碰撞时，它们会合并成一个数字翻倍的方块。每次移动后，会在空白处随机生成一个2或4的方块。目标是合成一个2048的方块！</p>
            
            <div class="key-controls">
                <div class="key">↑</div>
                <div class="key">↓</div>
                <div class="key">←</div>
                <div class="key">→</div>
                <span>方向键控制移动</span>
            </div>
            
            <div class="touch-controls">
                <div class="key"><i class="fas fa-arrows-alt"></i></div>
                <span>在游戏区域滑动控制移动</span>
            </div>
        </div>
        
        <div class="footer">
            <p>2048 游戏 | 使用 HTML5 Canvas 开发</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏常量
            const GRID_SIZE = 4;
            const CELL_SIZE = 100;
            const CELL_GAP = 15;
            const ANIMATION_SPEED = 150;
            
            // 游戏状态
            let grid = [];
            let score = 0;
            let bestScore = localStorage.getItem('2048-best-score') || 0;
            let gameOver = false;
            let gameWon = false;
            let isAnimating = false;
            let moveHistory = [];
            let canvas, ctx;
            
            // DOM 元素
            const scoreElement = document.getElementById('score');
            const bestElement = document.getElementById('best');
            const gameCanvas = document.getElementById('gameCanvas');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const gameWinScreen = document.getElementById('gameWinScreen');
            const finalScoreElement = document.getElementById('finalScore');
            const winScoreElement = document.getElementById('winScore');
            
            // 按钮
            const newGameBtn = document.getElementById('newGameBtn');
            const undoBtn = document.getElementById('undoBtn');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const continueBtn = document.getElementById('continueBtn');
            
            // 移动端控制按钮
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 初始化游戏
            function init() {
                canvas = gameCanvas;
                ctx = canvas.getContext('2d');
                
                // 设置画布尺寸
                const container = document.querySelector('.game-container');
                const size = Math.min(container.clientWidth, container.clientHeight) - 30;
                canvas.width = size;
                canvas.height = size;
                
                // 更新最高分显示
                bestElement.textContent = bestScore;
                
                // 初始化网格
                initializeGrid();
                
                // 绘制初始状态
                draw();
                
                // 显示开始屏幕
                startScreen.classList.remove('hidden');
                gameOverScreen.classList.add('hidden');
                gameWinScreen.classList.add('hidden');
            }
            
            // 初始化网格
            function initializeGrid() {
                grid = [];
                for (let row = 0; row < GRID_SIZE; row++) {
                    grid[row] = [];
                    for (let col = 0; col < GRID_SIZE; col++) {
                        grid[row][col] = { value: 0, merged: false, new: false };
                    }
                }
                
                // 添加两个初始方块
                addRandomTile();
                addRandomTile();
                
                // 重置游戏状态
                score = 0;
                gameOver = false;
                gameWon = false;
                moveHistory = [];
                updateScore();
            }
            
            // 添加随机方块
            function addRandomTile() {
                const emptyCells = [];
                
                // 查找所有空单元格
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (grid[row][col].value === 0) {
                            emptyCells.push({ row, col });
                        }
                    }
                }
                
                // 如果有空单元格，随机选择一个并添加2或4
                if (emptyCells.length > 0) {
                    const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    // 90% 概率生成2，10% 概率生成4
                    grid[randomCell.row][randomCell.col] = { 
                        value: Math.random() < 0.9 ? 2 : 4, 
                        merged: false, 
                        new: true 
                    };
                }
            }
            
            // 保存移动历史
            function saveMoveHistory() {
                const history = [];
                for (let row = 0; row < GRID_SIZE; row++) {
                    history[row] = [];
                    for (let col = 0; col < GRID_SIZE; col++) {
                        history[row][col] = grid[row][col].value;
                    }
                }
                
                moveHistory.push({
                    grid: history,
                    score: score
                });
                
                // 只保留最近10步历史
                if (moveHistory.length > 10) {
                    moveHistory.shift();
                }
            }
            
            // 撤销上一步
            function undoMove() {
                if (moveHistory.length === 0 || isAnimating) return;
                
                const lastMove = moveHistory.pop();
                if (!lastMove) return;
                
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        grid[row][col] = { 
                            value: lastMove.grid[row][col], 
                            merged: false, 
                            new: false 
                        };
                    }
                }
                
                score = lastMove.score;
                gameOver = false;
                gameWon = false;
                updateScore();
                draw();
            }
            
            // 更新分数显示
            function updateScore() {
                scoreElement.textContent = score;
                
                // 更新最高分
                if (score > bestScore) {
                    bestScore = score;
                    bestElement.textContent = bestScore;
                    localStorage.setItem('2048-best-score', bestScore);
                }
            }
            
            // 检查游戏是否结束
            function checkGameOver() {
                // 检查是否有空单元格
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (grid[row][col].value === 0) {
                            return false;
                        }
                    }
                }
                
                // 检查是否有可合并的相邻单元格
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        const current = grid[row][col].value;
                        
                        // 检查右侧单元格
                        if (col < GRID_SIZE - 1 && grid[row][col + 1].value === current) {
                            return false;
                        }
                        
                        // 检查下方单元格
                        if (row < GRID_SIZE - 1 && grid[row + 1][col].value === current) {
                            return false;
                        }
                    }
                }
                
                return true;
            }
            
            // 检查是否获胜
            function checkGameWin() {
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (grid[row][col].value === 2048) {
                            return true;
                        }
                    }
                }
                return false;
            }
            
            // 移动方块
            function move(direction) {
                if (gameOver || isAnimating) return;
                
                // 保存移动前的状态
                const oldGrid = JSON.parse(JSON.stringify(grid));
                const oldScore = score;
                
                let moved = false;
                
                // 重置方块状态
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        grid[row][col].merged = false;
                        grid[row][col].new = false;
                    }
                }
                
                // 根据方向处理移动
                if (direction === 'left') {
                    moved = moveLeft();
                } else if (direction === 'right') {
                    moved = moveRight();
                } else if (direction === 'up') {
                    moved = moveUp();
                } else if (direction === 'down') {
                    moved = moveDown();
                }
                
                // 如果发生了移动
                if (moved) {
                    // 保存历史
                    saveMoveHistory();
                    
                    // 添加新方块
                    addRandomTile();
                    
                    // 更新分数
                    updateScore();
                    
                    // 检查游戏状态
                    if (checkGameWin() && !gameWon) {
                        gameWon = true;
                        winScoreElement.textContent = score;
                        gameWinScreen.classList.remove('hidden');
                    } else if (checkGameOver()) {
                        gameOver = true;
                        finalScoreElement.textContent = score;
                        gameOverScreen.classList.remove('hidden');
                    }
                    
                    // 绘制动画
                    animateMove(oldGrid, oldScore);
                }
            }
            
            // 向左移动
            function moveLeft() {
                let moved = false;
                
                for (let row = 0; row < GRID_SIZE; row++) {
                    // 合并相同数字
                    for (let col = 0; col < GRID_SIZE - 1; col++) {
                        if (grid[row][col].value === 0) continue;
                        
                        for (let nextCol = col + 1; nextCol < GRID_SIZE; nextCol++) {
                            if (grid[row][nextCol].value === 0) continue;
                            
                            if (grid[row][col].value === grid[row][nextCol].value) {
                                // 合并方块
                                grid[row][col].value *= 2;
                                grid[row][col].merged = true;
                                grid[row][nextCol].value = 0;
                                score += grid[row][col].value;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                    
                    // 移动方块到左侧
                    for (let col = 0; col < GRID_SIZE; col++) {
                        if (grid[row][col].value === 0) {
                            for (let nextCol = col + 1; nextCol < GRID_SIZE; nextCol++) {
                                if (grid[row][nextCol].value !== 0) {
                                    grid[row][col].value = grid[row][nextCol].value;
                                    grid[row][nextCol].value = 0;
                                    moved = true;
                                    break;
                                }
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向右移动
            function moveRight() {
                let moved = false;
                
                for (let row = 0; row < GRID_SIZE; row++) {
                    // 合并相同数字
                    for (let col = GRID_SIZE - 1; col > 0; col--) {
                        if (grid[row][col].value === 0) continue;
                        
                        for (let prevCol = col - 1; prevCol >= 0; prevCol--) {
                            if (grid[row][prevCol].value === 0) continue;
                            
                            if (grid[row][col].value === grid[row][prevCol].value) {
                                // 合并方块
                                grid[row][col].value *= 2;
                                grid[row][col].merged = true;
                                grid[row][prevCol].value = 0;
                                score += grid[row][col].value;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                    
                    // 移动方块到右侧
                    for (let col = GRID_SIZE - 1; col >= 0; col--) {
                        if (grid[row][col].value === 0) {
                            for (let prevCol = col - 1; prevCol >= 0; prevCol--) {
                                if (grid[row][prevCol].value !== 0) {
                                    grid[row][col].value = grid[row][prevCol].value;
                                    grid[row][prevCol].value = 0;
                                    moved = true;
                                    break;
                                }
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向上移动
            function moveUp() {
                let moved = false;
                
                for (let col = 0; col < GRID_SIZE; col++) {
                    // 合并相同数字
                    for (let row = 0; row < GRID_SIZE - 1; row++) {
                        if (grid[row][col].value === 0) continue;
                        
                        for (let nextRow = row + 1; nextRow < GRID_SIZE; nextRow++) {
                            if (grid[nextRow][col].value === 0) continue;
                            
                            if (grid[row][col].value === grid[nextRow][col].value) {
                                // 合并方块
                                grid[row][col].value *= 2;
                                grid[row][col].merged = true;
                                grid[nextRow][col].value = 0;
                                score += grid[row][col].value;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                    
                    // 移动方块到上方
                    for (let row = 0; row < GRID_SIZE; row++) {
                        if (grid[row][col].value === 0) {
                            for (let nextRow = row + 1; nextRow < GRID_SIZE; nextRow++) {
                                if (grid[nextRow][col].value !== 0) {
                                    grid[row][col].value = grid[nextRow][col].value;
                                    grid[nextRow][col].value = 0;
                                    moved = true;
                                    break;
                                }
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 向下移动
            function moveDown() {
                let moved = false;
                
                for (let col = 0; col < GRID_SIZE; col++) {
                    // 合并相同数字
                    for (let row = GRID_SIZE - 1; row > 0; row--) {
                        if (grid[row][col].value === 0) continue;
                        
                        for (let prevRow = row - 1; prevRow >= 0; prevRow--) {
                            if (grid[prevRow][col].value === 0) continue;
                            
                            if (grid[row][col].value === grid[prevRow][col].value) {
                                // 合并方块
                                grid[row][col].value *= 2;
                                grid[row][col].merged = true;
                                grid[prevRow][col].value = 0;
                                score += grid[row][col].value;
                                moved = true;
                                break;
                            } else {
                                break;
                            }
                        }
                    }
                    
                    // 移动方块到下方
                    for (let row = GRID_SIZE - 1; row >= 0; row--) {
                        if (grid[row][col].value === 0) {
                            for (let prevRow = row - 1; prevRow >= 0; prevRow--) {
                                if (grid[prevRow][col].value !== 0) {
                                    grid[row][col].value = grid[prevRow][col].value;
                                    grid[prevRow][col].value = 0;
                                    moved = true;
                                    break;
                                }
                            }
                        }
                    }
                }
                
                return moved;
            }
            
            // 动画效果
            function animateMove(oldGrid, oldScore) {
                isAnimating = true;
                
                // 简单动画：直接重绘
                setTimeout(() => {
                    draw();
                    isAnimating = false;
                }, ANIMATION_SPEED);
            }
            
            // 绘制游戏
            function draw() {
                // 清除画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 计算单元格实际大小
                const cellSize = (canvas.width - (GRID_SIZE + 1) * CELL_GAP) / GRID_SIZE;
                
                // 绘制背景
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                for (let row = 0; row < GRID_SIZE; row++) {
                    for (let col = 0; col < GRID_SIZE; col++) {
                        const x = col * (cellSize + CELL_GAP) + CELL_GAP;
                        const y = row * (cellSize + CELL_GAP) + CELL_GAP;
                        
                        // 绘制单元格背景
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                        ctx.fillRect(x, y, cellSize, cellSize);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.strokeRect(x, y, cellSize, cellSize);
                        
                        // 绘制方块
                        const value = grid[row][col].value;
                        if (value !== 0) {
                            // 根据数字大小设置颜色
                            const color = getTileColor(value);
                            ctx.fillStyle = color.background;
                            ctx.fillRect(x, y, cellSize, cellSize);
                            
                            // 绘制边框
                            ctx.strokeStyle = color.border;
                            ctx.lineWidth = 3;
                            ctx.strokeRect(x, y, cellSize, cellSize);
                            
                            // 绘制数字
                            ctx.fillStyle = color.text;
                            ctx.font = `bold ${value < 100 ? cellSize * 0.5 : cellSize * 0.4}px Arial`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(value, x + cellSize / 2, y + cellSize / 2);
                            
                            // 如果是新生成的方块，添加闪烁效果
                            if (grid[row][col].new) {
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                                ctx.fillRect(x, y, cellSize, cellSize);
                            }
                            
                            // 如果是合并的方块，添加合并效果
                            if (grid[row][col].merged) {
                                ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                                ctx.fillRect(x, y, cellSize, cellSize);
                            }
                        }
                    }
                }
            }
            
            // 获取方块颜色
            function getTileColor(value) {
                const colors = {
                    2: { background: '#2A9D8F', text: '#ffffff', border: '#21867a' },
                    4: { background: '#E9C46A', text: '#333333', border: '#d4b259' },
                    8: { background: '#F4A261', text: '#ffffff', border: '#e69147' },
                    16: { background: '#E76F51', text: '#ffffff', border: '#d65c3e' },
                    32: { background: '#9D4EDD', text: '#ffffff', border: '#8c3bcc' },
                    64: { background: '#7209B7', text: '#ffffff', border: '#6108a0' },
                    128: { background: '#3A86FF', text: '#ffffff', border: '#2975ee' },
                    256: { background: '#FF006E', text: '#ffffff', border: '#ee005d' },
                    512: { background: '#FB5607', text: '#ffffff', border: '#ea4506' },
                    1024: { background: '#8338EC', text: '#ffffff', border: '#7227db' },
                    2048: { background: '#FFBE0B', text: '#333333', border: '#eead0a' },
                    4096: { background: '#3A86FF', text: '#ffffff', border: '#2975ee' },
                    8192: { background: '#FF006E', text: '#ffffff', border: '#ee005d' }
                };
                
                return colors[value] || { background: '#333333', text: '#ffffff', border: '#222222' };
            }
            
            // 事件监听器
            function setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    if (gameOver && !gameWon) return;
                    
                    switch(e.key) {
                        case 'ArrowUp':
                        case 'w':
                        case 'W':
                            e.preventDefault();
                            move('up');
                            break;
                        case 'ArrowDown':
                        case 's':
                        case 'S':
                            e.preventDefault();
                            move('down');
                            break;
                        case 'ArrowLeft':
                        case 'a':
                        case 'A':
                            e.preventDefault();
                            move('left');
                            break;
                        case 'ArrowRight':
                        case 'd':
                        case 'D':
                            e.preventDefault();
                            move('right');
                            break;
                    }
                });
                
                // 触屏滑动控制
                let touchStartX, touchStartY;
                
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (gameOver && !gameWon) return;
                    
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                }, { passive: false });
                
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                }, { passive: false });
                
                canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if (gameOver && !gameWon || !touchStartX || !touchStartY) return;
                    
                    const touch = e.changedTouches[0];
                    const touchEndX = touch.clientX;
                    const touchEndY = touch.clientY;
                    
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;
                    const minSwipeDistance = 30;
                    
                    // 重置触摸起点
                    touchStartX = null;
                    touchStartY = null;
                    
                    // 确定滑动方向
                    if (Math.abs(dx) > Math.abs(dy)) {
                        // 水平滑动
                        if (Math.abs(dx) > minSwipeDistance) {
                            if (dx > 0) {
                                move('right');
                            } else {
                                move('left');
                            }
                        }
                    } else {
                        // 垂直滑动
                        if (Math.abs(dy) > minSwipeDistance) {
                            if (dy > 0) {
                                move('down');
                            } else {
                                move('up');
                            }
                        }
                    }
                }, { passive: false });
                
                // 按钮事件
                newGameBtn.addEventListener('click', () => {
                    initializeGrid();
                    startScreen.classList.add('hidden');
                    gameOverScreen.classList.add('hidden');
                    gameWinScreen.classList.add('hidden');
                    draw();
                });

const gameId = 'e619a1a2-42d0-46a9-946c-7572d2ea6073';

const authorName = 'player_1dy3vs';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');

console.log('[DEBUG] authorToken:', authorToken);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
  }
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

function openSharePanel() {

}

// 关闭分享面板
function closeSharePanel() {
  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 切换留言板面板
function toggleCommentsPanel() {
  const panel = document.getElementById('game-comments-section');
  const sidebar = document.querySelector('.tiktok-sidebar');
  const authorInfo = document.getElementById('tiktok-author-info');
  const overlay = document.getElementById('comments-overlay');
  if (panel) {
    const isExpanding = !panel.classList.contains('expanded');
    panel.classList.toggle('expanded');
    // 评论面板展开时隐藏右侧按钮和作者信息（使用class覆盖!important）
    if (sidebar) {
      sidebar.classList.toggle('comments-open', isExpanding);
    }
    if (authorInfo) {
      authorInfo.classList.toggle('comments-open', isExpanding);
    }
    // 控制蒙版显示
    if (overlay) {
      overlay.classList.toggle('visible', isExpanding);
    }
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');
  const inputArea = document.getElementById('comment-input-area');
  const userToken = getUserToken();
  
  if (loginHint && inputArea) {
    if (userToken) {
      loginHint.style.display = 'none';
      inputArea.style.display = 'flex';
    } else {
      loginHint.style.display = 'block';
      inputArea.style.display = 'none';
    }
  }
}

window.addEventListener('load', function() {
  loadStats();
  updateCommentInputUI();
  loadGameComments(true);
});
