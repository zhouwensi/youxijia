<body>
  <!-- 原游戏body内容 -->
  
    <div class="header">
        <h1>🐍 温馨贪吃蛇 🐍</h1>
        <div class="subtitle">给五岁小宝贝的可爱游戏</div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="startScreen" class="screen">
            <h2>欢迎来到贪吃蛇乐园！</h2>
            <p>帮助可爱的小蛇吃到美味的糖果🍬</p>
            <p>小心不要撞到墙壁或者自己的身体哦！</p>
            <div class="score-display">最高分: <span id="highScoreDisplay">0</span></div>
            <button id="startBtn" class="btn">开始游戏</button>
        </div>
        
        <div id="gameOverScreen" class="screen hidden">
            <h2>游戏结束啦！</h2>
            <p>小蛇吃饱了，要休息一下~</p>
            <div class="score-display">你的得分: <span id="finalScore">0</span></div>
            <div class="score-display">最高分: <span id="finalHighScore">0</span></div>
            <button id="restartBtn" class="btn">再玩一次</button>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-instruction">使用方向键或滑动控制小蛇移动</div>
        
        <div class="keyboard-controls">
            <div class="key-row">
                <div class="key">↑</div>
            </div>
            <div class="key-row">
                <div class="key">←</div>
                <div class="key">↓</div>
                <div class="key">→</div>
            </div>
        </div>
        
        <div class="touch-controls">
            <div class="touch-area up" id="upBtn">↑</div>
            <div class="touch-area down" id="downBtn">↓</div>
            <div class="touch-area left" id="leftBtn">←</div>
            <div class="touch-area right" id="rightBtn">→</div>
        </div>
    </div>
    
    <div class="game-info">
        <div class="score">得分: <span id="score">0</span></div>
        <div class="high-score">最高分: <span id="highScore">0</span></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏变量
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');
            const scoreDisplay = document.getElementById('score');
            const highScoreDisplay = document.getElementById('highScore');
            const finalScoreDisplay = document.getElementById('finalScore');
            const finalHighScoreDisplay = document.getElementById('finalHighScore');
            
            // 触摸控制按钮
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            // 游戏设置
            const gridSize = 20;
            const gameSpeed = 10; // 帧数
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameRunning = false;
            let gameLoop;
            
            // 蛇的初始设置
            let snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            
            // 食物位置
            let food = {x: 15, y: 15};
            
            // 蛇的移动方向
            let dx = 1;
            let dy = 0;
            
            // 触摸控制变量
            let touchStartX = 0;
            let touchStartY = 0;
            
            // 初始化画布大小
            function initCanvas() {
                const container = document.querySelector('.game-container');
                const size = Math.min(container.clientWidth, 600);
                canvas.width = size;
                canvas.height = size;
                
                // 更新高分显示
                highScoreDisplay.textContent = highScore;
                document.getElementById('highScoreDisplay').textContent = highScore;
            }
            
            // 绘制游戏元素
            function drawGame() {
                // 清除画布
                ctx.fillStyle = '#fff9fd';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格背景
                drawGrid();
                
                // 绘制食物
                drawFood();
                
                // 绘制蛇
                drawSnake();
            }
            
            // 绘制网格背景
            function drawGrid() {
                ctx.strokeStyle = '#ffccf2';
                ctx.lineWidth = 0.5;
                
                // 垂直线
                for (let x = 0; x <= canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // 水平线
                for (let y = 0; y <= canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 绘制食物
            function drawFood() {
                const x = food.x * gridSize;
                const y = food.y * gridSize;
                
                // 绘制食物主体
                ctx.fillStyle = '#66ff99';
                ctx.beginPath();
                ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 - 1, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制食物高光
                ctx.fillStyle = '#ccffdd';
                ctx.beginPath();
                ctx.arc(x + gridSize/3, y + gridSize/3, gridSize/6, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制食物阴影
                ctx.shadowColor = '#33cc66';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#33cc66';
                ctx.beginPath();
                ctx.arc(x + gridSize/2, y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // 绘制蛇
            function drawSnake() {
                // 绘制蛇的每一节
                for (let i = 0; i < snake.length; i++) {
                    const segment = snake[i];
                    const x = segment.x * gridSize;
                    const y = segment.y * gridSize;
                    
                    // 蛇身颜色渐变
                    const colorValue = Math.max(150, 255 - i * 5);
                    ctx.fillStyle = `rgb(255, ${colorValue}, ${180 + i * 3})`;
                    
                    // 绘制圆角矩形作为蛇身
                    ctx.beginPath();
                    const radius = gridSize / 2 - 1;
                    ctx.roundRect(x, y, gridSize, gridSize, radius);
                    ctx.fill();
                    
                    // 蛇头特殊处理
                    if (i === 0) {
                        // 绘制眼睛
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(x + gridSize/3, y + gridSize/3, gridSize/6, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(x + 2*gridSize/3, y + gridSize/3, gridSize/6, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制瞳孔
                        ctx.fillStyle = '#ff3399';
                        ctx.beginPath();
                        ctx.arc(x + gridSize/3, y + gridSize/3, gridSize/10, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(x + 2*gridSize/3, y + gridSize/3, gridSize/10, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制微笑
                        ctx.strokeStyle = '#ff3399';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(x + gridSize/2, y + 2*gridSize/3, gridSize/4, 0.2 * Math.PI, 0.8 * Math.PI);
                        ctx.stroke();
                    }
                }
            }
            
            // 更新游戏状态
            function updateGame() {
                if (!gameRunning) return;
                
                // 移动蛇
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                
                // 检查是否撞墙
                if (head.x < 0 || head.x >= canvas.width/gridSize || 
                    head.y < 0 || head.y >= canvas.height/gridSize) {
                    gameOver();
                    return;
                }
                
                // 检查是否撞到自己
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) {
                        gameOver();
                        return;
                    }
                }
                
                // 将新头部添加到蛇
                snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    // 增加分数
                    score += 10;
                    scoreDisplay.textContent = score;
                    
                    // 播放吃食物的声音效果
                    playEatSound();
                    
                    // 生成新食物
                    generateFood();
                } else {
                    // 如果没有吃到食物，移除尾部
                    snake.pop();
                }
                
                // 绘制游戏
                drawGame();
            }
            
            // 生成新食物
            function generateFood() {
                let newFood;
                let foodOnSnake;
                
                do {
                    foodOnSnake = false;
                    newFood = {
                        x: Math.floor(Math.random() * (canvas.width / gridSize)),
                        y: Math.floor(Math.random() * (canvas.height / gridSize))
                    };
                    
                    // 检查食物是否在蛇身上
                    for (let segment of snake) {
                        if (segment.x === newFood.x && segment.y === newFood.y) {
                            foodOnSnake = true;
                            break;
                        }
                    }
                } while (foodOnSnake);
                
                food = newFood;
            }
            
            // 游戏结束
            function gameOver() {
                gameRunning = false;
                clearInterval(gameLoop);
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                // 更新显示
                finalScoreDisplay.textContent = score;
                finalHighScoreDisplay.textContent = highScore;
                
                // 显示游戏结束画面
                gameOverScreen.classList.remove('hidden');
            }
            
            // 开始游戏
            function startGame() {
                // 重置游戏状态
                snake = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                dx = 1;
                dy = 0;
                score = 0;
                scoreDisplay.textContent = score;
                highScoreDisplay.textContent = highScore;
                
                // 生成食物
                generateFood();
                
                // 隐藏开始画面
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                
                // 开始游戏循环
                gameRunning = true;
                gameLoop = setInterval(updateGame, 1000 / gameSpeed);
                
                // 绘制初始游戏画面
                drawGame();
            }
            
            // 播放吃食物的声音效果
            function playEatSound() {
                // 创建简单的音频上下文声音
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } catch (e) {
                    console.log("音频上下文不支持");
                }
            }
            
            // 键盘控制
            function keyDownHandler(e) {
                if (!gameRunning) return;
                
                // 防止方向键滚动页面
                if ([37, 38, 39, 40].includes(e.keyCode)) {
                    e.preventDefault();
                }
                
                // 改变方向（防止直接反向移动）
                const key = e.keyCode;
                const goingUp = dy === -1;
                const goingDown = dy === 1;
                const goingRight = dx === 1;
                const goingLeft = dx === -1;
                
                if (key === 37 && !goingRight) { // 左箭头
                    dx = -1;
                    dy = 0;
                } else if (key === 38 && !goingDown) { // 上箭头
                    dx = 0;
                    dy = -1;
                } else if (key === 39 && !goingLeft) { // 右箭头
                    dx = 1;
                    dy = 0;
                } else if (key === 40 && !goingUp) { // 下箭头
                    dx = 0;
                    dy = 1;
                }
            }
            
            // 触摸控制
            function setupTouchControls() {
                // 触摸按钮控制
                upBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (!gameRunning) return;
                    if (dy !== 1) { // 防止直接反向
                        dx = 0;
                        dy = -1;
                    }
                });
                
                downBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (!gameRunning) return;
                    if (dy !== -1) { // 防止直接反向
                        dx = 0;
                        dy = 1;
                    }
                });
                
                leftBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (!gameRunning) return;
                    if (dx !== 1) { // 防止直接反向
                        dx = -1;
                        dy = 0;
                    }
                });
                
                rightBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (!gameRunning) return;
                    if (dx !== -1) { // 防止直接反向
                        dx = 1;
                        dy = 0;
                    }
                });
                
                // 滑动手势控制
                canvas.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    if (!gameRunning) return;
                    
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                });
                
                canvas.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                });
                
                canvas.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if (!gameRunning || !touchStartX) return;
                    
                    const touch = e.changedTouches[0];
                    const touchEndX = touch.clientX;
                    const touchEndY = touch.clientY;
                    
                    const dxTouch = touchEndX - touchStartX;
                    const dyTouch = touchEndY - touchStartY;
                    
                    // 确定滑动方向
                    if (Math.abs(dxTouch) > Math.abs(dyTouch)) {
                        // 水平滑动
                        if (dxTouch > 20 && dx !== -1) { // 向右滑动
                            dx = 1;
                            dy = 0;
                        } else if (dxTouch < -20 && dx !== 1) { // 向左滑动
                            dx = -1;
                            dy = 0;
                        }
                    } else {
                        // 垂直滑动
                        if (dyTouch > 20 && dy !== -1) { // 向下滑动
                            dx = 0;
                            dy = 1;
                        } else if (dyTouch < -20 && dy !== 1) { // 向上滑动
                            dx = 0;
                            dy = -1;
                        }
                    }
                    
                    // 重置触摸起点
                    touchStartX = 0;
                    touchStartY = 0;
                });
            }
            
            // 初始化游戏
            function initGame() {
                // 初始化画布
                initCanvas();
                
                // 设置事件监听器
                window.addEventListener('resize', initCanvas);
                document.addEventListener('keydown', keyDownHandler);
                
                // 设置触摸控制
                setupTouchControls();
                
                // 按钮事件
                startBtn.addEventListener('click', startGame);
                restartBtn.addEventListener('click', startGame);
                
                // 初始绘制
                drawGame();
                
                // 显示最高分
                highScoreDisplay.textContent = highScore;
                document.getElementById('highScoreDisplay').textContent = highScore;
            }
            
            // 启动游戏
            initGame();
        });
    </script>
