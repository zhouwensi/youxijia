            </div>
            
            <div class="mobile-controls">
                <div class="joystick" id="joystickArea">
                    <div class="joystick-handle" id="joystickHandle"></div>
                </div>
                <div class="mobile-btn" id="jumpBtn">↑</div>
                <div class="mobile-btn" id="attackBtn">⚔️</div>
                <div class="mobile-btn" id="magicBtn">🔮</div>
            </div>
        </div>
        
        <div id="endScreen" class="screen hidden">
            <h2>游戏结束</h2>
            <p>你的最终得分: <span id="finalScore" class="highlight">0</span></p>
            <p id="gameResult">宇宙的命运掌握在你的手中</p>
            <button id="restartButton" class="button">再次挑战</button>
            <button id="menuButton" class="button" style="margin-top: 15px;">返回主菜单</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏状态
            const gameState = {
                current: 'start', // start, playing, ended
                score: 0,
                health: 100,
                level: 1,
                player: {
                    x: 400,
                    y: 300,
                    width: 40,
                    height: 60,
                    speed: 5,
                    jumpForce: 15,
                    velocityY: 0,
                    isJumping: false,
                    facing: 'right',
                    attackCooldown: 0,
                    magicType: 'fire'
                },
                enemies: [],
                platforms: [],
                particles: [],
                keys: {},
                touch: {
                    joystickActive: false,
                    joystickX: 0,
                    joystickY: 0,
                    jumpPressed: false,
                    attackPressed: false,
                    magicPressed: false
                }
            };

            // DOM元素
            const startScreen = document.getElementById('startScreen');
            const gameScreen = document.getElementById('gameScreen');
            const endScreen = document.getElementById('endScreen');
            const startButton = document.getElementById('startButton');
            const restartButton = document.getElementById('restartButton');
            const menuButton = document.getElementById('menuButton');
            const scoreElement = document.getElementById('score');
            const finalScoreElement = document.getElementById('finalScore');
            const healthFill = document.getElementById('healthFill');
            const gameResult = document.getElementById('gameResult');
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 移动控制元素
            const joystickArea = document.getElementById('joystickArea');
            const joystickHandle = document.getElementById('joystickHandle');
            const jumpBtn = document.getElementById('jumpBtn');
            const attackBtn = document.getElementById('attackBtn');
            const magicBtn = document.getElementById('magicBtn');

            // 初始化Canvas尺寸
            function resizeCanvas() {
                const container = document.getElementById('gameContainer');
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                
                // 重新生成平台
                generatePlatforms();
            }

            // 生成平台
            function generatePlatforms() {
                gameState.platforms = [];
                const platformCount = Math.floor(canvas.width / 200);
                
                for (let i = 0; i < platformCount; i++) {
                    gameState.platforms.push({
                        x: i * 200 + 50,
                        y: canvas.height - 100 - (i % 3) * 50,
                        width: 150,
                        height: 20,
                        color: i % 2 === 0 ? '#4a4aff' : '#ff4a4a'
                    });
                }
                
                // 添加起始平台
                gameState.platforms.push({
                    x: 350,
                    y: canvas.height - 150,
                    width: 100,
                    height: 20,
                    color: '#4aff4a'
                });
            }

            // 初始化游戏
            function initGame() {
                gameState.score = 0;
                gameState.health = 100;
                gameState.level = 1;
                gameState.enemies = [];
                gameState.particles = [];
                
                gameState.player.x = 400;
                gameState.player.y = 300;
                gameState.player.velocityY = 0;
                gameState.player.isJumping = false;
                gameState.player.attackCooldown = 0;
                gameState.player.magicType = 'fire';
                
                updateScore();
                updateHealth();
                
                // 生成初始敌人
                for (let i = 0; i < 5; i++) {
                    spawnEnemy();
                }
            }

            // 生成敌人
            function spawnEnemy() {
                const types = ['goblin', 'skeleton', 'wizard'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                gameState.enemies.push({
                    x: Math.random() * (canvas.width - 50) + 25,
                    y: Math.random() * (canvas.height - 200) + 50,
                    width: 40,
                    height: 40,
                    speed: 1 + Math.random() * 2,
                    type: type,
                    health: type === 'goblin' ? 30 : type === 'skeleton' ? 50 : 70,
                    maxHealth: type === 'goblin' ? 30 : type === 'skeleton' ? 50 : 70,
                    attackCooldown: 0
                });
            }

            // 切换屏幕
            function showScreen(screenName) {
                startScreen.classList.add('hidden');
                gameScreen.classList.add('hidden');
                endScreen.classList.add('hidden');
                
                gameState.current = screenName;
                
                if (screenName === 'start') {
                    startScreen.classList.remove('hidden');
                } else if (screenName === 'playing') {
                    gameScreen.classList.remove('hidden');
                    initGame();
                    requestAnimationFrame(gameLoop);
                } else if (screenName === 'ended') {
                    endScreen.classList.remove('hidden');
                    finalScoreElement.textContent = gameState.score;
                    
                    if (gameState.score >= 1000) {
                        gameResult.textContent = "太棒了！你拯救了宇宙！";
                    } else if (gameState.score >= 500) {
                        gameResult.textContent = "干得好！但战斗还未结束...";
                    } else {
                        gameResult.textContent = "黑暗势力暂时获胜...";
                    }
                }
            }

            // 更新分数显示
            function updateScore() {
                scoreElement.textContent = gameState.score;
            }

            // 更新生命值显示
            function updateHealth() {
                healthFill.style.width = `${gameState.health}%`;
            }

            // 玩家攻击
            function playerAttack() {
                if (gameState.player.attackCooldown > 0) return;
                
                gameState.player.attackCooldown = 20;
                
                // 创建攻击效果
                for (let i = 0; i < 10; i++) {
                    gameState.particles.push({
                        x: gameState.player.x + (gameState.player.facing === 'right' ? 30 : -30),
                        y: gameState.player.y + 10,
                        vx: (gameState.player.facing === 'right' ? 10 : -10) + (Math.random() * 4 - 2),
                        vy: Math.random() * 4 - 2,
                        size: Math.random() * 5 + 3,
                        color: '#ffcc00',
                        life: 30
                    });
                }
                
                // 检测敌人命中
                for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                    const enemy = gameState.enemies[i];
                    const dx = enemy.x - gameState.player.x;
                    const dy = enemy.y - gameState.player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 80) {
                        enemy.health -= 20;
                        
                        if (enemy.health <= 0) {
                            gameState.score += enemy.type === 'goblin' ? 50 : enemy.type === 'skeleton' ? 75 : 100;
                            gameState.enemies.splice(i, 1);
                            spawnEnemy(); // 生成新敌人
                            updateScore();
                        }
                    }
                }
            }

            // 使用魔法
            function useMagic() {
                const magicColors = {
                    fire: '#ff3300',
                    ice: '#00ccff',
                    lightning: '#ffcc00'
                };
                
                // 创建魔法效果
                for (let i = 0; i < 20; i++) {
                    gameState.particles.push({
                        x: gameState.player.x,
                        y: gameState.player.y + 10,
                        vx: (Math.random() * 10 - 5) * 2,
                        vy: (Math.random() * 10 - 5) * 2,
                        size: Math.random() * 8 + 4,
                        color: magicColors[gameState.player.magicType],
                        life: 40
                    });
                }
                
                // 魔法攻击所有敌人
                gameState.enemies.forEach(enemy => {
                    const dx = enemy.x - gameState.player.x;
                    const dy = enemy.y - gameState.player.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        enemy.health -= 30;
                        
                        if (enemy.health <= 0) {
                            gameState.score += enemy.type === 'goblin' ? 50 : enemy.type === 'skeleton' ? 75 : 100;
                            spawnEnemy();
                            updateScore();
                        }
                    }
                });
                
                // 切换魔法类型
                const magicTypes = ['fire', 'ice', 'lightning'];
                const currentIndex = magicTypes.indexOf(gameState.player.magicType);
                gameState.player.magicType = magicTypes[(currentIndex + 1) % magicTypes.length];
            }

            // 游戏主循环
            function gameLoop() {
                if (gameState.current !== 'playing') return;
                
                // 清空画布
                ctx.fillStyle = '#0f0f1f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景
                drawBackground();
                
                // 更新游戏状态
                updateGame();
                
                // 绘制游戏元素
                drawPlatforms();
                drawPlayer();
                drawEnemies();
                drawParticles();
                
                // 继续循环
                requestAnimationFrame(gameLoop);
            }

            // 绘制背景
            function drawBackground() {
                // 星空
                ctx.fillStyle = '#1a1a3a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 星星
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 100; i++) {
                    const x = (i * 7.3) % canvas.width;
                    const y = (i * 5.7) % canvas.height;
                    const size = Math.sin(Date.now() / 1000 + i) * 1 + 1;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // X-Way通道效果
                ctx.strokeStyle = 'rgba(74, 74, 255, 0.3)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const offset = (Date.now() / 100 + i * 100) % canvas.width;
                    ctx.beginPath();
                    ctx.moveTo(offset, 0);
                    ctx.lineTo(offset - 100, canvas.height);
                    ctx.stroke();
                }
            }

            // 更新游戏逻辑
            function updateGame() {
                // 更新玩家
                updatePlayer();
                
                // 更新敌人
                updateEnemies();
                
                // 更新粒子
                updateParticles();
                
                // 更新冷却时间
                if (gameState.player.attackCooldown > 0) {
                    gameState.player.attackCooldown--;
                }
                
                // 检查游戏结束
                if (gameState.health <= 0) {
                    showScreen('ended');
                }
                
                // 每1000分升一级
                if (gameState.score >= gameState.level * 1000) {
                    gameState.level++;
                    gameState.health = Math.min(100, gameState.health + 20);
                    updateHealth();
                }
            }

            // 更新玩家
            function updatePlayer() {
                // 移动输入
                let moveX = 0;
                
                if (gameState.keys['ArrowLeft'] || gameState.keys['a'] || gameState.keys['A']) {
                    moveX = -1;
                    gameState.player.facing = 'left';
                }
                if (gameState.keys['ArrowRight'] || gameState.keys['d'] || gameState.keys['D']) {
                    moveX = 1;
                    gameState.player.facing = 'right';
                }
                
                // 触屏摇杆控制
                if (gameState.touch.joystickActive) {
                    moveX = gameState.touch.joystickX;
                    if (moveX > 0) gameState.player.facing = 'right';
                    if (moveX < 0) gameState.player.facing = 'left';
                }
                
                // 应用移动
                gameState.player.x += moveX * gameState.player.speed;
                
                // 边界检查
                if (gameState.player.x < gameState.player.width / 2) {
                    gameState.player.x = gameState.player.width / 2;
                }
                if (gameState.player.x > canvas.width - gameState.player.width / 2) {
                    gameState.player.x = canvas.width - gameState.player.width / 2;
                }
                
                // 跳跃
                if ((gameState.keys['ArrowUp'] || gameState.keys['w'] || gameState.keys['W'] || 
                     gameState.touch.jumpPressed) && !gameState.player.isJumping) {
                    gameState.player.velocityY = -gameState.player.jumpForce;
                    gameState.player.isJumping = true;
                    gameState.touch.jumpPressed = false;
                }
                
                // 攻击
                if (gameState.keys[' '] || gameState.touch.attackPressed) {
                    playerAttack();
                    gameState.touch.attackPressed = false;
                }
                
                // 魔法
                if (gameState.keys['a'] || gameState.keys['A'] || gameState.touch.magicPressed) {
                    useMagic();
                    gameState.touch.magicPressed = false;
                }
                
                // 重力
                gameState.player.velocityY += 0.8;
                gameState.player.y += gameState.player.velocityY;
                
                // 平台碰撞
                let onPlatform = false;
                for (const platform of gameState.platforms) {
                    if (gameState.player.x + gameState.player.width / 2 > platform.x &&
                        gameState.player.x - gameState.player.width / 2 < platform.x + platform.width &&
                        gameState.player.y + gameState.player.height / 2 > platform.y &&
                        gameState.player.y + gameState.player.height / 2 < platform.y + platform.height + 10 &&
                        gameState.player.velocityY > 0) {
                        
                        gameState.player.y = platform.y - gameState.player.height / 2;
                        gameState.player.velocityY = 0;
                        gameState.player.isJumping = false;
                        onPlatform = true;
                        break;
                    }
                }
                
                // 地面碰撞
                if (gameState.player.y > canvas.height - gameState.player.height / 2) {
                    gameState.player.y = canvas.height - gameState.player.height / 2;
                    gameState.player.velocityY = 0;
                    gameState.player.isJumping = false;
                    onPlatform = true;
                }
                
                // 如果没有站在平台上，设置为跳跃状态
                if (!onPlatform && gameState.player.velocityY !== 0) {
                    gameState.player.isJumping = true;
                }
            }

            // 更新敌人
            function updateEnemies() {
                for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                    const enemy = gameState.enemies[i];
                    
                    // 敌人AI：向玩家移动
                    const dx = gameState.player.x - enemy.x;
                    const dy = gameState.player.y - enemy.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > 0) {
                        enemy.x += (dx / distance) * enemy.speed * 0.5;
                        enemy.y += (dy / distance) * enemy.speed * 0.5;
                    }
                    
                    // 敌人攻击冷却
                    if (enemy.attackCooldown > 0) {
                        enemy.attackCooldown--;
                    }
                    
                    // 敌人攻击玩家
                    if (distance < 50 && enemy.attackCooldown === 0) {
                        gameState.health -= enemy.type === 'goblin' ? 5 : enemy.type === 'skeleton' ? 10 : 15;
                        enemy.attackCooldown = 60;
                        updateHealth();
                        
                        // 创建受伤效果
                        for (let j = 0; j < 5; j++) {
                            gameState.particles.push({
                                x: gameState.player.x,
                                y: gameState.player.y,
                                vx: Math.random() * 6 - 3,
                                vy: Math.random() * 6 - 3,
                                size: Math.random() * 4 + 2,
                                color: '#ff0000',
                                life: 20
                            });
                        }
                    }
                    
                    // 敌人死亡
                    if (enemy.health <= 0) {
                        gameState.enemies.splice(i, 1);
                        spawnEnemy();
                    }
                }
            }

            // 更新粒子
            function updateParticles() {
                for (let i = gameState.particles.length - 1; i >= 0; i--) {
                    const particle = gameState.particles[i];
                    
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.1; // 重力
                    particle.life--;
                    
                    if (particle.life <= 0) {
                        gameState.particles.splice(i, 1);
                    }
                }
            }

            // 绘制平台
            function drawPlatforms() {
                gameState.platforms.forEach(platform => {
                    ctx.fillStyle = platform.color;
                    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                    
                    // 平台边框
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
                });
            }

            // 绘制玩家
            function drawPlayer() {
                ctx.save();
                ctx.translate(gameState.player.x, gameState.player.y);
                
                // 玩家身体
                ctx.fillStyle = '#4a4aff';
                ctx.fillRect(-gameState.player.width / 2, -gameState.player.height / 2, 
                            gameState.player.width, gameState.player.height);
                
                // 玩家细节
                ctx.fillStyle = '#2a2a9a';
                ctx.fillRect(-gameState.player.width / 2 + 5, -gameState.player.height / 2 + 5, 
                            gameState.player.width - 10, 15);
                
                // 玩家面部
                ctx.fillStyle = '#ffcc99';
                ctx.beginPath();
                ctx.arc(0, -gameState.player.height / 2 + 20, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // 武器
                ctx.fillStyle = '#cccccc';
                if (gameState.player.facing === 'right') {
                    ctx.fillRect(gameState.player.width / 2, -5, 20, 10);
                } else {
                    ctx.fillRect(-gameState.player.width / 2 - 20, -5, 20, 10);
                }
                
                // 魔法光环
                if (gameState.player.attackCooldown > 0) {
                    const magicColors = {
                        fire: '#ff3300',
                        ice: '#00ccff',
                        lightning: '#ffcc00'
                    };
                    
                    ctx.strokeStyle = magicColors[gameState.player.magicType];
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, gameState.player.width / 2 + 10, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }

            // 绘制敌人
            function drawEnemies() {
                gameState.enemies.forEach(enemy => {
                    ctx.save();
                    ctx.translate(enemy.x, enemy.y);
                    
                    // 根据敌人类型设置颜色
                    if (enemy.type === 'goblin') {
                        ctx.fillStyle = '#00aa00';
                    } else if (enemy.type === 'skeleton') {
                        ctx.fillStyle = '#cccccc';
                    } else {
                        ctx.fillStyle = '#aa00aa';
                    }
                    
                    // 敌人身体
                    ctx.beginPath();
                    ctx.arc(0, 0, enemy.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 敌人眼睛
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-8, -5, 3, 0, Math.PI * 2);
                    ctx.arc(8, -5, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 生命条
                    const healthPercent = enemy.health / enemy.maxHealth;
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-enemy.width / 2, -enemy.height / 2 - 10, enemy.width, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(-enemy.width / 2, -enemy.height / 2 - 10, enemy.width * healthPercent, 5);
                    
                    ctx.restore();
                });
            }

            // 绘制粒子
            function drawParticles() {
                gameState.particles.forEach(particle => {
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 事件监听器
            startButton.addEventListener('click', () => {
                showScreen('playing');
            });

            restartButton.addEventListener('click', () => {
                showScreen('playing');
            });

            menuButton.addEventListener('click', () => {
                showScreen('start');
            });

            // 键盘控制
            window.addEventListener('keydown', (e) => {
                gameState.keys[e.key] = true;
                
                // 防止空格键滚动页面
                if (e.key === ' ' && gameState.current === 'playing') {
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                gameState.keys[e.key] = false;
            });

            // 触屏控制 - 虚拟摇杆
            let joystickStartX = 0;
            let joystickStartY = 0;

            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = joystickArea.getBoundingClientRect();
                
                joystickStartX = rect.left + rect.width / 2;
                joystickStartY = rect.top + rect.height / 2;
                
                gameState.touch.joystickActive = true;
                updateJoystick(touch.clientX, touch.clientY);
            });

            document.addEventListener('touchmove', (e) => {
                if (gameState.touch.joystickActive) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    updateJoystick(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                if (gameState.touch.joystickActive) {
                    gameState.touch.joystickActive = false;
                    gameState.touch.joystickX = 0;
                    gameState.touch.joystickY = 0;
                    joystickHandle.style.transform = 'translate(-50%, -50%)';
                }
            });

            function updateJoystick(touchX, touchY) {
                const dx = touchX - joystickStartX;
                const dy = touchY - joystickStartY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const maxDistance = joystickArea.clientWidth / 2 - joystickHandle.clientWidth / 2;
                
                const angle = Math.atan2(dy, dx);
                const limitedDistance = Math.min(distance, maxDistance);
                
                const joyX = Math.cos(angle) * limitedDistance;
                const joyY = Math.sin(angle) * limitedDistance;
                
                joystickHandle.style.transform = `translate(${joyX}px, ${joyY}px)`;
                
                // 标准化摇杆输入 (-1 到 1)
                gameState.touch.joystickX = limitedDistance > 10 ? dx / maxDistance : 0;
                gameState.touch.joystickY = limitedDistance > 10 ? dy / maxDistance : 0;
            }

            // 触屏按钮
            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                gameState.touch.jumpPressed = true;
            });

            attackBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                gameState.touch.attackPressed = true;
            });

            magicBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                gameState.touch.magicPressed = true;
            });

            // 防止页面滚动
            document.addEventListener('touchmove', (e) => {
                if (gameState.current === 'playing') {
                    e.preventDefault();
                }
            }, { passive: false });

            // 窗口大小变化时调整Canvas
            window.addEventListener('resize', resizeCanvas);

<script>
// 获取游戏ID和作者信息
const gameId = 'f93a6b96-3108-4b12-b241-217f457dca15';
const gameTitle = '最终幻想X-Way';
const authorToken = 'c1234b72-94c4-4512-bb3f-e61a43244329';
const authorName = 'player_zzpa1v';
const API_BASE = '/api/games';

// 调试日志
console.log('[DEBUG] 游戏页面初始化');
console.log('[DEBUG] gameId:', gameId);
console.log('[DEBUG] authorToken:', authorToken);
console.log('[DEBUG] authorName:', authorName);

// 辅助函数
function showPromoModal() {
  console.log('[DEBUG] showPromoModal 被调用');
  document.getElementById('promo-modal').style.display = 'flex';
}

// 全屏模式状态
let isFullscreenMode = false;

// 切换全屏模式
function toggleFullscreenMode() {
  isFullscreenMode = !isFullscreenMode;
  
  if (isFullscreenMode) {
    // 进入全屏
    document.body.classList.add('fullscreen-mode');
    
    // 尝试请求浏览器全屏
    try {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 浏览器全屏请求失败:', e);
    }
    
    console.log('[全屏] 进入全屏模式');
  } else {
    // 退出全屏
    document.body.classList.remove('fullscreen-mode');
    
    // 退出浏览器全屏
    try {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    } catch (e) {
      console.log('[全屏] 退出浏览器全屏失败:', e);
    }
    
    console.log('[全屏] 退出全屏模式');
  }
}

// 监听浏览器全屏变化（如用户按ESC退出）
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
document.addEventListener('mozfullscreenchange', handleFullscreenChange);
document.addEventListener('MSFullscreenChange', handleFullscreenChange);

function handleFullscreenChange() {
  const isFullscreen = document.fullscreenElement || 
                       document.webkitFullscreenElement || 
                       document.mozFullScreenElement || 
                       document.msFullscreenElement;
  
  // 如果浏览器全屏被退出，同步状态
  if (!isFullscreen && isFullscreenMode) {
    isFullscreenMode = false;
    document.body.classList.remove('fullscreen-mode');
  }
}

// 监听ESC键退出全屏
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && isFullscreenMode) {
    toggleFullscreenMode();
  }
});

function getUserToken() {
  return localStorage.getItem('aigame-user-token') || '';
}

function getAuthHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  const token = getUserToken();
  if (token) {
    headers['X-User-Token'] = token;
  }
  return headers;
}

// 记录游玩
(function(){
  try {
    fetch(API_BASE + '/' + gameId + '/play', { method: 'POST', headers: getAuthHeaders() }).catch(function(){});
  } catch(e) {}
})();

// 获取统计数据和用户状态
function loadStats() {
  // 获取游戏统计
  fetch(API_BASE + '/' + gameId, { headers: getAuthHeaders() })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        const likesEl = document.getElementById('stat-likes');
        const count = data.game.likes_count || data.game.like_count || 0;
        likesEl.innerText = count;
        document.getElementById('stat-plays').innerText = data.game.play_count || 0;
        document.getElementById('stat-favs').innerText = data.game.favorite_count || 0;
        // 更新作者名（从数据库获取最新昵称）
        if (data.game.author_name) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.game.author_name;
        }
      }
    })
    .catch(err => console.error('加载统计失败', err));
  
  // 获取作者最新昵称
  if (authorToken) {
    fetch('/api/users/' + authorToken + '/profile', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.user && data.user.nickname) {
          const authorNameEl = document.getElementById('author-name');
          if (authorNameEl) authorNameEl.innerText = data.user.nickname;
        }
      })
      .catch(() => {});
  }
  
  // 获取用户点赞状态
  const userToken = getUserToken();
  if (userToken) {
    fetch(API_BASE + '/' + gameId + '/like-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.liked) {
          document.getElementById('stat-like-btn').classList.add('liked');
        }
      })
      .catch(() => {});
    
    // 获取用户收藏状态
    fetch(API_BASE + '/' + gameId + '/favorite-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.favorited) {
          document.getElementById('stat-fav-btn').classList.add('favorited');
        }
      })
      .catch(() => {});
    
    // 检查关注状态
    if (authorToken && authorToken !== userToken) {
      checkFollowStatus();
    } else if (authorToken === userToken) {
      // 隐藏自己的关注按钮
      const followBtn = document.getElementById('tiktok-follow-btn');
      if (followBtn) followBtn.style.display = 'none';
    }
    
    // 检查是否为作者，显示编辑按钮
    checkIsAuthorAndShowEditBtn();
  }
}

// 检查是否为作者并显示编辑按钮
function checkIsAuthorAndShowEditBtn() {
  const userToken = getUserToken();
  if (!userToken || !authorToken) return;
  
  // 如果当前用户是作者，显示编辑按钮
  if (userToken === authorToken) {
    const editBtn = document.getElementById('stat-edit-btn');
    if (editBtn) {
      editBtn.classList.add('visible');
    }
  }
}

// 打开游戏编辑页面
function openGameEditorPage() {
  // 跳转到主站的编辑页面
  window.location.href = '/?edit=' + gameId;
}

// 点赞（支持取消）
function likeGame() {
  const btn = document.getElementById('stat-like-btn');
  const isLiked = btn.classList.contains('liked');
  const countEl = document.getElementById('stat-likes');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI更新
  if (isLiked) {
    btn.classList.remove('liked');
    countEl.innerText = Math.max(0, count - 1);
  } else {
    btn.classList.add('liked');
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/like', { 
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        // 更新实际数量
        countEl.innerText = data.like_count || data.likeCount || countEl.innerText;
        if (data.liked !== undefined) {
          btn.classList.toggle('liked', data.liked);
        }
      } else {
        // 失败回滚
        btn.classList.toggle('liked', isLiked);
        countEl.innerText = count;
      }
    })
    .catch(err => {
      console.error(err);
      btn.classList.toggle('liked', isLiked);
      countEl.innerText = count;
    });
}

// 收藏
function toggleFavorite() {
  const btn = document.getElementById('stat-fav-btn');
  const countEl = document.getElementById('stat-favs');
  const isFav = btn.classList.contains('favorited');
  let count = parseInt(countEl.innerText) || 0;
  
  // 乐观UI切换
  btn.classList.toggle('favorited', !isFav);
  if (isFav) {
    countEl.innerText = Math.max(0, count - 1);
  } else {
    countEl.innerText = count + 1;
  }
  
  fetch(API_BASE + '/' + gameId + '/favorite', { 
    method: 'POST', 
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (data.favorited !== undefined) {
          btn.classList.toggle('favorited', data.favorited);
        }
        // 更新实际数量
        if (data.favorite_count !== undefined) {
          countEl.innerText = data.favorite_count;
        }
      } else {
        // 失败回滚
        btn.classList.toggle('favorited', isFav);
        countEl.innerText = count;
      }
    })
    .catch(() => {
      // 失败回滚
      btn.classList.toggle('favorited', isFav);
      countEl.innerText = count;
    });
}

// 打开分享面板
function openSharePanel() {
  const url = window.location.href;
  const shareText = '🎮 我发现了一个有趣的AI游戏：「' + gameTitle + '」\n\n👆 点击链接立即游玩：\n' + url + '\n\n💡 关注公众号「游戏开发技术教程」，一句话免费生成你的专属游戏！';

  document.getElementById('share-panel').style.display = 'flex';
}

// 关闭分享面板
function closeSharePanel() {
  document.getElementById('share-panel').style.display = 'none';
}

// 复制分享内容
function copyShareText() {
  const text = document.getElementById('share-text').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('分享内容已复制，快去分享给好友吧！');
      closeSharePanel();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand('copy');
  document.body.removeChild(textarea);
  alert('分享内容已复制，快去分享给好友吧！');
  closeSharePanel();
}

        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + followers + '</strong><span style="color:#999;font-size:12px;">粉丝</span></div>' +

    // 检查关注状态（只有不是自己时才检查）
    if (!isSelf) {

function openCommentAuthorProfile(commentAuthorToken) {
  if (!commentAuthorToken) return;

  if (commentAuthorToken === currentUserToken) {
    alert('这是您自己的评论');

  }

  // 加载评论者信息
  Promise.all([
    fetch('/api/users/' + commentAuthorToken + '/profile', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({})),
    fetch('/api/users/' + commentAuthorToken + '/follow-stats', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({})),
    fetch('/api/users/' + commentAuthorToken + '/games?limit=4', { headers: getAuthHeaders() }).then(r => r.json()).catch(() => ({ games: [] }))
  ]).then(([profileData, statsData, gamesData]) => {

    const followers = statsData.followerCount || statsData.followers || 0;
    const following = statsData.followingCount || statsData.following || 0;
    const games = gamesData.games || [];
    
    let gamesHtml = '';
    if (games.length > 0) {
      gamesHtml = '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px;">' +
        games.slice(0, 4).map(g => '<a href="/g/' + g.id.substring(0,2) + '/' + g.id + '.html" style="background:#f5f5f5;border-radius:8px;padding:10px;text-decoration:none;color:#333;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🎮 ' + (g.title || '未命名').substring(0, 10) + '</a>').join('') +
        '</div>';
    }
    
    // 账号ID显示（小字、浅色、带@前缀）
    const accountIdHtml = accountId ? '<div style="font-size:12px;color:#999;margin-top:2px;">@' + accountId + '</div>' : '';
    
    content.innerHTML = 
      '<div style="margin-bottom:15px;">' +
        '<div style="width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;">👤</div>' +
        '<div style="font-size:18px;font-weight:600;color:#333;">' + nickname + '</div>' +
        accountIdHtml +
      '</div>' +
      '<div style="display:flex;justify-content:center;gap:30px;margin-bottom:15px;">' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + following + '</strong><span style="color:#999;font-size:12px;">关注</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + followers + '</strong><span style="color:#999;font-size:12px;">粉丝</span></div>' +
        '<div style="text-align:center;"><strong style="font-size:20px;color:#333;display:block;">' + games.length + '</strong><span style="color:#999;font-size:12px;">作品</span></div>' +
      '</div>' +
      '<button onclick="toggleFollowCommentAuthor(\'' + commentAuthorToken + '\')" id="comment-author-follow-btn" style="width:100%;padding:10px;background:#fe2c55;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">+ 关注</button>' +
      gamesHtml;
    
    // 检查是否已关注
    fetch('/api/users/' + commentAuthorToken + '/follow-status', { headers: getAuthHeaders() })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.following) {
          const btn = document.getElementById('comment-author-follow-btn');
          if (btn) {
            btn.textContent = '已关注';
            btn.style.background = '#f5f5f5';
            btn.style.color = '#999';
          }
        }
      }).catch(() => {});
  }).catch(() => {
    content.innerHTML = '<div style="padding:20px;color:#999;">加载失败</div>';
  });
}

// 关注/取关评论者
function toggleFollowCommentAuthor(targetToken) {
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再关注');
    return;
  }
  
  const btn = document.getElementById('comment-author-follow-btn');
  const isFollowing = btn && btn.textContent === '已关注';
  
  fetch('/api/users/' + targetToken + '/follow', {
    method: isFollowing ? 'DELETE' : 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success && btn) {
        if (isFollowing) {
          btn.textContent = '+ 关注';
          btn.style.background = '#fe2c55';
          btn.style.color = '#fff';
        } else {
          btn.textContent = '已关注';
          btn.style.background = '#f5f5f5';
          btn.style.color = '#999';
        }
      }
    }).catch(() => {
      alert('操作失败，请重试');
    });
}

// 切换关注状态
function toggleFollow() {
  console.log('[DEBUG] toggleFollow 被调用, authorToken:', authorToken);
  if (!authorToken) {
    console.log('[DEBUG] authorToken为空，显示推广弹窗');
    showPromoModal();
    return;
  }
  
  const userToken = getUserToken();
  console.log('[DEBUG] userToken:', userToken);
  if (!userToken) {
    alert('请先登录');
    return;
  }
  if (authorToken === userToken) {
    alert('不能关注自己哦');
    return;
  }
  
  const btn = document.getElementById('tiktok-follow-btn');
  const isFollowing = btn.classList.contains('following');
  
  // 乐观更新
  if (isFollowing) {
    btn.classList.remove('following');
    btn.innerHTML = '<span class="follow-icon">+</span> 关注';
  } else {
    btn.classList.add('following');
    btn.innerHTML = '✓ 已关注';
  }
  
  fetch('/api/users/' + authorToken + '/follow', {
    method: 'POST',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        btn.classList.toggle('following', data.following);
        btn.innerHTML = data.following ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      } else {
        // 回滚
        btn.classList.toggle('following', isFollowing);
        btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
      }
    })
    .catch(() => {
      btn.classList.toggle('following', isFollowing);
      btn.innerHTML = isFollowing ? '✓ 已关注' : '<span class="follow-icon">+</span> 关注';
    });
}

// 切换留言板面板
function toggleCommentsPanel() {
  const panel = document.getElementById('game-comments-section');
  const sidebar = document.querySelector('.tiktok-sidebar');
  const authorInfo = document.getElementById('tiktok-author-info');
  const overlay = document.getElementById('comments-overlay');
  if (panel) {
    const isExpanding = !panel.classList.contains('expanded');
    panel.classList.toggle('expanded');
    // 评论面板展开时隐藏右侧按钮和作者信息（使用class覆盖!important）
    if (sidebar) {
      sidebar.classList.toggle('comments-open', isExpanding);
    }
    if (authorInfo) {
      authorInfo.classList.toggle('comments-open', isExpanding);
    }
    // 控制蒙版显示
    if (overlay) {
      overlay.classList.toggle('visible', isExpanding);
    }
  }
}

// 留言板状态
let commentsData = {
  comments: [],
  total: 0,
  offset: 0,
  hasMore: false,
  isLoading: false
};

// 加载留言列表
function loadGameComments(isRefresh = true) {
  if (commentsData.isLoading) return;
  commentsData.isLoading = true;
  
  const limit = 20;
  const offset = isRefresh ? 0 : commentsData.offset;
  
  fetch('/api/games/' + gameId + '/comments?limit=' + limit + '&offset=' + offset, {
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        if (isRefresh) {
          commentsData.comments = data.comments;
          commentsData.offset = data.comments.length;
        } else {
          commentsData.comments = commentsData.comments.concat(data.comments);
          commentsData.offset += data.comments.length;
        }
        commentsData.total = data.total;
        commentsData.hasMore = data.hasMore;
        renderComments();
        updateCommentsCount();
      }
    })
    .catch(err => console.error('加载留言失败:', err))
    .finally(() => { commentsData.isLoading = false; });
}

// 渲染留言列表
function renderComments() {
  const listEl = document.getElementById('game-comments-list');
  const loadMoreBtn = document.getElementById('comments-load-more-btn');
  
  if (!listEl) return;
  
  if (commentsData.comments.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">💬 还没有留言，快来抢沙发！</div>';
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    return;
  }
  
  let html = '';
  commentsData.comments.forEach(function(comment) {
    const timeStr = formatCommentTime(comment.created_at);
    const avatarInitial = comment.author_name ? comment.author_name.charAt(0).toUpperCase() : '?';
    const currentUserToken = getUserToken();
    const canDelete = comment.is_mine || (currentUserToken && comment.user_token === currentUserToken);
    const commentUserToken = comment.user_token || '';
    const clickableClass = commentUserToken ? 'comment-clickable' : '';
    const onClickAttr = commentUserToken ? 'onclick="openCommentAuthorProfile(\'' + commentUserToken + '\')"' : '';
    
    html += '<div class="comment-item" data-id="' + comment.id + '">' +
      '<div class="comment-header">' +
        '<div class="comment-author-info">' +
          '<div class="comment-avatar ' + clickableClass + '" ' + onClickAttr + '>' + avatarInitial + '</div>' +
          '<span class="comment-author-name ' + clickableClass + '" ' + onClickAttr + '>' + escapeHtml(comment.author_name) + '</span>' +
          '<span class="comment-time">' + timeStr + '</span>' +
        '</div>' +
        (canDelete ? '<button class="comment-delete-btn" onclick="deleteGameComment(' + comment.id + ')">删除</button>' : '') +
      '</div>' +
      '<div class="comment-content">' + escapeHtml(comment.content) + '</div>' +
    '</div>';
  });
  
  listEl.innerHTML = html;
  
  if (loadMoreBtn) {
    loadMoreBtn.style.display = commentsData.hasMore ? 'block' : 'none';
  }
}

// 更新评论数量
function updateCommentsCount() {
  const countEl = document.getElementById('stat-comments');
  if (countEl) countEl.textContent = commentsData.total;
}

// 格式化留言时间
function formatCommentTime(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return (date.getMonth() + 1) + '/' + date.getDate();
}

// HTML转义
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 发布留言
function submitGameComment() {
  const inputEl = document.getElementById('game-comment-input');
  const submitBtn = document.getElementById('game-comment-submit');
  
  if (!inputEl || !submitBtn) return;
  
  const content = inputEl.value.trim();
  if (!content) {
    alert('请输入留言内容');
    return;
  }
  if (content.length > 500) {
    alert('留言内容不能超过500字');
    return;
  }
  
  const userToken = getUserToken();
  if (!userToken) {
    alert('请先登录后再留言');
    return;
  }
  
  submitBtn.disabled = true;
  submitBtn.textContent = '发布中...';
  
  fetch('/api/games/' + gameId + '/comments', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ content: content })
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        inputEl.value = '';
        commentsData.comments.unshift(data.comment);
        commentsData.total++;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '发布失败');
      }
    })
    .catch(err => {
      console.error('发布留言失败:', err);
      alert('网络错误，请重试');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = '发布';
    });
}

// 删除留言
function deleteGameComment(commentId) {
  if (!confirm('确定要删除这条留言吗？')) return;
  
  fetch('/api/games/' + gameId + '/comments/' + commentId, {
    method: 'DELETE',
    headers: getAuthHeaders()
  })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        commentsData.comments = commentsData.comments.filter(function(c) { return c.id !== commentId; });
        commentsData.total--;
        renderComments();
        updateCommentsCount();
      } else {
        alert(data.error || '删除失败');
      }
    })
    .catch(err => {
      console.error('删除留言失败:', err);
      alert('网络错误，请重试');
    });
}

// 加载更多留言
function loadMoreGameComments() {
  if (!commentsData.hasMore || commentsData.isLoading) return;
  loadGameComments(false);
}

// 更新留言输入区域显示
function updateCommentInputUI() {
  const loginHint = document.getElementById('comment-login-hint');

}
