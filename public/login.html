<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 - 一句话游戏</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.5);
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --error: #ef4444;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--bg-secondary);
      border-radius: 20px;
      padding: 40px 30px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .login-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    .input-with-toggle {
      position: relative;
    }
    
    .input-with-toggle input {
      padding-right: 50px;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }
    
    .toggle-password:hover {
      color: var(--text-secondary);
    }
    
    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: var(--accent-gradient);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      margin-top: 12px;
    }
    
    .btn-secondary:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    
    .divider span {
      padding: 0 12px;
    }
    
    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .login-footer a {
      color: var(--accent-primary);
      text-decoration: none;
    }
    
    .login-footer a:hover {
      text-decoration: underline;
    }
    
    .message {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .message.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      display: block;
    }
    
    .message.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      display: block;
    }
    
    .tips {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    .tips-title {
      font-weight: 600;
      color: var(--accent-primary);
      margin-bottom: 6px;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <script src="/js/api-base.js"></script>
  <div class="login-container">
    <div class="login-header">
      <div class="login-icon">🎮</div>
      <h1 class="login-title" id="pageTitle">登录</h1>
      <p class="login-subtitle" id="pageSub">网站与小程序共用邮箱账号</p>
    </div>

    <div id="message" class="message"></div>

    <div class="tips">
      <div class="tips-title">💡 积分说明</div>
      <div>领取、兑换积分请在微信小程序「JustOneWord」内完成；本站可登录后消耗积分进行创作。</div>
    </div>

    <div id="panel-login">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">邮箱 / 账号 ID / 昵称</label>
          <input type="text" id="account" class="form-input" placeholder="注册邮箱或账号 ID" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-with-toggle">
            <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">登录</button>
      </form>
      <div class="login-footer" style="margin-top: 1rem;">
        <p>还没有账号？<a href="javascript:void(0)" onclick="showRegister()">邮箱注册</a></p>
      </div>
    </div>

    <div id="panel-register" style="display: none;">
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">密码（至少 8 位）</label>
          <div class="input-with-toggle">
            <input type="password" id="reg-password" class="form-input" required autocomplete="new-password">
            <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" id="reg-password2" class="form-input" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">昵称（可选）</label>
          <input type="text" id="reg-nickname" class="form-input" maxlength="20" placeholder="展示名">
        </div>
        <button type="submit" id="regBtn" class="btn btn-primary">注册并登录</button>
      </form>
      <div class="login-footer" style="margin-top: 1rem;">
        <p><a href="javascript:void(0)" onclick="showLoginPanel()">返回登录</a></p>
      </div>
    </div>

    <div class="divider"><span>或</span></div>
    <button class="btn btn-secondary" onclick="goHome()">返回首页</button>
  </div>

  <script>
    function apiUrl(p) {
      return typeof window.resolveApiUrl === 'function' ? window.resolveApiUrl(p) : p;
    }

    function checkLogin() {
      const t = localStorage.getItem('aigame-user-token');
      if (t) {
        const returnUrl = new URLSearchParams(window.location.search).get('return');
        window.location.href = returnUrl || '/';
      }
    }
    checkLogin();

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + (type || '');
    }
    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    function showRegister() {
      document.getElementById('panel-login').style.display = 'none';
      document.getElementById('panel-register').style.display = 'block';
      document.getElementById('pageTitle').textContent = '注册';
      document.getElementById('pageSub').textContent = '注册后可在网站与小程序同一账号登录';
      hideMessage();
    }
    function showLoginPanel() {
      document.getElementById('panel-register').style.display = 'none';
      document.getElementById('panel-login').style.display = 'block';
      document.getElementById('pageTitle').textContent = '登录';
      document.getElementById('pageSub').textContent = '网站与小程序共用邮箱账号';
      hideMessage();
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function persistSession(data) {
      localStorage.setItem('aigame-user-token', data.userToken);
      localStorage.setItem('aigame-author-token', data.userToken);
      localStorage.setItem('aigame-account-id', data.account.accountId);
      if (data.account.nickname) {
        localStorage.setItem('aigame-author-name', data.account.nickname);
      }
      localStorage.removeItem('aigame-logged-out');
    }

    async function syncUserData(userToken) {
      try {
        const h = { 'X-User-Token': userToken };
        const [likesRes, favoritesRes] = await Promise.all([
          fetch(apiUrl('/api/my-likes'), { headers: h }).then(r => r.json()).catch(() => ({ success: false })),
          fetch(apiUrl('/api/my-favorites'), { headers: h }).then(r => r.json()).catch(() => ({ success: false }))
        ]);
        if (likesRes.success && likesRes.games) {
          localStorage.setItem('aigame-liked-games', JSON.stringify(likesRes.games.map(g => g.id)));
        }
        if (favoritesRes.success && favoritesRes.games) {
          localStorage.setItem('aigame-favorited-games', JSON.stringify(favoritesRes.games.map(g => g.id)));
        }
      } catch (e) { console.warn(e); }
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMessage();
      const accountId = document.getElementById('account').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      if (!accountId || !password) {
        showMessage('请输入账号和密码', 'error');
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';
      try {
        const response = await fetch(apiUrl('/api/account/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accountId, password })
        });
        const data = await response.json();
        if (data.success) {
          persistSession({ userToken: data.userToken, account: data.account });
          showMessage('登录成功，正在跳转...', 'success');
          await syncUserData(data.userToken);
          setTimeout(() => {
            const returnUrl = new URLSearchParams(window.location.search).get('return');
            window.location.href = returnUrl || '/';
          }, 500);
        } else {
          showMessage(data.error || '登录失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请稍后重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideMessage();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;
      const nickname = document.getElementById('reg-nickname').value.trim();
      const regBtn = document.getElementById('regBtn');
      if (password.length < 8) {
        showMessage('密码至少 8 位', 'error');
        return;
      }
      if (password !== password2) {
        showMessage('两次密码不一致', 'error');
        return;
      }
      regBtn.disabled = true;
      regBtn.textContent = '注册中...';
      try {
        const response = await fetch(apiUrl('/api/account/register'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, nickname: nickname || undefined })
        });
        const data = await response.json();
        if (data.success) {
          persistSession({ userToken: data.userToken, account: data.account });
          showMessage('注册成功，正在跳转...', 'success');
          await syncUserData(data.userToken);
          setTimeout(() => {
            const returnUrl = new URLSearchParams(window.location.search).get('return');
            window.location.href = returnUrl || '/';
          }, 500);
        } else {
          showMessage(data.error || '注册失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请稍后重试', 'error');
      } finally {
        regBtn.disabled = false;
        regBtn.textContent = '注册并登录';
      }
    }

    function goHome() {
      window.location.href = '/';
    }
  </script>
</body>
</html>
