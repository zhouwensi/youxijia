# Cloudflare Worker：API（api.yijuhuayouxi.com）
# 1) 创建 KV：npx wrangler kv namespace create USER_KV
# 2) 把下方 id 换成命令输出的 production id（preview_id 可选，用于 wrangler dev --remote）
# 3) 密钥：npx wrangler secret put WX_APPSECRET   npx wrangler secret put DEEPSEEK_API_KEY

name = "yijuhuayouxi-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[[kv_namespaces]]
binding = "USER_KV"
id = "1118560a049f4acd85b33ef1e3dd4b69"

# 绑定自定义域时在 Cloudflare 控制台 Workers → 该 Worker → Triggers → Custom Domains
# 或使用 routes（需 zone 已在 Cloudflare）：
# routes = [
#   { pattern = "api.yijuhuayouxi.com/*", zone_name = "yijuhuayouxi.com" }
# ]

[vars]
SITE_NAME = "一句话游戏"
SITE_SLOGAN = "一句话生成游戏"
MINIPROGRAM_NAME = "JustOneWord"
# 允许 GitHub Pages 预览域（*.github.io）跨域调 API；正式站仍建议用自定义域
ALLOW_GITHUB_IO = "true"
# 逗号分隔；生产务必收紧为你的站点
ALLOWED_ORIGINS = "https://www.yijuhuayouxi.com,https://yijuhuayouxi.com,http://localhost:80,http://127.0.0.1:80"
# 小程序 AppID 可放 vars（公开）；AppSecret 用 secret
# WX_APPID = ""

# DEEPSEEK_BASE_URL 默认已在代码里；如需覆盖可在此加 [vars]
#
# 小程序流量主广告位（写入后 GET /api/site-config 会返回非空 ID；也可在控制台 Variables 配置而不提交仓库）：
# REWARDED_VIDEO_AD_UNIT_ID = ""
# MINI_BANNER_AD_UNIT_ID = ""
# MINI_BANNER_MINE_AD_UNIT_ID = ""
# INTERSTITIAL_AD_UNIT_ID = ""
# SPLASH_AD_UNIT_ID = ""   # 与「流量主-封面广告」开关不是一回事；见 doc/通行证与核销-联调说明.md
# Cloudflare 不能留空时可填 - 或 none，Worker 会当作未配置。
#
# 若 api 子域仍绑在本 KV Worker，但小程序微信登录已用 Pages+D1，请设置转发源（Cloudflare 控制台 → Worker → Settings → Variables）：
# PAGES_API_ORIGIN = https://youxijia.pages.dev
# 设置后还会转发：微信登录/账户/积分/签到，以及 /api/mp/privilege/*（小程序兑换码配额等，见 worker shouldForwardToPages）。
